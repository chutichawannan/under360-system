<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ใบจัดของ — Under360</title>
<!--
  N-63 · ใบจัดของ/ใบแปะกล่อง
  (9 ส.ค. นัทสั่งเอาโลโก้กับ QR ออก — เหลือแค่หัวบิล "Under 360" + เลขออเดอร์
   กระดาษ 58 มม. พื้นที่จำกัด โลโก้กับ QR กินที่ไปเปล่าๆ ครัวใช้เลขออเดอร์อ่านด้วยตาอยู่แล้ว
   ผลพลอยได้: ไม่ต้องพึ่ง CDN อีกต่อไป หน้านี้ทำงานได้แม้เน็ตครัวล่ม)

  เครื่องพิมพ์จริงที่ร้านใช้ (นัทยืนยัน 9 ส.ค. 2026): **SUNMI V2 Pro**
    · เครื่อง POS มือถือ Android · เครื่องพิมพ์ความร้อนในตัว **กระดาษ 58 มม.**
    · พิมพ์ได้จริง ~48 มม. (384 dot ที่ 203 dpi) → ตั้ง --ink ไว้ 48mm
    · ⚠️ เครื่องพิมพ์ในตัวของ SUNMI บางรุ่น เบราว์เซอร์จะเห็นก็ต่อเมื่อเปิด
      "SUNMI Print Service / InnerPrinter" ในเครื่อง — ถ้าหน้าเลือกเครื่องพิมพ์ไม่ขึ้น ให้ไปเปิดตัวนี้ก่อน
    · ก่อนหน้านี้ครัวกดพิมพ์จากหน้า Hato portal บนเครื่องนี้ได้ = ทางพิมพ์ผ่านเบราว์เซอร์ใช้ได้จริง
  ครัวใช้: ดูรายการ → หยิบของ → แปะหน้ากล่อง → ยกใส่ถุงส่งลูกค้า

  เปิดยังไง
    ?date=2026-08-10     ทุกใบของวันส่งนั้น (ค่าเริ่มต้น = วันนี้ เวลาไทย)
    ?order=U-0809-001    ใบเดียว
    &auto=1              โหลดเสร็จเด้งกล่องพิมพ์เอง (ใช้กับปุ่ม 🖨 ในหน้าออเดอร์)
    &w=57 / &w=80        สลับเป็นกระดาษใบเสร็จแบบม้วน (ค่าเริ่มต้น 100 = ป้าย 4 นิ้ว)

  ทำไมเนื้อหาแคบกว่ากระดาษเสมอ
    หัวพิมพ์ไปไม่ถึงขอบ → เว้นไว้ข้างละ ~2 มม. เสมอ (4 นิ้ว 100→96 · 57→48 · 80→72)
    ⚠️ ป้าย 4 นิ้วเป็นสติกเกอร์มีขนาดตายตัว — ถ้าใบยาวเกินป้าย เนื้อหาจะไหลไปป้ายถัดไป
       ต้องรู้ขนาดป้ายที่ร้านใช้จริง (เช่น 100x150 มม.) แล้วล็อก @page ให้ตรง ยังไม่ได้ตั้ง

  ทำไมพิมพ์ผ่านเบราว์เซอร์ ไม่ใช่ ESC/POS
    ESC/POS text mode วางสระบน-ล่างภาษาไทยเพี้ยนบ่อย · พิมพ์ผ่านเบราว์เซอร์เป็นภาพ (raster) สระตรงเสมอ

  อ่านอย่างเดียว ไม่เขียนอะไรลงฐานข้อมูล
-->
<style>
  :root{ --paper: 57mm; --ink: 48mm; --fs: 10.5px; }
  *{ box-sizing:border-box; }
  body{
    margin:0; background:#e9edf1; color:#000;
    font-family:'Sarabun','Noto Sans Thai',-apple-system,'Segoe UI',sans-serif;
  }

  /* ── แถบเครื่องมือ (ไม่ปริ้น) ── */
  .bar{
    position:sticky; top:0; z-index:9; background:#0f5132; color:#fff;
    padding:10px 12px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; font-size:14px;
  }
  .bar input,.bar select{ font:inherit; padding:6px 9px; border-radius:8px; border:1px solid #cfd8dc; min-width:0; }
  .bar button{ font:inherit; font-weight:700; padding:7px 16px; border-radius:8px; border:0; background:#ffd166; color:#3b2f00; cursor:pointer; }
  .bar button.ghost{ background:rgba(255,255,255,.18); color:#fff; }
  .bar .grow{ flex:1 1 auto; }
  .bar .count{ font-weight:700; background:rgba(255,255,255,.15); padding:5px 11px; border-radius:999px; }
  .bar .hint{ font-size:12px; opacity:.85; }

  /* ── แถบกรอง/เลือกใบที่จะปริ้น ── */
  .bar2{
    position:sticky; top:44px; z-index:8; background:#e8f0ea; border-bottom:1px solid #c9d9cf;
    padding:8px 12px; display:flex; gap:6px; align-items:center; flex-wrap:wrap; font-size:13px;
  }
  .bar2 .lbl{ font-weight:700; color:#0f5132; margin-right:2px; }
  .bar2 .grow{ flex:1 1 auto; }
  .chip{
    font:inherit; border:1px solid #b9cdc0; background:#fff; color:#2c4a3a;
    padding:5px 12px; border-radius:999px; cursor:pointer; font-weight:600;
  }
  .chip.on{ background:#0f5132; color:#fff; border-color:#0f5132; }
  .chip.pickall{ background:#fff7e0; border-color:#e5c25c; color:#6b5200; }
  .bar2 .count{ font-weight:800; color:#0f5132; padding-left:6px; }

  /* หัวติ๊กเลือกใบ — โผล่เฉพาะบนจอ ไม่ติดไปกับกระดาษ */
  .pick{
    display:flex; align-items:center; gap:8px; width:var(--paper);
    background:#0f5132; color:#fff; border-radius:10px 10px 0 0;
    padding:7px 10px; font-size:13px; font-weight:700; cursor:pointer; user-select:none;
  }
  .pick input{ width:18px; height:18px; accent-color:#ffd166; }
  .pick .tag{ margin-left:auto; font-size:11px; background:rgba(255,255,255,.2); padding:2px 8px; border-radius:999px; font-weight:600; }
  .slip.hide{ display:none; }
  .pick.hide{ display:none; }

  /* ── ตัวใบ ── */
  .sheet{ padding:14px 0 60px; display:flex; flex-direction:column; align-items:center; gap:14px; }
  .slip{
    width:var(--paper); background:#fff;
    padding:2mm calc((var(--paper) - var(--ink)) / 2);
    font-size:var(--fs); line-height:1.45; box-shadow:0 2px 10px rgba(0,0,0,.15);
  }
  .in{ width:var(--ink); }

  .shop{ text-align:center; font-weight:700; font-size:12px; margin-top:1mm; }
  .ordno{ text-align:center; font-weight:800; font-size:15px; letter-spacing:.3px;
          font-family:'IBM Plex Mono',ui-monospace,monospace; margin:.5mm 0; }

  .dash{ border-top:1px dashed #000; margin:1.5mm 0; }
  .sec{ font-weight:700; }
  .kv{ display:flex; gap:1.5mm; align-items:flex-start; }
  .kv .k{ flex:0 0 15mm; white-space:nowrap; }   /* ห้าม label ตัดคำกลางคำแบบใบ Hato */
  .kv .v{ flex:1 1 auto; font-weight:600; word-break:break-word; }

  .flag{ font-weight:800; font-size:11px; text-align:center; padding:1mm 0;
         border-top:1px solid #000; border-bottom:1px solid #000; margin:1.5mm 0; }

  .thead{ display:flex; font-weight:700; border-bottom:1px solid #000; padding-bottom:.5mm; }
  .thead .q{ flex:0 0 7mm; }
  .thead .n{ flex:1 1 auto; }
  .thead .p{ flex:0 0 12mm; text-align:right; }

  .line{ display:flex; padding:1mm 0 .5mm; }
  .line .q{ flex:0 0 7mm; font-weight:800; }
  .line .n{ flex:1 1 auto; font-weight:700; }
  .line .p{ flex:0 0 12mm; text-align:right; }
  /* แถวย่อยของเซ็ต — บรรทัดที่ล้นต้องเยื้องตาม ไม่ใช่กองซ้ายสุดแบบใบ Hato */
  .sub{ padding-left:3.5mm; text-indent:-1.5mm; font-size:10px; font-weight:500; }
  .code{ font-family:'IBM Plex Mono',ui-monospace,monospace; font-weight:800; }
  .dim{ color:#555; font-family:'IBM Plex Mono',ui-monospace,monospace; }
  .new{ font-size:8.5px; font-weight:800; border:1px solid #000; border-radius:1mm; padding:0 .8mm; margin-left:.8mm; }
  .brk{ border-bottom:1px dotted #999; }

  .tot{ display:flex; justify-content:space-between; padding:.4mm 0; }
  .tot.b{ font-weight:800; font-size:12px; border-top:1px solid #000; margin-top:.8mm; padding-top:1mm; }
  .note{ font-size:9.5px; margin-top:1.5mm; padding:1mm; border:1px dashed #000; }
  .sign{ display:flex; gap:2mm; margin-top:3mm; font-size:9px; }
  .sign div{ flex:1; border-top:1px solid #000; padding-top:.8mm; }
  .empty{ background:#fff; padding:22px; border-radius:10px; max-width:520px; text-align:center; color:#555; }

  @media print{
    /* ⚠️ ห้ามใช้ var() ใน @page — เบราว์เซอร์ไม่รองรับ (ไม่มี error ด้วย มันเงียบแล้วถอยไปใช้ A4)
       เจอจริง 12 ส.ค. 2569: อูสั่งพิมพ์จากมือถือ กล่องพิมพ์ขึ้น "ISO A4"
       สลิปเลยไปกองอยู่มุมบนซ้ายของกระดาษ A4 ตัวเล็กจิ๋ว
       → ขนาดกระดาษถูกฉีดเป็น @page จริงๆ ตอน applyWidth() แทน (ดู #pageSizeRule) */
    body{ background:#fff; }
    .bar, .bar2, .pick{ display:none !important; }
    .sheet{ padding:0; gap:0; display:block; }
    .slip{ box-shadow:none; page-break-after:always; break-after:page; }
    .slip:last-child{ page-break-after:auto; break-after:auto; }
    /* ใบที่ไม่ได้ติ๊ก / ถูกกรองออก = ไม่ออกกระดาษ */
    .slip.hide, .slip.skip{ display:none !important; }
  }
</style>
</head>
<body>

<div class="bar">
  <label>วันส่ง <input type="date" id="d"></label>
  <label>หรือเลขใบ <input type="text" id="o" placeholder="U-0809-001" size="12"></label>
  <select id="w">
    <option value="57">กระดาษ 57/58 มม. (POS SUNMI)</option>
    <option value="80">กระดาษ 80 มม.</option>
    <option value="100">ป้ายสติกเกอร์ 4 นิ้ว</option>
  </select>
  <button class="ghost" id="go">โหลด</button>
  <span class="grow"></span>
  <span class="hint">SUNMI V2 Pro · 58 มม.</span>
  <button id="pr">🖨 ปริ้นที่เลือก</button>
</div>

<div class="bar2">
  <span class="lbl">กรองประเภท</span>
  <button class="chip on" data-f="all">ทั้งหมด</button>
  <button class="chip" data-f="single">เมนูเดี่ยว</button>
  <button class="chip" data-f="set">เซ็ต / คอร์ส</button>
  <button class="chip" data-f="mp">Meal Plan</button>
  <button class="chip" data-f="nomp">ไม่เอา Meal Plan</button>
  <span class="grow"></span>
  <button class="chip pickall" id="all">เลือกทั้งหมด</button>
  <button class="chip pickall" id="none">ไม่เลือกเลย</button>
  <span class="count" id="cnt">—</span>
</div>

<div class="sheet" id="sheet"></div>

<script>
/* ════════════ ข้อมูล ════════════ */
const SB  = 'https://zdartbvhbvqlwzwyyiia.supabase.co/rest/v1/';
const ANON= 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpkYXJ0YnZoYnZxbHd6d3l5aWlhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE4MTY3OTksImV4cCI6MjA5NzM5Mjc5OX0.D41YGH-CuWrVFqcAgXEuhfVTxJ7WY26Xu-PeXBF6LB8';
const HDR = { apikey: ANON, Authorization: 'Bearer ' + ANON };

function todayTH(){
  const p = new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Bangkok',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());
  const g = t => p.find(x=>x.type===t).value;
  return `${g('year')}-${g('month')}-${g('day')}`;
}
const esc  = s => String(s??'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const baht = n => Number(n||0).toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2});

const qs = new URLSearchParams(location.search);
const $d=document.getElementById('d'), $o=document.getElementById('o'), $w=document.getElementById('w');
$d.value = qs.get('date') || todayTH();
$o.value = qs.get('order') || '';
// ค่าเริ่มต้น = ป้าย 4 นิ้ว เพราะเครื่องที่ร้านมีจริงคือ HPRT HT400 (ป้ายสติกเกอร์ 4")
// 57/80 มม. เก็บไว้เผื่อไปซื้อเครื่องใบเสร็จแบบม้วนทีหลัง
const PAPER = { '100': [100, 96], '80': [80, 72], '57': [57, 48] };   // [กระดาษ, พื้นที่พิมพ์จริง]
$w.value = PAPER[qs.get('w')] ? qs.get('w') : '57';
applyWidth();
function applyWidth(){
  const w = PAPER[$w.value] || PAPER['57'];
  document.documentElement.style.setProperty('--paper', w[0]+'mm');
  document.documentElement.style.setProperty('--ink',   w[1]+'mm');
  // ป้าย 4 นิ้วกว้างกว่า → ขยายตัวหนังสือให้อ่านง่ายขึ้น ไม่ต้องเพ่ง
  document.documentElement.style.setProperty('--fs', $w.value === '100' ? '12.5px' : '10.5px');
  /* บอกขนาดกระดาษให้เบราว์เซอร์เป็นตัวเลขจริง — ใส่ var() ใน @page ไม่ได้ (เงียบแล้วกลายเป็น A4)
     ต้องเขียนกฎใหม่ทุกครั้งที่เปลี่ยนขนาด ไม่ใช่ตั้งครั้งเดียวตอนโหลด */
  let st = document.getElementById('pageSizeRule');
  if(!st){ st = document.createElement('style'); st.id = 'pageSizeRule'; document.head.appendChild(st); }
  st.textContent = '@page{ size: ' + w[0] + 'mm auto; margin: 0; }';
}
$w.addEventListener('change', applyWidth);

/* ── กรองประเภท + ติ๊กเลือกใบที่จะปริ้น ──────────────────────────
   นัทขอเอง 9 ส.ค.: "อยากปริ้นแค่ลูกค้าธรรมดา ไม่ใช่มีลแพลน"
   กรอง = ซ่อนทั้งจอ · ติ๊ก = เลือกทีละใบ  → ปริ้นเฉพาะใบที่ทั้งไม่ถูกซ่อน และติ๊กอยู่ */
let FILTER = 'all';
const match = (t) => FILTER === 'all' ? true
  : FILTER === 'nomp' ? t !== 'mp'
  : t === FILTER;

function applyFilter(){
  document.querySelectorAll('.pick').forEach(p => {
    const on = match(p.dataset.t);
    p.classList.toggle('hide', !on);
    p.nextElementSibling.classList.toggle('hide', !on);
    if (!on) p.querySelector('.pk').checked = false;   // ถูกกรองออก = ไม่ปริ้น
  });
  updateCount();
}
function updateCount(){
  const all = [...document.querySelectorAll('.pick')];
  const shown = all.filter(p => !p.classList.contains('hide'));
  const picked = shown.filter(p => p.querySelector('.pk').checked);
  document.getElementById('cnt').textContent =
    picked.length === 0 ? 'ยังไม่ได้เลือกใบไหน'
    : `จะปริ้น ${picked.length} ใบ` + (shown.length !== all.length ? ` (จากทั้งหมด ${all.length})` : '');
  document.getElementById('pr').disabled = picked.length === 0;
  document.getElementById('pr').style.opacity = picked.length === 0 ? .5 : 1;
}
document.querySelectorAll('.chip[data-f]').forEach(b => b.onclick = () => {
  document.querySelectorAll('.chip[data-f]').forEach(x => x.classList.toggle('on', x === b));
  FILTER = b.dataset.f;
  applyFilter();
});
document.getElementById('all').onclick  = () => { document.querySelectorAll('.pick:not(.hide) .pk').forEach(c => c.checked = true);  updateCount(); };
document.getElementById('none').onclick = () => { document.querySelectorAll('.pk').forEach(c => c.checked = false); updateCount(); };
document.addEventListener('change', e => { if (e.target.classList.contains('pk')) updateCount(); });

// ก่อนสั่งพิมพ์ ติดธง skip ให้ใบที่ไม่ได้ติ๊ก → CSS @media print จะซ่อนให้
window.addEventListener('beforeprint', () => {
  document.querySelectorAll('.pick').forEach(p =>
    p.nextElementSibling.classList.toggle('skip', !p.querySelector('.pk').checked));
});
document.getElementById('pr').onclick = () => window.print();
document.getElementById('go').onclick = load;
$o.addEventListener('keydown', e => { if(e.key==='Enter') load(); });

let MENU = {};   // code -> { sub: ชื่อเล่นเมนู }

async function load(){
  const sheet = document.getElementById('sheet');
  sheet.innerHTML = '<div class="empty">กำลังโหลด…</div>';
  document.getElementById('cnt').textContent = '—';

  // เมนู: เอาชื่อเล่น (subcode) + ดูว่าเป็นเมนูใหม่ไหม — ทำก่อน แล้วค่อยโหลดออเดอร์ (อ่านทีละอย่าง)
  try{
    const r = await fetch(`${SB}menu_items?select=code,subcode&limit=1000`, {headers:HDR});
    const j = await r.json();
    MENU = {}; for (const m of j) MENU[m.code] = { sub: (m.subcode||'').trim() };
  }catch(e){ MENU = {}; }

  const cols = 'order_number,created_at,customer_name,customer_phone,delivery_address,delivery_date,time_slot,time_slot_label,total,subtotal,delivery_fee,discount_amount,status,payment_status,payment_account,want_utensils,notes,order_items(menu_name,menu_code,quantity,unit_price,notes)';
  const filter = $o.value.trim()
    ? `order_number=eq.${encodeURIComponent($o.value.trim())}`
    : `delivery_date=eq.${$d.value}&status=neq.cancelled`;

  let rows;
  try{
    const r = await fetch(`${SB}orders?select=${cols}&${filter}&order=time_slot.asc,order_number.asc&limit=300`, {headers:HDR});
    if(!r.ok) throw new Error(await r.text());
    rows = await r.json();
  }catch(err){
    sheet.innerHTML = `<div class="empty">โหลดไม่สำเร็จ<br><small>${esc(String(err).slice(0,300))}</small></div>`;
    return;
  }
  if(!rows.length){
    sheet.innerHTML = '<div class="empty">ไม่มีออเดอร์ของวันนี้ในระบบ<br><small>ช่วงรอยต่อ Hato — ใบที่ยังอยู่ใน Hato อย่างเดียวจะไม่ขึ้นที่นี่</small></div>';
    document.getElementById('cnt').textContent = '0 ใบ';
    return;
  }

  // ชื่อเซ็ต/แพคเกจ (ถ้ามี) — อ่านทีละคำสั่ง ไม่ยิงพร้อมกัน
  const pkgIds = [...new Set(rows.flatMap(o => (o.order_items||[])
    .map(i => (String(i.notes||'').match(/^pkg:([0-9a-f-]{8,})/i)||[])[1]).filter(Boolean)))];
  let PKG = {};
  if (pkgIds.length){
    try{
      const r = await fetch(`${SB}packages?select=id,name,base_price&id=in.(${pkgIds.join(',')})`, {headers:HDR});
      for (const p of await r.json()) PKG[p.id] = p;
    }catch(e){}
  }

  sheet.innerHTML = rows.map(o => slip(o, PKG)).join('');
  applyFilter();

}

function slip(o, PKG){
  // จัดกลุ่ม: เซ็ต/แพคเกจ · Meal Plan · เมนูเดี่ยว
  const groups = new Map(), singles = new Map();
  for (const it of (o.order_items||[])){
    const n = String(it.notes||'');
    const pkg = (n.match(/^pkg:([0-9a-f-]{8,})/i)||[])[1];
    const mp  = /^meal_plan:/i.test(n) ? n : null;
    const key = pkg ? 'pkg:'+pkg : mp ? 'mp' : null;
    if (key){
      const g = groups.get(key) || { key, pkg, mp, items:new Map() };
      const ik = it.menu_code+'|'+it.menu_name;
      const cur = g.items.get(ik) || { code:it.menu_code, name:it.menu_name, qty:0 };
      cur.qty += Number(it.quantity||0); g.items.set(ik, cur); groups.set(key, g);
    } else {
      const ik = it.menu_code+'|'+it.menu_name;
      const cur = singles.get(ik) || { code:it.menu_code, name:it.menu_name, qty:0, price:Number(it.unit_price||0) };
      cur.qty += Number(it.quantity||0); singles.set(ik, cur);
    }
  }

  // ชื่อเล่นเข้ม + โค้ดจาง + ชื่อเมนู — รูปแบบเดียวกับหน้าครัว (KQ) ครัวจะได้อ่านแบบเดียวกันทุกที่
  // โค้ดจางตัดตัวอักษรนำหน้าออกเหมือน KQ (S022 -> 022) — แต่ตัดได้เฉพาะตอน "มีชื่อเล่นนำหน้าอยู่แล้ว"
  // ⚠️ 12 ส.ค.: เดิมเขียน /^Nod/ (ตกเครื่องหมาย \) → No3 ถูกตัดเหลือ "3" ครัวอ่านไม่ออกว่าเมนูอะไร
  //    กติกาใหม่: ไม่มีชื่อเล่น = โชว์โค้ดเต็ม เสมอ · เมนูประจำ No1-No15 คงไว้ทั้งชุดเพราะครัวเรียก "No3" จริง
  const shortCode = (c, hasSub) => {
    const s = String(c || '');
    if (!hasSub) return s;                       // ไม่มีชื่อเล่น → ห้ามตัด ไม่งั้นเหลือเลขลอยๆ
    if (/^No\d/i.test(s)) return s;              // เมนูประจำเรียกเต็มเสมอ
    return s.replace(/^[A-Za-z]+/, '') || s;
  };
  const nameOf = it => {
    const m = MENU[it.code] || {};
    const sub = m.sub ? `<span class="code">${esc(m.sub)}</span> ` : '';
    const cd  = it.code ? `<span class="dim">${esc(shortCode(it.code, !!m.sub))}</span> ` : '';
    // NEW เอาจากชื่อเมนูจริงเท่านั้น ไม่เดาจากวันที่สร้าง (เคยเดาแล้วติด NEW เกือบทุกตัว = ไร้ความหมาย)
    const nm  = String(it.name||'').replace(/s*NEWs*$/i,'');
    const nw  = /NEWs*$/i.test(it.name||'') ? ' <span class="new">NEW</span>' : '';
    return sub + cd + esc(nm) + nw;
  };

  // ประเภทของใบ — ใช้กรองว่าจะปริ้นอะไรบ้าง
  //   mp     = Meal Plan (ทำสด จ/พ/ศ)
  //   set    = เซ็ต / คอร์ส / แพคเกจ
  //   single = เมนูเดี่ยว (ลูกค้าธรรมดา)
  const hasMP  = [...groups.values()].some(g => g.mp) || /^MP-/i.test(o.order_number || '');
  const hasPkg = [...groups.values()].some(g => g.pkg);
  const type   = hasMP ? 'mp' : hasPkg ? 'set' : 'single';
  const typeTH = hasMP ? 'Meal Plan' : hasPkg ? 'เซ็ต / คอร์ส' : 'เมนูเดี่ยว';

  let boxes = 0, body = '';
  for (const g of groups.values()){
    const p = g.pkg ? PKG[g.pkg] : null;
    const title = p ? p.name : (g.mp ? 'Meal Plan ' + g.mp.replace(/^meal_plan:/i,'').replace(/:/g,' ') : 'เซ็ต');
    const price = p && p.base_price ? baht(p.base_price) : '';
    const subs = [...g.items.values()];
    boxes += subs.reduce((s,i)=>s+i.qty,0);
    body += `<div class="line"><div class="q">1</div><div class="n">${esc(title)}</div><div class="p">${price}</div></div>`;
    body += subs.map(i => `<div class="line sub"><div class="n">x${i.qty} ${nameOf(i)}</div></div>`).join('');
    body += '<div class="brk"></div>';
  }
  for (const i of singles.values()){
    boxes += i.qty;
    body += `<div class="line"><div class="q">${i.qty}</div><div class="n">${nameOf(i)}</div><div class="p">${i.price?baht(i.price*i.qty):''}</div></div><div class="brk"></div>`;
  }

  const fee  = Number(o.delivery_fee||0);
  const disc = Number(o.discount_amount||0);
  const sub  = Number(o.subtotal ?? (Number(o.total||0) - fee + disc));
  const pay  = o.payment_status === 'paid' ? 'โอนแล้ว'
             : o.payment_status === 'pending_review' ? 'แนบสลิปแล้ว รอตรวจ' : 'ยังไม่โอน';

  return `
  <label class="pick" data-t="${type}">
    <input type="checkbox" class="pk" checked>
    <span>${esc(o.order_number)} · ${esc(o.customer_name || '-').slice(0,18)}</span>
    <span class="tag">${typeTH}</span>
  </label>
  <div class="slip" data-t="${type}"><div class="in">
    <div class="shop">Under 360</div>
    <div class="ordno">#${esc(o.order_number)}</div>

    <div class="dash"></div>
    <div class="sec">ข้อมูลการจัดส่ง</div>
    <div class="kv"><div class="k">ชื่อ</div><div class="v">${esc(o.customer_name)||'-'}</div></div>
    <div class="kv"><div class="k">เบอร์โทร</div><div class="v">${esc(o.customer_phone)||'-'}</div></div>
    <div class="kv"><div class="k">วันที่สั่ง</div><div class="v">${esc((o.created_at||'').slice(0,16).replace('T',' '))||'-'}</div></div>
    <div class="kv"><div class="k">วันเวลาส่ง</div><div class="v">${esc(o.delivery_date||'-')}, ${esc(o.time_slot_label||o.time_slot||'-')}</div></div>
    <div class="kv"><div class="k">ที่อยู่</div><div class="v">${esc(o.delivery_address)||'-ไม่มีข้อมูล-'}</div></div>
    <div class="kv"><div class="k">รายละเอียด</div><div class="v">${esc(o.notes)||'-ไม่มีข้อมูล-'}</div></div>

    <div class="flag">${o.want_utensils ? '✓ ใส่ช้อนส้อม / ตะเกียบ / หลอด' : '✕ ไม่รับช้อนส้อม / ตะเกียบ / หลอด'}</div>

    <div class="thead"><div class="q">จำนวน</div><div class="n">สินค้า</div><div class="p">ราคา</div></div>
    ${body}

    <div class="tot"><span>รวม ${boxes} รายการ</span><span>${baht(sub)}</span></div>
    <div class="tot"><span>ค่าส่ง</span><span>${baht(fee)}</span></div>
    ${disc ? `<div class="tot"><span>ส่วนลด</span><span>-${baht(disc)}</span></div>` : ''}
    <div class="tot b"><span>ยอดชำระทั้งสิ้น</span><span>${baht(o.total)}</span></div>
<!-- 12 ส.ค. นัทสั่งเอาออก: กล่องเตือนยอดไม่ลงตัว (N-61) ไม่ต้องขึ้นบนบิลที่ครัว/ลูกค้าเห็น -->
    <div class="tot"><span>การชำระเงิน</span><span>${pay}</span></div>

    <div class="sign"><div>ผู้จัดสินค้า</div><div>ผู้ส่ง</div></div>
  </div></div>`;
}

load().then(() => {
  // ?auto=1 = เปิดมาแล้วเด้งกล่องพิมพ์เลย ไม่ต้องกดปุ่มซ้ำ
  // รอ 1 เฟรม + 300ms ให้ฟอนต์ไทยกับ layout นิ่งก่อน ไม่งั้นบางเครื่องจับภาพตอนยังจัดหน้าไม่เสร็จ
  if (qs.get('auto') === '1' && document.querySelectorAll('.slip').length) {
    requestAnimationFrame(() => setTimeout(() => window.print(), 300));
  }
});
</script>
</body>
</html>
