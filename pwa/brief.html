<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow, noarchive">
<script src="/gate.js"></script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Under360 — สรุปให้นัท</title>
<meta name="theme-color" content="#0E1512">
<link rel="icon" href="./icon-192.png">
<!--
  📋 สรุปให้นัทใบเดียว — นัทขอเอง 12 ก.ย. 2569
  คำนัท: *"ขี้เกียจจะให้สรุปแล้วอะ พวกนายพิมพ์คุยกันเองยาวมากเลย ... ทำยังไงฉันถึงจะรู้เรื่องทั้งหมดทีเดียว"*

  ปัญหาที่หน้านี้แก้: ห้องคุยกันวันละหลายสิบใบบนบอร์ด (session_messages)
  นัทต้องไล่อ่านเองทั้งหมด = อ่านไม่ไหว = เลยไม่รู้ว่าตกลงมีอะไรต้องกดบ้าง

  วิธี: ตัวตั้งเวลา (scheduled task `daily-brief`) อ่านบอร์ดทั้งวันแล้วย่อเหลือ 3 กอง
  เขียนลง kitchen_data คีย์ `daily_brief` · หน้านี้แค่เอามาแสดง ไม่คิดเอง ไม่เดาเอง

  🔴 กติกาที่หน้านี้บังคับ:
   · **3 กองเท่านั้น** — ⏳ รอนัทกด · ✅ เสร็จแล้ว · 🔴 พัง/ต้องรู้   (ไม่มีกอง "กำลังทำ" เพราะนัทไม่ต้องรู้)
   · **กอง "รอนัทกด" อยู่บนสุดเสมอ** — ของที่เหลือเลื่อนดูได้ ของที่ต้องกดต้องเห็นก่อน
   · **ห้ามยาวเกิน 10 บรรทัด** ถ้าเกิน = ตัวเขียนสรุปทำงานผิด ไม่ใช่หน้านี้
   · ไม่มีศัพท์เทคนิค ไม่มีเลข commit — นัทอ่านแล้วต้องรู้ว่า "ต้องทำอะไร" ทันที
   · สรุปเก่ากว่า 30 ชม. = ขึ้นป้ายว่าเก่า (ตัวตั้งเวลาอาจไม่ได้รัน — ห้ามให้ของเก่าดูเหมือนของสด)
-->
<style>
:root{
  --bg:#0E1512; --panel:#16211C; --panel2:#1D2A24; --line:#2A3A32;
  --tx:#EAF2ED; --soft:#93A79B; --g:#35D07F; --warn:#FF6B6B; --amber:#F2B33D;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--tx);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Thai",sans-serif;
  font-size:16px;line-height:1.55;padding-bottom:40px}
header{padding:16px 16px 10px;border-bottom:1px solid var(--line);position:sticky;top:0;
  background:rgba(14,21,18,.97);backdrop-filter:blur(8px);z-index:5}
h1{margin:0;font-size:20px;font-weight:800;letter-spacing:-.2px}
.sub{font-size:12px;color:var(--soft);margin-top:3px}
.stale{display:inline-block;margin-top:6px;font-size:11.5px;font-weight:700;color:var(--amber);
  background:#3A2F12;border:1px solid #5A4A20;border-radius:999px;padding:3px 10px}
main{padding:14px 16px}
.group{margin-bottom:20px}
.gh{font-size:13px;font-weight:700;color:var(--soft);margin-bottom:9px;letter-spacing:.03em}
.item{background:var(--panel);border:1px solid var(--line);border-radius:13px;
  padding:13px 15px;margin-bottom:9px;font-size:15px;line-height:1.65}
.item.act{border-color:#5A4A20;background:#221D10}
.item.bad{border-color:#5A2A2A;background:#221312}
.who{display:block;font-size:11.5px;color:var(--soft);margin-top:5px}
.empty{color:var(--soft);font-size:13.5px;padding:10px 2px}
.none{background:var(--panel);border:1px dashed var(--line);border-radius:13px;
  padding:24px 18px;text-align:center;color:var(--soft);font-size:14px;line-height:1.8}
.none b{color:var(--tx)}
code{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-size:12.5px}
.foot{margin-top:22px;padding-top:14px;border-top:1px solid var(--line);
  font-size:12px;color:var(--soft);line-height:1.8}
</style>
</head>
<body>

<header>
  <h1>📋 สรุปให้นัท</h1>
  <div class="sub" id="sub">กำลังโหลด…</div>
  <div id="stalewrap"></div>
</header>

<main id="main"></main>

<script>
const SB_URL = 'https://zdartbvhbvqlwzwyyiia.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpkYXJ0YnZoYnZxbHd6d3l5aWlhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE4MTY3OTksImV4cCI6MjA5NzM5Mjc5OX0.D41YGH-CuWrVFqcAgXEuhfVTxJ7WY26Xu-PeXBF6LB8';
const KEY = 'daily_brief';
const STALE_HOURS = 30;   // ตั้งเวลาไว้วันละครั้ง — เกิน 30 ชม. แปลว่ารอบที่แล้วไม่ได้รัน

const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* เวลาไทยเสมอ — นัทอยู่ PST ถ้าคิดจากเครื่องจะเพี้ยนไปวันนึง */
function thaiStamp(iso){
  if(!iso) return '—';
  const t = new Date(new Date(iso).getTime() + 7*3600*1000).toISOString();
  return t.slice(8,10) + '/' + t.slice(5,7) + ' ' + t.slice(11,16) + ' น.';
}
const hoursAgo = iso => iso ? (Date.now() - new Date(iso).getTime())/3600000 : 999;

/* 3 กองเท่านั้น · เรียงตามที่นัทต้องเห็นก่อน */
const GROUPS = [
  {key:'act',  label:'⏳ รอพี่กด / รอพี่เคาะ', cls:'act'},
  {key:'bad',  label:'🔴 พัง หรือ ต้องรู้ไว้',  cls:'bad'},
  {key:'done', label:'✅ เสร็จแล้ว ไม่ต้องทำอะไร', cls:''}
];

async function load(){
  const main = document.getElementById('main'), sub = document.getElementById('sub');
  try{
    const r = await fetch(SB_URL + '/rest/v1/kitchen_data?select=data,updated_at&key=eq.' + KEY + '&limit=1',
      {headers:{apikey:SB_KEY, Authorization:'Bearer ' + SB_KEY}});
    const rows = r.ok ? await r.json() : [];
    const row = rows && rows[0];
    const d = row && row.data;
    if(!d || !d.items || !d.items.length){
      sub.textContent = 'ยังไม่มีสรุป';
      main.innerHTML = '<div class="none"><b>ยังไม่มีสรุปรอบแรก</b><br>'
        + 'ตัวสรุปทำงานวันละครั้ง (23:00 เวลาไทย = ~9 โมงเช้าที่พี่อยู่)<br>'
        + 'ถ้าอยากได้เดี๋ยวนี้ บอกห้อง u ให้รันรอบพิเศษได้</div>';
      return;
    }
    const at = d.at || (row && row.updated_at);
    sub.textContent = 'รอบล่าสุด ' + thaiStamp(at) + ' · อ่านจากบอร์ด ' + (d.msg_count || 0) + ' ใบ';
    if(hoursAgo(at) > STALE_HOURS){
      document.getElementById('stalewrap').innerHTML =
        '<span class="stale">⚠️ สรุปนี้เก่ากว่า ' + Math.round(hoursAgo(at)) + ' ชม. — ตัวสรุปอาจไม่ได้รัน</span>';
    }
    let h = '';
    GROUPS.forEach(g => {
      const list = d.items.filter(x => x.bucket === g.key);
      if(!list.length) return;
      h += '<div class="group"><div class="gh">' + g.label + ' (' + list.length + ')</div>'
        + list.map(x => '<div class="item ' + g.cls + '">' + esc(x.text)
            + (x.room ? '<span class="who">— ' + esc(x.room) + '</span>' : '') + '</div>').join('')
        + '</div>';
    });
    if(!d.items.some(x => x.bucket === 'act')){
      h = '<div class="group"><div class="gh">⏳ รอพี่กด / รอพี่เคาะ</div>'
        + '<div class="item">ไม่มี — ไม่มีอะไรค้างที่พี่ต้องทำ</div></div>' + h;
    }
    h += '<div class="foot">หน้านี้ไม่ได้คิดเอง — ตัวสรุปอ่านบอร์ดทุกห้องแล้วย่อให้<br>'
      + 'อยากได้ละเอียดของเรื่องไหน ถามห้องนั้นตรง ๆ ได้เลย</div>';
    main.innerHTML = h;
  }catch(e){
    console.error(e);
    sub.textContent = 'โหลดไม่สำเร็จ';
    main.innerHTML = '<div class="none"><b>โหลดสรุปไม่สำเร็จ</b><br>รีเฟรชอีกครั้ง ถ้ายังไม่ได้บอกห้อง u</div>';
  }
}
load();
</script>
</body>
</html>
