<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Under360 — ใบตรวจงาน</title>
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#10221A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ใบตรวจ">
<link rel="apple-touch-icon" href="./icon-192.png">
<style>
:root{
  --ink:#16211c;--soft:#4a5a52;--faint:#7d8c84;
  --bg:#f6f8f6;--card:#fff;--line:#dee6e0;
  --brand:#3c7a5c;--brandsoft:#e9f2ec;
  --warn:#8f5606;--warnsoft:#fdf3e3;
  --stop:#a02a1f;--stopsoft:#fdeceb;
  --ok:#2f6b4f;--oksoft:#e7f3ec;
  --r:10px;
  --thai:"Noto Sans Thai","Sarabun","Leelawadee UI",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--thai);font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%}
.wrap{max-width:760px;margin:0 auto;padding:16px 14px 100px}

/* ── ล็อก PIN ── */
#gate{position:fixed;inset:0;background:#10221A;color:#fff;display:grid;place-items:center;z-index:100;text-align:center;padding:20px}
#gate h1{font-size:22px;margin:0 0 6px}
#gate p{color:#9DB3A8;font-size:14px;margin:0 0 18px}
#gate input{width:190px;font-size:26px;text-align:center;letter-spacing:8px;padding:12px;border-radius:12px;border:1px solid #2B4238;background:#16281F;color:#fff;font-family:inherit}
#gate .err{color:#F0A08F;font-size:13px;margin-top:10px;min-height:18px}

header.top{padding:4px 0 14px;border-bottom:2px solid var(--ink)}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--brand);font-weight:700}
h1.t{font-size:23px;line-height:1.25;margin:5px 0 6px;letter-spacing:-.01em}
.sub{color:var(--soft);font-size:14px;margin:0}

.who{display:flex;gap:8px;align-items:center;margin:12px 0 0;font-size:13.5px;color:var(--soft);flex-wrap:wrap}
.who b{color:var(--ink)}
.who button{font-family:inherit;font-size:12.5px;padding:4px 10px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--soft);cursor:pointer}

.roles{margin:14px 0 4px}
.roles-l{font-size:12px;color:var(--faint);margin-bottom:6px}
.roles-b{display:flex;gap:6px;flex-wrap:wrap}
.role{font-family:inherit;font-size:13.5px;font-weight:600;padding:7px 13px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--soft);cursor:pointer}
.role.on{background:var(--brand);border-color:var(--brand);color:#fff}

.bar{position:sticky;top:0;z-index:20;background:var(--bg);padding:10px 0;border-bottom:1px solid var(--line);margin-bottom:16px}
.bar-row{display:flex;align-items:center;gap:10px}
.track{flex:1;height:7px;background:var(--line);border-radius:99px;overflow:hidden;display:flex}
.fok{height:100%;background:var(--ok);transition:width .3s}
.fbad{height:100%;background:var(--stop);transition:width .3s}
.count{font-size:12.5px;color:var(--soft);font-variant-numeric:tabular-nums;white-space:nowrap}

h2.sec{display:flex;align-items:center;gap:10px;margin:30px 0 3px;font-size:19px;scroll-margin-top:80px}
h2.sec .n{flex:none;width:28px;height:28px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700}
.why{margin:0 0 11px 38px;color:var(--faint);font-size:13px}
h3.grp{margin:18px 0 7px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--brand);font-weight:700}
.known{margin:0 0 9px;padding:9px 12px;background:var(--oksoft);border-left:3px solid var(--ok);border-radius:0 8px 8px 0;font-size:13.5px;color:var(--soft)}
.known.bad{background:var(--stopsoft);border-left-color:var(--stop)}
.known .lbl{display:block;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ok);font-weight:700;margin-bottom:2px}
.known.bad .lbl{color:var(--stop)}
.known b{color:var(--ink)}

.item{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;margin-bottom:8px}
.item.s-ok{border-color:var(--ok);background:var(--oksoft)}
.item.s-bad{border-color:var(--stop);background:var(--stopsoft)}
.item.s-skip{opacity:.55}
.it-top{display:flex;gap:9px;align-items:flex-start}
.it-t{flex:1;font-weight:600;font-size:15px}
.it-t .code{font-size:11px;color:var(--faint);font-weight:400}
.btns{display:flex;gap:4px;flex:none}
.btns b{width:32px;height:30px;display:grid;place-items:center;border:1px solid var(--line);border-radius:7px;font-size:15px;cursor:pointer;color:var(--faint);user-select:none;background:var(--card)}
.btns b.on[data-v="ok"]{background:var(--ok);border-color:var(--ok);color:#fff}
.btns b.on[data-v="bad"]{background:var(--stop);border-color:var(--stop);color:#fff}
.btns b.on[data-v="skip"]{background:var(--line);border-color:var(--line);color:var(--soft)}
.exp{margin:8px 0 0 32px;padding-left:10px;border-left:2px solid var(--line);font-size:13.5px;color:var(--soft)}
.exp b{color:var(--ink)}
textarea{display:block;width:100%;margin:8px 0 0;font-family:inherit;font-size:14px;padding:7px 9px;border:1px dashed var(--line);border-radius:8px;background:transparent;color:var(--ink);resize:vertical;min-height:34px}
textarea:focus{outline:2px solid var(--brand);outline-offset:1px;border-style:solid}
.by{font-size:11.5px;color:var(--faint);margin-top:5px}

.shots{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px}
.addshot{font-family:inherit;font-size:12.5px;color:var(--brand);border:1px dashed var(--brand);border-radius:8px;padding:6px 11px;cursor:pointer;background:transparent;font-weight:600}
.shot{width:54px;height:54px;border-radius:8px;overflow:hidden;border:1px solid var(--line);cursor:zoom-in}
.shot img{width:100%;height:100%;object-fit:cover;display:block}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:99;display:none;place-items:center;padding:16px}
.lb.on{display:grid}
.lb img{max-width:100%;max-height:88vh;border-radius:8px}

.secnote{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--brand);border-radius:var(--r);padding:11px 13px;margin:12px 0 4px}
.secnote h4{margin:0 0 4px;font-size:14px}
.secnote textarea{min-height:54px}

.foot{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:9px 14px;padding-bottom:calc(9px + env(safe-area-inset-bottom))}
.foot-in{max-width:760px;margin:0 auto;display:flex;gap:8px;align-items:center}
.foot .st{flex:1;font-size:12.5px;color:var(--faint)}
.foot button{font-family:inherit;font-size:14px;font-weight:600;padding:10px 14px;border-radius:9px;border:1px solid var(--brand);background:var(--brand);color:#fff;cursor:pointer}
code{font-family:ui-monospace,Menlo,monospace;font-size:.88em;background:var(--brandsoft);padding:1px 5px;border-radius:4px}
</style>
</head>
<body>

<div id="gate">
  <div>
    <h1>ใบตรวจงาน Under360</h1>
    <p>ใส่รหัส 4 ตัว</p>
    <input id="pin" type="tel" inputmode="numeric" maxlength="4" autocomplete="off">
    <div class="err" id="pinerr"></div>
  </div>
</div>

<div class="wrap" id="app" style="display:none">
  <header class="top">
    <div class="eyebrow">ช่วยกันตรวจ · ทุกคนเห็นเหมือนกัน</div>
    <h1 class="t">ใบตรวจระบบ 7 หมวด</h1>
    <p class="sub">กด <b>✓ ผ่าน</b> / <b>✗ มีปัญหา</b> / <b>– ข้าม</b> · พิมพ์คอมเมนต์ · แนบรูปหน้าจอได้ · <b>บันทึกอัตโนมัติ ทุกคนเห็นทันที</b></p>
    <div class="who">
      <span>คุณคือ: <b id="whoName">—</b></span>
      <button id="btnName">เปลี่ยนชื่อ</button>
      <span id="syncSt" style="color:var(--faint)"></span>
    </div>
  </header>

  <div class="roles">
    <div class="roles-l">เลือกงานของตัวเอง — จะเห็นเฉพาะส่วนที่ต้องตรวจ</div>
    <div class="roles-b">
      <button class="role on" data-r="all">ดูทั้งหมด</button>
      <button class="role" data-r="cust">🛒 ฝั่งลูกค้า</button>
      <button class="role" data-r="admin">💻 แอดมิน</button>
      <button class="role" data-r="kitchen">🍳 ครัว</button>
      <button class="role" data-r="msg">🛵 แมสเซนเจอร์</button>
    </div>
  </div>

  <div class="bar">
    <div class="bar-row">
      <div class="track"><div class="fok" id="fok"></div><div class="fbad" id="fbad"></div></div>
      <div class="count" id="count">0 / 0</div>
    </div>
  </div>

  <div id="list"></div>
</div>

<div class="lb" id="lb"><img alt="รูปที่แนบ"></div>

<div class="foot" id="foot" style="display:none">
  <div class="foot-in">
    <div class="st" id="footSt">พร้อมใช้งาน</div>
    <button id="btnRefresh">รีเฟรช</button>
  </div>
</div>

var ROLE = {1:'cust',2:'admin',3:'admin',4:'admin',5:'admin',6:'msg',7:'kitchen'};
var RKEY = 'u360_chk_role';
var state = {};            // { 'chk:1-01': {v,note,photos,by,at} }
var BUCKET = 'menu-images';
var PREFIX = 'chk:';

function curRole(){ try { return localStorage.getItem(RKEY) || 'all'; } catch(e){ return 'all'; } }

/* ── โหลดของทุกคนจากส่วนกลาง ── */
async function loadAll(){
  setSt('กำลังโหลด...');
  var r = await sb.from('kitchen_data').select('key,data').like('key', PREFIX + '%');
  if (r.error) { setSt('โหลดไม่สำเร็จ: ' + r.error.message); return; }
  state = {};
  (r.data || []).forEach(function(row){ state[row.key] = row.data || {}; });
  render();
  setSt('อัปเดตล่าสุด ' + new Date().toLocaleTimeString('th-TH', {hour:'2-digit', minute:'2-digit'}));
}
async function saveOne(id, patch){
  var key = PREFIX + id;
  var cur = state[key] || {};
  var next = Object.assign({}, cur, patch, { by: whoAmI() || cur.by || '', at: new Date().toISOString() });
  state[key] = next;
  var r = await sb.from('kitchen_data').upsert({ key: key, data: next }, { onConflict: 'key' });
  if (r.error) setSt('บันทึกไม่สำเร็จ: ' + r.error.message);
  else setSt('บันทึกแล้ว ' + new Date().toLocaleTimeString('th-TH', {hour:'2-digit', minute:'2-digit'}));
}
function setSt(t){ var el = document.getElementById('footSt'); if (el) el.textContent = t; }

/* ── วาดหน้า ── */
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function render(){
  var box = document.getElementById('list');
  box.innerHTML = '';
  DATA.forEach(function(sec){
    var wrap = document.createElement('div');
    wrap.dataset.role = ROLE[sec.n];
    var html = '<h2 class="sec" id="sec' + sec.n + '"><span class="n">' + sec.n + '</span>' + esc(sec.t) + '</h2>' +
               '<p class="why">' + esc(sec.why) + '</p>';
    (sec.known || []).forEach(function(k){
      html += '<div class="known' + (k.bad ? ' bad' : '') + '"><span class="lbl">' + k.l + '</span>' + (k.h ? '<b>' + k.h + '</b><br>' : '') + k.b + '</div>';
    });
    sec.groups.forEach(function(gr){
      html += '<h3 class="grp">' + esc(gr.g) + '</h3>';
      gr.items.forEach(function(it){
        var s = state[PREFIX + it.k] || {};
        var v = s.v || '';
        var photos = (s.photos || []).map(function(u){
          return '<div class="shot" data-url="' + esc(u) + '"><img src="' + esc(u) + '" alt="รูปแนบข้อ ' + it.k + '"></div>';
        }).join('');
        html += '<div class="item' + (v ? ' s-' + v : '') + '" data-k="' + it.k + '">' +
          '<div class="it-top"><div class="it-t">' + esc(it.t) + ' <span class="code">' + it.k + '</span></div>' +
          '<div class="btns">' +
            '<b data-v="ok" class="' + (v === 'ok' ? 'on' : '') + '">✓</b>' +
            '<b data-v="bad" class="' + (v === 'bad' ? 'on' : '') + '">✗</b>' +
            '<b data-v="skip" class="' + (v === 'skip' ? 'on' : '') + '">–</b>' +
          '</div></div>' +
          (it.e ? '<div class="exp">' + it.e + '</div>' : '') +
          '<textarea placeholder="คอมเมนต์">' + esc(s.note || '') + '</textarea>' +
          '<div class="shots">' + photos + '<button class="addshot">＋ แนบรูป</button>' +
          '<input type="file" accept="image/*" multiple hidden></div>' +
          (s.by ? '<div class="by">ตรวจโดย ' + esc(s.by) + (s.at ? ' · ' + new Date(s.at).toLocaleString('th-TH', {day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit'}) : '') + '</div>' : '') +
        '</div>';
      });
    });
    var sn = state[PREFIX + 'note-' + sec.n] || {};
    html += '<div class="secnote" data-k="note-' + sec.n + '"><h4>สรุปหมวด ' + sec.n + '</h4>' +
            '<textarea placeholder="ภาพรวมหมวดนี้ · อะไรต้องแก้ก่อน">' + esc(sn.note || '') + '</textarea></div>';
    wrap.innerHTML = html;
    box.appendChild(wrap);
  });
  applyRole();
  paint();
}
function applyRole(){
  var r = curRole();
  document.querySelectorAll('.role').forEach(function(b){ b.classList.toggle('on', b.dataset.r === r); });
  document.querySelectorAll('#list > [data-role]').forEach(function(el){
    el.style.display = (r === 'all' || el.dataset.role === r) ? '' : 'none';
  });
}
function paint(){
  var r = curRole(), ok = 0, bad = 0, any = 0, tot = 0;
  DATA.forEach(function(sec){
    if (r !== 'all' && ROLE[sec.n] !== r) return;
    sec.groups.forEach(function(gr){ gr.items.forEach(function(it){
      tot++;
      var v = (state[PREFIX + it.k] || {}).v;
      if (v) any++;
      if (v === 'ok') ok++;
      if (v === 'bad') bad++;
    }); });
  });
  document.getElementById('fok').style.width = (tot ? ok / tot * 100 : 0) + '%';
  document.getElementById('fbad').style.width = (tot ? bad / tot * 100 : 0) + '%';
  document.getElementById('count').textContent = 'ตรวจแล้ว ' + any + '/' + tot + ' · ปัญหา ' + bad;
}

/* ── เหตุการณ์ ── */
document.addEventListener('click', function(e){
  var role = e.target.closest('.role');
  if (role) { try { localStorage.setItem(RKEY, role.dataset.r); } catch(err){} applyRole(); paint(); return; }

  var shot = e.target.closest('.shot');
  if (shot) { var lb = document.getElementById('lb'); lb.querySelector('img').src = shot.dataset.url; lb.classList.add('on'); return; }

  var add = e.target.closest('.addshot');
  if (add) { if (!askName()) { paintWho(); return; } add.parentNode.querySelector('input[type=file]').click(); return; }

  var b = e.target.closest('.btns b');
  if (b) {
    if (!askName()) { paintWho(); return; }
    paintWho();
    var item = b.closest('.item'), id = item.dataset.k;
    var cur = (state[PREFIX + id] || {}).v || '';
    var nv = (cur === b.dataset.v) ? '' : b.dataset.v;
    saveOne(id, { v: nv }).then(function(){
      item.className = 'item' + (nv ? ' s-' + nv : '');
      item.querySelectorAll('.btns b').forEach(function(x){ x.classList.toggle('on', x.dataset.v === nv); });
      paint();
    });
  }
});
document.getElementById('lb').addEventListener('click', function(){ this.classList.remove('on'); });

var noteTimer = {};
document.addEventListener('input', function(e){
  if (!e.target.matches('textarea')) return;
  var host = e.target.closest('[data-k]');
  if (!host) return;
  var id = host.dataset.k, val = e.target.value;
  clearTimeout(noteTimer[id]);
  noteTimer[id] = setTimeout(function(){ saveOne(id, { note: val }); }, 800);   // หน่วง 0.8 วิ กันยิงถี่
});

document.addEventListener('change', async function(e){
  if (!e.target.matches('input[type=file]')) return;
  var box = e.target.parentNode, id = box.closest('[data-k]').dataset.k;
  var files = Array.prototype.slice.call(e.target.files);
  e.target.value = '';
  setSt('กำลังอัพรูป ' + files.length + ' รูป...');
  var urls = ((state[PREFIX + id] || {}).photos || []).slice();
  for (var i = 0; i < files.length; i++) {
    var f = files[i];
    var ext = (f.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g, '') || 'jpg';
    var path = 'checklist/' + id + '-' + Date.now() + '-' + i + '.' + ext;
    var up = await sb.storage.from(BUCKET).upload(path, f, { upsert: true, contentType: f.type || 'image/jpeg' });
    if (up.error) { setSt('อัพรูปไม่สำเร็จ: ' + up.error.message); continue; }
    urls.push(SB_URL + '/storage/v1/object/public/' + BUCKET + '/' + path);
  }
  await saveOne(id, { photos: urls });
  render();
});

document.getElementById('btnRefresh').addEventListener('click', loadAll);

function start(){
  paintWho();
  loadAll();
  setInterval(function(){ if (document.visibilityState === 'visible') loadAll(); }, 20000);  // เห็นของคนอื่นภายใน 20 วิ
}
</script>
</body>
</html>
