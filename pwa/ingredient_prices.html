<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Under360 — เช็คราคาวัตถุดิบ</title>
<meta name="theme-color" content="#10221A">
<link rel="icon" href="./icon-192.png">
<!--
  🛡️ หน้าเช็คราคาวัตถุดิบ — GO vs Freshket (เลขาสั่งงานข้อ 4 · นัทขอเอง 17 ส.ค. 2569)

  นัทพูดเอง: "อยากได้ interface ไว้เช็คราคาจากทั้ง 2 ที่ แบบตรวจทุกๆ 1-3 วัน"

  หน้านี้ "อ่านอย่างเดียว" — ไม่ดึงราคาเอง ไม่กดสั่งของ
    · คนเติมข้อมูล = ห้อง CC (ไล่บิลย้อนหลัง 3 เดือนจากเว็บทั้ง 2 เจ้า)
    · ตารางที่อ่าน = scripts/sql_ingredient_sourcing.sql
  ⛔ ห้ามใส่ปุ่มสั่งซื้อในหน้านี้ — นัทยังไม่ตัดสินใจเรื่องให้เอเจนต์สั่งของ

  กติกาที่หน้านี้บังคับให้เห็น (จาก docs/BRIEF_PRICE_COMPARE.md):
    · เทียบเป็น ฿/กก. เสมอ — ราคาต่อแพ็คเทียบกันไม่ได้ ขนาดบรรจุคนละเรื่อง
    · ของที่สั่งบ่อยต้องอยู่บนสุด — ประหยัด 1 บาทกับของที่สั่งทุกวัน ชนะประหยัด 20 บาทกับของที่สั่งปีละครั้ง
    · ราคาเก่ากว่า 3 วัน = ต้องเห็นว่าเก่า (ราคาผักขยับเร็ว ตัดสินใจด้วยราคาเก่า = ตัดสินใจผิด)
    · อายุของ/ฟรีซได้ไหม โชว์คู่ราคาเสมอ — ถูกกว่าแต่เน่าก่อนใช้ = แพงกว่า
-->
<style>
:root{
  --bg:#0E1512; --panel:#16211C; --panel2:#1D2A24; --line:#2A3A32;
  --tx:#EAF2ED; --soft:#93A79B; --g:#35D07F; --g-dim:#1F7A4D;
  --warn:#FF6B6B; --amber:#F2B33D; --blue:#5AA9FF;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--tx);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Thai",sans-serif;
  font-size:16px;line-height:1.45;padding-bottom:60px}
header{position:sticky;top:0;z-index:20;background:rgba(14,21,18,.97);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:12px 14px}
.hrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.htitle{font-size:19px;font-weight:700}
.hsub{font-size:12px;color:var(--soft);margin-top:2px}
.right{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{background:var(--panel2);color:var(--tx);border:1px solid var(--line);
  border-radius:10px;padding:9px 13px;font-size:14px;font-weight:600;cursor:pointer}
.btn:active{background:var(--g-dim)}
.btn.on{border-color:var(--g);color:var(--g)}
input.search{width:100%;margin-top:10px;background:var(--panel);border:1px solid var(--line);
  color:var(--tx);border-radius:11px;padding:11px 13px;font-size:15px;font-family:inherit}
input.search::placeholder{color:var(--soft)}
main{padding:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px 15px}
.kpi .l{font-size:12px;color:var(--soft)}
.kpi .v{font-size:24px;font-weight:800;margin-top:3px;letter-spacing:-.3px}
.kpi.warn .v{color:var(--amber)}

.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;
  padding:12px 14px;margin-bottom:11px}
.name{font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.freq{font-size:11.5px;font-weight:700;color:var(--blue);background:#12283B;
  border:1px solid #204866;border-radius:999px;padding:2px 8px}
.facts{font-size:12px;color:var(--soft);margin-top:3px;display:flex;gap:10px;flex-wrap:wrap}
.vrow{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}
.v{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:9px 11px}
.v.best{border-color:var(--g);background:#16301F}
.v.none{opacity:.45}
.vh{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--soft)}
.vkg{font-size:19px;font-weight:800;margin-top:2px;letter-spacing:-.3px}
.vpack{font-size:11.5px;color:var(--soft);margin-top:1px}
.tag{font-size:10.5px;font-weight:700;border-radius:999px;padding:1px 7px}
.tag.best{background:var(--g);color:#08150E}
.tag.up{background:#3A1A1A;color:var(--warn);border:1px solid #5A2A2A}
.tag.down{background:#12301F;color:var(--g);border:1px solid #1F5A3A}
.tag.old{background:#3A2F12;color:var(--amber);border:1px solid #5A4A20}
.tag.out{background:#3A1A1A;color:var(--warn);border:1px solid #5A2A2A}
.save{font-size:12.5px;color:var(--g);margin-top:9px;font-weight:600}
.empty{background:var(--panel);border:1px dashed var(--line);border-radius:14px;
  padding:22px 18px;text-align:center;color:var(--soft);font-size:14px;line-height:1.7}
.empty b{color:var(--tx)}
code{background:var(--panel2);border:1px solid var(--line);border-radius:6px;
  padding:1px 6px;font-size:12.5px;color:var(--amber)}
</style>
</head>
<body>

<header>
  <div class="hrow">
    <div>
      <div class="htitle">🥬 เช็คราคาวัตถุดิบ</div>
      <div class="hsub" id="sub">กำลังโหลด…</div>
    </div>
    <div class="right">
      <button class="btn on" id="b-freq" onclick="setSort('freq')">สั่งบ่อยก่อน</button>
      <button class="btn" id="b-gap" onclick="setSort('gap')">ส่วนต่างมากก่อน</button>
      <button class="btn" onclick="load()">↻</button>
    </div>
  </div>
  <input class="search" id="q" placeholder="ค้นชื่อของ เช่น พริก / อกไก่ / ไข่" oninput="render()">
</header>

<main>
  <div class="kpis" id="kpis" style="display:none">
    <div class="kpi"><div class="l">ของที่มีราคาทั้ง 2 เจ้า</div><div class="v" id="k-both">–</div></div>
    <div class="kpi"><div class="l">ประหยัดได้ถ้าเลือกถูกทุกตัว</div><div class="v" id="k-save">–</div></div>
    <div class="kpi warn"><div class="l">ราคาเก่าเกิน 3 วัน</div><div class="v" id="k-old">–</div></div>
  </div>
  <div id="list"></div>
</main>

<script>
/* LIFF/PWA เพจนี้ใช้ createClient ตรงๆ ตามกติกาโปรเจค (ไม่ใช้ getSB) */
const SB_URL = 'https://zdartbvhbvqlwzwyyiia.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpkYXJ0YnZoYnZxbHd6d3l5aWlhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE4MTY3OTksImV4cCI6MjA5NzM5Mjc5OX0.D41YGH-CuWrVFqcAgXEuhfVTxJ7WY26Xu-PeXBF6LB8';
const VENDORS = [{key:'go', label:'GO'}, {key:'freshket', label:'Freshket'}];
const STALE_DAYS = 3;          // นัทบอกเอง: "ตรวจทุกๆ 1-3 วัน" → เกิน 3 วัน = เก่า
const FREQ_DAYS  = 90;         // "สั่งบ่อยไม่บ่อย" นับจากบิล 3 เดือนล่าสุด

let ITEMS = [], STATE = 'loading', SORT = 'freq';

const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const baht = n => '฿' + Math.round(Number(n)||0).toLocaleString();
const baht1 = n => '฿' + (Math.round((Number(n)||0)*10)/10).toLocaleString(undefined,{minimumFractionDigits:0,maximumFractionDigits:1});
const daysAgo = ts => ts ? Math.floor((Date.now() - new Date(ts).getTime())/86400000) : null;

/* REST ตรง ไม่ผ่าน SDK — ตารางยังไม่ถูกสร้าง (404) ต้องแยกออกจาก "สร้างแล้วแต่ว่าง" ให้ได้
   ไม่งั้นหน้าจะขึ้น "ไม่มีข้อมูล" เหมือนกันทั้ง 2 กรณี แล้วไม่มีใครรู้ว่าต้องไปรัน SQL */
async function rest(path){
  const r = await fetch(SB_URL + '/rest/v1/' + path, {headers:{apikey:SB_KEY, Authorization:'Bearer ' + SB_KEY}});
  if(r.status === 404) return {missing:true, rows:[]};
  if(!r.ok) throw new Error(path + ' → ' + r.status);
  return {missing:false, rows: await r.json()};
}

async function load(){
  STATE = 'loading'; ITEMS = []; render();
  try{
    // sequential reads (กติกาโปรเจค) · ทุก select มี limit เสมอ
    const prices    = await rest('ingredient_prices?select=name,vendor,vendor_name,grade,pack_size,pack_unit,pack_size_kg,price,price_per_kg,in_stock,checked_at,note&order=checked_at.desc&limit=4000');
    if(prices.missing){ STATE = 'nosql'; return render(); }
    const since     = new Date(Date.now() - FREQ_DAYS*86400000).toISOString().slice(0,10);
    const purchases = await rest('ingredient_purchases?select=name,vendor,order_date,qty,qty_kg,line_total&order_date=gte.' + since + '&limit=5000');
    const facts     = await rest('ingredient_facts?select=name,shelf_life_days,freezable,freeze_note,storage&limit=2000');

    const factOf = {};
    (facts.rows||[]).forEach(f => { factOf[f.name] = f; });

    const freq = {};   // ชื่อของ → สั่งกี่ครั้ง (นับใบ ไม่ใช่จำนวนชิ้น — "ความถี่การใช้" ตามที่นัทถาม)
    (purchases.rows||[]).forEach(p => { freq[p.name] = (freq[p.name]||0) + 1; });

    /* จัดกลุ่ม: ชื่อของ → เจ้า → ราคาล่าสุด + ราคารอบก่อน (ไว้บอกขึ้น/ลง)
       prices เรียง checked_at desc มาแล้ว → ตัวแรกที่เจอ = ล่าสุด ตัวที่สอง = รอบก่อน */
    const byName = {};
    (prices.rows||[]).forEach(p => {
      const g = byName[p.name] || (byName[p.name] = {name:p.name, v:{}});
      const slot = g.v[p.vendor] || (g.v[p.vendor] = {list:[]});
      slot.list.push(p);
    });

    ITEMS = Object.values(byName).map(g => {
      VENDORS.forEach(v => {
        const s = g.v[v.key];
        if(!s) return;
        s.cur  = s.list[0];
        s.prev = s.list.find(x => x.checked_at !== s.cur.checked_at) || null;
      });
      const go = g.v.go && g.v.go.cur, fk = g.v.freshket && g.v.freshket.cur;
      const kg = x => (x && x.price_per_kg != null && Number(x.price_per_kg) > 0) ? Number(x.price_per_kg) : null;
      const gkg = kg(go), fkg = kg(fk);
      // "ถูกกว่า" ตัดสินจาก ฿/กก. เท่านั้น และต้องมีของขายอยู่จริง
      const goOk = gkg != null && (!go || go.in_stock !== false);
      const fkOk = fkg != null && (!fk || fk.in_stock !== false);
      let best = null, gap = 0;
      if(goOk && fkOk){ best = gkg <= fkg ? 'go' : 'freshket'; gap = Math.abs(gkg - fkg); }
      else if(goOk) best = 'go';
      else if(fkOk) best = 'freshket';
      const oldest = Math.max(...VENDORS.map(v => (g.v[v.key] && g.v[v.key].cur) ? (daysAgo(g.v[v.key].cur.checked_at)||0) : -1));
      return {name:g.name, v:g.v, best, gap, freq:freq[g.name]||0, fact:factOf[g.name]||null,
              bothPriced: goOk && fkOk, staleDays: oldest};
    });
    STATE = ITEMS.length ? 'ok' : 'empty';
  }catch(e){
    console.error(e); STATE = 'error';
  }
  render();
}

function setSort(s){
  SORT = s;
  document.getElementById('b-freq').className = 'btn' + (s==='freq' ? ' on' : '');
  document.getElementById('b-gap').className  = 'btn' + (s==='gap'  ? ' on' : '');
  render();
}

function vendorBox(it, v){
  const s = it.v[v.key], cur = s && s.cur;
  if(!cur) return '<div class="v none"><div class="vh">' + v.label + '</div>'
    + '<div class="vkg" style="font-size:14px;font-weight:600">ยังไม่มีราคา</div></div>';
  const kg = (cur.price_per_kg != null && Number(cur.price_per_kg) > 0) ? Number(cur.price_per_kg) : null;
  const tags = [];
  if(it.best === v.key && it.bothPriced) tags.push('<span class="tag best">ถูกกว่า</span>');
  if(cur.in_stock === false) tags.push('<span class="tag out">ของหมด</span>');
  // ขึ้น/ลงเทียบรอบตรวจก่อนหน้า — เทียบราคาต่อแพ็ค (ตรงกับสิ่งที่เห็นบนเว็บเจ้านั้น)
  if(s.prev && Number(s.prev.price) > 0){
    const d = Number(cur.price) - Number(s.prev.price);
    const pct = Math.round(Math.abs(d) / Number(s.prev.price) * 100);
    if(Math.abs(d) >= 0.5 && pct >= 1)
      tags.push('<span class="tag ' + (d>0?'up':'down') + '">' + (d>0?'▲':'▼') + ' ' + pct + '%</span>');
  }
  const dAgo = daysAgo(cur.checked_at);
  if(dAgo != null && dAgo > STALE_DAYS) tags.push('<span class="tag old">ราคาเก่า ' + dAgo + ' วัน</span>');
  const packTxt = cur.pack_size ? (cur.pack_size + ' ' + (cur.pack_unit||'')) : (cur.pack_unit||'');
  return '<div class="v' + (it.best === v.key && it.bothPriced ? ' best' : '') + '">'
    + '<div class="vh">' + v.label + (cur.grade ? ' · ' + esc(cur.grade) : '') + '</div>'
    + '<div class="vkg">' + (kg != null ? baht1(kg) + '<span style="font-size:12px;color:var(--soft);font-weight:600"> /กก.</span>'
                                        : '<span style="font-size:15px">' + baht(cur.price) + '</span>') + '</div>'
    + '<div class="vpack">' + baht(cur.price) + (packTxt ? ' · ' + esc(packTxt) : '')
    + (dAgo != null ? ' · ' + (dAgo === 0 ? 'วันนี้' : dAgo + ' วันก่อน') : '') + '</div>'
    + (tags.length ? '<div style="margin-top:5px;display:flex;gap:5px;flex-wrap:wrap">' + tags.join('') + '</div>' : '')
    + '</div>';
}

function render(){
  const list = document.getElementById('list'), sub = document.getElementById('sub');
  const kpis = document.getElementById('kpis');
  kpis.style.display = 'none';

  if(STATE === 'loading'){ sub.textContent = 'กำลังโหลด…'; list.innerHTML = ''; return; }
  if(STATE === 'nosql'){
    sub.textContent = 'ยังไม่มีตารางเก็บราคา';
    list.innerHTML = '<div class="empty"><b>ยังไม่ได้สร้างตาราง</b><br>'
      + 'เปิด Supabase → SQL Editor แล้ววาง <code>scripts/sql_ingredient_sourcing.sql</code> รันครั้งเดียว<br>'
      + 'แล้วกลับมากด ↻ หน้านี้อีกครั้ง</div>';
    return;
  }
  if(STATE === 'error'){
    sub.textContent = 'โหลดไม่สำเร็จ';
    list.innerHTML = '<div class="empty"><b>อ่านข้อมูลไม่ได้</b><br>กด ↻ ลองใหม่อีกครั้ง</div>';
    return;
  }
  if(STATE === 'empty'){
    sub.textContent = 'ตารางพร้อมแล้ว · ยังไม่มีราคา';
    list.innerHTML = '<div class="empty"><b>ตารางพร้อมแล้ว แต่ยังไม่มีใครเติมราคา</b><br>'
      + 'ห้อง CC เป็นคนไล่บิลย้อนหลัง 3 เดือนจาก GO + Freshket มาลง<br>'
      + 'พอมีข้อมูลแล้วหน้านี้จะขึ้นเองทันที ไม่ต้องแก้อะไร</div>';
    return;
  }

  const q = (document.getElementById('q').value||'').trim().toLowerCase();
  let rows = ITEMS.filter(it => !q || it.name.toLowerCase().includes(q));
  rows.sort((a,b) => SORT === 'gap'
    ? (b.gap - a.gap) || (b.freq - a.freq)
    : (b.freq - a.freq) || (b.gap - a.gap) || a.name.localeCompare(b.name,'th'));

  // KPI คิดจากของทั้งหมด ไม่ใช่เฉพาะที่ค้นเจอ — ตัวเลขภาพรวมต้องนิ่ง ไม่ขยับตามคำค้น
  const both = ITEMS.filter(i => i.bothPriced);
  const stale = ITEMS.filter(i => i.staleDays > STALE_DAYS);
  document.getElementById('k-both').textContent = both.length + ' / ' + ITEMS.length;
  document.getElementById('k-save').textContent = baht(both.reduce((s,i) => s + i.gap, 0)) + '/กก.';
  document.getElementById('k-old').textContent  = stale.length;
  kpis.style.display = 'grid';
  sub.textContent = ITEMS.length + ' รายการ · เทียบเป็น ฿/กก. · เรียง' + (SORT==='gap' ? 'ส่วนต่างมากก่อน' : 'ของที่สั่งบ่อยก่อน');

  list.innerHTML = rows.map(it => {
    const f = it.fact || {};
    const facts = [];
    if(f.shelf_life_days != null) facts.push('อยู่ได้ ' + f.shelf_life_days + ' วัน');
    if(f.freezable === true)  facts.push('❄️ ฟรีซได้' + (f.freeze_note ? ' (' + esc(f.freeze_note) + ')' : ''));
    if(f.freezable === false) facts.push('ฟรีซไม่ได้');
    if(f.storage) facts.push(esc(f.storage));
    // 🔴 ไม่มีอายุของ = เทียบราคาให้ครบตามกติกาข้อ 4/5 ไม่ได้ ต้องเห็นว่าขาด ไม่ใช่เงียบ
    if(!f.shelf_life_days && f.freezable == null) facts.push('<span style="color:var(--amber)">⚠️ ยังไม่รู้อายุของ/ฟรีซได้ไหม</span>');
    return '<div class="card">'
      + '<div class="name">' + esc(it.name)
      + (it.freq ? '<span class="freq">สั่ง ' + it.freq + ' ครั้ง/3 เดือน</span>' : '')
      + '</div>'
      + (facts.length ? '<div class="facts">' + facts.join(' · ') + '</div>' : '')
      + '<div class="vrow">' + VENDORS.map(v => vendorBox(it, v)).join('') + '</div>'
      + (it.bothPriced && it.gap > 0
          ? '<div class="save">ถูกกว่า ' + baht1(it.gap) + '/กก. ถ้าซื้อที่ '
            + (it.best === 'go' ? 'GO' : 'Freshket') + '</div>'
          : '')
      + '</div>';
  }).join('') || '<div class="empty">ไม่พบของที่ค้น</div>';
}

load();
</script>
</body>
</html>
