<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ครัววันนี้ — Under360</title>
<!-- ตัวเปิดสำหรับติดหน้าโฮม: หน้านี้ถือ manifest/ไอคอน แล้วพาไปหน้าจริงทันที
     ทำแยกเพราะ kitchen/index.html เป็นไฟล์ของห้องครัว — ไม่แก้ทับของห้องอื่น -->
<link rel="manifest" href="/pwa/manifest-k.webmanifest">
<meta name="theme-color" content="#10221A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ครัววันนี้">
<link rel="apple-touch-icon" href="/pwa/icon-192.png">
<link rel="icon" href="/pwa/icon-192.png">
<style>
html,body{margin:0;height:100%;background:#0E1512;color:#EAF2ED;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Thai",sans-serif;
  display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px}
.dot{width:34px;height:34px;border:3px solid #2A3A32;border-top-color:#35D07F;border-radius:50%;
  animation:s .8s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
a{color:#35D07F}
</style>

<div class="dot"></div>
<div>กำลังเปิดใบงานครัว…</div>
