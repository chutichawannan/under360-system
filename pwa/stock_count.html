<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#1F4D3A">
<title>นับของเหลือ — Under360</title>
<link rel="manifest" href="manifest-k.webmanifest">
<style>
/* ═══ หน้านับของเหลือ — รอบ 3 (u-maintainer · 2 ก.ย. 2569) ═══
   นัทสั่ง: "interface ui ux ต้องง่ายกว่านี้ แบ่งเป็นตาราง 3-4 ช่อง
            และมี +100 +500 -100 -500 อยู่ดีกว่า"

   ทำไมเป็นตารางช่องแล้วแตะขยาย (ไม่ใช่ยัดปุ่ม 4 ปุ่มในทุกช่อง):
     130 รายการ × 4 ปุ่ม = 520 ปุ่มบนจอเดียว — กดผิดง่าย หาของยาก
     แบบนี้ตาไล่รูปทีละช่องได้เร็ว (3 ช่องต่อแถว = เห็น ~12 อย่างต่อจอ)
     แตะช่องไหน ปุ่มค่อยกางออกเฉพาะช่องนั้น = มีปุ่มใหญ่ให้กดทีละอย่าง ไม่พลาด

   คนที่ใช้จริงคือครัว อ่านไทยได้ 2 ใน 6 คน → พึ่งรูป + ตัวเลข + ปุ่ม ไม่พึ่งตัวหนังสือ
   หน่วยล็อกไว้ (กรัม · ไข่เป็นฟอง) ไม่มีช่องให้พิมพ์หน่วยเอง
   — บทเรียนจากรอบที่นัทจดมือ 22 ส.ค.: 13/27 รายการตีความไม่ได้เพราะไม่มีหน่วย */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--g:#1F4D3A;--gl:#E8F0EC;--bg:#F4F4F0;--line:#E5E5E1;--soft:#6B7280;--r:#C9573F}
body{margin:0;background:var(--bg);color:#1A1A1A;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Thai",sans-serif;padding-bottom:88px}
.hdr{position:sticky;top:0;z-index:30;background:var(--g);color:#fff;padding:11px 14px 9px}
.hdr h1{margin:0;font-size:16.5px;font-weight:800;letter-spacing:-.3px}
.hdr .sub{font-size:11px;opacity:.85;margin-top:2px}
.tabs{position:sticky;top:53px;z-index:29;display:flex;gap:6px;overflow-x:auto;padding:8px 12px;
  background:var(--bg);-webkit-overflow-scrolling:touch;border-bottom:1px solid var(--line)}
.tab{flex:0 0 auto;background:#fff;border:1px solid var(--line);border-radius:18px;padding:7px 12px;
  font-size:12.5px;font-weight:700;color:var(--soft);white-space:nowrap}
.tab.on{background:var(--g);border-color:var(--g);color:#fff}
.tab .n{margin-left:5px;font-size:11px;opacity:.75}

/* ตาราง 3 ช่อง — จอกว้างขึ้นเป็น 4 ช่องเอง */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px 10px 4px}
@media(min-width:520px){ .grid{grid-template-columns:repeat(4,1fr)} }
.cell{background:#fff;border:1.5px solid var(--line);border-radius:13px;padding:7px 6px 8px;
  display:flex;flex-direction:column;align-items:center;gap:5px;min-height:112px;overflow:hidden}
.cell.has{border-color:var(--g);background:#F6FBF8}
.cell.open{grid-column:1/-1;flex-direction:row;align-items:center;gap:12px;padding:12px;min-height:0}
.pic{width:52px;height:52px;flex-shrink:0;border-radius:10px;background:var(--gl);object-fit:cover;
  display:flex;align-items:center;justify-content:center;font-size:24px}
img.pic{background:#fff}
.cell.open .pic{width:62px;height:62px}
.nm{font-size:11.5px;font-weight:600;line-height:1.25;text-align:center;
  overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.cell.open .nm{flex:1;text-align:left;font-size:15px;font-weight:800;-webkit-line-clamp:2}
.val{font-size:15px;font-weight:800;color:var(--g);line-height:1}
.val.none{color:#C4C7C4;font-weight:600}
.cell.open .val{font-size:26px}
.vu{font-size:10px;color:var(--soft);font-weight:600;margin-left:2px}

/* แผงปุ่มตอนแตะ — ปุ่มใหญ่ กดทีละอย่าง ไม่พลาด */
.pad{display:none;grid-column:1/-1;background:#fff;border:1.5px solid var(--g);border-top:0;
  border-radius:0 0 13px 13px;margin:-8px 10px 8px;padding:10px 12px 12px}
.pad.on{display:block}
.pad .row{display:flex;gap:7px;margin-bottom:8px}
.pb{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:13px 0;
  font-size:15px;font-weight:800;font-family:inherit;color:#1A1A1A}
.pb.up{border-color:#BFD8CC;color:var(--g);background:var(--gl)}
.pb.dn{border-color:#EED8D3;color:var(--r);background:#FDF3F1}
.pad .row2{display:flex;gap:7px;align-items:center}
.tin{flex:1;text-align:center;font-size:22px;font-weight:800;font-family:inherit;
  border:1.5px solid var(--line);border-radius:10px;padding:10px;background:#fff}
.tin:focus{outline:none;border-color:var(--g)}
.zero{flex-shrink:0;background:#FDF3F1;border:1.5px solid #EED8D3;color:var(--r);border-radius:10px;
  padding:11px 14px;font-size:13px;font-weight:800;font-family:inherit}
.ok{flex-shrink:0;background:var(--g);color:#fff;border:0;border-radius:10px;padding:12px 20px;
  font-size:14px;font-weight:800;font-family:inherit}

.bar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#fff;border-top:1px solid var(--line);
  padding:9px 12px calc(9px + env(safe-area-inset-bottom));display:flex;gap:10px;align-items:center}
.bar .st{flex:1;font-size:11.5px;color:var(--soft);line-height:1.35}
.bar .st b{color:#1A1A1A;font-size:14px}
.save{background:var(--g);color:#fff;border:0;border-radius:11px;padding:12px 18px;font-size:14px;
  font-weight:800;font-family:inherit}
.save:disabled{background:#C9CDC9}
.note{margin:6px 12px 12px;background:#FEF9C3;border:1px solid #FDE68A;border-radius:10px;
  padding:10px 12px;font-size:11.5px;color:#713F12;line-height:1.55}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:80px;background:#1A1A1A;color:#fff;
  padding:10px 17px;border-radius:20px;font-size:13px;font-weight:700;opacity:0;transition:.25s;
  pointer-events:none;z-index:50}
.toast.on{opacity:1}
.last{font-size:10.5px;color:var(--soft);padding:5px 14px 0}
</style>
</head>
<body>

<div class="hdr">
  <h1>นับของเหลือ</h1>
  <div class="sub" id="hsub">กำลังโหลด…</div>
</div>
<div class="tabs" id="tabs"></div>
<div class="last" id="lastLine"></div>
<div id="list"></div>

<div class="note">
  <b>แตะรูปของ</b> → กดปุ่ม <b>+100 / +500</b> จนครบ แล้วแตะ <b>เสร็จ</b> · กดเกินใช้ <b>−100 / −500</b> ลดลงได้<br>
  ทั้งหมดนับเป็น<b>กรัม</b> (ไข่นับเป็นฟอง) · ของที่ไม่ได้นับ <b>เว้นว่างไว้</b> · ใส่ <b>0</b> เท่านั้นที่แปลว่าหมด
</div>

<div class="bar">
  <div class="st" id="stat">—</div>
  <button class="save" id="saveBtn" onclick="save()" disabled>บันทึก</button>
</div>
<div class="toast" id="toast"></div>

<script>
var SB='https://zdartbvhbvqlwzwyyiia.supabase.co/rest/v1';
var KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpkYXJ0YnZoYnZxbHd6d3l5aWlhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE4MTY3OTksImV4cCI6MjA5NzM5Mjc5OX0.D41YGH-CuWrVFqcAgXEuhfVTxJ7WY26Xu-PeXBF6LB8';
var H={apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'};
var LIST=null, VAL={}, TAB=0, OPEN=null, LAST=null;

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function toast(t){var e=document.getElementById('toast');e.textContent=t;e.classList.add('on');setTimeout(function(){e.classList.remove('on');},1700);}
/* วันไทยเสมอ — เจ้าของร้านอยู่คนละโซนเวลา ใช้นาฬิกาเครื่องจะได้คนละวันกับครัว */
function bkkToday(){ return new Date(Date.now()+7*3600e3).toISOString().slice(0,10); }
function bkkNow(){ return new Date(Date.now()+7*3600e3).toISOString().replace('T',' ').slice(0,16); }
async function get(q){ var r=await fetch(SB+'/'+q,{headers:H}); return r.json(); }

async function load(){
  try{
    var a=await get('kitchen_data?key=eq.stock_count_list&select=data');
    LIST=(a[0]&&a[0].data)||null;
    if(!LIST||!LIST.groups){ document.getElementById('hsub').textContent='ยังไม่มีลิสต์ของที่ต้องนับ'; return; }
    var c=await get('kitchen_data?key=like.stock_count:*&select=key,data&order=key.desc&limit=1');
    LAST=(c&&c[0])||null;
    render();
  }catch(e){ document.getElementById('hsub').textContent='โหลดไม่สำเร็จ — ลองรีเฟรช'; }
}
function counted(){ var n=0; for(var k in VAL){ if(VAL[k]!=='' && VAL[k]!=null) n++; } return n; }
function total(){ return LIST.groups.reduce(function(s,g){return s+g.items.length;},0); }
function doneIn(g){ return g.items.filter(function(it){return VAL[it.key]!=='' && VAL[it.key]!=null;}).length; }

function render(){
  document.getElementById('hsub').textContent='วันที่ '+bkkToday()+' · '+total()+' รายการ';
  if(LAST){
    var d=String(LAST.key).replace('stock_count:',''), who=(LAST.data&&LAST.data.by)||'';
    document.getElementById('lastLine').textContent='นับครั้งล่าสุด '+d+(who?(' โดย '+who):'');
  }
  document.getElementById('tabs').innerHTML=LIST.groups.map(function(g,i){
    return '<div class="tab'+(i===TAB?' on':'')+'" onclick="setTab('+i+')">'+esc(g.emoji||'')+' '+esc(g.name)
      +'<span class="n">'+doneIn(g)+'/'+g.items.length+'</span></div>';
  }).join('');
  var cur=LIST.groups[TAB]||{items:[]};
  var html='<div class="grid">';
  cur.items.forEach(function(it){
    var v=VAL[it.key], has=(v!=='' && v!=null), isOpen=(OPEN===it.key);
    /* รูปวัตถุดิบ — ตรวจมาทีละรูปแล้วว่าตรงของจริง · ตัวที่ยังไม่มีใช้อีโมจิของกลุ่มไปก่อน
       รูปพังเมื่อไหร่ตกกลับเป็นอีโมจิเอง ไม่ปล่อยกรอบว่าง */
    var pic = it.img
      ? '<img class="pic" src="'+esc(it.img)+'" loading="lazy" alt="" onerror="this.outerHTML=\'<div class=&quot;pic&quot;>'+esc(cur.emoji||'📦')+'</div>\'">'
      : '<div class="pic">'+esc(cur.emoji||'📦')+'</div>';
    var unit=(it.unit==='ฟอง'?'ฟอง':'ก.');
    html+='<div class="cell'+(has?' has':'')+(isOpen?' open':'')+'" onclick="openCell(\''+it.key+'\')">'
      + pic
      + '<div class="nm">'+esc(it.name)+'</div>'
      + '<div class="val'+(has?'':' none')+'">'+(has?(v+'<span class="vu">'+unit+'</span>'):'—')+'</div>'
      + '</div>';
    if(isOpen){
      html+='<div class="pad on" onclick="event.stopPropagation()">'
        + '<div class="row">'
        +   '<button class="pb dn" onclick="bump(\''+it.key+'\',-500)">−500</button>'
        +   '<button class="pb dn" onclick="bump(\''+it.key+'\',-100)">−100</button>'
        +   '<button class="pb up" onclick="bump(\''+it.key+'\',100)">+100</button>'
        +   '<button class="pb up" onclick="bump(\''+it.key+'\',500)">+500</button>'
        + '</div>'
        + '<div class="row2">'
        +   '<button class="zero" onclick="setVal(\''+it.key+'\',0)">หมด</button>'
        +   '<input class="tin" id="tin" type="number" inputmode="numeric" min="0" placeholder="พิมพ์เอง"'
        +     ' value="'+(has?v:'')+'" onfocus="this.select()" oninput="typed(\''+it.key+'\',this.value)">'
        +   '<button class="ok" onclick="closeCell()">เสร็จ</button>'
        + '</div></div>';
    }
  });
  html+='</div>';
  document.getElementById('list').innerHTML=html;
  quiet();
}
function setTab(i){ TAB=i; OPEN=null; render(); window.scrollTo(0,0); }
function openCell(k){ OPEN=(OPEN===k?null:k); render();
  if(OPEN){ var el=document.querySelector('.cell.open'); if(el) el.scrollIntoView({block:'center',behavior:'smooth'}); } }
function closeCell(){ OPEN=null; render(); }
function bump(k,n){
  var cur=Number(VAL[k])||0;
  VAL[k]=Math.max(0,cur+n);
  var t=document.getElementById('tin'); if(t) t.value=VAL[k];
  var box=document.querySelector('.cell.open .val');
  if(box) box.innerHTML=VAL[k]+'<span class="vu">ก.</span>';
  var cell=document.querySelector('.cell.open'); if(cell) cell.classList.add('has');
  quiet();
}
function setVal(k,v){ VAL[k]=v; render(); }
function typed(k,v){ VAL[k]=(v===''?'':Math.max(0,Number(v)||0)); quiet(); }
/* อัปเดตแค่ตัวเลขสรุป ไม่วาดใหม่ทั้งหน้า — ไม่งั้นคีย์บอร์ดเด้งปิดทุกครั้งที่พิมพ์ */
function quiet(){
  var n=counted();
  document.getElementById('stat').innerHTML='นับแล้ว <b>'+n+'</b> / '+total()+' รายการ';
  document.getElementById('saveBtn').disabled = n===0;
  var tabs=document.querySelectorAll('.tab .n');
  LIST.groups.forEach(function(g,i){ if(tabs[i]) tabs[i].textContent=doneIn(g)+'/'+g.items.length; });
}

async function save(){
  var btn=document.getElementById('saveBtn');
  btn.disabled=true; btn.textContent='กำลังบันทึก…';
  try{
    var who=localStorage.getItem('lastNickname')||'';
    if(!who){ who=(window.prompt('ใครเป็นคนนับรอบนี้ (พิมพ์ชื่อเล่น)','')||'').trim();
              if(who) localStorage.setItem('lastNickname',who); }
    var rows=[], byId={};
    LIST.groups.forEach(function(g){ g.items.forEach(function(it){
      var v=VAL[it.key];
      if(v==='' || v==null) return;                     // ไม่ได้นับ = ไม่แตะค่าเดิม
      rows.push({name:it.name, qty:Number(v), unit:it.unit||'g', sku:it.sku||'', ing_id:it.ing_id||null});
      if(it.ing_id) byId[it.ing_id]=Number(v);
    });});
    if(!rows.length){ toast('ยังไม่ได้กรอกอะไรเลย'); btn.disabled=false; btn.textContent='บันทึก'; return; }

    /* ① เก็บรอบนับเป็นประวัติ — ห้ามทับรอบเก่า ต้องเทียบข้ามรอบได้ถึงจะรู้ว่าของไหนเหลือประจำ */
    var r1=await fetch(SB+'/kitchen_data',{method:'POST',headers:Object.assign({},H,{Prefer:'resolution=merge-duplicates'}),
      body:JSON.stringify({key:'stock_count:'+bkkToday(),data:{date:bkkToday(),at:bkkNow(),by:who,items:rows}})});
    if(!r1.ok) throw new Error('save fail');

    /* ② เขียนกลับเข้าคลังวัตถุดิบเฉพาะตัวที่ผูก id → หน้าแพลนซื้อของคำนวณต่อได้ทันที
          อ่านคลังสดก่อนเขียนเสมอ กันทับของที่คนอื่นเพิ่งแก้ */
    var n2=0;
    if(Object.keys(byId).length){
      var cur=await get('kitchen_data?key=eq.ingredients&select=data');
      var ing=(cur[0]&&cur[0].data)||[];
      ing.forEach(function(i){ if(byId[i.id]!=null){ i.stock=byId[i.id]; n2++; } });
      await fetch(SB+'/kitchen_data?key=eq.ingredients',{method:'PATCH',headers:H,body:JSON.stringify({data:ing})});
    }
    fetch(SB+'/activity_log',{method:'POST',headers:H,body:JSON.stringify({
      session_id:'count_'+Date.now(), actor:who||'ครัว', source:'k', action_type:'stock',
      summary:'นับของเหลือ '+rows.length+' รายการ ('+bkkToday()+')',
      detail:{count:rows.length, updated_ingredients:n2, by:who, items:rows.slice(0,80)}
    })}).catch(function(){});

    toast('บันทึกแล้ว '+rows.length+' รายการ');
    LAST={key:'stock_count:'+bkkToday(),data:{by:who}};
    OPEN=null; setTimeout(render,300);
  }catch(e){ toast('บันทึกไม่สำเร็จ — ลองใหม่อีกครั้ง'); }
  btn.disabled=false; btn.textContent='บันทึก';
}
load();
</script>
</body>
</html>
