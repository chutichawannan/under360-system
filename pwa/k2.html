.hdr-row{display:flex;align-items:center;gap:8px}

.days{display:flex;gap:6px;margin-top:8px;overflow-x:auto;padding-bottom:2px}
.day{flex:0 0 auto;background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:9px;padding:6px 12px;font-size:12px;font-family:var(--sans);cursor:pointer;white-space:nowrap}

.sec{font-size:12px;font-weight:700;color:var(--soft);margin:14px 4px 7px;letter-spacing:.3px}
.empty{text-align:center;color:var(--soft);font-size:13px;padding:28px 10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:78px;background:#111;color:#fff;padding:9px 16px;border-radius:11px;font-size:13px;z-index:99;opacity:0;transition:.2s;pointer-events:none}

</style>

<script>

     · "ลูกค้าซื้อได้" คำนวณอย่างเดียว ห้ามใครกรอก
     · ไม่มี "ปิดวันอัตโนมัติ" ไม่มีช่อง "กำลังเติม"

   🤝 อยู่ร่วมกับหน้าเก่ายังไง (ข้อ 3 ที่พี่ปืนกำชับ):

       actual_stock = ของในตู้ที่ครัวนับได้   (ความหมายเดิมเป๊ะ)
       stock_total  = ลูกค้าซื้อได้อีก        (ความหมายเดิมเป๊ะ) = max(0, นับได้ − จอง)
     หน้าเก่าคิด "มีจริง" = stock_total + จอง − กำลังเติม
       → เมื่อ "กำลังเติม" = 0 จะได้ค่าเดียวกับที่นับพอดี ไม่แตกกัน
     ⚠️ ข้อยกเว้นที่ต้องรู้: ถ้านับได้ "น้อยกว่า" จอง หน้าเก่าจะโชว์เท่ากับจองเสมอ
        (มันไม่มีที่เก็บค่าที่ต่ำกว่านั้น — คือบั๊กที่ ISSUE 02 กำลังแก้)
        หน้านี้เก็บค่าจริงลง actual_stock ครบ ไม่ตัดทิ้ง

   📌 ที่เก็บใหม่ใช้ kitchen_data (คีย์-ค่า) เท่านั้น ไม่แตะ schema
       k2_pack = ติ๊กจัดของ (แยกคีย์จากของเก่า เพราะของเก่าเอาไปคิดสต๊อก แต่ของใหม่ไม่คิด)
       k2_plan = เลขแผนผลิตที่คนพิมพ์ทับ
   ══════════════════════════════════════════════════════════════════════════ */
const SB_URL='https://zdartbvhbvqlwzwyyiia.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpkYXJ0YnZoYnZxbHd6d3l5aWlhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE4MTY3OTksImV4cCI6MjA5NzM5Mjc5OX0.D41YGH-CuWrVFqcAgXEuhfVTxJ7WY26Xu-PeXBF6LB8';
let sb=null;
function getSB(){try{if(!sb&&typeof supabase!=='undefined')sb=supabase.createClient(SB_URL,SB_KEY);return sb;}catch(e){return null;}}

/* เวลาไทยเสมอ — เครื่องนัทอยู่คนละโซน ถ้าใช้เวลาเครื่องจะเพี้ยนทั้งวัน */
function thaiToday(){ return new Date(Date.now()+7*3600e3).toISOString().slice(0,10); }
/* 🕐 ฐานข้อมูลเก็บเวลาเป็น UTC · ไทย = UTC+7
   ทุกที่ที่เอาเวลาจากฐานข้อมูลมาให้คนอ่าน ต้องผ่าน 2 ตัวนี้ ห้ามตัดสตริงดิบ ๆ
   (นัทจับได้ 13 ก.ย.: ครัวนับ 9 โมงเช้า แต่หน้าจอขึ้น 02:10) */
function thaiIso(iso){ return iso ? new Date(new Date(iso).getTime()+7*3600e3).toISOString() : ''; }
function thaiDateOf(iso){ return thaiIso(iso).slice(0,10); }          // วันที่ตามเวลาไทย
function thaiClock(iso){ const t=thaiIso(iso); return t ? (t.slice(8,10)+'/'+t.slice(5,7)+' '+t.slice(11,16)+' น.') : ''; }
function dPlus(ymd,n){ const d=new Date(ymd+'T00:00:00Z'); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); }
const DOW=['อา','จ','อ','พ','พฤ','ศ','ส'];
function dLabel(ymd){
  const t=thaiToday();
  if(ymd===t) return 'วันนี้';
  if(ymd===dPlus(t,1)) return 'พรุ่งนี้';
  if(ymd===dPlus(t,-1)) return 'เมื่อวาน';
  const d=new Date(ymd+'T00:00:00Z');
  return DOW[d.getUTCDay()]+' '+d.getUTCDate()+'/'+(d.getUTCMonth()+1);
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('on'); clearTimeout(t._x); t._x=setTimeout(()=>t.classList.remove('on'),1900); }

/* รหัสสั้นที่ครัวเรียกกันจริง (s1-s8 / d1-d5) — ไม่มีก็ใช้โค้ดเต็ม */
function shortCode(m){ return (m.subcode&&String(m.subcode).trim()) ? String(m.subcode).toUpperCase() : String(m.code||''); }
/* ❌ ถอดรูปอาหารออกทั้งหน้า — นัทสั่งเองจากหน้าจริง 10 ก.ย. 2569: "ไม่ต้องมีภาพอาหารข้างหน้า"
   ผลพลอยได้: เมนูที่รูปโหลดไม่ขึ้น (เช่น S098 ขึ้นกรอบขาว) หายไปเอง
   น้ำหนักการอ่านย้ายไปที่ "รหัสสั้น" ทั้งหมด → ขยายรหัสให้ใหญ่ที่สุดในแถวชดเชย */

let VIEW='pack', DAY=thaiToday(), USER='';
let MENUS=[], ORDERS=[], ITEMS={}, PACK={}, PLAN={}, HIST=[];
/* 11 ก.ย. 2569 (นัท "เติมเลยด่วน"): กำลังผลิต (stock_incoming) · แผนป้าย+ยอดวางขายของนิว · รอบ Meal Plan */
let INC={}, SUBPLAN={}, STOCKPLAN={}, MPD=[];
/* MAKE = "จะทำเพิ่ม" ต่อเมนู: { menu_id: {n, from:'YYYY-MM-DD', by, at} }
   เก็บแยกจาก actual_stock โดยตั้งใจ — ห้ามเอาไปรวมกันไม่ว่ากรณีใด */
let MAKE={};
/* ข้อจำกัดอาหารของลูกค้า (แพ้/ไม่ทาน) — คีย์ได้ทั้ง customer_id และ line_uid เหมือนหน้าครัวเดิม */
let PREFS={};

function setUser(){
  const n=(prompt('ใส่ชื่อคุณ (ระบบจำไว้ใช้ตอนบันทึก)',USER||'')||'').trim();
  if(!n) return;
  USER=n; try{ localStorage.setItem('lastNickname',n); }catch(e){}

}
function needUser(){ if(!USER){ setUser(); } return !!USER; }

/* ─── โหลดข้อมูลจริงทั้งหมด ───────────────────────────────────────────────
   ช่วงที่โหลด: ย้อนหลัง 7 วัน ถึงหน้า 14 วัน — พอสำหรับดูย้อนหลังและวางแผน
   ⚠️ ต้องมี limit เสมอ (บทเรียน 1000-cap ของบ้านนี้) */
async function loadAll(){
  const s=getSB(); if(!s) return;
  const from=dPlus(thaiToday(),-7), to=dPlus(thaiToday(),14);
  const [mr,or_,kd,mpr]=await Promise.all([
    /* โหลดทั้งหมด ไม่กรอง is_available — ต้องรู้จักเมนูที่ปิดขายไปแล้วด้วย
       เพราะใบที่สั่งไว้ก่อนปิดขาย ยังมีของค้างอยู่จริง (เคสจริง 11 ก.ย.: S184 ปิดแล้ว แต่คุณ Golf ยังรอ 2 กล่อง)
       หน้านับของค่อยกรองเอาเฉพาะที่เปิดขายทีหลัง */
    s.from('menu_items').select('id,code,subcode,name,stock_total,actual_stock,is_available,category').limit(1000),
    s.from('orders').select('id,order_number,customer_name,line_display_name,want_utensils,status,delivery_date,created_at,source,total,customer_id,line_uid')
      .gte('delivery_date',from).lte('delivery_date',to).limit(1000),
    s.from('kitchen_data').select('key,data').in('key',['k2_pack','k2_plan','appConfig','stock_incoming','weekly_subcode_plan','weekly_stock_plan','k2_make']).limit(10),
    /* รอบ Meal Plan — หน้าครัวเดิมมีคิวนี้ · k2 เดิมอ่านจากใบอย่างเดียว รอบที่ใบลงวันอื่นจึงหายจากจอ */
    s.from('mp_deliveries').select('id,order_id,customer_name,delivery_date,round_no,total_rounds,mp_type,box_count,status').gte('delivery_date',from).lte('delivery_date',to).limit(1000)
  ]);
  MENUS=(mr.data||[]).sort((a,b)=>shortCode(a).localeCompare(shortCode(b),'th',{numeric:true}));
  ORDERS=(or_.data||[]).filter(o=>o.status!=='cancelled'&&o.source!=='parallel_test');
  /* 🔴 ข้อจำกัดอาหาร — ครัวต้องเห็นก่อนจัดของ (หน้าครัวเดิมมีมาตลอด · k2 เพิ่งเติม 12 ก.ย. 2569)
     ถามทั้ง customer_id และ line_uid เพราะฝั่งโปรไฟล์เขียน fallback เป็น line_uid ตอนหา customer id ไม่เจอ
     ซอยเป็นก้อนละ 60 กัน URL ยาวเกินตอนออเดอร์เยอะ (บทเรียนเดียวกับหน้าเดิม) */
  PREFS={};
  try{
    const ids=[];
    ORDERS.forEach(o=>{ if(o.customer_id&&ids.indexOf(o.customer_id)<0) ids.push(o.customer_id);
                        if(o.line_uid&&ids.indexOf(o.line_uid)<0) ids.push(o.line_uid); });
    for(let i=0;i<ids.length;i+=60){
      const pf=await s.from('customer_preferences').select('customer_id,allergies,dislikes').in('customer_id',ids.slice(i,i+60)).limit(200);
      (pf.data||[]).forEach(p=>{ PREFS[p.customer_id]=p; });
    }
  }catch(e){ PREFS={}; }   /* อ่านไม่ได้ = ไม่โชว์ ดีกว่าทำให้ทั้งหน้าพัง — แต่ครัวจะไม่เห็นคำเตือน */
  MPD=((mpr&&mpr.data)||[]).filter(r=>r.status!=='cancelled');
  (kd.data||[]).forEach(r=>{ if(r.key==='stock_incoming')INC=r.data||{}; if(r.key==='weekly_subcode_plan')SUBPLAN=r.data||{}; if(r.key==='weekly_stock_plan')STOCKPLAN=r.data||{}; });
  (kd.data||[]).forEach(r=>{ if(r.key==='k2_pack')PACK=r.data||{}; if(r.key==='k2_plan')PLAN=r.data||{}; if(r.key==='k2_make')MAKE=r.data||{};
    if(r.key==='appConfig'){ CAT_LABEL={}; ((r.data&&r.data.categories)||[]).forEach(c=>{ if(c&&c.key) CAT_LABEL[c.key]=c.label||c.key; }); } });

  ITEMS={};
  const ids=ORDERS.map(o=>o.id);
  for(let i=0;i<ids.length;i+=60){
    const r=await s.from('order_items').select('id,order_id,menu_item_id,menu_code,menu_name,quantity').in('order_id',ids.slice(i,i+60)).limit(2000);
    (r.data||[]).forEach(it=>{ (ITEMS[it.order_id]=ITEMS[it.order_id]||[]).push(it); });
  }
  render();
}

/* ─── ตัวเลขแกน 3 ตัว ────────────────────────────────────────────────────
   จองที่ยังไม่ส่ง = ทุกใบที่วันส่ง >= วันนี้ และยังไม่ delivered
   ⚠️ ตั้งใจไม่ตัดใบที่ "แพ็คแล้ว" ออก — ตามคอนเซปต์นัท ถุงที่แพ็คแล้วยังอยู่ในตู้
      และยังถูกนับด้วยตา จึงต้องยังถูกนับเป็น "จอง" อยู่ */
/* ใบนี้จัดครบแล้วหรือยัง — จัดครบ = ของออกจากตู้ไปแล้ว ไม่ต้องกันไว้ให้อีก
   นับจากช่องติ๊กจริงในหน้าจัดของ (PACK) ไม่ใช่จากสถานะใบ เพราะสถานะเปลี่ยนด้วยเหตุอื่นได้ */
function packDoneOf(o){
  const need = (ITEMS[o.id]||[]).filter(it=>!isMPHeadRow(it)).reduce((s,it)=>s+(Number(it.quantity)||0),0);
  return need > 0 && packedOf(o) >= need;
}
/* ยอดจองที่ยัง "ต้องกันของไว้ให้" — ตัดใบที่จัดใส่ถุงไปแล้วออก
   🔑 ของที่ออกจากตู้ไปแล้ว ไม่นับ ไม่หัก ทั้งสองฝั่ง (เคส S135 13 ก.ย.: 1 − 2 = −1 ทั้งที่ของพอ) */
function bookedOpen(){
  const t=thaiToday(), m={};
  ORDERS.forEach(o=>{
    if(o.status==='delivered') return;
    if(!o.delivery_date || o.delivery_date < t) return;
    if(packDoneOf(o)) return;                       // จัดแล้ว = ไม่อยู่ในตู้แล้ว
    (ITEMS[o.id]||[]).forEach(it=>{ if(it.menu_item_id) m[it.menu_item_id]=(m[it.menu_item_id]||0)+(it.quantity||0); });
  });
  return m;
}
function bookedMap(){
  const t=thaiToday(), m={};
  ORDERS.forEach(o=>{
    if(o.status==='delivered') return;
    if(!o.delivery_date || o.delivery_date < t) return;
    (ITEMS[o.id]||[]).forEach(it=>{ if(it.menu_item_id) m[it.menu_item_id]=(m[it.menu_item_id]||0)+(it.quantity||0); });

}
function bookedOn(ymd){
  const m={};
  ORDERS.forEach(o=>{
    if(o.status==='delivered'||o.delivery_date!==ymd) return;
    (ITEMS[o.id]||[]).forEach(it=>{ if(it.menu_item_id) m[it.menu_item_id]=(m[it.menu_item_id]||0)+(it.quantity||0); });
  });
  return m;
}
/* รายวัน เฉพาะใบที่ยังไม่ได้จัด — ใช้ตอบ "วันนั้นต้องเตรียมของอีกกี่กล่อง"
   ใบที่จัดใส่ถุงแล้วไม่ต้องเตรียมซ้ำ (เคส S135 13 ก.ย.) */
function bookedOnOpen(ymd){
  const m={};
  ORDERS.forEach(o=>{
    if(o.status==='delivered'||o.delivery_date!==ymd) return;
    if(packDoneOf(o)) return;
    (ITEMS[o.id]||[]).forEach(it=>{ if(it.menu_item_id) m[it.menu_item_id]=(m[it.menu_item_id]||0)+(it.quantity||0); });
  });
  return m;
}
function ordersOn(ymd){ return ORDERS.filter(o=>o.delivery_date===ymd); }
/* แถวหัว Meal Plan (MP-xxx ×7) = 1 รายการที่หมายถึงทั้งชุด ไม่ใช่ 7 กล่องที่ต้องหยิบทีละกล่อง
   นับรวมเมื่อไหร่ ตัวนับ ☑ จะพองจนครัวเลิกเชื่อ (บทเรียนเดิมจากใบจัดของ: MP 1 แถว = 21 กล่อง) */
function boxesOf(o){ return (ITEMS[o.id]||[]).reduce((s,i)=>s+(isMPHeadRow(i)?0:(i.quantity||0)),0); }
/* นับเฉพาะแถวเดียวกับที่ boxesOf นับ — เดิมนับติ๊กของแถวหัวชุด Meal Plan ด้วย ตัวนับเลยเกิน (เช่น ☑ 8/7)
   และใบถูกนับว่า "จัดครบ" ก่อนจัดจริง (reviewer ของชุด polish 11 ก.ย. ชี้ไว้) */
function packedOf(o){ const p=PACK[o.id]||{}; return (ITEMS[o.id]||[]).reduce((s,it)=>s+(isMPHeadRow(it)?0:(Number(p[it.id])||0)),0); }
function isDone(o){ if(o.status==='ready'||o.status==='delivered') return true; const b=boxesOf(o); return b>0 && packedOf(o)>=b; }
/* ใบที่แอดมินเปิดให้ระหว่างวัน = "ด่วน" — อธิบายตัวเองได้ในหน้า (ข้อ 2 ที่นัทติ) */
/* ป้าย "ด่วน" = แอดมินเพิ่งสั่งเพิ่มระหว่างวัน
   เดิมเทียบ created_at (UTC) กับวันไทยตรง ๆ → ใบที่สั่งเที่ยงคืน–7 โมงเช้าเวลาไทย
   จะถูกอ่านเป็นของ "เมื่อวาน" แล้วป้ายด่วนหายทั้งที่เพิ่งสั่งจริง */
function isUrgent(o){ return String(o.source||'')==='admin_manual' && thaiDateOf(o.created_at) >= dPlus(thaiToday(),-1); }

function go(v){ VIEW=v; ['pack','count','plan','admin'].forEach(x=>document.getElementById('nav-'+x).classList.toggle('on',x===v)); render(); }

/* ─── 📦 จัดของ — ติ๊ก 1 ครั้งจบ ไม่มีปุ่มยืนยัน และไม่แตะสต๊อก ───────────── */
/* 🍱 ใบ Meal Plan = ทำสดวันนั้น คนละงานกับจัดของสต็อก — หน้าเก่าแยกแท็บไว้ ที่นี่แยกเป็นกลุ่มในหน้าเดียว
   (ไม่เพิ่มแท็บ เพราะกติกาคือยิ่งครัวต้องเปิดน้อยหน้ายิ่งดี)
   ของจริง 11 ก.ย.: 15 ใบของวันนั้น เป็น Meal Plan 10 ใบ — ถ้าไม่แยก ครัวเปิดมาเจอกองปนกันทันที */
function isMPOrder(o){
  return (ITEMS[o.id]||[]).some(it => /^MP-/i.test(String(it.menu_code||'')) || /^meal_plan:/i.test(String(it.notes||'')));
}
/* แถว "MP-HP-R2 ×7" = 1 รายการที่หมายถึงทั้งชุด ไม่ใช่ 7 กล่องที่ต้องหยิบทีละกล่อง
   ถ้านับรวมเข้าตัวนับ ☑ ตัวเลขจะพองจนครัวเลิกเชื่อ (บทเรียนเดิมจากใบจัดของ: MP 1 แถว = 21 กล่อง) */
function isMPHeadRow(it){ return /^MP-/i.test(String(it.menu_code||'')); }
/* 🍳 กำลังผลิต — ยอดที่สั่งครัวทำไว้ (นิวเขียนตอนเปิดเมนูสัปดาห์ใหม่ · หน้าครัวเดิมก็เขียนช่องนี้)
   โชว์อย่างเดียว ไม่มีช่องกรอก — หน้านับของยังมีช่องเดียวตามที่ออกแบบไว้ (ISSUE 02 รอบ 4) */
function incOf(mid){ const r=INC&&INC[mid]; return (r&&Number(r.n)>0)?{n:Number(r.n),by:String(r.by||""),at:String(r.at||"")}:null; }
/* ยอดที่นิววางขายสัปดาห์นั้น ของเมนูนี้ — หาช่องจากแผนป้าย (รหัสจริง) ไม่ใช่จาก subcode ปัจจุบัน
   เพราะป้าย S1–S8 ย้ายไปเมนูชุดใหม่ทุกสัปดาห์ */
function weekStartOfYmd(ymd){ const d=new Date(ymd+'T00:00:00Z'); d.setUTCDate(d.getUTCDate()-((d.getUTCDay()+6)%7)); return d.toISOString().slice(0,10); }
function weekPlanOf(m,ymd){
  const wk=weekStartOfYmd(ymd), plan=(SUBPLAN||{})[wk], qty=(((STOCKPLAN||{})[wk])||{}).qty;
  if(!plan||!qty||!m) return null;
  const slot=Object.keys(plan).find(k=>plan[k]===m.code);
  return (slot&&Number(qty[slot])>0)?{slot:slot,n:Number(qty[slot]),week:wk}:null;
}
/* 🍱 รอบ Meal Plan ของวันนั้นที่ "ใบออเดอร์ลงวันอื่น" — หน้าที่อ่านจากใบ (k2 · ใบจัดของ · แมส) จะไม่เห็นรายนี้
   เคสจริง 11 ก.ย.: PIMM รอบ 3/3 ส่งจันทร์ 14 แต่ใบ U-0904-005 ลงวันที่ 4 */
function mpRoundsOffOrder(ymd){
  const onDay=new Set(ordersOn(ymd).map(o=>o.id));
  return MPD.filter(r=>r.delivery_date===ymd&&r.status!=='delivered'&&!(r.order_id&&onDay.has(r.order_id)));
}
function mpRoundsOn(ymd){ return MPD.filter(r=>r.delivery_date===ymd); }
/* พิมพ์ใบจัดของ — ใช้หน้าพิมพ์เดิมที่ครัวใช้อยู่ (เครื่อง SUNMI) ส่งวันไปให้ แล้วเด้งกล่องพิมพ์เอง */
function printUrl(ymd){ return '/print_pickslip.html?date='+encodeURIComponent(ymd)+'&auto=1'; }

  }

/* หัวการ์ด — เอาของที่หน้าเก่ามีและครัวใช้จริงมาครบ (นัทสั่งเอง 10 ก.ย. เทียบกับหน้าเก่า)
     ชื่อลูกค้า (+ ชื่อไลน์ถ้าไม่ตรงกัน) · เลขใบ · ตัวนับกล่อง · ช้อนส้อม
   ⚠️ ช้อนส้อม: ค่า null/undefined = ใส่ (default true ใน DB) — เช็คแบบเดียวกับหน้าเก่าเป๊ะ
      ถ้าเช็คด้วย if(o.want_utensils) ใบเก่าที่ไม่มีค่าจะกลายเป็น "ไม่ต้องใส่" ทั้งหมด = ครัวลืมใส่ช้อน */
/* ⚠️ ป้ายข้อจำกัดอาหาร — แพ้ = อันตรายถึงชีวิต · ไม่ทาน = ความชอบ
   ไม่มีข้อจำกัด = ไม่ขึ้นอะไรเลย (ถ้าขึ้นทุกใบ ครัวจะชินแล้วเลิกอ่าน — กติกาเดียวกับหน้าครัวเดิม) */
function dietHtml(o){
  const p = o ? (PREFS[o.customer_id] || PREFS[o.line_uid]) : null;
  if(!p) return '';
  const al=String(p.allergies||'').trim(), dl=String(p.dislikes||'').trim();
  if(!al&&!dl) return '';
  let h='';
  if(al) h+='<div class="diet diet-al">⚠️ แพ้ '+esc(al)+'</div>';
  if(dl) h+='<div class="diet diet-dl">ไม่ทาน '+esc(dl)+'</div>';
  return h;
}
function cardHtml(o,urgent){
  const its=ITEMS[o.id]||[], p=PACK[o.id]||{}, b=boxesOf(o), dn=packedOf(o);
  const packed=(o.status==='ready'||o.status==='delivered');
  const ln=String(o.line_display_name||'').trim(), cn=String(o.customer_name||'').trim();
  const wantU=(o.want_utensils!==false);
  let h='<div class="card'+(urgent?' urg':'')+(packed?' done':'')+'">'
   +'<div class="c-top">'
     +'<div class="c-name">'+esc(cn||'—')+(ln&&ln!==cn?'<span class="c-line"> (LINE: '+esc(ln)+')</span>':'')+'</div>'
     +'<div class="c-prog">☑ '+dn+'/'+b+'</div></div>'
   +'<div class="c-sub">'
     +'<span class="oid">'+esc(o.order_number||'—')+'</span>'
     +'<span class="chip'+(wantU?' u-yes':' u-no')+'">'+(wantU?'🥄🍴 ใส่ช้อนส้อม':'❌ ไม่ต้องช้อนส้อม')+'</span>'
     +(packed?'<span class="chip st">✅ จัดกล่องแล้ว</span>':'')
   +'</div>'
   +dietHtml(o);
  its.forEach(it=>{
    const m=MENUS.find(x=>x.id===it.menu_item_id)||{code:it.menu_code,name:it.menu_name};
    const q=it.quantity||1, on=(Number(p[it.id])||0)>=q;
    /* 🔴 เมนูที่ปิดขายไปแล้ว แต่ใบนี้สั่งไว้ก่อนปิด = ของยังถูกสัญญาไว้กับลูกค้า
       ครัวต้องเห็นป้ายก่อนจะเดินไปหาในตู้แล้วไม่เจอ
       เคสจริง 11 ก.ย.: S184 ปิดขายแล้ว ครัวบอกไม่มีของ แต่คุณ Golf ยังรออยู่ 2 กล่อง */
    const closed = !!(it.menu_item_id && m && m.is_available===false);
    const head = isMPHeadRow(it);
    h+='<div class="row'+(on?' on':'')+(head?' mp':'')+'" onclick="tick(\''+o.id+'\',\''+it.id+'\','+q+')">'
     +'<div class="code">'+esc(shortCode(m))+'</div>'
     +'<div class="nm">'+esc(String(m.name||it.menu_name||'').slice(0,34))
       +(closed?'<span class="flag">⚠️ ปิดขายแล้ว</span>':'')+'</div>'
     +'<div class="qty">'+(head?('ชุด '+q):('×'+q))+'</div><div class="tick">'+(on?'✅':'⬜')+'</div></div>';
  });
  /* ปุ่ม 2 ตัวแบบหน้าเก่า — แต่ **ไม่ใช่ขั้นบังคับ** ติ๊กแต่ละแถวบันทึกทันทีอยู่แล้ว
     ปุ่มนี้คือทางลัด "ติ๊กครบทั้งใบทีเดียว" + ปิดสถานะใบ ไม่ใช่ด่านที่ถ้าไม่กดแล้วงานหาย
     (84 ใบใน 9 วันที่หน้าเก่าไม่เคยถูกกด = บทเรียนว่าห้ามให้งานขึ้นกับปุ่มเดียว) */
  h+='<div class="acts">';
  if(!packed){
    if(dn>0&&dn<b) h+='<button class="bt part" onclick="markPartial(\''+o.id+'\')">📦 จัดเสร็จบางส่วน '+dn+'/'+b+'</button>';
    h+='<button class="bt pack" onclick="markPacked(\''+o.id+'\')">✅ จัดกล่องเสร็จ</button>';
  }else{
    h+='<button class="bt undo" onclick="markUnpack(\''+o.id+'\')">↩ ยังไม่จัด</button>';
  }
  return h+'</div></div>';
}
/* ติ๊กครบทั้งใบ + ปิดสถานะ — เขียน status เดียวกับหน้าเก่า (ready) จะได้ไม่แตกกัน */
async function markPacked(oid){
  if(!needUser()) return;
  const s=getSB(); if(!s) return;
  const o=ORDERS.find(x=>x.id===oid); if(!o) return;
  const p=PACK[oid]||(PACK[oid]={});
  (ITEMS[oid]||[]).forEach(it=>{ p[it.id]=it.quantity||1; });
  o.status='ready'; render();
  const w=await s.from('orders').update({status:'ready',updated_at:new Date().toISOString()}).eq('id',oid);
  if(w.error){ toast('บันทึกไม่สำเร็จ ลองใหม่'); return; }
  await s.from('kitchen_data').upsert({key:'k2_pack',data:PACK},{onConflict:'key'});
  logPack(o,'✅ จัดกล่องเสร็จ ('+boxesOf(o)+' กล่อง)');
  toast('จัดกล่องเสร็จ · '+(o.customer_name||''));
}
async function markUnpack(oid){
  if(!needUser()) return;
  const s=getSB(); if(!s) return;
  const o=ORDERS.find(x=>x.id===oid); if(!o) return;
  /* ย้อนสถานะต้องล้างติ๊กด้วย — เดิมเก็บติ๊กไว้ ใบเลยยังถูกนับว่า "จัดครบ" ทั้งที่เพิ่งกดยังไม่จัด
     (reviewer ของชุด polish 11 ก.ย. ชี้ไว้) */
  o.status='confirmed'; delete PACK[oid]; render();
  const w=await s.from('orders').update({status:'confirmed',updated_at:new Date().toISOString()}).eq('id',oid);
  if(w.error){ toast('บันทึกไม่สำเร็จ ลองใหม่'); return; }
  await s.from('kitchen_data').upsert({key:'k2_pack',data:PACK},{onConflict:'key'});
  logPack(o,'↩ ยังไม่จัด');
  toast('ย้อนกลับเป็นยังไม่จัดแล้ว');
}
/* บางส่วน = ยืนยันจำนวนที่ติ๊กไว้ตอนนี้ ให้มีร่องรอยว่าจัดไปแล้วกี่กล่อง ใบยังไม่ปิด */
async function markPartial(oid){
  if(!needUser()) return;
  const o=ORDERS.find(x=>x.id===oid); if(!o) return;
  logPack(o,'📦 จัดเสร็จบางส่วน '+packedOf(o)+'/'+boxesOf(o)+' กล่อง');
  toast('บันทึกว่าจัดไปแล้ว '+packedOf(o)+' กล่อง');
}
function logPack(o,what){
  const s=getSB(); if(!s) return;
  s.from('activity_log').insert({
    session_id:'k2_'+(window._sid||(window._sid=Date.now())), actor:USER, source:'k2', action_type:'kq_status',
    summary:(o.customer_name||'—')+' ('+(o.order_number||'—')+') — '+what,
    detail:{order_id:o.id,order_number:o.order_number,page:'k2'}
  }).then(()=>{},()=>{});
}
async function tick(oid,iid,q){
  const p=PACK[oid]||(PACK[oid]={});
  if((Number(p[iid])||0)>=q) delete p[iid]; else p[iid]=q;
  if(!Object.keys(p).length) delete PACK[oid];
  render();
  const s=getSB(); if(!s) return;
  const r=await s.from('kitchen_data').upsert({key:'k2_pack',data:PACK},{onConflict:'key'});
  if(r.error) toast('บันทึกไม่สำเร็จ ลองใหม่');
}

/* ─── 🔢 นับของ — ช่องเดียว เลขที่ครัวพิมพ์ชนะเสมอ ────────────────────── */
/* ─── 🗂️ หน้านับของ: แยกหมวด + เลือกหมวด + พับหมวด (นัทสั่ง 11 ก.ย. 2569) ─────────────────
   นัท: "รายการมันเยอะ คนจะกรอกล่าง ๆ ต้องเลื่อนไปเยอะมาก — จะ collapse หรือจะเพิ่มประเภทมาให้ติ้กก็ได้"
   → ทำทั้งคู่: ปุ่มหมวดบนหัว (แตะแล้วเหลือหมวดเดียว) + หัวข้อแต่ละหมวดแตะพับ/กางได้
   🔴 ตัดแถวออกตอน render เท่านั้น — ส่วน polish ตั้ง el.hidden ใหม่ให้ทุกแถวทุกครั้ง ซ่อนด้วย hidden จะเด้งกลับ */
let CAT_LABEL = {};
/* หมวดที่ appConfig ยังไม่มีชื่อไทย — ตั้งชื่อสำรองให้ครัวอ่านออก ไม่ขึ้นรหัสดิบ */
const CAT_FALLBACK = { jay2026:'คอร์สเจ 2569', hyrox:'Hyrox', uncategorized:'ยังไม่มีหมวด' };
let COUNT_CAT = 'all';   // หมวดที่เลือกอยู่
let COUNT_FOLD = {};     // { category: true } = พับไว้
/* เปิดมาครั้งแรกให้เจอ "ต้องนับวันนี้" — คนที่เคยเลือกหมวดค้างไว้ ยังได้ของเดิม */
/* 🔴 นัทสั่งซ่อน 12 ก.ย. 2569: "ซ่อนระบบนับของที่นายคิดให้ไปก่อนเลย เพราะผิด objective ที่คุยไว้ตอนแรก
   แถมตีความผิดแล้วไปทำระบบเองขึ้นมาด้วย"
   ปิดทั้งชุดด้วยตัวแปรเดียว: ปุ่ม 🎯 ต้องนับวันนี้ · กล่องบอกว่ากำลังกรอง · ปุ่ม "เท่าเดิม"
   ไม่ได้ลบโค้ดทิ้ง — ถ้าวันหนึ่งนัทสั่งเอา เปลี่ยนเป็น true บรรทัดเดียวจบ */
var COUNT_SMART = false;
try{ COUNT_CAT = localStorage.getItem('k2_count_cat') || (COUNT_SMART ? 'todo' : 'all'); COUNT_FOLD = JSON.parse(localStorage.getItem('k2_count_fold') || '{}') || {}; }catch(e){ COUNT_CAT = COUNT_SMART ? 'todo' : 'all'; }
function catKey(m){ return (m && m.category) ? String(m.category) : 'uncategorized'; }
function catLabel(k){ return CAT_LABEL[k] || CAT_FALLBACK[k] || k; }
function saveCountUi(){ try{ localStorage.setItem('k2_count_cat', COUNT_CAT); localStorage.setItem('k2_count_fold', JSON.stringify(COUNT_FOLD)); }catch(e){} }
function pickCountCat(k){ COUNT_CAT = k; if(k !== 'all') COUNT_FOLD[k] = false; saveCountUi(); render(); try{ window.scrollTo({top:0, behavior:'smooth'}); }catch(e){} }
function toggleCountFold(k){ COUNT_FOLD[k] = !COUNT_FOLD[k]; saveCountUi(); render(); }
/* เรียงหมวด: หมวดที่มีเมนูมากก่อน — เป็นหมวดที่ครัวนับบ่อยสุด */
/* 🎯 ต้องนับวันนี้ไหม — ระบบช่วยเลือก ไม่ใช่ระบบเดาเลขแทนคน
   เข้าข้อใดข้อหนึ่ง = ต้องนับ · ที่เหลือกดดูได้จากปุ่ม "ทั้งหมด" */
function needCountToday(m, bookedSoon, counted7d){
  if(String(m.subcode||'').trim()) return true;                       // เมนูสัปดาห์
  if(m.stock_total!=null && Number(m.stock_total)<=3) return true;      // ใกล้หมด
  if((bookedSoon[m.id]||0)>0) return true;                              // มีคนจองวันนี้/พรุ่งนี้
  if(!counted7d(m)) return true;                                        // ไม่มีร่องรอยการนับใน 7 วัน
  return false;
}
function countGroups(list){
  const g = {};
  list.forEach(m => { const k = catKey(m); (g[k] = g[k] || []).push(m); });
  return Object.keys(g).sort((a,b) => g[b].length - g[a].length || catLabel(a).localeCompare(catLabel(b), "th")).map(k => ({ key:k, items:g[k] }));
}
function viewCount(){

  let h='<div class="hint">นับ <b>เฉพาะของที่ยังไม่ได้จัด</b> — ถุงที่จัดใส่ไว้แล้วไม่ต้องนับ<br>พิมพ์เลขที่นับได้ลงไปตรง ๆ ระบบไม่แก้เลขของคุณ และไม่เด้งกลับ</div><div class="wrap">';

    +'<button type="button" class="catchip'+(COUNT_CAT==='all'?' on':'')+'" onclick="pickCountCat(\'all\')">ทั้งหมด <b>'+openMenus.length+'</b></button>'
    + groups.map(g => '<button type="button" class="catchip'+(COUNT_CAT===g.key?' on':'')+'" onclick="pickCountCat(\''+esc(g.key)+'\')">'+esc(catLabel(g.key))+' <b>'+g.items.length+'</b></button>').join('')
    +'</div><div class="wrap">';
  /* 🔴 ครัวเปิดมากลางวันทำงานแล้วเห็นรายการน้อยลง จะอ่านว่า "เมนูหาย" ไม่ใช่ "กำลังกรอง"
     → บอกตรง ๆ ว่ากรองอยู่ + ซ่อนไปกี่เมนู + ปุ่มกดดูครบอยู่ตรงนี้เลย ไม่ต้องไปหา */
  if(COUNT_SMART && COUNT_CAT==='todo'){

      +((todo.length && hidden>0)?'<br>อีก '+hidden+' เมนู<b>ไม่ได้หาย</b> — ของในตู้ยังพอ ยังไม่มีใครจอง และเพิ่งนับไป':'')

         (ก) ครัวนับแล้วได้ 0 จริง   (ข) ไม่เคยมีใครกรอกเลย ค่าตั้งต้นเป็น 0
       เคสจริง 11 ก.ย.: MC1 ซาลาเปาเจ ขึ้น 0 → ทั้งห้อง u และห้อง 05 อ่านว่า "ของหมด"
       ความจริงคือ **ไม่มีใครเคยกรอกสักครั้ง** (activity_log พูดถึง MC1 = 0 แถว)
       และ stock_total = null แปลว่าขายได้ไม่จำกัดอยู่แล้ว — อันตรายกว่า 0 เสียอีก

     +(!counted?'<div class="mini warn2">🕳️ ยังไม่เคยนับใน 7 วัน — เลขนี้ไม่ได้มาจากการนับ</div>':'')
     +(unlimited?'<div class="mini warn2">♾️ ตอนนี้ขายได้ไม่จำกัด — ลูกค้าสั่งเกินของได้</div>':'')
     +(incOf(m.id)?'<div class="mini">🍳 กำลังผลิต '+incOf(m.id).n+' — ยังไม่ต้องนับรวม</div>':'')+'</div>'
     +'<input class="cnt" type="number" inputmode="numeric" value="'+have+'" onchange="saveCount(\''+m.id+'\',this.value)">'
     /* ของที่ไม่ขยับ — แตะครั้งเดียวแทนพิมพ์เลข · ยังเป็นคนยืนยัน ไม่ใช่ระบบเดา
        ไม่เคยนับเลย (ช่องว่าง) = ไม่มีเลขให้ยืนยัน ต้องพิมพ์เอง
        12 ก.ย. 2569: ไม่มีร่องรอยการนับใน 7 วัน ก็ไม่ให้กด "เท่าเดิม" ด้วย —
        เลขที่ไม่รู้ว่ามาจากไหน ถ้ากดยืนยันได้ = ระบบได้ "การนับ" ที่ไม่มีใครนับจริง (เคส MC1 = 0) */
     +((!COUNT_SMART||have===''||!counted)?'':'<button type="button" class="same" onclick="confirmSame(\''+m.id+'\')">เท่าเดิม</button>')
     +'</div>';
  });
  });
  h+='</div><div class="wrap"><div class="sec">🕘 ประวัติการนับ 7 วัน (ใครนับเท่าไหร่ เมื่อไหร่)</div><div class="card">';
  h+= HIST.length ? HIST.slice(0,60).map(r=>'<div class="hist">'+esc(thaiClock(r.created_at))+' · '+esc(r.actor||'—')+' · '+esc(String(r.summary||'').slice(0,70))+'</div>').join('')
                  : '<div class="empty">ยังไม่มีประวัติ</div>';

}
/* ยืนยันว่าของเท่าเดิม — เขียนค่าเดิมกลับไป + ลง log ว่าใครยืนยันเมื่อไหร่
   ต่างจาก "ปิดวันอัตโนมัติ" ของหน้าเก่าตรงที่ **มีคนแตะจริง** ไม่ใช่ระบบขยับเลขเอง */
function confirmSame(mid){
  const m=MENUS.find(x=>x.id===mid);
  if(!m || m.actual_stock==null){ toast('ยังไม่เคยนับ — ต้องพิมพ์เลขก่อน'); return; }
  return saveCount(mid, m.actual_stock, true);
}
async function saveCount(mid,val,same){
  if(!needUser()) { render(); return; }
  const s=getSB(); if(!s) return;
  const m=MENUS.find(x=>x.id===mid); if(!m) return;
  const n=(String(val).trim()==='')?null:Math.max(0,parseInt(val,10)||0);
  const before=(m.actual_stock==null)?'—':m.actual_stock;
  /* 13 ก.ย. 2569: หักเฉพาะใบที่ยังไม่ได้จัด — ของที่แพ็คไปแล้วไม่อยู่ในตู้ ครัวก็ไม่ได้นับมัน
     เดิมหักทุกใบ → S135 นับได้ 1 หักจอง 2 (จัดไปแล้วทั้งคู่) = −1 ทั้งที่ของเหลือจริง 1 */
  const booked=bookedOpen()[mid]||0;
  /* 🔑 หัวใจของทั้ง issue:
       actual_stock = เลขที่คนนับ  (เก็บครบ ไม่ตัดทิ้ง แม้จะน้อยกว่าที่จองไว้)
       stock_total  = ที่ลูกค้าซื้อได้อีก = นับได้ − จอง  (ติดลบไม่ได้ เพราะแปลว่า "ซื้อได้อีกกี่ชิ้น") */
  const sellable=(n==null)?null:Math.max(0,n-booked);
  const r=await s.from('menu_items').update({actual_stock:n,stock_total:sellable}).eq('id',mid);
  /* 🔑 นับแล้ว = ของจริงเข้าระบบแล้ว → ปิดใบสั่งงาน "จะทำเพิ่ม" ที่ถึงกำหนดแล้วทิ้ง
     ถ้าไม่ปิด เลขแผนจะค้างแล้วไปบวกซ้ำกับของที่นับได้ = ขายของที่ไม่มี (รูเดิมของ ISSUE 02)
     ปิดเฉพาะใบที่ถึงกำหนดแล้ว — ใบของสัปดาห์หน้ายังไม่ถึงวัน ต้องอยู่ต่อ */
  try{
    const mk = MAKE && MAKE[mid];
    if(mk && (!mk.from || String(mk.from) <= DAY)){
      delete MAKE[mid];
      await s.from('kitchen_data').upsert({key:'k2_make', data:MAKE},{onConflict:'key'});
    }
  }catch(e){}
  if(r.error){ toast('บันทึกไม่สำเร็จ: '+(r.error.message||'')); return; }
  m.actual_stock=n; m.stock_total=sellable;
  await s.from('activity_log').insert({
    session_id:'k2_'+(window._sid||(window._sid=Date.now())), actor:USER, source:'k2', action_type:'stock',
    summary:shortCode(m)+' '+String(m.name||'').slice(0,26)+' — '+(same?('ยืนยันเท่าเดิม '+(n==null?'—':n)):('นับของ · '+before+'→'+(n==null?'—':n)))+' (จอง '+booked+' · ซื้อได้ '+(sellable==null?'∞':sellable)+')',
    detail:{menu_id:mid,code:m.code,counted:n,booked:booked,sellable:sellable,page:'k2'}
  });
  toast((same?'ยืนยันเท่าเดิม ':'บันทึกแล้ว ')+shortCode(m)+' = '+(n==null?'ไม่จำกัด':n));
  loadHist();
}

/* ─── 📅 วางแผนผลิต — คนพิมพ์ทับได้ ไม่ใช่ ML ─────────────────────────── */
/* เลขในแผนเก็บได้ 2 แบบ: ตัวเลขล้วน (ของเก่า) หรือ {n,by,at} (ตั้งแต่ 12 ก.ย. 2569) */
function planNum(v){ return (v && typeof v === "object") ? v.n : v; }
function planWho(v){ return (v && typeof v === "object" && v.by) ? v.by : ""; }
/* แถว "จะทำเพิ่ม" — 2 ช่อง: จำนวน + ส่งได้ตั้งแต่ (กรอกมือทั้งคู่ ตามที่นัทสั่ง) */
function makeRow(m){
  const r = makeOf(m.id), exp = makeExpired(r);
  /* เมนูที่ยังไม่มีแผน แสดงแค่ปุ่มเล็ก — 139 เมนูถ้ากางช่องหมด ครัวจะหาของจริงไม่เจอ */
  if(!r && !MAKE_OPEN[m.id]) return '<button type="button" class="mk-add" onclick="openMake(&quot;'+m.id+'&quot;)" aria-label="เพิ่มแผนผลิตเมนูนี้">+</button>';
  const n = r ? r.n : '';
  const from = r ? r.from : '';
  /* คอลัมน์ขวา: เลขบน วันล่าง — นิ้วโป้งแตะได้ทั้งคู่โดยไม่ต้องเลื่อนสายตาไปมา
     ชื่อคนใส่ไม่ขึ้นบนจอแล้ว (ยังเก็บในฐานข้อมูลและใน log ตรวจย้อนได้) */
  return '<div class="pside'+(exp?' mk-exp':'')+'">'
    + '<input class="mk-n" type="number" inputmode="numeric" min="0" placeholder="0" value="'+n+'"'
    + ' aria-label="จะทำเพิ่มกี่กล่อง" onchange="saveMake(&quot;'+m.id+'&quot;, this.value, null)">'
    + '<input class="mk-d" type="date" value="'+esc(from)+'"'
    + ' aria-label="ส่งได้ตั้งแต่วันไหน" onchange="saveMake(&quot;'+m.id+'&quot;, null, this.value)">'
    + (exp ? '<div class="mk-by">⚠️ เลยวันแล้ว</div>' : '')
    + '</div>';
}
function viewPlan(){
  const bk=bookedOnOpen(DAY), have={};
  MENUS.forEach(m=>have[m.id]=(m.actual_stock==null?0:Number(m.actual_stock)));
  let rows=MENUS.filter(m=>m.is_available!==false).map(m=>{
    const b=bk[m.id]||0, sug=Math.max(0,b-(have[m.id]||0));
    const ov=planNum((PLAN[DAY]||{})[m.id]);
    return {m,b,have:have[m.id]||0,make:(ov==null?sug:Number(ov)),ov:ov!=null};
  }).filter(r=>r.b>0||r.make>0||r.ov||incOf(r.m.id)||weekPlanOf(r.m,DAY)||makeOf(r.m.id));
  /* หัวจอต้องตอบ "วันนี้ครัวมีงานกี่กล่อง" — งานมาจาก 2 ทาง: ที่ระบบคิดจากยอดจอง + ที่คนใส่ว่าจะทำเพิ่ม
     ก่อนหน้านี้หัวจอขึ้น 0 ทั้งที่ต้องผลิต 75 เพราะนับแต่ทางแรก */
  /* ครัวเปิดมาต้องเจอ "งานที่ต้องทำ" ก่อน ไม่ใช่เมนูที่ไม่ต้องทำอะไร
     เรียง: มีจะทำเพิ่ม → ระบบคิดว่าต้องทำ → ที่เหลือ */
  rows.sort((a,b)=>{
    const A=(makeOf(a.m.id)?2:0)+(a.make>0?1:0), B=(makeOf(b.m.id)?2:0)+(b.make>0?1:0);
    return B-A || shortCode(a.m).localeCompare(shortCode(b.m),'th',{numeric:true});
  });
  const total=rows.reduce((s,r)=>{
    const mk = makeOf(r.m.id);
    return s + r.make + ((mk && !makeExpired(mk)) ? mk.n : 0);
  },0);
  let h='<div class="hint hint-s">🔴 ระบบยังไม่รู้ว่า <b>ของอยู่ได้กี่วัน</b> — เลขนี้พอสำหรับวันที่เลือกเท่านั้น ยังเกลี่ยข้ามวันให้ไม่ได้</div>'
  h+='<div class="sum"><div class="sum-big">'+total+'</div><div class="sum-lbl">กล่องที่ต้องทำสำหรับ '+dLabel(DAY)+'</div></div>';

  /* แถบหมวด — ใช้ตัวเลือกร่วมกับหน้านับของ/หน้าแอดมิน (COUNT_CAT)
     ครัวเลือกหมวดไว้แล้วสลับแท็บ หมวดยังอยู่ตัวเดิม ไม่ต้องเลือกใหม่ทุกครั้ง */
  const pg = countGroups(rows.map(r=>r.m));
  if(COUNT_CAT !== 'all' && COUNT_CAT !== 'todo' && !pg.some(g=>g.key===COUNT_CAT)) COUNT_CAT='all';
  h+='<div class="catbar" role="group" aria-label="เลือกหมวดเมนู">'
    +'<button type="button" class="catchip'+(COUNT_CAT==='all'||COUNT_CAT==='todo'?' on':'')+'" onclick="pickCountCat(&quot;all&quot;)">ทั้งหมด <b>'+rows.length+'</b></button>'
    + pg.map(g=>'<button type="button" class="catchip'+(COUNT_CAT===g.key?' on':'')+'" onclick="pickCountCat(&quot;'+esc(g.key)+'&quot;)">'+esc(catLabel(g.key))+' <b>'+g.items.length+'</b></button>').join('')
    +'</div>';
  if(COUNT_CAT !== 'all' && COUNT_CAT !== 'todo') rows = rows.filter(r=>catKey(r.m)===COUNT_CAT);
  h+='<div class="wrap">';
  if(!rows.length) return h+'<div class="empty">วันนี้ยังไม่มีอะไรต้องทำ</div></div>';
  rows.forEach(r=>{
    /* 2 บรรทัดต่อเมนู — ซ้ายคือ "เมนูอะไร สถานะยังไง" ขวาคือ "ต้องทำเท่าไหร่ ให้ทันเมื่อไหร่"
       ไม่ใส่อะไรที่ครัวไม่ได้ใช้ตัดสินใจ ณ วินาทีนั้น (นัทติว่ารกเกินไป 13 ก.ย.) */
    const notCounted = r.have>0 && !HIST.some(x=>String(x.summary||'').indexOf(shortCode(r.m)+' ')===0);
    h+='<div class="crow crow-plan">'
     +'<div class="pmain">'
       +'<div class="code">'+esc(shortCode(r.m))+'</div>'
       +'<div class="mini">'+esc(String(r.m.name||'').slice(0,26))+'</div>'
       +'<div class="mini pfacts">จอง '+r.b+' · ในตู้ '+r.have
         /* ป้ายสั้นแทนประโยคยาว — ความหมายเดิม: เลขในตู้ไม่มีร่องรอยการนับใน 7 วัน
            (เคสจริง 12 ก.ย. ระบบเก่าย้ายเลขแผน 75 กล่องมาเป็นของจริงเอง ตี 3:45) */
         +(notCounted?' <span class="tagx">🕳️ ยังไม่ได้นับ</span>':'')
         +(r.ov?' · <b>คนแก้เลขเอง</b>':'')
         +(incOf(r.m.id)?' · 🍳 กำลังผลิต '+incOf(r.m.id).n:'')
         +(r.make>0?' · ระบบคิด '+r.make:'')
       +'</div>'
     +'</div>'
     /* 🔑 หัวใจ: "จะทำเพิ่ม" อยู่คนละช่องกับ "ในตู้" และมีวันกำกับเสมอ
        อยู่ในการ์ดเดียวกันกับเมนู ไม่งั้นครัวอ่านไม่ออกว่าเลขเป็นของเมนูไหน */
     + makeRow(r.m)
     +'</div>';
  });
  return h+'</div>';
}
/* ─── จะทำเพิ่ม ─────────────────────────────────────────────
   นัทสั่ง 12 ก.ย.: "ตอนนี้ระบบยังไม่เติมให้ ขอเติมเองแบบ manual ไปก่อน"
   → ไม่มีการเดาวันให้ คนใส่วันเอง ระบบไม่ยุ่ง */
function makeOf(mid){
  const r = MAKE && MAKE[mid];
  if(!r || !(Number(r.n) > 0)) return null;
  return { n:Number(r.n), from:String(r.from||''), by:String(r.by||''), at:r.at };
}
/* หมดอายุ = เลยวันที่ส่งได้ไปแล้ว · ยังโชว์อยู่แต่ติดป้าย ไม่ลบให้เงียบ ๆ
   (ของที่หายเองโดยไม่มีใครเห็น = สิ่งที่ทำให้ไม่มีใครเชื่อตัวเลขอีก) */
function makeExpired(r){ return !!(r && r.from && r.from < DAY); }
/* กดปุ่ม + จะทำเพิ่ม → กางช่องให้กรอกทันที (ยังไม่เขียนอะไรลงฐานข้อมูล) */
let MAKE_OPEN = {};
function openMake(mid){ MAKE_OPEN[mid]=true; render(); }
async function saveMake(mid, val, ymd){
  const s=getSB(); if(!s) return;
  if(!needUser()){ render(); return; }   // ต้องรู้ว่าใครใส่ ก่อนจะเก็บเลข
  const cur = (MAKE && MAKE[mid]) || {};
  const n = (val==null) ? Number(cur.n||0) : Math.max(0, parseInt(val,10)||0);
  const from = (ymd==null) ? String(cur.from||'') : String(ymd||'');
  const before = Number(cur.n||0);
  if(n <= 0) delete MAKE[mid];
  else MAKE[mid] = { n:n, from:from, by:USER||'', at:new Date().toISOString(), seeded:!!cur.seeded };
  const r = await s.from('kitchen_data').upsert({key:'k2_make', data:MAKE}, {onConflict:'key'});
  if(r.error){ toast('บันทึกไม่สำเร็จ'); return; }

  /* ลูกค้าซื้อได้เพิ่มทันทีเท่าที่ครัวบอกว่าจะทำ — บวกเฉพาะ "ส่วนต่าง" ไม่ใช่ยอดเต็ม
     (กดแก้ 4→6 ต้องบวก 2 ไม่ใช่บวก 6 · ลบทิ้งต้องคืนกลับ)
     ⚠️ แตะ stock_total อย่างเดียว **ห้ามแตะ actual_stock** — ของในตู้มาจากการนับเท่านั้น */
  const d = n - before;
  if(d !== 0){
    const m = MENUS.find(x=>x.id===mid);
    const curSell = (m && m.stock_total!=null) ? Number(m.stock_total) : null;
    if(m && curSell!=null){
      const next = Math.max(0, curSell + d);
      const up = await s.from('menu_items').update({stock_total:next}).eq('id',mid);
      if(up.error){ toast('อัปเดตยอดขายไม่สำเร็จ'); }
      else { m.stock_total = next; }
    }
    try{ await s.from('activity_log').insert({
      action_type:'kq_status', actor:USER||'—', source:'k2',
      summary: shortCode(m||{}) + ' ' + String((m&&m.name)||'').slice(0,40) + ' — จะทำเพิ่ม ' + before + ' → ' + n +
               (from? (' (ส่งได้ ' + from + ')') : '') });
    }catch(e){}
  }
  toast(n>0 ? ('จะทำเพิ่ม '+n+' กล่อง') : 'เอาออกแล้ว');
  render();
}
async function savePlan(mid,val){
  const s=getSB(); if(!s) return;
  if(!needUser()){ render(); return; }   // ต้องรู้ว่าใครใส่ ก่อนจะเก็บเลข
  PLAN[DAY]=PLAN[DAY]||{};
  /* เก็บเป็น {n, by, at} — เลขเปล่า ๆ ที่ไม่รู้ว่าใครใส่เมื่อไหร่ คือของที่ไม่มีใครกล้าแตะทีหลัง
     รูปแบบเก่า (ตัวเลขล้วน) ยังอ่านได้ ดู planNum() */
  PLAN[DAY][mid]={ n:Math.max(0,parseInt(val,10)||0), by:USER||"", at:new Date().toISOString() };
  const r=await s.from('kitchen_data').upsert({key:'k2_plan',data:PLAN},{onConflict:'key'});
  if(r.error){ toast('บันทึกแผนไม่สำเร็จ'); return; }
  toast('บันทึกแผนแล้ว'); render();
}

/* ─── 🧾 หน้าแอดมิน — เห็น "จอง" ซึ่งครัวไม่ต้องเห็น ────────────────────
   เคสที่นัทยกมา: แอดมินบอกครัว "เอาอันนี้ไปแทน" ทั้งที่ของนั้นมีคนจองแล้ว
   หน้านี้จึงต้องตอบคำถามเดียว: **หยิบตัวไหนไปแทนได้โดยไม่ไปกินของคนอื่น** */
function viewAdmin(){
  const bk=bookedOpen();
  /* หมวด: ใช้ตัวเดียวกับหน้านับของ — เลือกหมวดที่แท็บไหน อีกแท็บก็ติดตาม (นัทสั่ง 12 ก.ย. ผ่าน 05) */
  const openMenus=MENUS.filter(m=>m.is_available!==false);
  const groups=countGroups(openMenus);
  if(COUNT_CAT!=='all' && !groups.some(g=>g.key===COUNT_CAT)) COUNT_CAT='all';   // หมวดที่เคยเลือกไม่มีแล้ว
  const pick=openMenus.filter(m=>COUNT_CAT==='all'||catKey(m)===COUNT_CAT);
  const rows=pick.map(m=>{
    const have=(m.actual_stock==null)?null:Number(m.actual_stock);
    const b=bk[m.id]||0;
    return {m,have,b,free:(have==null?null:have-b)};
  });
  const bad=rows.filter(r=>r.free!=null&&r.free<0);
  const okList=rows.filter(r=>r.free!=null&&r.free>0).sort((a,b)=>b.free-a.free);
  const none=rows.filter(r=>r.free!=null&&r.free===0);
  const unknown=rows.filter(r=>r.free==null);
  /* พับกลุ่มได้เหมือนหน้านับของ — เก็บสถานะพับด้วยคีย์ adm: กันชนกับหมวดของหน้านับ */
  const sec=(key,label,list)=>{
    if(!list.length) return '';
    const folded=!!COUNT_FOLD['adm:'+key];
    let x='<button type="button" class="sec cathead'+(folded?' folded':'')+'" aria-expanded="'+(!folded)+'" onclick="toggleCountFold(\'adm:'+key+'\')">'
      +'<span class="caret">'+(folded?'▸':'▾')+'</span> '+label+' <span class="catn">'+list.length+' เมนู</span></button>';
    if(!folded) x+=list.map(adminRow).join('');
    return x;
  };
  let h='<div class="hint">ตัวเลขนี้<b>ครัวไม่เห็น</b> — มีไว้ตอบคำถามเดียว: <b>หยิบเมนูไหนไปแทนได้ โดยไม่ไปกินของที่ลูกค้าจองไว้</b><br>เลขใหญ่ = ในตู้ − จองที่ยังไม่ได้จัด (ใบที่จัดใส่ถุงแล้วไม่หัก เพราะของออกจากตู้ไปแล้ว)</div>';
  /* แถบปุ่มหมวด — ชุดเดียวกับหน้านับของ (ทั้งหมด + หมวดที่มีเมนูจริง เรียงตามจำนวน) */
  h+='<div class="catbar" role="group" aria-label="เลือกหมวดเมนู">'
    +'<button type="button" class="catchip'+(COUNT_CAT==='all'?' on':'')+'" onclick="pickCountCat(\'all\')">ทั้งหมด <b>'+openMenus.length+'</b></button>'
    + groups.map(g => '<button type="button" class="catchip'+(COUNT_CAT===g.key?' on':'')+'" onclick="pickCountCat(\''+esc(g.key)+'\')">'+esc(catLabel(g.key))+' <b>'+g.items.length+'</b></button>').join('')
    +'</div><div class="wrap">';
  if(!rows.length) return h+'<div class="empty">หมวดนี้ยังไม่มีเมนูเปิดขาย</div></div>';
  h+=sec('bad','🔴 จองเกินของที่นับได้ — ห้ามหยิบไปแทนเด็ดขาด',bad);
  h+=sec('ok','✅ ว่างจริง หยิบไปแทนได้',okList);
  if(!okList.length) h+='<div class="empty">หมวดนี้ไม่มีเมนูที่ว่างเลย</div>';
  h+=sec('none','⚪ พอดีเป๊ะ ไม่เหลือ',none);
  /* เมนูที่ไม่เคยมีใครนับ (actual_stock = null) ห้ามจัดเข้า "ว่างจริง" เพราะไม่รู้ว่ามีของหรือเปล่า
     (reviewer ของชุด polish 11 ก.ย. ชี้ไว้ — เดิมหายไปจากหน้านี้ทั้งหมด) */
  h+=sec('unknown','❔ ยังไม่เคยนับ — ไม่รู้ว่ามีของจริงเท่าไหร่ · อย่าหยิบไปแทนจนกว่าครัวจะนับ',unknown);
  return h+'</div>';
}
function adminRow(r){
  return '<div class="crow">'
   +'<div style="flex:1"><div class="code">'+esc(shortCode(r.m))+'</div>'
   +'<div class="mini">'+esc(String(r.m.name||'').slice(0,24))+'</div>'
   +'<div class="mini">ในตู้ '+(r.have==null?'—':r.have)+' · จองแล้ว '+r.b+'</div></div>'
   +'<div class="big '+(r.free<0?'neg':'ok')+'">'+(r.free==null?'—':r.free)+'</div></div>';
}

  const icons={pack:'<path d="m3 7 9-4 9 4-9 4z"/><path d="M3 7v10l9 4 9-4V7M12 11v10M7.5 5l9 4"/>',count:'<rect x="5" y="3" width="14" height="18" rx="3"/><path d="M8 7h8M8 11h1m3 0h1m3 0h.1M8 15h1m3 0h1m3 0h.1M8 18h1m3 0h4"/>',plan:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M7 3v4m10-4v4M3 11h18m-13 4h2m4 0h2m-8 3h2"/>',admin:'<path d="M8 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-3M8 3v5h5M8 3l5 5M7 13h6m-6 4h4"/><circle cx="18" cy="7" r="3"/><path d="m20 9 2 2"/>',search:'<circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/>'};
  const svg=k=>'<svg class="icon" aria-hidden="true" viewBox="0 0 24 24">'+icons[k]+'</svg>';
  const labels={pack:['จัดของ','เตรียมทุกกล่อง ให้พร้อมส่ง'],count:['นับของ','นับในตู้ แล้วบันทึกจำนวนจริง'],plan:['วางแผนผลิต','เตรียมจำนวนผลิตสำหรับวันที่เลือก'],admin:['ภาพรวมแอดมิน','เช็กของว่าง ก่อนเลือกเมนูทดแทน']};
  let filter='all', query='', previousView='pack';
  const header=document.querySelector('.hdr');
  const row=header.querySelector('.hdr-row');
  const h1=row.querySelector('h1');
  row.insertAdjacentHTML('afterbegin','<span class="brandmark" aria-hidden="true">360</span><div class="brand"><strong>under360</strong><small>พื้นที่ทำงานของทีมครัว</small></div>');
  const heading=document.createElement('div');heading.className='page-heading';
  const headingText=document.createElement('div');headingText.append(h1);
  const desc=document.createElement('p');desc.className='page-desc';headingText.append(desc);heading.append(headingText);
  const today=document.createElement('span');today.className='today-label';today.textContent=new Intl.DateTimeFormat('th-TH',{day:'numeric',month:'short',timeZone:'Asia/Bangkok'}).format(new Date());heading.append(today);row.after(heading);
  const tools=document.createElement('div');tools.className='tools';
  tools.innerHTML='<label class="search">'+svg('search')+'<input type="search" id="quick-search" aria-label="ค้นหาออเดอร์หรือเมนู" placeholder="ค้นหาชื่อ เลขใบ หรือรหัสเมนู"></label><div class="filters" role="group" aria-label="กรองสถานะใบจัดของ"><button class="filter active" data-filter="all">ทั้งหมด</button><button class="filter" data-filter="pending">ยังไม่ครบ</button><button class="filter" data-filter="urgent">งานด่วน</button><button class="filter" data-filter="done">จัดครบแล้ว</button></div>';
  const view=document.getElementById('view');view.before(tools);
  const empty=document.createElement('div');empty.className='search-empty';empty.hidden=true;empty.innerHTML='ไม่พบรายการที่ตรงกัน<button type="button">ล้างการค้นหาและตัวกรอง</button>';view.after(empty);
  const search=tools.querySelector('input');search.addEventListener('input',()=>{query=search.value.toLocaleLowerCase().trim();applyFilter();});
  tools.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{filter=b.dataset.filter;applyFilter();}));
  empty.querySelector('button').addEventListener('click',()=>{filter='all';query='';search.value='';applyFilter();search.focus();});
  document.querySelector('.nav').setAttribute('aria-label','เมนูหลัก');
  Object.keys(labels).forEach(k=>{document.getElementById('nav-'+k).innerHTML=svg(k)+'<span>'+(k==='admin'?'แอดมิน':k==='plan'?'วางแผน':labels[k][0])+'</span>';});
  document.getElementById('who').setAttribute('aria-label','ตั้งชื่อผู้บันทึก');
  document.getElementById('toast').setAttribute('role','status');
  document.getElementById('days').setAttribute('aria-label','เลือกวันที่ส่ง');
  // Mobile name sheet replaces the browser prompt; save actions still call their original functions.
  const userSheet=document.createElement('dialog');userSheet.className='user-sheet';
  userSheet.innerHTML='<form method="dialog"><h2>ใครกำลังทำงานอยู่?</h2><p>ใช้ชื่อนี้ในประวัติการบันทึกของทีมครัว</p><label for="operator-name">ชื่อผู้บันทึก</label><input id="operator-name" autocomplete="nickname" required maxlength="80" placeholder="เช่น พี่นัท"><div class="sheet-actions"><button value="cancel" type="button">ยกเลิก</button><button value="save" type="submit">บันทึกชื่อ</button></div></form>';
  document.body.append(userSheet);let afterName=null;
  setUser=function(){userSheet.querySelector('input').value=USER;userSheet.showModal();};
  userSheet.querySelector('[value=cancel]').addEventListener('click',()=>{afterName=null;userSheet.close();render();});
  userSheet.addEventListener('cancel',()=>{afterName=null;render();});
  userSheet.querySelector('form').addEventListener('submit',e=>{e.preventDefault();const n=userSheet.querySelector('input').value.trim();if(!n)return;USER=n;try{localStorage.setItem('lastNickname',n);}catch(e){}document.getElementById('who').textContent='👤 '+n;userSheet.close();const next=afterName;afterName=null;if(next)next();});
  const withName=fn=>function(...args){if(USER)return fn(...args);afterName=()=>fn(...args);setUser();};
  markPacked=withName(markPacked);markUnpack=withName(markUnpack);markPartial=withName(markPartial);saveCount=withName(saveCount);
  function applyFilter(){
    tools.querySelector('.filters').hidden=VIEW!=='pack';
    tools.querySelectorAll('[data-filter]').forEach(b=>{b.classList.toggle('active',b.dataset.filter===filter);b.setAttribute('aria-pressed',String(b.dataset.filter===filter));});
    let visible=0;const selector=VIEW==='pack'?'.card':'.crow';
    view.querySelectorAll(selector).forEach(el=>{
      const done=el.dataset.complete==='true';
      const matches=VIEW!=='pack'||filter==='all'||(filter==='done'&&done)||(filter==='pending'&&!done)||(filter==='urgent'&&el.classList.contains('urg'));
      el.hidden=!(matches&&el.textContent.toLocaleLowerCase().includes(query));if(!el.hidden)visible++;
    });
    view.querySelectorAll('.sec').forEach(sec=>{let n=sec.nextElementSibling,found=false;while(n&&!n.classList.contains('sec')){if(!n.hidden)found=true;n=n.nextElementSibling;}sec.hidden=!found;});
    empty.hidden=visible>0||(!query&&(VIEW!=='pack'||filter==='all'));
  }
  function enhance(){
    if(previousView!==VIEW){query='';search.value='';filter='all';previousView=VIEW;}
    document.body.dataset.view=VIEW;h1.textContent=labels[VIEW][0];desc.textContent=labels[VIEW][1];
    search.placeholder=VIEW==='pack'?'ค้นหาชื่อ เลขใบ หรือรหัสเมนู':'ค้นหารหัสหรือชื่อเมนู';
    Object.keys(labels).forEach(k=>document.getElementById('nav-'+k).setAttribute('aria-current',k===VIEW?'page':'false'));
    document.querySelectorAll('.day').forEach(b=>{
      const d=b.getAttribute('onclick').match(/'(.*?)'/)[1];const n=ordersOn(d).length;
      const date=new Date(d+'T00:00:00Z');
      b.setAttribute('aria-label',dLabel(d)+' '+d+' '+n+' ใบ');b.setAttribute('aria-pressed',String(d===DAY));
      b.innerHTML='<span>'+esc(d===thaiToday()?'วันนี้':d===dPlus(thaiToday(),1)?'พรุ่งนี้':d===dPlus(thaiToday(),-1)?'เมื่อวาน':DOW[date.getUTCDay()])+'</span><strong>'+date.getUTCDate()+'</strong><small>'+(n?n+' ใบ':'—')+'</small>';
    });
    // Keep the original summary before local search without changing its values.
    const sum=view.querySelector('.sum');if(sum)tools.before(sum);else document.querySelectorAll('body>.sum').forEach(el=>el.remove());
    document.querySelectorAll('body>.sum').forEach(el=>{if(el!==sum)el.remove();});
    view.querySelectorAll('.row').forEach(el=>{el.setAttribute('role','checkbox');el.setAttribute('aria-checked',String(el.classList.contains('on')));el.tabIndex=0;
      const ids=Array.from(el.getAttribute('onclick').matchAll(/'([^']+)'/g),m=>m[1]);const item=(ITEMS[ids[0]]||[]).find(i=>i.id===ids[1]);const menu=MENUS.find(m=>m.id===item?.menu_item_id);const name=el.querySelector('.nm');if(item&&name?.firstChild)name.firstChild.textContent=menu?.name||item.menu_name||'';
      el.querySelector('.tick')?.setAttribute('aria-hidden','true');el.addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();const handler=el.getAttribute('onclick');el.click();const next=Array.from(view.querySelectorAll('.row')).find(r=>r.getAttribute('onclick')===handler);next?.focus({preventScroll:true});}});});
    view.querySelectorAll('.card').forEach(el=>{const handler=el.querySelector('.row')?.getAttribute('onclick');const id=handler?.match(/'([^']+)'/)?.[1];const order=ORDERS.find(o=>o.id===id);el.dataset.complete=String(order?isDone(order):false);});
    view.querySelectorAll('.cnt').forEach(input=>{const code=input.closest('.crow').querySelector('.code').textContent;input.setAttribute('aria-label',(VIEW==='count'?'จำนวนที่นับได้ ':'จำนวนที่จะผลิต ')+code);input.min='0';input.step='1';});
    // Add full names to the existing short labels; retain alerts and all original handlers.
    view.querySelectorAll('.crow').forEach(el=>{const code=el.querySelector('.code')?.textContent;const menu=MENUS.find(m=>shortCode(m)===code);if(!menu)return;const mini=el.querySelector('.mini');if(VIEW==='plan'){/* แถวมีชื่อเมนูอยู่แล้วตั้งแต่ตอนวาด — เติมซ้ำจะได้ชื่อ 2 บรรทัด */}else if(mini)mini.textContent=menu.name;});
    applyFilter();
  }
  const originalRender=render;render=function(){originalRender();enhance();};
  render();
  const selected=document.querySelector('.day.on');if(selected){const days=document.getElementById('days');days.scrollLeft=Math.max(0,selected.offsetLeft-days.clientWidth/2+selected.clientWidth/2);}
})();
</script>
</body>
