<!--
  💰 สมุดเงินเรา — ใบงาน docs/BRIEF_LEDGER.md (นัทขอเอง 12 ก.ย. 2569) ทำตาม **v3**
  นัทเคาะดีไซน์แล้ว: *"กำลังไปได้ดี แบบไหนก็ใช้ได้หมดนั่นแหละ เดี๋ยววันไหนใช้ไม่ได้เดี๋ยวก็ขอให้แก้เพิ่มเอง"*
  หน้าตาอิงดีไซน์ที่นัทดู: claude.ai/code/artifact/db6eba6b-c503-4154-ac69-d19ac7077eef

  หน้านี้ไม่ใช่ "ที่กรอกบัญชี" — คนจดด้วยการพิมพ์ในกลุ่มไลน์ที่มีกะปัน
  หน้านี้คือ "ที่มาดู / มาแก้ทีหลัง" + ที่ส่งออกให้คนทำบัญชี

  ⚠️ ชื่อซ้ำที่ต้องระวัง: /money = **ใบทวงเงินลูกค้า** (pwa/cash_due.html) ของเดิม
     หน้านี้อยู่ที่ **/ledger** — อย่าสลับกันเวลาบอกใคร

  🔑 ใครเป็นใคร = **LINE uid** ไม่ใช่ PIN ร่วม (ใบงาน v3 สั่งไว้ตรง ๆ)
     ผูกครั้งแรกแบบ "ใครเปิดก่อนกดเลือกชื่อ" แล้วล็อกช่องนั้นทันที (เก็บใน kitchen_data คีย์ ledger_owners)
     🔴 **ยังเป็นการล็อกระดับการแสดงผล ไม่ใช่ระดับสิทธิ์จริง** — ทุกหน้าในระบบยิงด้วย anon key ตัวเดียวกัน
        คนที่รู้วิธียังอ้อมไปอ่านฐานข้อมูลตรงได้ · ถ้าพลอยต้องการล็อกจริงต้องอ่านผ่าน serverless (service role)
        **ห้ามบอกใครว่าข้อมูลถูกล็อกแล้ว** จนกว่าจะทำชั้นนั้น

  กติกาที่หน้านี้บังคับให้เป็นจริง:
   · รายรับของร้าน **ไม่ให้ใครจด** — คำนวณสดจาก orders (กติกาเดียวกับ scripts/finance/orders.mjs)
     ตัดออเดอร์เทส · ตัด HS- (log แต้ม) · ตัดใบยอด 0 (รอบส่งเพิ่ม/พนักงาน/prepaid)
   · กระเป๋า "เราสองคน" ต้องบอกว่าใครออก → หน้าสรุปบอกได้ว่าใครออกไปก่อนมากกว่า
   · ที่กะปันเดาไม่ชัด ติดป้าย "ยังไม่ยืนยันกระเป๋า" แตะยืนยันได้ทันทีในแถวนั้นเลย
   · export CSV เกิดในเครื่องคนกด ไม่ผ่านเซิร์ฟเวอร์เรา — ข้อมูลไม่กลายเป็นไฟล์ค้างที่ไหน
   · ลบแล้วต้องนับซ้ำว่าหายจริง (RLS เคยบล็อกเงียบแล้วคืน 204 เหมือนสำเร็จ)

  ⛔ เวอร์ชันแรกตั้งใจไม่ทำ: อ่านสลิปอัตโนมัติ · ต่อ API ธนาคาร · งบกำไรขาดทุน · ตีความภาษี
     ตัวเลขทุกตัวต้องผ่านคนทำบัญชีก่อนใช้จริง
-->

  for(const [k,v] of ICONS){ if(hay.indexOf(k) >= 0) return v; }

}

let TAB = 'nut', POT = 'personal', ME = null, OWNERS = {}, ROWS = [],
    SHOP_IN = {day:0, month:0, days:0, monthCount:0}, STATE = 'loading', EDIT = null;

const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money = n => '฿' + Math.round(Number(n)||0).toLocaleString('en-US');

/* 🇹🇭 เวลาไทยเสมอ — นัทอยู่ PST เปิดตอนไหนก็ต้องได้ "วันนี้" แบบเดียวกับที่เมืองไทยเห็น */
function thaiYmd(d){
  const t = new Date((d||new Date()).getTime() + 7*3600*1000);
  return t.toISOString().slice(0,10);
}
const dayStartIso = ymd => new Date(ymd + 'T00:00:00+07:00').toISOString();
const dayEndIso   = ymd => new Date(new Date(ymd + 'T00:00:00+07:00').getTime() + 86400000).toISOString();
function monthRange(ymd){
  /* คิดจากตัวเลขในสตริงตรง ๆ — ห้ามใช้ getUTCMonth ของเวลาไทยที่แปลงแล้ว
     วันที่ 1 เวลาไทย = วันสุดท้ายของเดือนก่อนตาม UTC → เดือนจะเลื่อนผิดไป 1 แบบเงียบ ๆ */
  const y = Number(ymd.slice(0,4)), m = Number(ymd.slice(5,7));
  const two = n => (n < 10 ? '0' : '') + n;
  const first = y + '-' + two(m) + '-01';
  const nextFirst = (m === 12 ? (y+1) + '-01' : y + '-' + two(m+1)) + '-01';
  return { from: dayStartIso(first), to: dayStartIso(nextFirst) };
}
const TH_MON = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
function dayLabel(ymd){
  const today = thaiYmd(), y1 = thaiYmd(new Date(Date.now() - 86400000));
  const d = Number(ymd.slice(8,10)) + ' ' + TH_MON[Number(ymd.slice(5,7)) - 1];
  if(ymd === today) return 'วันนี้ · ' + d;
  if(ymd === y1) return 'เมื่อวาน · ' + d;
  return d;
}

async function rest(path, opt){
  const o = opt || {};
  const r = await fetch(SB_URL + '/rest/v1/' + path, {
    method: o.method || 'GET',
    headers: Object.assign({apikey:SB_KEY, Authorization:'Bearer ' + SB_KEY,
      'Content-Type':'application/json'}, o.headers || {}),
    body: o.body ? JSON.stringify(o.body) : undefined
  });
  /* 404 = ตารางยังไม่ถูกสร้าง ต้องแยกจาก "สร้างแล้วแต่ว่าง" ไม่งั้นไม่มีใครรู้ว่าต้องไปรัน SQL */
  if(r.status === 404) return {missing:true, rows:[]};
  if(!r.ok) throw new Error(path + ' → ' + r.status + ' ' + (await r.text()).slice(0,200));
  const txt = await r.text();
  return {missing:false, rows: txt ? JSON.parse(txt) : []};
}

async function loadOwners(){
  const r = await rest('kitchen_data?select=key,data&key=eq.' + OWNERS_KEY + '&limit=1');
  OWNERS = (r.rows && r.rows[0] && r.rows[0].data) || {};
  return OWNERS;
}
async function saveOwners(next){
  const has = await rest('kitchen_data?select=key&key=eq.' + OWNERS_KEY + '&limit=1');
  if((has.rows||[]).length) await rest('kitchen_data?key=eq.' + OWNERS_KEY, {method:'PATCH', body:{data:next}});
  else await rest('kitchen_data', {method:'POST', body:{key:OWNERS_KEY, data:next}});
  OWNERS = next;
}
async function claimMe(uid, who){
  if(OWNERS[uid]) return;                                  // ผูกแล้ว ไม่ให้เปลี่ยนเอง
  const taken = Object.keys(OWNERS).filter(k => OWNERS[k] === who);
  if(taken.length){ toast('ช่องของ' + NAME[who] + 'ถูกผูกไว้แล้ว'); return; }
  const next = Object.assign({}, OWNERS); next[uid] = who;
  await saveOwners(next);
  ME = who;
  start();
}

  gateHtml('<h1>สมุดเงินเรา</h1>'
    + '<p>ไลน์นี้ยังไม่ได้ผูกกับสมุด<br>เลือกครั้งเดียว แล้วจะจำไว้ถาวร</p>'
    /* 🔴 ประโยคนี้ต้องอยู่บนจอ ไม่ใช่ในคอมเมนต์ — คนที่ต้องรู้คือคนที่กำลังจะกรอกเงินจริงลงไป */

    + 'ตอนนี้กันแค่ไม่ให้กดเข้าหน้าของอีกฝ่าย แต่คนที่รู้วิธียังเปิดดูข้อมูลได้<br>'
    + 'ถ้าอยากให้ล็อกจริง บอกห้อง u ได้ ทำเพิ่มได้</p>'
    + '<div class="acts">' + btn('nut') + btn('ploy') + '</div>'
    + (used.length >= 2 ? '<p style="color:var(--warn)">ผูกครบ 2 คนแล้ว — ถ้านี่คือเครื่องของนัทหรือพลอยจริง ๆ ให้บอกห้อง u มาแก้ให้</p>' : '')

/* ── รายรับของร้าน: ไม่ให้ใครจด คำนวณสดจาก orders ────────────────────────────
   ใช้กติกาเดียวกับ scripts/finance/orders.mjs — ถ้าแก้ที่นั่น ต้องแก้ที่นี่ด้วย
   (ยกมาเป็นโค้ดเพราะหน้านี้เป็น HTML ไฟล์เดียว import ไม่ได้ · ห้ามคำนวณยอดขายด้วยมือแบบอื่น) */
const TEST_NAMES = ['nut','test user','ทดลอบ 1','ploy ♡','schematest'];
function isTestOrder(o){
  if(o.source === 'parallel_test') return true;
  if(o.created_by === '[TEST-P] Claude') return true;
  if(String(o.notes||'').indexOf('[PARALLEL]') === 0) return true;
  return TEST_NAMES.indexOf(String(o.customer_name||'').trim().toLowerCase()) >= 0;
}
const isLoyaltyLog = o => o.source === 'hato_loyalty_log' || String(o.order_number||'').indexOf('HS-') === 0;
/* ใบยอด 0 ไม่ใช่การขาย (รอบส่งเพิ่ม · prepaid ทยอยส่ง · อาหารพนักงาน) */
const isSale = o => Number(o.total) > 0 && !isLoyaltyLog(o) && !isTestOrder(o);

async function loadShopIncome(today){
  const m = monthRange(today);
  const sel = 'select=order_number,total,created_at,source,created_by,customer_name,notes';
  const res = await rest('orders?' + sel + '&created_at=gte.' + m.from + '&created_at=lt.' + m.to
                       + '&order=created_at.asc&limit=5000');
  const sales = (res.rows||[]).filter(isSale);
  const dFrom = dayStartIso(today), dTo = dayEndIso(today);
  const inDay = sales.filter(o => o.created_at >= dFrom && o.created_at < dTo);
  return {
    month: sales.reduce((s,o) => s + Number(o.total||0), 0),
    day:   inDay.reduce((s,o) => s + Number(o.total||0), 0),
    days:  inDay.length, monthCount: sales.length
  };
}

async function load(){
  STATE = 'loading'; render();
  const today = thaiYmd();
  try{
    const m = monthRange(today);
    /* sequential reads ตามกติกาโปรเจค · ทุก select มี limit เสมอ */
    const led = await rest('ledger?select=*&at=gte.' + m.from + '&at=lt.' + m.to + '&order=at.desc&limit=3000');
    if(led.missing){ STATE = 'nosql'; return render(); }
    ROWS = led.rows || [];
    SHOP_IN = await loadShopIncome(today);
    STATE = 'ok';
  }catch(e){ console.error(e); STATE = 'error'; }
  render();
}

/* กระเป๋าไหนเห็นอะไร — "ของนัท/ของพลอย" = ของใครของมัน · shared/sum = เห็นร่วมกัน */
function rowsOf(pot){
  if(pot === 'personal') return ROWS.filter(r => r.book === 'personal' && (r.owner||'nut') === 'nut');
  if(pot === 'ploy')     return ROWS.filter(r => r.book === 'personal' && r.owner === 'ploy');
  if(pot === 'shop')     return ROWS.filter(r => r.book === 'shop');
  if(pot === 'shared')   return ROWS.filter(r => r.book === 'shared');
  return ROWS;   // sum
}
const outSum = list => list.filter(r => r.kind === 'out').reduce((s,r) => s + Number(r.amount||0), 0);
const inSum  = list => list.filter(r => r.kind === 'in').reduce((s,r) => s + Number(r.amount||0), 0);

/* เราสองคน: ใครออกไปก่อนมากกว่า (หารครึ่งเป็นค่าตั้งต้น — ยังไม่มีใครเคาะสัดส่วนอื่น) */
function sharedBalance(list){
  const paid = {nut:0, ploy:0};
  list.filter(r => r.kind === 'out').forEach(r => {
    const by = r.paid_by || r.owner || 'nut';
    if(paid[by] == null) paid[by] = 0;
    paid[by] += Number(r.amount||0);
  });
  const total = paid.nut + paid.ploy;
  return {paid:paid, total:total, nutNet: paid.nut - total/2};   // บวก = นัทออกเกิน ควรได้คืน
}

function setTab(t){
  if(t === 'nut' && ME !== 'nut') return;
  if(t === 'ploy' && ME !== 'ploy') return;
  TAB = t; POT = POTS[t][0];
  document.querySelectorAll('[role="tab"]').forEach(b =>
    b.setAttribute('aria-selected', b.dataset.tab === t));
  render();
}
function setPot(p){ POT = p; render(); }

function renderPots(){
  const pots = POTS[TAB], bar = document.getElementById('potbar');
  bar.classList.toggle('hidden', pots.length < 2);
  bar.innerHTML = pots.map(p => '<button data-pot="' + p + '" aria-pressed="' + (p === POT)
    + '" style="--pc:var(--pot-' + (p === 'sum' ? 'personal' : p) + ')" onclick="setPot(&quot;' + p + '&quot;)">'
    + POTNAME[p] + '</button>').join('');
}

function renderSummary(){
  const boxes = [
    {pot:'personal', ic:'🙍', t:'ส่วนตัวนัท'},
    {pot:'shop',     ic:'🏪', t:'ร้าน Under360'},
    {pot:'ploy',     ic:'👩', t:'ของพลอย'},
    {pot:'shared',   ic:'🏠', t:'เราสองคน'}
  ].map(b => { const l = rowsOf(b.pot); return Object.assign({}, b, {n:l.length, v:outSum(l)}); });
  const bal = sharedBalance(rowsOf('shared'));
  const who = bal.nutNet >= 0 ? 'nut' : 'ploy';
  const diff = Math.abs(bal.nutNet);
  const rowOf = (ic,t,c,a,isIn) => '<div class="row"><div class="ic">' + ic + '</div>'
    + '<div class="r-main"><div class="r-title">' + esc(t) + '</div>'
    + '<div class="r-sub"><span class="chip">' + esc(c) + '</span></div></div>'
    + '<div class="amt' + (isIn ? ' in' : '') + '">' + (isIn ? '+' : '−') + money(a) + '</div></div>';
  return '<div class="dayhead"><span>รวมตามกระเป๋า</span><span class="num">'
      + money(boxes.reduce((s,b) => s + b.v, 0)) + '</span></div>'
    + boxes.map(b => rowOf(b.ic, b.t, b.n + ' รายการ', b.v)).join('')
    + '<div class="dayhead"><span>เงินระหว่างกัน</span><span></span></div>'
    + (bal.total
        ? rowOf('⚖️', (diff < 1 ? 'ออกไปเท่ากันพอดี' : NAME[who] + 'ออกไปก่อนมากกว่า'),
                'หารครึ่ง · นัทออก ' + money(bal.paid.nut) + ' พลอยออก ' + money(bal.paid.ploy), diff)
        : '<div class="empty">เดือนนี้ยังไม่มีรายการของเราสองคน</div>')
    + '<div class="dayhead"><span>รายรับร้าน (ดึงอัตโนมัติ)</span><span></span></div>'
    + rowOf('🧾', 'ยอดขายจากออเดอร์ในระบบ', 'ไม่ต้องจดเอง · ' + SHOP_IN.monthCount + ' ใบ', SHOP_IN.month, true);
}

function renderList(){
  const rows = rowsOf(POT).slice().sort((a,b) => String(b.at).localeCompare(String(a.at)));
  if(!rows.length){
    return '<div class="empty">เดือนนี้ยังไม่มีรายการในกระเป๋านี้<br>'
      + '<b>ไม่ต้องมากรอกที่นี่ก็ได้</b> — พิมพ์ในกลุ่มไลน์ตามปกติ เดี๋ยวขึ้นเอง</div>';
  }
  const byDay = {};
  rows.forEach(r => {
    const ymd = thaiYmd(new Date(r.at));
    (byDay[ymd] = byDay[ymd] || []).push(r);
  });
  return Object.keys(byDay).sort().reverse().map(ymd => {
    const list = byDay[ymd];
    return '<div class="dayhead"><span>' + esc(dayLabel(ymd)) + '</span>'
      + '<span class="num">' + money(outSum(list)) + '</span></div>'
      + list.map(r => {
        const isIn = r.kind === 'in';
        const chips = [];
        chips.push('<span class="chip tap" onclick="openEdit(&quot;' + r.id + '&quot;)">'
          + esc(r.category || (isIn ? 'รับเข้า' : 'จ่ายออก'))
          + (r.book === 'shared' ? ' · ' + esc(NAME[r.paid_by || r.owner || 'nut'] || '') + 'ออก' : '')
          + '</span>');
        if(r.slip_url) chips.push('<a class="chip" href="' + esc(r.slip_url) + '" target="_blank" rel="noopener">สลิป</a>');
        if(r.needs_review) chips.push('<span class="chip flag" onclick="confirmBook(&quot;' + r.id + '&quot;)">ยังไม่ยืนยันกระเป๋า</span>');
        return '<div class="row"><div class="ic">' + iconOf(r) + '</div>'
          + '<div class="r-main"><div class="r-title">' + esc(r.note || r.category || '—') + '</div>'
          + '<div class="r-sub">' + chips.join('') + '</div></div>'
          + '<div class="amt' + (isIn ? ' in' : '') + '">' + (isIn ? '+' : '−') + money(r.amount) + '</div></div>';
      }).join('');
  }).join('');
}

function render(){
  const list = document.getElementById('list');
  document.getElementById('whoami').textContent = ME ? NAME[ME] : '—';
  document.querySelectorAll('[role="tab"]').forEach(b => {
    const t = b.dataset.tab;
    b.disabled = (t === 'nut' && ME !== 'nut') || (t === 'ploy' && ME !== 'ploy');
  });
  if(STATE === 'loading'){ list.innerHTML = '<div class="empty">กำลังโหลด…</div>'; return; }
  if(STATE === 'nosql'){
    document.getElementById('totBig').textContent = '—';
    list.innerHTML = '<div class="empty"><b>ยังไม่ได้สร้างตารางในฐานข้อมูล</b><br>'
      + 'ต้องเปิด Supabase → SQL Editor แล้วรัน <code>scripts/sql_ledger.sql</code> ก่อนหนึ่งครั้ง<br>'
      + 'หน้านี้จะใช้ได้ทันทีหลังรัน ไม่ต้องแก้อะไรเพิ่ม</div>';
    return;
  }
  if(STATE === 'error'){
    list.innerHTML = '<div class="empty"><b>โหลดข้อมูลไม่สำเร็จ</b><br>กด ↻ อีกครั้ง ถ้ายังไม่ได้ให้บอกห้อง u</div>';
    return;
  }
  renderPots();
  const rows = rowsOf(POT);
  const isSum = POT === 'sum';
  const out = outSum(rows);
  const income = inSum(rows) + ((POT === 'shop' || isSum) ? SHOP_IN.month : 0);
  document.getElementById('totLabel').textContent = 'จ่ายเดือนนี้ · ' + POTNAME[POT];
  document.getElementById('totBig').textContent = money(out);
  document.getElementById('totIn').textContent = money(income);

  /* แถบสัดส่วน 4 หมวดบนสุด — ดีไซน์ล็อกไว้ว่าต้องมี */
  const cats = {};
  rows.filter(r => r.kind === 'out').forEach(r => {
    const k = r.category || 'ไม่ระบุหมวด';
    cats[k] = (cats[k]||0) + Number(r.amount||0);
  });
  const top = Object.keys(cats).map(k => [k, cats[k]]).sort((a,b) => b[1]-a[1]).slice(0,4);
  const hues = ['var(--pot-shop)','var(--pot-personal)','var(--pot-ploy)','var(--pot-shared)'];
  document.getElementById('bars').innerHTML = out
    ? top.map((e,n) => '<i style="width:' + (e[1]/out*100).toFixed(1) + '%;background:' + hues[n] + '"></i>').join('') : '';
  document.getElementById('legend').innerHTML = out
    ? top.map((e,n) => '<span><i class="dot" style="background:' + hues[n] + '"></i>'
        + esc(e[0]) + ' <b class="num">' + money(e[1]) + '</b></span>').join('') : '';

  list.innerHTML = isSum ? renderSummary() : renderList();
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(toast._t); toast._t = setTimeout(() => { t.style.display = 'none'; }, 2600);
}

document.getElementById('form').addEventListener('submit', async (ev) => {
  const act = ev.submitter && ev.submitter.value;
  if(act === 'cancel') return;
  if(act === 'delete'){ ev.preventDefault(); document.getElementById('dlg').close(); return removeRow(); }
  ev.preventDefault();
  const amount = Number(document.getElementById('f-amount').value);
  if(!(amount >= 0)){ toast('ใส่จำนวนเงินก่อน'); return; }
  const ymd = document.getElementById('f-at').value || thaiYmd();
  /* แก้เฉพาะ "วัน" ให้คงเวลาเดิมไว้ ไม่งั้นรายการเที่ยงคืนจะเด้งข้ามวันตอนกดแก้ */
  const at = (EDIT && thaiYmd(new Date(EDIT.at)) === ymd) ? EDIT.at : dayStartIso(ymd);
  const book = document.getElementById('f-book').value;
  const body = {
    at: at, book: book,
    kind: document.getElementById('f-kind').value,
    amount: amount,
    paid_by: book === 'shared' ? document.getElementById('f-paid').value : null,
    category: document.getElementById('f-category').value.trim() || null,
    note: document.getElementById('f-note').value.trim() || null,
    slip_url: document.getElementById('f-slip').value.trim() || null,
    updated_at: new Date().toISOString()
  };
  try{
    if(EDIT){
      body.needs_review = false;      // คนแตะเองแล้ว = ไม่ต้องรอยืนยันอีก
      await rest('ledger?id=eq.' + EDIT.id, {method:'PATCH', body:body});
      toast('แก้แล้ว');
    } else {
      body.owner = ME || 'nut';
      body.source = 'manual';
      body.created_by = 'หน้าเว็บ (' + (NAME[ME]||ME||'—') + ')';
      await rest('ledger', {method:'POST', body:body});
      toast('จดแล้ว ' + money(amount));
    }
    document.getElementById('dlg').close();
    await load();
  }catch(e){ console.error(e); toast('บันทึกไม่สำเร็จ'); }
});

/* 🔴 DELETE ได้ 204 ไม่ได้แปลว่าลบแล้ว — RLS บล็อกเงียบได้ ต้องนับแถวซ้ำเสมอ */
async function removeRow(){
  const r = EDIT; if(!r) return;
  if(!confirm('ลบรายการนี้? ' + money(r.amount) + ' ' + (r.note||r.category||''))) return;
  try{
    await rest('ledger?id=eq.' + r.id, {method:'DELETE'});
    const back = await rest('ledger?select=id&id=eq.' + r.id + '&limit=1');
    if((back.rows||[]).length){ toast('ลบไม่สำเร็จ — แถวยังอยู่ (สิทธิ์ถูกปฏิเสธเงียบ)'); return; }
    toast('ลบแล้ว'); await load();
  }catch(e){ console.error(e); toast('ลบไม่สำเร็จ'); }
}
async function confirmBook(id){
  try{
    await rest('ledger?id=eq.' + id, {method:'PATCH',
      body:{needs_review:false, updated_at:new Date().toISOString()}});
    toast('ยืนยันแล้ว'); await load();
  }catch(e){ console.error(e); toast('ไม่สำเร็จ'); }
}

/* ── ส่งออกให้คนทำบัญชี ──────────────────────────────────────────────
   เกิดในเครื่องคนกดล้วน ๆ (Blob + a.download) ไม่ผ่านเซิร์ฟเวอร์เรา
   BOM ข้างหน้า ไม่งั้น Excel เปิดภาษาไทยเป็นขยะ */
function exportCsv(){
  const rows = POT === 'sum' ? ROWS : rowsOf(POT);
  if(!rows.length){ toast('ไม่มีรายการให้ส่งออก'); return; }
  const BOOKNAME = {shop:'ร้าน', personal:'ส่วนตัว', shared:'เราสองคน'};
  const head = ['วันที่','เวลา','กระเป๋า','คนจด','คนออกเงิน','รับ/จ่าย','จำนวนเงิน','หมวด','รายการ','สลิป','ที่มา','รอยืนยัน'];
  const q = v => '"' + String(v==null?'':v).split('"').join('""') + '"';
  const body = rows.map(r => {
    const t = new Date(new Date(r.at).getTime() + 7*3600*1000).toISOString();
    return [t.slice(0,10), t.slice(11,16), BOOKNAME[r.book] || r.book,
            NAME[r.owner] || r.owner || '', NAME[r.paid_by] || '',
            r.kind === 'in' ? 'รับ' : 'จ่าย', Number(r.amount||0), r.category||'', r.note||'',
            r.slip_url||'', r.source||'', r.needs_review ? 'ใช่' : ''].map(q).join(',');
  });
  const csv = String.fromCharCode(0xFEFF) + [head.map(q).join(',')].concat(body).join(String.fromCharCode(13,10));
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv;charset=utf-8'}));
  a.download = 'ledger-' + POT + '-' + thaiYmd() + '.csv';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  toast('ส่งออก ' + rows.length + ' รายการ');
}

function start(){
  document.getElementById('gate').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('fab').classList.remove('hidden');
  TAB = ME === 'ploy' ? 'ploy' : 'nut';
  POT = POTS[TAB][0];
  document.querySelectorAll('[role="tab"]').forEach(b => {
    b.setAttribute('aria-selected', b.dataset.tab === TAB);
    b.onclick = () => setTab(b.dataset.tab);
  });
  fillCats();
  load();
}

(async function(){
  const who = await identify();
  if(!who) return;          // หน้าจอบอกไปแล้วว่าต้องทำอะไรต่อ
  ME = who;
  start();
})();
</script>
