<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ใบงานครัว (สด) — Under360</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;700;800;900&family=Noto+Sans+Myanmar:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--ink:#1A2027;--soft:#6B7280;--line:#E5E7EB;
  --lc:#1D4ED8;--lcbg:#EFF6FF;--hp:#7C3AED;--hpbg:#F5F3FF;--hx:#B45309;--hxbg:#FEF6E7;
  --head:#0F766E;--red:#B91C1C;--redbg:#FDECEC;--yel:#92400E;--yelbg:#FEF3C7}
*{box-sizing:border-box}
/* 🪤 เลื่อนไม่ถึงล่างสุด — เจอซ้ำหลายหน้าแล้ว (นัทบอก "เป็นทุกหน้า")
   สาเหตุที่เจอบ่อย: แถบหัวเป็น sticky + หน้าถูกเปิดในกรอบที่สูงไม่เท่าจอจริง
   → ห้ามล็อกความสูงด้วย 100vh/100dvh · ปล่อยให้หน้ายาวตามเนื้อหา แล้วเผื่อท้ายหน้าไว้เยอะๆ */
html,body{height:auto;min-height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch}
body{margin:0;background:#fff;color:var(--ink);font-family:"Noto Sans Thai","Noto Sans Myanmar",sans-serif;font-size:14px;line-height:1.35;padding-bottom:140px}
.wrap{max-width:820px;margin:0 auto;padding:0 12px 40px}
.bar{position:sticky;top:0;z-index:10;background:#fff;padding:8px 0 6px;border-bottom:1px solid var(--line)}
.row{display:flex;gap:5px;margin-bottom:5px}
.lb{flex:1;font-size:13px;font-weight:800;border:1.5px solid var(--line);background:#fff;color:var(--soft);border-radius:8px;padding:7px 4px;cursor:pointer;font-family:inherit}
.lb.on{background:var(--head);color:#fff;border-color:var(--head)}
.vb{flex:1;font-size:14px;font-weight:900;border:1.5px solid var(--line);background:#fff;color:var(--soft);border-radius:8px;padding:9px 4px;cursor:pointer;font-family:inherit}
.vb.on{background:#0B3B37;color:#fff;border-color:#0B3B37}
.dbar{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--soft)}
.dbar input{font-family:inherit;font-size:13px;padding:5px 8px;border:1.5px solid var(--line);border-radius:8px;min-height:36px}
.dbar button{font-family:inherit;font-size:13px;font-weight:800;padding:6px 12px;border:1.5px solid var(--line);background:#fff;border-radius:8px;cursor:pointer;min-height:36px}
h1{font-size:18px;font-weight:900;margin:10px 0 1px}
.sub{color:var(--soft);font-size:12px;margin-bottom:8px}
.fresh{font-size:11.5px;color:var(--soft);margin-bottom:10px}
.fresh b{color:var(--head)}
.key{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.k{font-size:12px;font-weight:800;border-radius:8px;padding:5px 10px}
.k.lc{background:var(--lcbg);color:var(--lc)}.k.hp{background:var(--hpbg);color:var(--hp)}.k.hx{background:var(--hxbg);color:var(--hx)}
.bigred{background:var(--redbg);border:3px solid var(--red);border-radius:12px;padding:14px;margin-bottom:14px}
.bigred .t{font-weight:900;color:var(--red);font-size:19px;margin-bottom:8px;text-align:center}
.bigred li{font-size:13.5px;font-weight:800;color:#7F1D1D;margin:6px 0;line-height:1.4}
.m{border:1px solid var(--line);border-radius:10px;margin-bottom:7px;overflow:hidden}
.mh{background:#F3F4F6;padding:6px 10px;display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.mh .t1{font-weight:800;font-size:15px}
.mh .tot{flex:none;font-size:13px;font-weight:900;color:#fff;background:var(--head);border-radius:999px;padding:4px 12px;white-space:nowrap}
.ln{display:flex;gap:8px;padding:5px 10px;border-top:1px solid #F1F3F5;align-items:center}
.ln .tag{flex:none;font-size:11px;font-weight:900;border-radius:7px;padding:4px 6px;min-width:32px;text-align:center}
.ln.lc .tag{background:var(--lcbg);color:var(--lc)}.ln.hp .tag{background:var(--hpbg);color:var(--hp)}.ln.hx .tag{background:var(--hxbg);color:var(--hx)}
.ln .d{flex:1;font-size:13px}.ln .q{flex:none;font-weight:900;font-size:16px;min-width:26px;text-align:right}
/* ชื่อเล่นเมนู — ครัวเรียกด้วยคำนี้ ต้องเด่นพอให้กวาดตาเจอ */
.nick{display:inline-block;background:#FEF3C7;color:#92400E;border:1px solid #FCD34D;border-radius:6px;padding:1px 7px;font-size:12px;font-weight:900;margin-right:2px;}
body.tablet .nick{font-size:15px;padding:2px 9px;}
.sp{background:var(--redbg);color:#7F1D1D;font-size:12px;font-weight:800;padding:5px 10px;line-height:1.3}
/* ใครได้เมนูนี้บ้าง — ครัวต้องรู้ว่ากล่องนี้ของใคร ไม่ใช่รู้แค่ว่าทำกี่กล่อง (นัทสั่ง 17 ส.ค.) */
.who{padding:5px 10px 7px;font-size:11.5px;color:#4B5563;line-height:1.7;border-top:1px dashed #EEF0F3}
.who .p{display:inline-block;margin:2px 5px 2px 0;background:#F3F4F6;border-radius:7px;padding:2px 8px;font-weight:700;white-space:nowrap}
.who .p.warn{background:#FEF3C7;color:#7C2D12;border:1px solid #FCD34D}
.who .p .x{font-weight:900;color:#0F766E}
/* ข้อจำกัดที่ผูกกับ "กล่องนั้น" ไม่ใช่ทั้งใบ — เช่น 1 กล่องไม่เอาชีส · 1 กล่องไม่เอาน้ำจิ้มซีฟู้ด */
.perbox{background:#FFF7ED;border-top:1px solid #FDBA74;color:#9A3412;font-size:12.5px;font-weight:800;padding:6px 10px;line-height:1.5}
.sec{font-size:13px;font-weight:900;color:var(--head);margin:16px 0 6px}
.c{border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden}
.ch{background:#F3F4F6;padding:8px 10px;display:flex;gap:9px;align-items:center;cursor:pointer}
.ch .nm{flex:1;font-weight:900;font-size:15px}
.ch .bx{font-size:12px;font-weight:900;color:#fff;background:var(--head);border-radius:999px;padding:3px 10px;white-space:nowrap}
.tick{width:26px;height:26px;flex:none;border-radius:7px;border:2px solid #CBD5E1;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:900;color:#fff}
.c.done .tick{background:var(--head);border-color:var(--head)}
.c.done .ch{background:#ECFDF5}
.c.done .nm{text-decoration:line-through;color:var(--soft)}
.ci{padding:6px 10px;font-size:13px;border-top:1px solid #F1F3F5}
.ci .mi{padding:2px 0}
.empty{text-align:center;color:var(--soft);padding:40px 10px;font-size:14px}
.err{background:var(--redbg);border:2px solid var(--red);border-radius:10px;padding:12px;color:#7F1D1D;font-weight:800;font-size:13px;margin:12px 0}
.note{background:var(--yelbg);border:1px solid #FCD34D;border-radius:10px;padding:8px 11px;font-size:12px;color:#78350F;margin-bottom:10px;line-height:1.5}
@media print{.bar{display:none}}
</style>
</head>
<body>
<div class="wrap">

<div class="bar">
  <div class="row">
    <button class="lb on" id="b_th"  onclick="setLang('th')">ไทย</button>
    <button class="lb"    id="b_shn" onclick="setLang('shn')">ไทใหญ่ · တႆး</button>
    <button class="lb"    id="b_my"  onclick="setLang('my')">พม่า · မြန်မာ</button>
  </div>
  <div class="row">
    <button class="vb on" id="v_prod" onclick="setView('prod')">🍳 <span data-i="v_prod">ใบผลิต</span></button>
    <button class="vb"    id="v_pack" onclick="setView('pack')">📦 <span data-i="v_pack">ใบจัดของ</span></button>
    <button class="vb on" id="w_btn"  onclick="setWho(!SHOWWHO)" style="margin-left:auto">👤 <span data-i="whoBtn">โชว์ผู้รับ</span></button>
  </div>
  <div class="dbar">
    <button onclick="shiftDay(-1)">◀</button>
    <input type="date" id="dpick" onchange="pickDate(this.value)">
    <button onclick="shiftDay(1)">▶</button>
    <button onclick="load()" style="margin-left:auto">🔄 <span data-i="refresh">รีเฟรช</span></button>
  </div>
</div>

<h1>👨‍🍳 <span data-i="title">ใบงานครัว</span> <span id="hDate"></span></h1>
<div class="sub" id="hSub"></div>
<div class="fresh" id="hFresh"></div>

<div class="key">
  <span class="k lc">LC = <span data-i="meat">เนื้อ</span> 120g</span>
  <span class="k hp">HP = <span data-i="meat">เนื้อ</span> 170g</span>
  <span class="k hx">HX = Hyrox</span>
</div>

<div id="out"></div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════════════════
   ใบงานครัวแบบ "ดึงสด" — แทนไฟล์ใบงานรายวันที่ฟ้าสร้างมือ (ฟ้าขอเอง · นัทเคาะ 17 ส.ค. 2569)

   ทำไมต้องมี: ใบเดิมเป็น "ภาพนิ่งของตอนที่สร้าง"
     เคสจริง 17 ส.ค. — ฟ้าสร้างใบเย็นวันที่ 16 · ตี 1:47 กิฟเลื่อนวันส่งลูกค้า TooN มาเป็นวันที่ 17
     เช้ามาครัวเปิดใบ → ไม่มี TooN และ **ไม่มีอะไรบอกว่าใบเก่าแล้ว** → เกือบทำอาหารขาด 1 คน
   หน้านี้อ่านจาก DB ทุกครั้งที่เปิด/กดรีเฟรช → แอดมินแก้ในระบบ ใบเปลี่ยนทันที

   🔒 อ่านอย่างเดียว ไม่เขียน DB เลยสักจุด (ติ๊กเก็บในเครื่องผ่าน localStorage)
   🕐 ยึดเวลาไทยเสมอ — เครื่องครัวอาจตั้งโซนเวลาอะไรก็ได้
   📌 เฉพาะ Meal Plan ตามที่นัทสั่ง (เมนูสต็อคไม่ปน)
   ══════════════════════════════════════════════════════════════════════════ */
const SB_URL = 'https://zdartbvhbvqlwzwyyiia.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpkYXJ0YnZoYnZxbHd6d3l5aWlhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE4MTY3OTksImV4cCI6MjA5NzM5Mjc5OX0.D41YGH-CuWrVFqcAgXEuhfVTxJ7WY26Xu-PeXBF6LB8';
const sb = supabase.createClient(SB_URL, SB_KEY);

/* ── ป้ายกำกับ 3 ภาษา ────────────────────────────────────────────────
   ครัวอ่านไทยออกจริง 2/6 คน — ของสำคัญต้องมีเลข + ป้ายสี ไม่พึ่งตัวหนังสือล้วน
   ⚠️ "ชื่อเมนู" แปลอัตโนมัติไม่ได้ (ห้ามให้ AI แปลสูตรเองโดยไม่มีคนตรวจ — กฎในคู่มือครัว)
      → ชื่อเมนูดึงคำแปลจาก `kitchen_data.kitchen_terms` ที่ฟ้าเติมเองได้ ไม่มีคำแปล = โชว์ไทย */
const UI = {
  title:{th:'ใบงานครัว', shn:'ၽိုၼ်ႁဵတ်းၵၢၼ်ႁွင်ႈၶဝ်ႈ', my:'မီးဖိုချောင်အလုပ်စာရွက်'},
  v_prod:{th:'ใบผลิต', shn:'ႁဵတ်းၵိၼ်', my:'ချက်ရန်'},
  v_pack:{th:'ใบจัดของ', shn:'ၸတ်းၶွင်', my:'ထုပ်ပိုးရန်'},
  refresh:{th:'รีเฟรช', shn:'ဢဝ်မႂ်ႇ', my:'ပြန်ဆွဲ'},
  meat:{th:'เนื้อ', shn:'ၼိူဝ်ႉ', my:'အသား'},
  box:{th:'กล่อง', shn:'ႁိပ်ႇ', my:'ဘူး'},
  menu:{th:'เมนู', shn:'မဵၼ်ႇ', my:'မီနူး'},
  people:{th:'คน', shn:'ၵေႃႉ', my:'ဦး'},
  secProd:{th:'■ เมนูที่ต้องทำวันนี้', shn:'■ မဵၼ်ႇလႆႈႁဵတ်းမိူဝ်ႈၼႆႉ', my:'■ ယနေ့ချက်ရမည့်မီနူး'},
  secPack:{th:'■ จัดของรายคน', shn:'■ ၸတ်းၶွင် ၽႂ်မၼ်း', my:'■ တစ်ဦးချင်း ထုပ်ပိုး'},
  redT:{th:'🔴 ข้อห้ามรายคน — ห้ามพลาด', shn:'🔴 ၶေႃႈႁၢမ်ႈ ၽႂ်မၼ်း — ယႃႇပေလိုမ်း', my:'🔴 တစ်ဦးချင်း တားမြစ်ချက် — မမေ့ပါနှင့်'},
  none:{th:'วันนี้ยังไม่มีออเดอร์ Meal Plan', shn:'မိူဝ်ႈၼႆႉ ပႆႇမီးဢွတ်ႇတိူဝ်ႇ', my:'ယနေ့ အော်ဒါမရှိသေးပါ'},
  loading:{th:'กำลังดึงข้อมูล…', shn:'တိုၵ်ႉဢဝ်ၶေႃႈမုၼ်း…', my:'ဒေတာဆွဲနေသည်…'},
  nomenu:{th:'ยังไม่ได้จ่ายเมนู', shn:'ပႆႇပၼ်မဵၼ်ႇ', my:'မီနူးမသတ်မှတ်ရသေး'},
  round:{th:'รอบ', shn:'ပွၵ်ႈ', my:'အကြိမ်'},
  whoGets:{th:'👤 ใครได้บ้าง:', shn:'👤 ၽႂ်လႆႈ:', my:'👤 ဘယ်သူရမလဲ:'},
  whoBtn:{th:'โชว์ผู้รับ', shn:'ၼႄၽူႈလႆႈ', my:'လက်ခံသူပြ'},
  req:{th:'ลูกค้าขอเอง', shn:'ၽူႈသိုဝ်ႉတၢင်ႇ', my:'ဖောက်သည်တောင်းဆို'}
};
let LANG = localStorage.getItem('kq_sheet_lang') || 'th';
let VIEW = localStorage.getItem('kq_sheet_view') || 'prod';
let SHOWWHO = localStorage.getItem('kq_sheet_who') !== '0';   // โชว์รายชื่อผู้รับใต้เมนู (ค่าเริ่มต้น = โชว์)
let TERMS = {};          // { 'อกไก่': {shn:'…', my:'…'} } — ฟ้าเติมได้ที่ kitchen_data.kitchen_terms
let DATA = null;

function t(k){ const e=UI[k]; return e ? (e[LANG]||e.th) : k; }
// แปลข้อความจากคลังคำ — ไม่มีคำแปล = คืนภาษาไทยตามเดิม (ดีกว่าโชว์ว่าง)
function tr(s){
  if(LANG==='th' || !s) return s||'';
  const hit = TERMS[String(s).trim()];
  return (hit && hit[LANG]) ? hit[LANG] : s;
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

// วันไทยเสมอ (เครื่องครัวอาจตั้งโซนเวลาอะไรก็ได้ · นัทอยู่ PST ด้วย)
function thaiToday(){ return new Date(Date.now()+7*3600e3).toISOString().slice(0,10); }
let DATE = new URLSearchParams(location.search).get('d') || thaiToday();

function setLang(l){
  LANG=l; localStorage.setItem('kq_sheet_lang',l);
  ['th','shn','my'].forEach(x=>document.getElementById('b_'+x).classList.toggle('on',x===l));
  document.querySelectorAll('[data-i]').forEach(e=>{ e.textContent=t(e.dataset.i); });
  render();
}
function setView(v){
  VIEW=v; localStorage.setItem('kq_sheet_view',v);
  document.getElementById('v_prod').classList.toggle('on',v==='prod');
  document.getElementById('v_pack').classList.toggle('on',v==='pack');
  render();
}
/* 👤 โชว์/ซ่อนรายชื่อผู้รับใต้แต่ละเมนู — บางทีอยากดูแค่ยอดผลิตล้วนๆ ไม่อยากให้ชื่อรก
   (นัทขอ 17 ส.ค.) · จำค่าไว้ในเครื่อง เปิดครั้งหน้าได้ค่าเดิม · ค่าเริ่มต้น = โชว์ */
function setWho(v){
  SHOWWHO=!!v; localStorage.setItem('kq_sheet_who', SHOWWHO?'1':'0');
  const b=document.getElementById('w_btn');
  if(b){ b.classList.toggle('on',SHOWWHO); b.title=SHOWWHO?'กดเพื่อซ่อนรายชื่อผู้รับ':'กดเพื่อโชว์รายชื่อผู้รับ'; }
  render();
}
function pickDate(v){ if(!v)return; DATE=v; load(); }
function shiftDay(n){
  const d=new Date(DATE+'T00:00:00'); d.setDate(d.getDate()+n);
  DATE=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  load();
}

/* ── ดึงข้อมูล ─────────────────────────────────────────────────────────
   แหล่งความจริง = `order_items` (ครัว/แมส/เงิน อ่านที่นี่หมด และมี cron คอยทำให้ตรงกับแผน)
   `mp_deliveries` ใช้เอา "ใครสั่งอะไร กี่กล่อง รอบไหน" + ของแพ้/คำขอ
   ⚠️ ทุก .select() ต้องมี .limit() — ไม่ใส่ = Supabase คืนแค่ 1000 แถวเงียบๆ */
async function load(){
  document.getElementById('dpick').value = DATE;
  document.getElementById('out').innerHTML = '<div class="empty">'+t('loading')+'</div>';
  try{
    const [mpR, ordR, cfgR] = await Promise.all([
      sb.from('mp_deliveries')
        .select('id,order_id,customer_name,line_display_name,line_uid,customer_id,mp_type,mp_set,round_no,total_rounds,box_count,menu_items,customer_request,customer_note,admin_notes,status,time_slot_label,delivery_address')
        .eq('delivery_date',DATE).neq('status','cancelled').limit(300),
      sb.from('orders').select('id,order_number,line_uid,customer_id,notes,status')
        .eq('delivery_date',DATE).neq('status','cancelled').limit(500),
      sb.from('kitchen_data').select('key,data').in('key',['kitchen_terms','recipes']).limit(5)
    ]);
    if(mpR.error) throw mpR.error;

    (cfgR.data||[]).forEach(r=>{ if(r.key==='kitchen_terms' && r.data) TERMS=r.data; });
    const recipes = ((cfgR.data||[]).find(r=>r.key==='recipes')||{}).data || [];

    const rows = mpR.data||[];
    const oids = rows.map(r=>r.order_id).filter(Boolean);
    let items = [];
    for(let i=0;i<oids.length;i+=40){
      const s = await sb.from('order_items').select('order_id,menu_code,menu_name,quantity,notes')
        .in('order_id', oids.slice(i,i+40)).limit(2000);
      if(!s.error) items = items.concat(s.data||[]);
    }
    // ข้อจำกัด/ของแพ้ ติดตัวลูกค้า (ตารางเดียวกับที่ลูกค้ากรอกเองในแอป)
    const cids = [...new Set(rows.map(r=>r.customer_id).filter(Boolean))];
    let prefs = [];
    if(cids.length){
      const p = await sb.from('customer_preferences').select('customer_id,allergies,dislikes').in('customer_id',cids).limit(300);
      if(!p.error) prefs = p.data||[];
    }
    DATA = { rows, items, prefs, recipes, orders:(ordR.data||[]), at:new Date() };
    render();
  }catch(e){
    console.error(e);
    document.getElementById('out').innerHTML =
      '<div class="err">ดึงข้อมูลไม่สำเร็จ — '+esc(e.message||e)+'<br>ลองกด 🔄 อีกครั้ง ถ้ายังไม่ได้ให้บอกห้องระบบ</div>';
  }
}

// กล่องของ Meal Plan = บรรทัดที่ระบบเขียนจากแผน (มีป้าย meal_plan:box) หรือโค้ดขึ้นต้น HP/LC/HX
function mpBoxRows(orderId){
  return (DATA.items||[]).filter(i=>{
    if(i.order_id!==orderId) return false;
    const n=String(i.notes||'');
    if(n.indexOf('meal_plan:box')===0) return true;
    if(n.indexOf('meal_plan:')===0||n.indexOf('pkg:')===0) return false;   // บรรทัดราคา ไม่ใช่กล่อง
    return /^(HP|LC|HX)\d/i.test(String(i.menu_code||''));
  });
}
function famOf(code, mpType){
  const c=String(code||'').toUpperCase();
  if(c.indexOf('HX')===0 || /hyrox|hx/i.test(mpType||'')) return 'hx';
  if(c.indexOf('LC')===0) return 'lc';
  if(c.indexOf('HP')===0) return 'hp';
  return String(mpType||'').toLowerCase()==='lc' ? 'lc' : 'hp';
}
function gramOf(fam){ return fam==='lc' ? '120g' : '170g'; }
// เลขฐานของเมนู เช่น HP09/LC09 = จานเดียวกัน เลข 09 (LC/HP ต่างแค่กรัมเนื้อ — นัทยืนยันเอง)
function baseNo(code){ const m=String(code||'').match(/(\d+)/); return m?m[1].padStart(2,'0'):''; }
function nameOf(code, fallback){
  const r=(DATA.recipes||[]).find(x=>String(x.code||'').toUpperCase()===String(code||'').toUpperCase());
  return (r&&r.name) || fallback || code || '';
}
/* 🏷️ ชื่อเล่นเมนู (S1-S8 · D1-D5) — **ครัวเรียกเมนูด้วยชื่อเล่น ไม่ใช่โค้ดจริง**
   เมนูพิเศษหมุนทุกสัปดาห์ · ค้างข้ามสัปดาห์เติม x (xs3 = ค้างมา 1 สัปดาห์)
   ⚠️ ใบงานสดตัวนี้เดิม **ไม่โชว์ชื่อเล่นเลยสักที่** ทั้งที่เป็นคำที่ครัวใช้เรียกกันจริง
      เจอตอนนัทสั่งให้ไล่ตรวจช่องชื่อเล่นทั้งระบบ 17 ส.ค. 2569 */
function nickOf(code){
  const r=(DATA.recipes||[]).find(x=>String(x.code||'').toUpperCase()===String(code||'').toUpperCase());
  return (r&&r.subcode&&String(r.subcode).trim()) || '';
}
function nickTag(code){
  const n=nickOf(code);
  return n ? '<span class="nick">'+esc(n)+'</span> ' : '';
}
function prefOf(r){
  const p=(DATA.prefs||[]).find(x=>x.customer_id===r.customer_id);
  return p || null;
}
function whoOf(r){ return r.customer_name || r.line_display_name || 'ลูกค้า'; }

function render(){
  if(!DATA) return;
  const el=document.getElementById('out');
  const d=new Date(DATE+'T00:00:00');
  const DAYS=['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัส','ศุกร์','เสาร์'];
  const MON=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
  document.getElementById('hDate').textContent = DAYS[d.getDay()]+' '+d.getDate()+' '+MON[d.getMonth()];

  const rows=DATA.rows;
  let totBoxes=0; rows.forEach(r=>{ totBoxes += mpBoxRows(r.order_id).reduce((s,i)=>s+(i.quantity||1),0) || (r.box_count||0); });
  document.getElementById('hSub').textContent = rows.length+' '+t('people')+' · '+totBoxes+' '+t('box');
  const hh=String(DATA.at.getHours()).padStart(2,'0'), mm=String(DATA.at.getMinutes()).padStart(2,'0');
  document.getElementById('hFresh').innerHTML = 'ข้อมูล ณ <b>'+hh+':'+mm+'</b> — กด 🔄 เพื่อดึงใหม่';

  if(!rows.length){ el.innerHTML='<div class="empty">'+t('none')+'</div>'; return; }

  // 🔴 ข้อห้ามรายคน — ขึ้นบนสุดเสมอ ทั้ง 2 มุมมอง (เรื่องความปลอดภัย ไม่ใช่ข้อมูลประกอบ)
  let html='';
  const restr=[];
  rows.forEach(r=>{
    const p=prefOf(r); const bits=[];
    if(p&&p.allergies) bits.push('แพ้: '+p.allergies);
    if(p&&p.dislikes)  bits.push('ไม่ทาน: '+p.dislikes);
    if(r.customer_note) bits.push(r.customer_note);
    if(bits.length) restr.push('<li>'+esc(whoOf(r))+' — '+esc(bits.join(' · '))+'</li>');
  });
  if(restr.length){
    html+='<div class="bigred"><div class="t">'+t('redT')+'</div><ul>'+restr.join('')+'</ul></div>';
  }

  html += (VIEW==='prod') ? renderProd(rows) : renderPack(rows);
  el.innerHTML = html;
  if(VIEW==='pack') restoreTicks();
}

/* ข้อจำกัดของลูกค้าคนนี้ (รวมทุกทาง) — ใช้ทั้งกล่องแดงบนสุดและป้ายใต้เมนู
   3 ที่ที่ข้อจำกัดมาได้: ตารางถาวรของลูกค้า · โน้ตที่ลูกค้าพิมพ์ตอนสั่ง · โน้ตแอดมิน */
/* โน้ตของ "กล่องนี้" — อ่าน 2 ทาง แล้วเอาอันที่เจอก่อน
   ทางแอดมิน (mp_deliveries.menu_items[].note) มาก่อนเสมอ เพราะเป็นของที่เพิ่งพิมพ์ */
function boxNote(r, code){
  const c=String(code||'').toUpperCase();
  const hit=(r.menu_items||[]).find(m=>String(m.code||'').toUpperCase()===c);
  if(hit && hit.note && String(hit.note).trim()) return String(hit.note).trim();
  const oi=(DATA.items||[]).find(i=>i.order_id===r.order_id && String(i.menu_code||'').toUpperCase()===c && String(i.notes||'').indexOf('📌')>=0);
  if(oi){ const n=String(oi.notes); return n.slice(n.indexOf('📌')+2).trim(); }
  return '';
}
function restrOf(r){
  const p=prefOf(r), bits=[];
  if(p&&p.allergies) bits.push('แพ้ '+p.allergies);
  if(p&&p.dislikes)  bits.push('ไม่ทาน '+p.dislikes);
  if(r.customer_note) bits.push(String(r.customer_note).trim());
  return bits;
}

/* มุมที่ 1 — ใบผลิต: หั่นตามเมนู ครัวอ่านทีละจาน
   + ใต้ทุกเมนูบอกว่า **กล่องนี้ของใคร** และ **กล่องไหนมีข้อจำกัด** (นัทสั่ง 17 ส.ค.)
     เหตุผล: รู้แค่ "ทำ 11 กล่อง" ยังแพ็คไม่ได้ · และข้อจำกัดแบบ "1 กล่องไม่เอาชีส"
     ต้องเห็นตอนกำลังทำจานนั้น ไม่ใช่ไปเห็นตอนท้ายใบ */
function renderProd(rows){
  const agg={};   // baseNo → { name, lc, hp, hx, notes[], who{} }
  rows.forEach(r=>{
    const boxes=mpBoxRows(r.order_id);
    boxes.forEach(i=>{
      const no=baseNo(i.menu_code)||i.menu_code;
      const fam=famOf(i.menu_code, r.mp_type);
      if(!agg[no]) agg[no]={ no, code:i.menu_code, name:nameOf(i.menu_code,i.menu_name), lc:0, hp:0, hx:0, notes:[], who:{} };
      const q=(i.quantity||1);
      agg[no][fam] += q;
      const nm=whoOf(r);
      if(!agg[no].who[nm]) agg[no].who[nm]={ n:0, fam:fam, restr:restrOf(r), box:[] };
      agg[no].who[nm].n += q;
      /* โน้ตรายกล่อง ("กล่องนี้ไม่เอาชีส") มาได้ 2 ทาง — ต้องอ่านทั้งคู่
         ① `order_items.notes` หลัง 📌 (ตัว sync เขียนให้)
         ② `mp_deliveries.menu_items[].note` = **ที่แอดมินพิมพ์จริง**
         ⚠️ ถ้าอ่านแค่ทางที่ 1 โน้ตที่เพิ่งพิมพ์จะยังไม่โผล่จนกว่า cron จะวิ่ง (ทุก 10 นาที)
            ครัวยืนทำอาหารอยู่ รอ 10 นาทีไม่ได้ */
      const txt = boxNote(r, i.menu_code);
      if(txt && agg[no].who[nm].box.indexOf(txt)<0){
        agg[no].who[nm].box.push(txt);
        agg[no].notes.push(nm+' — '+txt);
      }
    });
  });
  const list=Object.values(agg).sort((a,b)=>String(a.no).localeCompare(String(b.no)));
  if(!list.length) return '<div class="empty">'+t('nomenu')+'</div>';

  let h='<div class="sec">'+t('secProd')+'</div>';
  list.forEach(m=>{
    const tot=m.lc+m.hp+m.hx;
    h+='<div class="m"><div class="mh"><div><div class="t1">'+nickTag(m.code)+esc(m.no)+'. '+esc(tr(m.name))+'</div></div>'
      +'<span class="tot">'+tot+'</span></div>';
    [['lc',m.lc],['hp',m.hp],['hx',m.hx]].forEach(([fam,q])=>{
      if(!q) return;
      h+='<div class="ln '+fam+'"><span class="tag">'+fam.toUpperCase()+'</span>'
        +'<div class="d"><b>'+t('meat')+' '+gramOf(fam)+'</b></div><span class="q">'+q+'</span></div>';
    });
    // 👤 ใครได้เมนูนี้บ้าง — คนที่มีข้อจำกัดขึ้นป้ายเหลือง จะได้สะดุดตาตอนทำ
    const names=Object.keys(m.who);
    if(names.length && SHOWWHO){   // ปิดได้ด้วยปุ่ม 👤 ถ้าอยากดูยอดผลิตล้วนๆ
      h+='<div class="who">'+t('whoGets')+' ';
      names.forEach(nm=>{
        const w=m.who[nm], hasR=w.restr.length>0;
        h+='<span class="p'+(hasR?' warn':'')+'">'+(hasR?'⚠️ ':'')+esc(nm)
          +' <span class="x">×'+w.n+'</span></span>';
      });
      h+='</div>';
    }
    // 🚫 ข้อจำกัดรายกล่อง — แยกบรรทัดให้อ่านง่ายตอนยืนทำอาหาร
    names.forEach(nm=>{
      const w=m.who[nm];
      if(!w.restr.length) return;
      h+='<div class="perbox">🚫 '+esc(nm)+' '+w.n+' '+t('box')+' — '+esc(w.restr.join(' · '))+'</div>';
    });
    // โน้ตเฉพาะกล่องที่แอดมินพิมพ์ไว้ (ถ้ามี)
    m.notes.forEach(n=>{ h+='<div class="sp">📌 '+esc(n)+'</div>'; });
    h+='</div>';
  });
  return h;
}

/* มุมที่ 2 — ใบจัดของ: หั่นตามลูกค้า ติ๊กได้ (ติ๊กเก็บในเครื่อง ไม่เขียน DB) */
function renderPack(rows){
  let h='<div class="note">ติ๊กแล้วจำไว้ในเครื่องนี้เท่านั้น — เปลี่ยนเครื่องหรือล้างแอปแล้วติ๊กหาย · ระบบไม่ถูกแก้จากหน้านี้</div>';
  h+='<div class="sec">'+t('secPack')+'</div>';
  rows.slice().sort((a,b)=>whoOf(a).localeCompare(whoOf(b))).forEach(r=>{
    const boxes=mpBoxRows(r.order_id);
    const n=boxes.reduce((s,i)=>s+(i.quantity||1),0) || (r.box_count||0);
    const fam=famOf((boxes[0]||{}).menu_code, r.mp_type);
    const p=prefOf(r);
    const warn=[];
    if(p&&p.allergies) warn.push('แพ้: '+p.allergies);
    if(p&&p.dislikes)  warn.push('ไม่ทาน: '+p.dislikes);
    if(r.customer_note) warn.push(r.customer_note);
    const reqs=(r.customer_request||[]).map(x=>x.code||x.name).filter(Boolean);

    h+='<div class="c" id="c_'+esc(r.id)+'" onclick="toggleTick(\''+esc(r.id)+'\')">'
      +'<div class="ch"><div class="tick">✓</div>'
      +'<div class="nm">'+esc(whoOf(r))+' <span style="font-size:11px;color:#6B7280;font-weight:700">'+fam.toUpperCase()
      +' · '+t('round')+' '+(r.round_no||1)+'/'+(r.total_rounds||1)+'</span></div>'
      +'<span class="bx">'+n+' '+t('box')+'</span></div>';
    if(warn.length) h+='<div class="sp">⚠️ '+esc(warn.join(' · '))+'</div>';
    if(reqs.length) h+='<div class="sp" style="background:#FFF7ED;color:#9A3412">🙋 '+t('req')+': '+esc(reqs.join(' · '))+'</div>';
    h+='<div class="ci">';
    if(boxes.length) boxes.forEach(i=>{ h+='<div class="mi">• '+nickTag(i.menu_code)+esc(baseNo(i.menu_code))+' '+esc(tr(nameOf(i.menu_code,i.menu_name)))+'</div>'; });
    else h+='<div class="mi" style="color:#B91C1C;font-weight:800">'+t('nomenu')+'</div>';
    h+='</div></div>';
  });
  return h;
}

/* ติ๊กเก็บใน localStorage แยกตามวัน — ข้ามวันแล้วเริ่มใหม่เอง ไม่ต้องมีใครล้าง */
function tickKey(){ return 'kq_sheet_tick_'+DATE; }
function toggleTick(id){
  const el=document.getElementById('c_'+id); if(!el) return;
  el.classList.toggle('done');
  const set=new Set(JSON.parse(localStorage.getItem(tickKey())||'[]'));
  el.classList.contains('done') ? set.add(id) : set.delete(id);
  localStorage.setItem(tickKey(), JSON.stringify([...set]));
}
function restoreTicks(){
  const set=new Set(JSON.parse(localStorage.getItem(tickKey())||'[]'));
  set.forEach(id=>{ const el=document.getElementById('c_'+id); if(el) el.classList.add('done'); });
}

setLang(LANG); setView(VIEW); setWho(SHOWWHO); load();
</script>
