    if(c.gift) h += '<div class="gift">'+esc(UI.gift[lang])+'</div>';
    if(c.items.length===0){ h += '<div class="it"><span class="bo"></span><span class="no">?</span><span class="tx">'+esc(UI.pick[lang])+'</span></div>'; }
    c.items.forEach(function(code){
      var m=M[code], k=ci+'-'+code, on=done[k]?' done':'';
      h += '<div class="it'+on+'" onclick="tog(\''+k+'\',this)"><span class="bo">✓</span><span class="no">'+code+'</span>'
         + '<span class="tx">'+esc(m[lang])+'<small>'+esc(m.p[lang])+'</small></span></div>';
    });
    h += '</div>';
  });
  document.getElementById('app').innerHTML=h;
}
function tog(k,el){ done[k]=!done[k]; if(!done[k]) delete done[k]; localStorage.setItem('pack0807',JSON.stringify(done)); el.classList.toggle('done'); }
function clearAll(){ done={}; localStorage.removeItem('pack0807'); render(); }
function setLang(l){
  lang=l;
  document.querySelectorAll('[data-i]').forEach(function(e){var k=e.getAttribute('data-i'); if(UI[k]&&UI[k][l]!=null) e.textContent=UI[k][l];});
  ['th','shn','my'].forEach(function(x){document.getElementById('b_'+x).classList.toggle('on', x===l);});
  var b=document.getElementById('vbanner'); b.textContent=V[l]||''; b.style.display=l==='th'?'none':'block';
  document.documentElement.lang = l==='my'?'my':(l==='shn'?'shn':'th');
  render();
}
render();
</script>
