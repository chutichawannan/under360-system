<meta charset="utf-8">
<title>Under360 — การ์ดเมนูประจำสัปดาห์</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#e9ecef;font-family:"Sarabun","Noto Sans Thai","Segoe UI",sans-serif;padding:24px;display:flex;flex-direction:column;align-items:center;gap:16px}
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:#fff;padding:12px 16px;border-radius:12px;max-width:1040px;width:100%}
  .bar input{font:inherit;padding:8px 10px;border:1px solid #ccc;border-radius:8px}
  .bar input.wide{flex:1;min-width:220px}
  .bar button{font:inherit;padding:8px 16px;border:0;border-radius:8px;background:#1f7a4d;color:#fff;cursor:pointer}
  #card{width:1040px;height:1040px;background:#fff;position:relative;overflow:hidden;
        box-shadow:0 8px 30px rgba(0,0,0,.15)}
  #card .head{background:#1f7a4d;color:#fff;padding:30px 40px 26px}
  #card .head h1{font-size:52px;font-weight:800;letter-spacing:-.5px}
  #card .head p{font-size:30px;opacity:.92;margin-top:6px}
  #grid{display:grid;gap:14px;padding:22px 26px}
  .it{position:relative;border-radius:14px;overflow:hidden;background:#f2f2f2}
  .it img{width:100%;height:100%;object-fit:cover;display:block}
  .it .no{position:absolute;top:10px;left:10px;background:#1f7a4d;color:#fff;font-weight:800;
          padding:5px 13px;border-radius:999px;font-size:26px;line-height:1.15}
  .it .cap{position:absolute;left:0;right:0;bottom:0;padding:34px 12px 10px;color:#fff;
           background:linear-gradient(transparent,rgba(0,0,0,.82))}
  .it .cap b{display:block;font-size:25px;font-weight:700;line-height:1.22;
             text-shadow:0 1px 3px rgba(0,0,0,.6)}
  .it .cap i{font-style:normal;font-size:23px;opacity:.95}
  .foot{position:absolute;left:0;right:0;bottom:0;height:78px;background:#173d2c;color:#fff;
        display:flex;align-items:center;justify-content:space-between;padding:0 40px;font-size:27px}
  .foot b{font-weight:800}
  @media print{body{background:#fff;padding:0}.bar{display:none}}
</style>

<div class="bar">
  <input id="i-title" class="wide" placeholder="หัวเรื่อง">
  <input id="i-sub" class="wide" placeholder="บรรทัดรอง (ช่วงวันที่)">
  <input id="i-codes" class="wide" placeholder="รหัสเมนู คั่นด้วย , (ว่าง = เมนูพิเศษสัปดาห์นี้ทั้งหมด)">
  <button onclick="load()">สร้างการ์ด</button>
  <button onclick="png()" style="background:#b8860b">⬇ บันทึกรูป PNG</button>
</div>

<div id="card">
  <div class="head"><h1 id="t"></h1><p id="s"></p></div>
  <div id="grid"></div>
  <div class="foot"><span>สั่งผ่าน LINE <b>@under360</b></span><b id="cnt"></b></div>
</div>

<script>
const URL_="https://zdartbvhbvqlwzwyyiia.supabase.co";
const KEY_="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpkYXJ0YnZoYnZxbHd6d3l5aWlhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE4MTY3OTksImV4cCI6MjA5NzM5Mjc5OX0.D41YGH-CuWrVFqcAgXEuhfVTxJ7WY26Xu-PeXBF6LB8";
const H={apikey:KEY_,Authorization:"Bearer "+KEY_};
const qs=new URLSearchParams(location.search);

// ช่วงวันที่เริ่มต้น = จันทร์–อาทิตย์ สัปดาห์หน้า (เวลาไทย)
function nextWeekLabel(){
  const M=["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
  const now=new Date(new Date().toLocaleString("en-US",{timeZone:"Asia/Bangkok"}));
  const d=now.getDay();                       // 0=อา
  const toMon=(8-(d===0?7:d))%7||7;           // จันทร์ถัดไป
  const a=new Date(now); a.setDate(now.getDate()+toMon);
  const b=new Date(a);   b.setDate(a.getDate()+6);
  return a.getDate()+" "+M[a.getMonth()]+" – "+b.getDate()+" "+M[b.getMonth()];
}

function thumb(u,w){
  if(!u) return "";
  return u.includes("/object/public/")
    ? u.replace("/object/public/","/render/image/public/")+"?width="+w+"&quality=80"
    : u;
}

async function load(){
  const title=document.getElementById("i-title").value.trim()||"เมนูพิเศษสัปดาห์หน้า";
  const sub  =document.getElementById("i-sub").value.trim();
  const codes=document.getElementById("i-codes").value.trim();
  document.getElementById("t").textContent=title;
  document.getElementById("s").textContent=sub;

  let q="menu_items?select=code,subcode,name,price,image_urls&is_available=eq.true&";
  q+= codes ? "code=in.("+codes.split(/[,\s]+/).filter(Boolean).join(",")+")"
            : "subcode=not.is.null";
  q+="&limit=40";
  const r=await fetch(URL_+"/rest/v1/"+q,{headers:H});
  let rows=r.ok?await r.json():[];
  rows=rows.filter(x=>x.image_urls&&x.image_urls[0]);
  rows.sort((a,b)=>String(a.subcode||a.code).localeCompare(String(b.subcode||b.code),"en",{numeric:true}));

  const n=rows.length;
  const cols=n<=4?2:(n<=9?3:4);
  const g=document.getElementById("grid");
  const headH=document.querySelector(".head").offsetHeight;
  const rowsN=Math.ceil(n/cols);
  const cellH=Math.floor((1040-headH-78-44-(rowsN-1)*14)/rowsN);
  g.style.gridTemplateColumns="repeat("+cols+",1fr)";
  g.innerHTML=rows.map(x=>
    '<div class="it" style="height:'+cellH+'px">'+
      '<img src="'+thumb(x.image_urls[0],520)+'">'+
      (x.subcode?'<span class="no">'+x.subcode+'</span>':'')+
      '<div class="cap"><b>'+x.name+'</b><i>'+(x.price?x.price+".-":"")+'</i></div>'+
    '</div>').join("");
  document.getElementById("cnt").textContent=n?n+" เมนู":"ไม่พบเมนู";
}

// ── บันทึกเป็นไฟล์ PNG (ไม่ใช้ไลบรารีข้างนอก) ─────────────────────────
async function toDataUrl(u){
  const r=await fetch(u,{mode:"cors"});
  const b=await r.blob();
  return await new Promise(res=>{const f=new FileReader();f.onload=()=>res(f.result);f.readAsDataURL(b);});
}
async function png(){
  const card=document.getElementById("card");
  const imgs=[...card.querySelectorAll("img")];
  const keep=imgs.map(i=>i.src);
  try{
    await Promise.all(imgs.map(async i=>{ try{ i.src=await toDataUrl(i.src);}catch(e){} }));
    await new Promise(r=>setTimeout(r,400));
    let css="";
    for(const s of document.styleSheets){ try{ for(const r of s.cssRules) css+=r.cssText; }catch(e){} }
    const html=new XMLSerializer().serializeToString(card);
    const svg='<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="1040">'+
      '<foreignObject width="100%" height="100%">'+
      '<div xmlns="http://www.w3.org/1999/xhtml"><style>'+css+'</style>'+html+'</div>'+
      '</foreignObject></svg>';
    const im=new Image();
    await new Promise((ok,no)=>{im.onload=ok;im.onerror=no;
      im.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg);});
    const c=document.createElement("canvas"); c.width=c.height=1040;
    const x=c.getContext("2d"); x.fillStyle="#fff"; x.fillRect(0,0,1040,1040); x.drawImage(im,0,0);
    const blob=await new Promise(r=>c.toBlob(r,"image/png"));
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download="menu_"+(document.getElementById("i-sub").value.replace(/[^0-9]+/g,"_")||"week")+".png";
    a.click();
    window.__pngSize=blob.size;
  } finally { imgs.forEach((i,n)=>i.src=keep[n]); }
}

document.getElementById("i-title").value=qs.get("title")||"เมนูพิเศษสัปดาห์หน้า";
document.getElementById("i-sub").value  =qs.get("sub")||nextWeekLabel();
document.getElementById("i-codes").value=qs.get("codes")||"";
load();
</script>
