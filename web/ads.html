<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 🔴 หน้าหลังบ้าน เก็บตัวเลขค่าโฆษณา = ความลับทางธุรกิจ
     ห้ามให้ Google เก็บเด็ดขาด (คู่แข่ง 42 รายในชีทเราจะอ่านได้หมด) -->
<meta name="robots" content="noindex,nofollow,noarchive">
<title>ตัวเลขแอด — Under360</title>
<link rel="icon" href="/img/u360_logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;600;700&family=Sarabun:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--ink:#14171A;--muted:#6B7280;--hair:#E4E7E2;--green:#2E7D43;--paper:#fff;--soft:#F7F8F6;
  --red:#C62828;--redbg:#FDECEC;--amber:#8A6A00;--amberbg:#FFF8E6;--blue:#1F5FA8;--bluebg:#EAF2FB}
body{font-family:'Sarabun',sans-serif;color:var(--ink);background:var(--soft);font-size:16px;line-height:1.6}
.wrap{max-width:1180px;margin:0 auto;padding:0 18px}
h1,h2,h3{font-family:'Prompt',sans-serif;font-weight:600;line-height:1.3}

header{background:var(--paper);border-bottom:1px solid var(--hair);padding:14px 0}
header .r{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header h1{font-size:1.15rem;margin-right:auto}
header .lock{font-size:.8rem;color:var(--muted);background:var(--soft);border:1px solid var(--hair);
  border-radius:999px;padding:4px 12px}
.seg{display:flex;gap:4px;background:var(--soft);border:1px solid var(--hair);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;font-family:'Prompt';font-weight:600;font-size:.85rem;
  padding:6px 14px;border-radius:999px;cursor:pointer;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--green);color:#fff}
.seg.aud button.on[data-a="new"]{background:var(--blue)}
.bar2{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.bar2 .lbl{font-size:.8rem;color:var(--muted)}

.note{background:var(--amberbg);border-bottom:1px solid #F0DFA8;color:var(--amber);
  font-size:.9rem;padding:9px 0}

section{padding:22px 0}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.card{background:var(--paper);border:1px solid var(--hair);border-radius:14px;padding:16px 18px}
.card .k{font-size:.85rem;color:var(--muted)}
.card .v{font-family:'Prompt';font-weight:700;font-size:1.85rem;line-height:1.2;margin-top:4px}
.card .s{font-size:.85rem;color:var(--muted);margin-top:2px}
.card.hero{border-color:var(--green)}
.card.hero .v{color:var(--green)}
.card.db .v{color:var(--ink)}
.card.claim{background:var(--amberbg);border-color:#F0DFA8}
.card.claim .k{color:var(--amber);font-weight:700}
.card.claim .v{color:var(--amber);font-size:1.5rem}
.card.newc{border-color:var(--blue)}
.card.newc .v{color:var(--blue)}
/* ── u360-buyer-type / u360-new-buyers ── */
th.bth,td.btc{background:#F6FAF6}
.topbuy{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.topbuy .lbl{font-size:.8rem;color:var(--muted);margin-right:2px}
.chip{background:var(--paper);border:1px solid var(--hair);border-radius:999px;padding:4px 12px;font-size:.85rem}
.chip b{font-family:'Prompt';color:var(--green);margin-right:6px}
.chip em{font-style:normal;color:var(--muted);font-size:.78rem}
table.nb{min-width:900px}
table.nb th:nth-child(3),table.nb td.items,table.nb th:nth-child(5),table.nb td.adsrc{text-align:left;white-space:normal;min-width:220px}
.up{color:var(--red)} .down{color:var(--green)}
/* มือถือ: การ์ด 5 ใบเรียงแถวเดียว = ตารางคอนเซปต์ตกไปจอที่ 2 → วาง 2 คอลัมน์ · ช่อง Meta เคลมเต็มแถว (ข้อความเตือนยาว) */
@media (max-width:520px){
  .cards{grid-template-columns:1fr 1fr;gap:8px}
  .card{padding:12px 13px}
  .card .v{font-size:1.35rem}
  .card .s{font-size:.78rem;line-height:1.45}
  .card.claim{grid-column:1 / -1}
  .card.claim .v{font-size:1.2rem}
}

.h2row{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:26px 0 0}
.h2row h2{font-size:1.05rem}
.h2row .sub{font-size:.82rem;color:var(--muted)}

.tblwrap{background:var(--paper);border:1px solid var(--hair);border-radius:14px;overflow:auto;margin-top:10px}
table{width:100%;border-collapse:collapse;font-size:.9rem;min-width:980px}
th,td{padding:10px 12px;text-align:right;white-space:nowrap;border-top:1px solid var(--hair)}
th{font-family:'Prompt';font-weight:600;font-size:.78rem;color:var(--muted);
  text-align:right;background:var(--soft);border-top:0;position:sticky;top:0}
th:first-child,td:first-child{text-align:left;white-space:normal;min-width:240px}
th.claimh,td.claimc{background:var(--amberbg);color:var(--amber)}
tr.bad td{background:var(--redbg)}
tr.bad td.claimc{background:var(--amberbg)}
.flag{display:inline-block;background:var(--red);color:#fff;border-radius:999px;
  padding:2px 9px;font-size:.72rem;font-family:'Prompt';font-weight:600;margin:3px 4px 0 0}
.win{color:var(--green);font-family:'Prompt';font-weight:600}
.dim{color:#B3B8BF}
.msg{background:var(--paper);border:1px solid var(--hair);border-radius:14px;padding:22px;margin-top:14px}
.msg b{font-family:'Prompt';font-weight:600}
.msg code{background:var(--soft);border:1px solid var(--hair);border-radius:6px;padding:2px 7px;font-size:.9em}
.msg ol{margin:10px 0 0 20px} .msg li{margin-top:6px;color:var(--muted)}
.fine{font-size:.8rem;color:var(--muted);margin-top:8px;line-height:1.6}
footer{color:var(--muted);font-size:.85rem;padding:20px 0 40px}

/* ── u360-concepts — มุมมองตามคอนเซปต์ (06 ขอ 11 ก.ย.) ── */
tr.crow{cursor:pointer}
tr.crow:hover td{background:#FAFBF9}
tr.crow.bad:hover td{background:var(--redbg)}
.cname{display:flex;gap:10px;align-items:flex-start}
.caret{display:inline-block;width:14px;color:var(--muted);transition:transform .15s;flex-shrink:0;margin-top:2px}
tr.crow.open .caret{transform:rotate(90deg)}
.ccode{font-family:'Prompt';font-weight:700;background:var(--soft);border:1px solid var(--hair);
  border-radius:7px;padding:0 7px;font-size:.85rem;flex-shrink:0}
.ctitle b{font-weight:600} .ctitle em{display:block;font-style:normal;font-size:.76rem;color:var(--muted)}
.crown{margin-left:4px}
tr.sub td{background:#FBFCFA;font-size:.84rem;color:#4B5563}
tr.sub td:first-child{padding-left:46px}
tr.sub[hidden]{display:none}
.audtag{display:inline-block;font-size:.7rem;font-family:'Prompt';font-weight:600;border-radius:5px;padding:0 6px;margin-right:6px}
.audtag.new{background:var(--bluebg);color:var(--blue)}
.audtag.old{background:#F1ECF7;color:#6B3FA0}
details.stopped{margin-top:14px}
details.stopped summary{cursor:pointer;font-family:'Prompt';font-weight:600;font-size:.9rem;color:var(--muted);
  background:var(--paper);border:1px solid var(--hair);border-radius:12px;padding:10px 14px;list-style:none}
details.stopped summary::-webkit-details-marker{display:none}
details.stopped[open] summary{border-radius:12px 12px 0 0}
details.stopped .tblwrap{margin-top:0;border-radius:0 0 14px 14px;border-top:0;opacity:.85}

  /* ── u360-ads-gate ── */
  #adsgate { position:fixed; inset:0; z-index:200; display:grid; place-items:center;
             background:#10221A; color:#fff; text-align:center; padding:24px;
             font-family:inherit; }
  #adsgate h2 { font-size:20px; margin:0 0 6px; font-weight:600; }
  #adsgate p { color:#9DB3A8; font-size:14px; margin:0 0 18px; }
  #adsgate input { width:190px; font-size:26px; text-align:center; letter-spacing:8px;
                   padding:12px; border-radius:12px; border:1px solid #2B4238;
                   background:#16281F; color:#fff; font-family:inherit; }
  #adsgate .err { color:#F0A08F; font-size:13px; margin-top:10px; min-height:18px; }
  /* ── u360-watchdog-card ── */
  .wd { border:1px solid var(--line,#e5eae6); border-radius:14px; padding:14px 16px;
        margin-bottom:18px; background:var(--soft,#f7f9f7); }
  .wdhead { display:flex; align-items:baseline; justify-content:space-between;
            gap:12px; margin-bottom:8px; font-size:15px; }
  .wdhead span { font-size:12px; opacity:.65; }
  .wd pre { margin:0; white-space:pre-wrap; word-break:break-word;
            font-family:inherit; font-size:13px; line-height:1.75; }
  /* แอด 50+ ตัว รายงานยามยาวทั้งจอ → ดันตารางคอนเซปต์ (ของที่นัทต้องเห็นก่อน) ตกขอบล่าง
     พับไว้ 6 บรรทัด กดกางดูได้ */
  .wd:not(.open) pre { max-height:calc(1.75em * 6); overflow:hidden;
            -webkit-mask-image:linear-gradient(#000 60%, transparent); mask-image:linear-gradient(#000 60%, transparent); }
  .wdmore { margin-top:6px; border:0; background:transparent; color:var(--green); font-family:'Prompt';
            font-weight:600; font-size:13px; cursor:pointer; padding:2px 0; }
  /* ── u360-thumbs-ui ── */
  .adcell-wrap { display:block; }
  .adcell { display:flex; align-items:center; gap:10px; min-width:220px; }
  .adthumb { width:44px; height:44px; border-radius:8px; object-fit:cover; flex-shrink:0;
             border:1px solid var(--line,#e5eae6); background:var(--soft,#f7f9f7); display:block; }
  .adthumb.none { display:block; }
  .adinfo { display:flex; flex-direction:column; line-height:1.35; min-width:0; }
  .adinfo b { font-weight:600; font-size:13px; }
  .adinfo em { font-style:normal; font-size:11px; opacity:.7; }
  .dead { display:inline-block; margin-left:6px; font-size:10px; font-weight:500;
          background:#EEE; color:#777; border-radius:5px; padding:1px 5px; vertical-align:1px; }
  .funnel { display:flex; align-items:center; flex-wrap:wrap; gap:6px 4px; margin:14px 0 4px;
            padding:14px 12px; border:1px solid var(--line,#e5eae6); border-radius:14px;
            background:var(--soft,#f7f9f7); }
  .fstep { display:flex; flex-direction:column; align-items:center; min-width:66px; }
  .fstep b { font-size:19px; font-weight:600; line-height:1.3; }
  .fstep em { font-style:normal; font-size:11px; opacity:.7; }
  .arw { font-size:11px; opacity:.55; padding:0 2px; }
  /* ── u360-google-ui ── */
  .gsec { margin-top:22px; }
  .gh { font-size:1rem; margin-bottom:10px; }
  .gcards { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:10px; }
  .gcard { background:var(--paper); border:1px solid var(--hair); border-radius:12px; padding:12px 14px; }
  .gcard .k { font-size:.8rem; color:var(--muted); }
  .gcard .v { font-family:'Prompt'; font-weight:700; font-size:1.35rem; line-height:1.25; margin-top:2px; }
  .gcard .na { font-family:'Sarabun'; font-weight:400; font-size:.85rem; color:var(--muted); }
  .gnote { font-size:.82rem; color:var(--muted); margin-top:8px; }
</style>
</head>
<body>

<header>
  <div class="wrap r">
    <h1>📊 ตัวเลขแอด</h1>
    <span class="lock">🔒 หน้าหลังบ้าน — ไม่ให้ Google เก็บ</span>
    <div class="seg" id="ranges"></div>
  </div>
</header>

<div class="note" id="topnote"><div class="wrap">⏱️ ตัวเลข Meta ดึงใหม่ทุก 15 นาที — ไม่ใช่เรียลไทม์ (ดึงถี่กว่านี้บัญชีแอดโดน Meta ล็อก)</div></div>

<section><div class="wrap">
  <!-- u360-watchdog-card — รายงานล่าสุดของยามเฝ้าแอด (นัทขอ 9 ก.ย.) -->
  <div class="wd" id="wd" hidden>
    <div class="wdhead"><b>🐕 ยามเฝ้าแอด</b><span id="wdtime"></span></div>
    <pre id="wdtext"></pre>
    <button class="wdmore" id="wdmore" type="button" hidden>ดูรายงานเต็ม ▾</button>
  </div>
  <div class="bar2">
    <span class="lbl">ยิงใส่ใคร</span><div class="seg aud" id="auds"></div>
    <span class="lbl" style="margin-left:8px">ดูแบบ</span><div class="seg" id="views"></div>
  </div>
  <div class="cards" id="cards"></div>
  <div id="body"></div>
  <div class="funnel" id="funnel" hidden></div>
  <div class="gsec" id="gsec" hidden></div>
</div></section>

<footer><div class="wrap" id="foot">กำลังโหลด…</div></footer>

<div id="adsgate">
  <div>
    <h2>ใส่รหัสเพื่อดูตัวเลขโฆษณา</h2>
    <p>หน้านี้มีค่าใช้จ่ายโฆษณาจริง</p>
    <input id="adspin" type="tel" inputmode="numeric" maxlength="4" autocomplete="off" aria-label="รหัสผ่าน">
    <div class="err" id="adspinerr"></div>
  </div>
</div>
<script>
/* u360-ads-gate — หน้าเว็บไม่รู้ค่ารหัสจริง แค่ส่งไปให้ server ตรวจ
   ?check=1 = เช็ครหัสอย่างเดียว ไม่ไปแตะ Meta (เดิมเช็ครหัสทีดึงแอดทั้งบัญชีที — 06 โดนล็อกลิมิต 11 ก.ย.) */
var U360PIN = '';
function u360pin(){ return U360PIN; }
(function(){
  try{ U360PIN = localStorage.getItem('u360_ads_pin') || ''; }catch(e){}
  var gate=document.getElementById('adsgate'), inp=document.getElementById('adspin'), err=document.getElementById('adspinerr');
  function tryPin(p){
    return fetch('/api/ads-insights?check=1', {headers:{'x-ads-pin':p}}).then(function(r){ return r.status !== 401; });
  }
  function unlock(){ window.U360_UNLOCKED = true; gate.remove(); document.dispatchEvent(new Event('u360-unlocked')); }
  if (U360PIN) { tryPin(U360PIN).then(function(ok){ if(ok) unlock(); else { U360PIN=''; inp.focus(); } }); }
  else setTimeout(function(){ inp.focus(); }, 100);
  inp.addEventListener('input', function(){
    if (inp.value.length < 4) { err.textContent=''; return; }
    var p = inp.value;
    tryPin(p).then(function(ok){
      if (ok) { U360PIN = p; try{ localStorage.setItem('u360_ads_pin', p); }catch(e){} unlock(); }
      else { err.textContent = 'รหัสไม่ถูก'; inp.value=''; }
    });
  });
})();
</script>
<script>
var DAYS = 7, AUDF = 'all', VIEW = 'concept', LAST = null;
try { AUDF = localStorage.getItem('u360_ads_aud') || 'all'; VIEW = localStorage.getItem('u360_ads_view') || 'concept'; } catch(e){}
var RANGES = [[1,'วันนี้'],[7,'7 วัน'],[30,'30 วัน']];
/* ความหมายชุด — ต้องตรงกับ AUD ใน web/api/ads-insights.js (06 กำหนด 11 ก.ย.) */
var AUDS = [['all','ทั้งหมด'],['new','แอดที่ยิงคนใหม่ (A · D)'],['old','แอดที่ยิงคนเก่า (B · C)']];
var VIEWS = [['concept','ตามคอนเซปต์'],['ad','รายแอด']];
/* "ยิงคนใหม่" = ชุดแอดที่ตั้งใจยิง ไม่ใช่คนที่ซื้อจริง (นัทสับสนแล้วรอบนึง 11 ก.ย.)
   คนที่ซื้อจริงใช้ป้าย 🆕 คนใหม่ · 🔁 ลูกค้าเก่า · 🥬 เคยซื้อเจ ที่มาจากประวัติใน DB */
var AUDNAME = { 'new':'ยิงคนใหม่', 'old':'ยิงคนเก่า' };
var BT = [['new','🆕 คนใหม่'],['old','🔁 ลูกค้าเก่า'],['jay','🥬 เคยซื้อเจ']];
var MIN_LEADS_WIN = 3;   /* 🏆 ต้องมีคนกดลิงก์เข้าไลน์อย่างน้อยเท่านี้ถึงนับว่าชนะ — M ตั้งเอง (น้อยกว่านี้ยังบังเอิญได้) */

function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function baht(n){ return '฿' + Number(n||0).toLocaleString('th-TH',{maximumFractionDigits:0}); }
function num(n){ return Number(n||0).toLocaleString('th-TH'); }
function z(n, f){ return n ? (f ? f(n) : num(n)) : '<span class="dim">0</span>'; }

function segs(id, list, cur, onPick){
  var box = document.getElementById(id);
  box.innerHTML = list.map(function(r){
    return '<button class="'+(r[0]===cur?'on':'')+'" data-v="'+r[0]+'" data-a="'+r[0]+'">'+r[1]+'</button>';
  }).join('');
  [].slice.call(box.querySelectorAll('button')).forEach(function(b){
    b.onclick = function(){ onPick(isNaN(+b.dataset.v) ? b.dataset.v : +b.dataset.v); };
  });
}
function renderControls(){
  segs('ranges', RANGES, DAYS, function(v){ DAYS = v; renderControls(); load(); });
  segs('auds', AUDS, AUDF, function(v){ AUDF = v; try{localStorage.setItem('u360_ads_aud', v);}catch(e){} renderControls(); if (LAST) draw(); });
  segs('views', VIEWS, VIEW, function(v){ VIEW = v; try{localStorage.setItem('u360_ads_view', v);}catch(e){} renderControls(); if (LAST) draw(); });
}

function load(){
  document.getElementById('foot').textContent = 'กำลังโหลด…';
  fetch('/api/ads-insights?days=' + DAYS, { cache:'no-store', headers:{'x-ads-pin': u360pin()} })
    .then(function(r){ return r.json(); })
    .then(render)
    .catch(function(){ document.getElementById('body').innerHTML =
      '<div class="msg">🔴 เรียกข้อมูลไม่ได้ ลองรีเฟรชอีกครั้ง</div>'; });
}

function render(d){
  var cards = document.getElementById('cards'), body = document.getElementById('body');

  if(d.setupNeeded){
    cards.innerHTML = '';
    body.innerHTML = '<div class="msg"><b>ยังใช้งานไม่ได้ — ต้องตั้งค่าใน Vercel ก่อน</b>'
      + '<p style="color:var(--muted);margin-top:6px">โทเค็นต้องอยู่ฝั่ง server เท่านั้น '
      + 'ใส่ในหน้าเว็บไม่ได้เด็ดขาด ใครก็อ่านข้อมูลโฆษณาเราได้หมด</p>'
      + '<ol><li>เปิด Vercel → โปรเจค <code>under360-web</code> → Settings → Environment Variables</li>'
      + '<li>เพิ่ม <code>META_TOKEN</code> (โทเค็นจากห้อง 06)</li>'
      + '<li>เพิ่ม <code>META_AD_ACCOUNT</code> = <code>act_463330657546428</code></li>'
      + '<li>Redeploy แล้วรีเฟรชหน้านี้</li></ol></div>';
    document.getElementById('foot').textContent = '';
    return;
  }
  if(d.error){
    cards.innerHTML = '';
    body.innerHTML = '<div class="msg">🔴 ' + esc(d.error) + '</div>';
    document.getElementById('foot').textContent = '';
    return;
  }
  LAST = d;
  renderFunnel(d.funnel);   /* u360-thumbs-ui */
  renderGoogle(d.google);   /* u360-google-ui */
  draw();
}

/* ยอดยืนยันใน DB ของกลุ่มแอด — นับ utm ละครั้งเดียว
   (แอดชื่อเก่าหลายตัวใช้รหัสเดียวกัน เช่น c4 · จานแดง / c4 · health — บวกตรงๆ = ออเดอร์ใบเดียวนับซ้ำ) */
function dbFor(list){
  var by = (LAST.orders && LAST.orders.byUtm) || {}, seen = {};
  var r = { n:0, rev:0, bt:{ 'new':{n:0,rev:0}, old:{n:0,rev:0}, jay:{n:0,rev:0}, unknown:{n:0,rev:0} } };
  list.forEach(function(a){
    if (!a.utm || seen[a.utm]) return; seen[a.utm] = 1;
    var h = by[a.utm]; if (!h) return;
    r.n += h.orders; r.rev += h.revenue;
    ['new','old','jay','unknown'].forEach(function(t){ var x = h[t]; if (x) { r.bt[t].n += x.n; r.bt[t].rev += x.rev; } });
  });
  return r;
}
function sum(list, k){ return list.reduce(function(s,a){ return s + (+a[k]||0); }, 0); }
function agg(list){
  var spend = sum(list,'spend'), clicks = sum(list,'clicks'), imp = sum(list,'impressions'), leads = sum(list,'leads');
  var fr = 0; list.forEach(function(a){ if (a.impressions >= 300 && a.frequency > fr) fr = a.frequency; });
  var db = dbFor(list);
  return { n:list.length, live:list.filter(function(a){return a.live;}).length,
    spend:spend, clicks:clicks, imp:imp, ctr: imp ? clicks/imp*100 : 0, leads:leads,
    cpl: leads ? spend/leads : null, chats:sum(list,'chats'), saves:sum(list,'saves'), shares:sum(list,'shares'),
    freq:fr, db:db.n, dbRev:db.rev, bt:db.bt, claim:sum(list,'metaPurchases'), claimRev:sum(list,'metaRevenue') };
}

/* ── u360-concepts — คำถามที่นัทอยากรู้: "คอนเซปต์ไหนชนะ" ไม่ใช่ "แอดตัวไหนชนะ" ── */
function conceptView(ads){
  var groups = {}, order = [];
  ads.forEach(function(a){
    var k = a.legacy ? '__legacy' : (a.code || '?');
    if (!groups[k]) { groups[k] = { k:k, code:a.legacy ? 'เก่า' : a.code, title:a.legacy ? 'แอดชุดเก่า (ก่อน 11 ก.ย.)' : a.concept, ads:[] }; order.push(k); }
    groups[k].ads.push(a);
  });
  var rows = order.map(function(k){ var g = groups[k]; g.m = agg(g.ads); return g; });
  rows.sort(function(x, y){
    if ((x.k === '__legacy') !== (y.k === '__legacy')) return x.k === '__legacy' ? 1 : -1;
    if ((x.m.cpl==null) !== (y.m.cpl==null)) return x.m.cpl==null ? 1 : -1;
    if (x.m.cpl!=null && x.m.cpl !== y.m.cpl) return x.m.cpl - y.m.cpl;
    return y.m.spend - x.m.spend;
  });
  var best = null;
  rows.forEach(function(r){ if (r.k !== '__legacy' && r.m.leads >= MIN_LEADS_WIN && (!best || r.m.cpl < best.m.cpl)) best = r; });

  var html = '<div class="h2row"><h2>คอนเซปต์ไหนชนะ</h2><span class="sub">รวมรหัสใบเดียวกันจากทุกชุด · กดแถวเพื่อดูแยกชุด · เรียงจากต่อคนกดลิงก์เข้าไลน์ถูกสุด</span></div>'
    + '<div class="tblwrap"><table><thead><tr><th>คอนเซปต์</th><th>แอดวิ่ง</th>' + HEAD_METRICS + '</tr></thead><tbody>';
  rows.forEach(function(r){
    var m = r.m, bad = m.freq > 3;
    html += '<tr class="crow' + (bad ? ' bad' : '') + '" data-k="' + esc(r.k) + '">'
      + '<td><span class="cname"><span class="caret">▸</span><span class="ccode">' + esc(r.code) + '</span>'
      + '<span class="ctitle"><b>' + esc(r.title) + '</b><em>' + m.n + ' แอด' + (bad ? ' · ⚠️ มีแอดเห็นซ้ำเกิน 3' : '') + '</em></span></span></td>'
      + '<td>' + (m.live ? m.live + '/' + m.n : '<span class="dim">หยุดหมด</span>') + '</td>'
      + metricCells(m, best === r)
      + '</tr>';
    /* แยกตามชุด a/b/c/d ใต้คอนเซปต์ */
    var bySet = {};
    r.ads.forEach(function(a){ (bySet[a.set || '?'] = bySet[a.set || '?'] || []).push(a); });
    Object.keys(bySet).sort().forEach(function(s){
      var sm = agg(bySet[s]), a0 = bySet[s][0];
      html += '<tr class="sub" data-k="' + esc(r.k) + '" hidden>'
        + '<td>' + (a0.aud ? '<span class="audtag ' + a0.aud + '">' + AUDNAME[a0.aud] + '</span>' : '') + 'ชุด ' + esc(s.toUpperCase())
        + ' <span class="dim">· ' + esc(a0.adset || '') + '</span></td>'
        + '<td>' + (sm.live ? sm.live + '/' + sm.n : '<span class="dim">หยุด</span>') + '</td>'
        + metricCells(sm, false) + '</tr>';
    });
  });
  html += '</tbody></table></div>'
    + '<p class="fine">🏆 = ต่อคนกดลิงก์เข้าไลน์ถูกสุด เฉพาะคอนเซปต์ที่มีคนกดลิงก์เข้าไลน์อย่างน้อย ' + MIN_LEADS_WIN + ' คน (เกณฑ์นี้ M ตั้งเอง — น้อยกว่านี้ยังบังเอิญได้)'
    + ' · ตัวเลขรวมแอดที่หยุดไปแล้วด้วย เพราะเงินใช้ไปแล้วจริง · "เห็นซ้ำ" = ค่าสูงสุดของแอดในกลุ่มที่แสดงผลเกิน 300 ครั้ง'
    + ' · ✅ = ออเดอร์จริงที่ติดรหัสแอดมา แยกตามประวัติของ<b>คนซื้อ</b> (ไม่ใช่ชุดแอดที่ยิง): 🆕 ไม่เคยจ่ายเงินกับร้านมาก่อน · 🔁 เคยสั่งแต่ไม่เคยซื้อเจ · 🥬 เคยสั่งเมนูเจมาก่อน (นับใบ ฿0 ของคอร์สเจด้วย)'
    + ' · Meta เคลม = ตัวเลขของ Meta เอง ห้ามอ่านเป็นยอดขาย</p>';
  return html;
}

/* ── รายแอด — ที่ยังวิ่งอยู่ขึ้นก่อน · ที่หยุดแล้วพับเก็บ (ไม่งั้นนัทนึกว่ายังรัน) ── */
function adView(ads){
  var live = ads.filter(function(a){ return a.live !== false; });
  var stopped = ads.filter(function(a){ return a.live === false; });
  var bySpend = function(x, y){ return y.spend - x.spend; };
  live.sort(bySpend); stopped.sort(bySpend);
  var table = function(list){
    return '<div class="tblwrap"><table><thead><tr><th>ชิ้นงาน</th>' + HEAD_METRICS + '</tr></thead><tbody>'
      + list.map(function(a){
          var bad = a.flags && a.flags.length;
          var m = { spend:a.spend, clicks:a.clicks, ctr:a.ctr, leads:a.leads, cpl:a.costPerLead, chats:a.chats,
                    saves:a.saves, shares:a.shares, freq:a.frequency, db:a.orders, dbRev:a.revenue,
                    bt: dbFor([a]).bt,
                    claim:a.metaPurchases, claimRev:a.metaRevenue };
          return '<tr class="' + (bad ? 'bad' : '') + '">'
            + '<td class="adcell-wrap">' + adCell(a)
            + (bad ? '<div>' + a.flags.map(function(f){ return '<span class="flag">' + esc(f) + '</span>'; }).join('') + '</div>' : '')
            + '</td>' + metricCells(m, false) + '</tr>';
        }).join('')
      + '</tbody></table></div>';
  };
  var html = '<div class="h2row"><h2>▶️ กำลังวิ่ง ' + live.length + ' แอด</h2><span class="sub">เรียงตามเงินที่ใช้</span></div>'
    + (live.length ? table(live) : '<div class="msg">ไม่มีแอดที่กำลังวิ่งในกลุ่มนี้</div>');
  if (stopped.length) html += '<details class="stopped"><summary>⏸️ หยุดแล้ว ' + stopped.length + ' แอด — กดดู (ไม่ได้ใช้เงินเพิ่มแล้ว)</summary>' + table(stopped) + '</details>';
  return html;
}

(function waitUnlockWd(){
  if (window.U360_UNLOCKED || !document.getElementById('adsgate')) { loadWatchdog(); return; }
  setTimeout(waitUnlockWd, 150);
})();

/* u360-thumbs-ui — เซลล์ชื่อชิ้นงาน: รูปจริง + ชื่อ + ยิงใส่ใคร + ป้ายถ้าปิดแล้ว */
function adCell(a){
  var img = a.thumb
    ? '<img class="adthumb" src="' + esc(a.thumb) + '" alt="" loading="lazy">'
    : '<span class="adthumb none"></span>';
  var dead = (a.live === false) ? '<span class="dead">' + (a.status === 'DELETED' ? 'ลบแล้ว' : 'หยุดแล้ว') + '</span>' : '';
  var aud = a.aud ? '<span class="audtag ' + a.aud + '">' + AUDNAME[a.aud] + '</span>' : '';
  return '<span class="adcell">' + img + '<span class="adinfo"><b>' + esc(a.ad) + '</b>' + dead
       + '<em>' + aud + esc(a.adset || '') + '</em></span></span>';
}
/* แถวสรุปช่องทาง — บอกว่าคนหายตรงไหน (ทั้งบัญชี ไม่แยกกลุ่ม) */
function renderFunnel(f){
  if (!f) return;
  var box = document.getElementById('funnel'); if (!box) return;
  var steps = [['กดจากแอด', f.clicks, ''], ['เปิดหน้าเจ', f.visits, 'skip'], ['กดไป LINE', f.toLine, ''], ['จองจริง', f.orders, '']];
  box.innerHTML = steps.map(function(s, i){
    var prev = i ? steps[i-1][1] : 0;
    var pct = (i && prev && s[2] !== 'skip') ? Math.round(s[1] / prev * 100) + '%' : '';
    return (i ? '<span class="arw">' + pct + ' ›</span>' : '')
         + '<span class="fstep"><b>' + s[1].toLocaleString('th-TH') + '</b><em>' + s[0] + '</em></span>';
  }).join('');
  box.removeAttribute('hidden');
}

/* u360-google-ui — ช่องค่าใช้จ่ายเขียนบอกตรงๆ ว่ายังดึงไม่ได้ **ห้ามโชว์ 0** */
function renderGoogle(g){
  var box = document.getElementById('gsec'); if (!box || !g) return;
  var cells = [
    ['ใช้ไป', g.spend == null ? '<span class="na">ยังดึงไม่ได้</span>' : baht(g.spend)],
    ['คนเข้าหน้าเจ', Number(g.visits || 0).toLocaleString('th-TH')],
    ['กดไป LINE', Number(g.toLine || 0).toLocaleString('th-TH')],
    ['ออเดอร์จริง', Number(g.orders || 0).toLocaleString('th-TH')],
    ['ยอดขาย', g.revenue ? baht(g.revenue) : '—']
  ];
  box.innerHTML = '<h2 class="gh">🔍 Google Ads</h2>'
    + '<div class="gcards">' + cells.map(function(c){
        return '<div class="gcard"><div class="k">' + c[0] + '</div><div class="v">' + c[1] + '</div></div>';
      }).join('') + '</div>'
    + (g.spendNote ? '<p class="gnote">' + esc(g.spendNote) + '</p>' : '');
  box.removeAttribute('hidden');
}
</script>
