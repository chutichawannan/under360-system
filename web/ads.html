<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 🔴 หน้าหลังบ้าน เก็บตัวเลขค่าโฆษณา = ความลับทางธุรกิจ
     ห้ามให้ Google เก็บเด็ดขาด (คู่แข่ง 42 รายในชีทเราจะอ่านได้หมด) -->
<meta name="robots" content="noindex,nofollow,noarchive">
<title>ตัวเลขแอด — Under360</title>
<link rel="icon" href="/img/u360_logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;600;700&family=Sarabun:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--ink:#14171A;--muted:#6B7280;--hair:#E4E7E2;--green:#2E7D43;--paper:#fff;--soft:#F7F8F6;
  --red:#C62828;--redbg:#FDECEC;--amber:#8A6A00;--amberbg:#FFF8E6}
body{font-family:'Sarabun',sans-serif;color:var(--ink);background:var(--soft);font-size:16px;line-height:1.6}
.wrap{max-width:1120px;margin:0 auto;padding:0 18px}
h1,h2,h3{font-family:'Prompt',sans-serif;font-weight:600;line-height:1.3}

header{background:var(--paper);border-bottom:1px solid var(--hair);padding:14px 0}
header .r{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header h1{font-size:1.15rem;margin-right:auto}
header .lock{font-size:.8rem;color:var(--muted);background:var(--soft);border:1px solid var(--hair);
  border-radius:999px;padding:4px 12px}
.rangebtns{display:flex;gap:6px;background:var(--soft);border-radius:999px;padding:4px}
.rangebtns button{border:0;background:transparent;font-family:'Prompt';font-weight:600;font-size:.85rem;
  padding:6px 14px;border-radius:999px;cursor:pointer;color:var(--muted)}
.rangebtns button.on{background:var(--green);color:#fff}

.note{background:var(--amberbg);border-bottom:1px solid #F0DFA8;color:var(--amber);
  font-size:.9rem;padding:9px 0}

section{padding:22px 0}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.card{background:var(--paper);border:1px solid var(--hair);border-radius:14px;padding:16px 18px}
.card .k{font-size:.85rem;color:var(--muted)}
.card .v{font-family:'Prompt';font-weight:700;font-size:1.85rem;line-height:1.2;margin-top:4px}
.card .s{font-size:.85rem;color:var(--muted);margin-top:2px}
.card.hero .v{color:var(--green)}
.up{color:var(--red)} .down{color:var(--green)}

.tblwrap{background:var(--paper);border:1px solid var(--hair);border-radius:14px;overflow:auto;margin-top:14px}
table{width:100%;border-collapse:collapse;font-size:.92rem;min-width:780px}
th,td{padding:11px 13px;text-align:right;white-space:nowrap;border-top:1px solid var(--hair)}
th{font-family:'Prompt';font-weight:600;font-size:.82rem;color:var(--muted);
  text-align:right;background:var(--soft);border-top:0;position:sticky;top:0}
th:first-child,td:first-child{text-align:left;white-space:normal;min-width:220px}
tr.bad td{background:var(--redbg)}
.flag{display:inline-block;background:var(--red);color:#fff;border-radius:999px;
  padding:2px 9px;font-size:.74rem;font-family:'Prompt';font-weight:600;margin-left:6px}
.win{color:var(--green);font-family:'Prompt';font-weight:600}
.msg{background:var(--paper);border:1px solid var(--hair);border-radius:14px;padding:22px;margin-top:14px}
.msg b{font-family:'Prompt';font-weight:600}
.msg code{background:var(--soft);border:1px solid var(--hair);border-radius:6px;padding:2px 7px;font-size:.9em}
.msg ol{margin:10px 0 0 20px} .msg li{margin-top:6px;color:var(--muted)}
footer{color:var(--muted);font-size:.85rem;padding:20px 0 40px}
  /* ── u360-ads-gate ── */
  #adsgate { position:fixed; inset:0; z-index:200; display:grid; place-items:center;
             background:#10221A; color:#fff; text-align:center; padding:24px;
             font-family:inherit; }
  #adsgate h2 { font-size:20px; margin:0 0 6px; font-weight:600; }
  #adsgate p { color:#9DB3A8; font-size:14px; margin:0 0 18px; }
  #adsgate input { width:190px; font-size:26px; text-align:center; letter-spacing:8px;
                   padding:12px; border-radius:12px; border:1px solid #2B4238;
                   background:#16281F; color:#fff; font-family:inherit; }
  #adsgate .err { color:#F0A08F; font-size:13px; margin-top:10px; min-height:18px; }
  /* ── u360-watchdog-card ── */
  .wd { border:1px solid var(--line,#e5eae6); border-radius:14px; padding:14px 16px;
        margin-bottom:18px; background:var(--soft,#f7f9f7); }
  .wdhead { display:flex; align-items:baseline; justify-content:space-between;
            gap:12px; margin-bottom:8px; font-size:15px; }
  .wdhead span { font-size:12px; opacity:.65; }
  .wd pre { margin:0; white-space:pre-wrap; word-break:break-word;
            font-family:inherit; font-size:13px; line-height:1.75; }
</style>
</head>
<body>

<header>
  <div class="wrap r">
    <h1>📊 ตัวเลขแอด</h1>
    <span class="lock">🔒 หน้าหลังบ้าน — ไม่ให้ Google เก็บ</span>
    <div class="rangebtns" id="ranges"></div>
  </div>
</header>

<div class="note"><div class="wrap">⏱️ ข้อมูลจาก Meta หน่วงประมาณ 15 นาที — ไม่ใช่เรียลไทม์</div></div>

<!-- u360-watchdog-card — รายงานล่าสุดของยามเฝ้าแอด (นัทขอ 9 ก.ย.) -->
<section><div class="wrap">
  <div class="wd" id="wd" hidden>
    <div class="wdhead"><b>🐕 ยามเฝ้าแอด</b><span id="wdtime"></span></div>
    <pre id="wdtext"></pre>
  </div>
  <div class="cards" id="cards"></div>
  <div id="body"></div>
</div></section>

<footer><div class="wrap" id="foot">กำลังโหลด…</div></footer>

<div id="adsgate">
  <div>
    <h2>ใส่รหัสเพื่อดูตัวเลขโฆษณา</h2>
    <p>หน้านี้มีค่าใช้จ่ายโฆษณาจริง</p>
    <input id="adspin" type="tel" inputmode="numeric" maxlength="4" autocomplete="off" aria-label="รหัสผ่าน">
    <div class="err" id="adspinerr"></div>
  </div>
</div>
<script>
/* u360-ads-gate — หน้าเว็บไม่รู้ค่ารหัสจริง แค่ส่งไปให้ server ตรวจ
   จำไว้ในเครื่องเพื่อไม่ต้องพิมพ์ซ้ำทุกครั้ง */
var U360PIN = '';
function u360pin(){ return U360PIN; }
(function(){
  try{ U360PIN = localStorage.getItem('u360_ads_pin') || ''; }catch(e){}
  var gate=document.getElementById('adsgate'), inp=document.getElementById('adspin'), err=document.getElementById('adspinerr');
  function tryPin(p){
    return fetch('/api/ads-insights?days=1', {headers:{'x-ads-pin':p}}).then(function(r){ return r.status !== 401; });
  }
  function unlock(){ gate.remove(); document.dispatchEvent(new Event('u360-unlocked')); }
  if (U360PIN) { tryPin(U360PIN).then(function(ok){ if(ok) unlock(); else { U360PIN=''; inp.focus(); } }); }
  else setTimeout(function(){ inp.focus(); }, 100);
  inp.addEventListener('input', function(){
    if (inp.value.length < 4) { err.textContent=''; return; }
    var p = inp.value;
    tryPin(p).then(function(ok){
      if (ok) { U360PIN = p; try{ localStorage.setItem('u360_ads_pin', p); }catch(e){} unlock(); }
      else { err.textContent = 'รหัสไม่ถูก'; inp.value=''; }
    });
  });
})();
</script>
<script>
var DAYS = 7;
var RANGES = [[1,'วันนี้'],[7,'7 วัน'],[30,'30 วัน']];

function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function baht(n){ return '฿' + Number(n||0).toLocaleString('th-TH',{maximumFractionDigits:0}); }

function renderRanges(){
  document.getElementById('ranges').innerHTML = RANGES.map(function(r){
    return '<button class="'+(r[0]===DAYS?'on':'')+'" data-d="'+r[0]+'">'+r[1]+'</button>';
  }).join('');
  [].slice.call(document.querySelectorAll('#ranges button')).forEach(function(b){
    b.onclick = function(){ DAYS = +b.dataset.d; renderRanges(); load(); };
  });
}

function load(){
  document.getElementById('foot').textContent = 'กำลังโหลด…';
  fetch('/api/ads-insights?days=' + DAYS, { cache:'no-store', headers:{'x-ads-pin': u360pin()} })
    .then(function(r){ return r.json(); })
    .then(render)
    .catch(function(){ document.getElementById('body').innerHTML =
      '<div class="msg">🔴 เรียกข้อมูลไม่ได้ ลองรีเฟรชอีกครั้ง</div>'; });
}

function render(d){
  var cards = document.getElementById('cards'), body = document.getElementById('body');

  /* ยังไม่ได้ตั้งค่า — บอกให้ชัดว่าต้องทำอะไร ไม่ใช่โชว์หน้าว่าง */
  if(d.setupNeeded){
    cards.innerHTML = '';
    body.innerHTML = '<div class="msg"><b>ยังใช้งานไม่ได้ — ต้องตั้งค่าใน Vercel ก่อน</b>'
      + '<p style="color:var(--muted);margin-top:6px">โทเค็นต้องอยู่ฝั่ง server เท่านั้น '
      + 'ใส่ในหน้าเว็บไม่ได้เด็ดขาด ใครก็อ่านข้อมูลโฆษณาเราได้หมด</p>'
      + '<ol><li>เปิด Vercel → โปรเจค <code>under360-web</code> → Settings → Environment Variables</li>'
      + '<li>เพิ่ม <code>META_TOKEN</code> (โทเค็นจากห้อง 06)</li>'
      + '<li>เพิ่ม <code>META_AD_ACCOUNT</code> = <code>act_463330657546428</code></li>'
      + '<li>Redeploy แล้วรีเฟรชหน้านี้</li></ol></div>';
    document.getElementById('foot').textContent = '';
    return;
  }
  if(d.error){
    cards.innerHTML = '';
    body.innerHTML = '<div class="msg">🔴 ' + esc(d.error) + '</div>';
    document.getElementById('foot').textContent = '';
    return;
  }

  var t = d.totals || {}, o = d.orders || {};
  var diff = (t.today||0) - (t.yesterday||0);
  var cpo = (o.matched && t.spend) ? (t.spend / o.matched) : null;

  cards.innerHTML = ''
    + card('ใช้ไปวันนี้', baht(t.today),
        (t.yesterday!=null ? (diff>=0?'<span class="up">▲ '+baht(Math.abs(diff))+'</span>':'<span class="down">▼ '+baht(Math.abs(diff))+'</span>') + ' เทียบเมื่อวาน ('+baht(t.yesterday)+')' : ''))
    + card('ใช้ทั้งช่วง', baht(t.spend), d.since + ' → ' + d.until)
    + card('คลิกทั้งช่วง', Number(t.clicks||0).toLocaleString('th-TH'), '')
    + card('ต่อ 1 ออเดอร์จริง', cpo!=null ? baht(cpo) : '—',
        o.matched ? (o.matched + ' ออเดอร์จากแอด · ยอด ' + baht(o.revenue)) : 'ยังไม่มีออเดอร์จากแอดในช่วงนี้ (ออเดอร์จากช่องทางอื่นไม่นับ)', true);

  if(!d.ads || !d.ads.length){
    body.innerHTML = '<div class="msg">ช่วงนี้ยังไม่มีแอดที่ใช้เงิน</div>';
  } else {
    body.innerHTML = '<div class="tblwrap"><table><thead><tr>'
      + '<th>ชิ้นงาน</th><th>ใช้เงิน</th><th>คนเห็น</th><th>เห็นซ้ำ</th>'
      + '<th>คลิก</th><th>ต่อคลิก</th><th>CTR</th><th>ออเดอร์</th><th>ต่อออเดอร์</th>'
      + '</tr></thead><tbody>'
      + d.ads.map(function(a){
          var bad = a.flags && a.flags.length;
          return '<tr class="'+(bad?'bad':'')+'">'
            + '<td>' + esc(a.ad)
              + (a.campaign ? '<div style="font-size:.82rem;color:var(--muted)">' + esc(a.campaign) + '</div>' : '')
              + (bad ? a.flags.map(function(f){return '<span class="flag">'+esc(f)+'</span>';}).join('') : '')
            + '</td>'
            + '<td>' + baht(a.spend) + '</td>'
            + '<td>' + Number(a.reach||0).toLocaleString('th-TH') + '</td>'
            + '<td>' + (a.frequency||0).toFixed(2) + '</td>'
            + '<td>' + Number(a.clicks||0).toLocaleString('th-TH') + '</td>'
            + '<td>' + baht(a.cpc) + '</td>'
            + '<td>' + (a.ctr||0).toFixed(2) + '%</td>'
            + '<td>' + (a.orders || 0) + '</td>'
            + '<td>' + (a.costPerOrder!=null ? '<span class="win">'+baht(a.costPerOrder)+'</span>' : '—') + '</td>'
            + '</tr>';
        }).join('')
      + '</tbody></table></div>';
  }

  document.getElementById('foot').textContent =
    'อัปเดตเมื่อ ' + new Date(d.updatedAt).toLocaleString('th-TH', {timeZone:'Asia/Bangkok'})
    + ' · เวลาไทย · ช่วง ' + d.since + ' → ' + d.until;
}

function card(k, v, s, hero){
  return '<div class="card' + (hero?' hero':'') + '"><div class="k">' + esc(k) + '</div>'
       + '<div class="v">' + v + '</div>'
       + (s ? '<div class="s">' + s + '</div>' : '') + '</div>';
}

renderRanges();
/* รอปลดล็อกก่อนค่อยโหลด — ยิงก่อนมีรหัสจะได้ 401 แล้วหน้าค้างที่คำว่า locked
   ถ้าปลดไปแล้วตั้งแต่ครั้งก่อน (จำรหัสไว้) ประตูจะถูกถอดก่อนบรรทัดนี้ทำงาน เลยโหลดได้เลย */
if (document.getElementById('adsgate')) document.addEventListener('u360-unlocked', load);
else load();
setInterval(load, 5 * 60 * 1000);   /* Meta หน่วง 15 นาทีอยู่แล้ว รีเฟรชถี่กว่านี้ไม่มีประโยชน์ */
/* u360-watchdog-card — โชว์รายงานล่าสุดของยามเฝ้าแอด
   โหลดหลังปลดล็อกเท่านั้น เหมือนตัวเลขแอด */
function loadWatchdog(){
  var SBU='https://zdartbvhbvqlwzwyyiia.supabase.co/rest/v1/session_messages'
        + '?select=created_at,text&sender=eq.' + encodeURIComponent('ยามเฝ้าแอด')
        + '&order=created_at.desc&limit=1';
  var k='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpkYXJ0YnZoYnZxbHd6d3l5aWlhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE4MTY3OTksImV4cCI6MjA5NzM5Mjc5OX0.D41YGH-CuWrVFqcAgXEuhfVTxJ7WY26Xu-PeXBF6LB8';
  fetch(SBU,{headers:{apikey:k,Authorization:'Bearer '+k}})
    .then(function(r){ return r.ok ? r.json() : []; })
    .then(function(rows){
      if(!rows || !rows.length) return;
      var m=rows[0], box=document.getElementById('wd');
      /* textContent ไม่ใช่ innerHTML — ข้อความมาจากห้องอื่น ห้ามให้กลายเป็นโค้ดในหน้าเรา */
      /* ตัด ** ของ markdown กับ ✅ นำหน้าออก — ใช้ split/join ไม่ใช้ regex
         (regex ในสคริปต์ที่เขียนผ่าน shell โดน backslash หายมาแล้ว 3 รอบวันนี้) */
      document.getElementById('wdtext').textContent =
        String(m.text||'').split('**').join('').replace('✅ ','').trim();
      var d=new Date(m.created_at);
      document.getElementById('wdtime').textContent =
        'อัปเดต ' + d.toLocaleString('th-TH',{timeZone:'Asia/Bangkok',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
      box.removeAttribute('hidden');
    })
    .catch(function(){});
}
if (document.getElementById('adsgate')) document.addEventListener('u360-unlocked', loadWatchdog);
else loadWatchdog();

</script>
</body>
</html>
