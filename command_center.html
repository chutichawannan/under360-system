<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Under360 — Command Center</title>
<link rel="icon" href="https://under360-system.vercel.app/favicon.jpg">
<!-- 📱 ติดหน้าโฮมเป็นแอป (นัทขอ 13 ส.ค. 2569)
     iPhone: Safari → แชร์ → "เพิ่มไปยังหน้าจอโฮม" → เปิดแล้วเต็มจอ ไม่มีแถบเบราว์เซอร์
     ⚠️ apple-touch-icon ต้องเป็น PNG — ของเดิมชี้ favicon.jpg ซึ่ง iOS ไม่รับ
        แล้วมันจะไปจับภาพหน้าจอมาทำไอคอนแทน (ได้ไอคอนเบลอๆ อ่านไม่ออก)
     ⚠️ ไม่ผูก service worker ที่นี่ — ตัวที่มีอยู่คุมแค่ /pwa/ โดยตั้งใจ (กันไปคุมหน้าลูกค้า)
        iOS ไม่ต้องมี SW ก็ติดหน้าโฮมได้ -->
<link rel="manifest" href="/pwa/manifest-cc.webmanifest">
<meta name="theme-color" content="#1F4D3A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Under360">
<link rel="apple-touch-icon" href="/pwa/icon-192.png">
<link rel="apple-touch-icon" sizes="192x192" href="/pwa/icon-192.png">
<link rel="apple-touch-icon" sizes="512x512" href="/pwa/icon-512.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{
    --ink:#14201B; --soft:#5F6B64; --faint:#9AA5A0; --line:#E7EAE7;
    --bg:#F4F6F3; --card:#FFFFFF; --nut:#1F4D3A; --nut2:#2E6B50; --nutl:#E8F0EC;
    --gold:#C69A3A; --idle:#9CA3AF; --work:#16A34A; --block:#DC2626; --warn:#D97706;
    --radius:16px;
  }
  html,body{height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans Thai",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5}
  #app{min-height:100dvh}
  .page{display:none;min-height:100dvh}
  .page.on{display:block}
  .wrap{max-width:1600px;margin:0 auto}
  #pgChat .wrap,#pgList .wrap{max-width:860px}
  /* หน้าแรก = ลิงก์ล้วน → คอลัมน์เดียว กลางจอเสมอ
     เดิมใช้ column-count:3 (ทำไว้สำหรับการ์ดแดชบอร์ด) พอหน้าแรกเหลือแต่ลิงก์
     มันเลยหั่นกลุ่มลิงก์กระจายคนละคอลัมน์ = อ่านไม่รู้เรื่องบนจอคอม */
  #pgHome .body{max-width:620px;margin:0 auto}
  #homeCards{column-count:1}
  /* แดชบอร์ด = การ์ดเยอะ → จอกว้างค่อยจัด 3 คอลัมน์เหมือนเดิม */
  #dashCards{column-count:3;column-gap:16px}
  #dashCards .card{margin-bottom:16px;break-inside:avoid;-webkit-column-break-inside:avoid}
  .span-all{column-span:all;-webkit-column-span:all}
  #chatMsgs{max-width:860px;margin:0 auto;width:100%}
  @media(max-width:1200px){ #dashCards{column-count:2} }
  @media(max-width:820px){ .wrap{max-width:100%} #dashCards{column-count:1} }

  /* top bar */
  .top{position:sticky;top:0;z-index:20;background:var(--nut);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 18px 12px;display:flex;align-items:center;gap:12px}
  .top .bk{background:rgba(255,255,255,.16);border:none;color:#fff;width:34px;height:34px;border-radius:10px;font-size:19px;cursor:pointer;flex-shrink:0}
  .top .tt{flex:1;min-width:0}
  .top .tt b{font-size:17px;font-weight:800;display:block;letter-spacing:.2px}
  .top .tt .s{font-size:11.5px;opacity:.8}
  .top .rf{background:rgba(255,255,255,.16);border:none;color:#fff;width:34px;height:34px;border-radius:10px;font-size:16px;cursor:pointer;flex-shrink:0}
  .top .clk{font-size:12.5px;font-weight:700;background:rgba(255,255,255,.16);padding:6px 10px;border-radius:9px;white-space:nowrap;flex-shrink:0;font-variant-numeric:tabular-nums;letter-spacing:.2px}

  .body{padding:14px 14px calc(28px + env(safe-area-inset-bottom))}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:13px;box-shadow:0 1px 2px rgba(20,32,27,.03)}
  .card>h3{font-size:12px;font-weight:800;color:var(--nut);letter-spacing:.06em;text-transform:uppercase;margin-bottom:12px;display:flex;align-items:center;gap:7px}
  .card>h3 .r{margin-left:auto;font-size:11px;font-weight:600;color:var(--faint);text-transform:none;letter-spacing:0}

  /* business hero */
  .biz-top{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}
  .biz-main{flex:1;min-width:150px}
  .biz-lbl{font-size:12px;color:var(--soft)}
  .biz-num{font-size:34px;font-weight:800;color:var(--nut);line-height:1.05;letter-spacing:-.5px}
  .biz-cmp{font-size:12.5px;margin-top:3px}
  .up{color:var(--work)} .down{color:var(--block)}
  .biz-side{display:flex;gap:18px}
  .stat .v{font-size:22px;font-weight:800;color:var(--ink)}
  .stat .k{font-size:11px;color:var(--faint)}
  .spark{margin-top:14px}
  .fresh{margin-top:12px;font-size:12px;padding:8px 11px;border-radius:10px;display:flex;align-items:center;gap:7px}
  .fresh.ok{background:#EAF6EF;color:#166534} .fresh.bad{background:#FEF2F2;color:#991B1B}

  /* action list */
  .act{display:flex;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
  .act:first-of-type{border-top:none;padding-top:2px}
  .act .n{width:22px;height:22px;border-radius:50%;background:var(--nutl);color:var(--nut);font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
  .act .x{flex:1;font-size:14px}
  .act .x .sub{font-size:12px;color:var(--faint);margin-top:1px}

  /* routine */
  .rj{display:flex;align-items:flex-start;gap:11px;padding:11px 0;border-top:1px solid var(--line);cursor:pointer}
  .rj:first-of-type{border-top:none;padding-top:2px}
  .rj .ck{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;transition:.12s}
  .rj.done .ck{background:var(--work);border-color:var(--work)}
  .rj.due .ck{border-color:var(--block)}
  .rj .rx{flex:1;min-width:0}
  .rj .rt{font-size:14.5px;font-weight:600}
  .rj.done .rt{color:var(--faint);text-decoration:line-through;font-weight:500}
  .rj .rs{font-size:12px;margin-top:1px}
  .rj .rs.due{color:var(--block);font-weight:600} .rj .rs.okc{color:var(--work)}
  .badge-auto{font-size:10px;font-weight:700;background:#EEF2FF;color:#4F46E5;padding:1px 6px;border-radius:6px;margin-left:6px;vertical-align:1px}
  .badge-wk{font-size:10px;font-weight:700;background:#FEF3C7;color:#92400E;padding:1px 6px;border-radius:6px;margin-left:6px;vertical-align:1px}
  .complink{margin:6px 0 2px;display:flex;gap:7px}
  .complink input{flex:1;border:1px solid var(--line);border-radius:9px;padding:8px 11px;font-family:inherit;font-size:13px;outline:none}
  .complink input:focus{border-color:var(--nut)}
  .complink button{background:var(--nut);color:#fff;border:none;border-radius:9px;padding:0 13px;font-weight:700;font-size:13px;cursor:pointer}

  /* progress */
  .ring-row{display:flex;align-items:center;gap:16px;margin-bottom:6px}
  .ring{flex-shrink:0}
  .prow{margin-bottom:9px}
  .prow:last-child{margin-bottom:0}
  .prow .pl{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px}
  .prow .pl b{font-weight:700}
  .bar{height:7px;background:#EEF1EE;border-radius:5px;overflow:hidden}
  .bar>i{display:block;height:100%;background:var(--nut);border-radius:5px}

  /* bar chart (hover ขึ้นยอด) */
  .bars{display:flex;align-items:flex-end;gap:8px;height:104px;padding-top:24px}
  .barcol{flex:1;height:100%;display:flex;flex-direction:column;align-items:center;min-width:0;cursor:default}
  .bwrap{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center;position:relative}
  .bwrap>i{width:78%;max-width:40px;min-height:3px;background:linear-gradient(180deg,#2E6B4F,#1F4D3A);border-radius:5px 5px 0 0;transition:.15s}
  .barcol:hover .bwrap>i{background:linear-gradient(180deg,#41946E,#2E6B4F)}
  .btip{position:absolute;bottom:calc(100% + 5px);left:50%;transform:translateX(-50%) translateY(4px);background:#111827;color:#fff;font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px;white-space:nowrap;opacity:0;pointer-events:none;transition:.12s;z-index:6;box-shadow:0 4px 12px rgba(0,0,0,.22)}
  .btip:after{content:'';position:absolute;top:100%;left:50%;transform:translateX(-50%);border:5px solid transparent;border-top-color:#111827}
  .barcol:hover .btip{opacity:1;transform:translateX(-50%) translateY(0)}
  .blab{font-size:10.5px;color:var(--faint);margin-top:6px;white-space:nowrap}

  /* team grid */
  .team{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .tc{border:1px solid var(--line);border-radius:12px;padding:10px 11px;cursor:pointer;transition:background .12s}
  .tc:active{background:#F3F4F6}
  .tc .th{display:flex;align-items:center;gap:7px}
  .tc .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
  .tc .tn{font-weight:700;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tc .ts{font-size:11px;color:var(--faint);margin-top:4px;line-height:1.35;height:29px;overflow:hidden}

  /* แถบหมวด ครัว/แอดมิน/อื่นๆ — เต็มความกว้าง แบ่ง 3 ช่องเท่ากัน (นัทสั่ง 12 ส.ค.) */
  .tabbar{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;width:100%;
    background:#E7EBE8;border-radius:14px;padding:5px;margin-bottom:16px}
  .tab{width:100%;border:none;background:transparent;font-family:inherit;font-size:15px;font-weight:700;
    color:#6B7280;padding:11px 4px;border-radius:10px;cursor:pointer;transition:.15s;-webkit-tap-highlight-color:transparent}
  .tab.on{background:#fff;color:var(--nut);box-shadow:0 1px 3px rgba(0,0,0,.12)}

  /* การ์ดลิงก์ — ไอคอนเส้นในกรอบมน · ชื่อกับคำอธิบายคนละบรรทัด */
  .lnk{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);
    border-radius:14px;padding:13px 14px;margin-bottom:9px;text-decoration:none;color:var(--ink);
    font-size:15px;font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .lnk:active{background:#F6F8F6}
  .lnk .ic{width:38px;height:38px;flex-shrink:0;border:1px solid var(--line);border-radius:11px;
    display:flex;align-items:center;justify-content:center;color:var(--nut);background:#FAFBFA}
  .lnk .ic svg{width:20px;height:20px}
  .lnk .lt{display:flex;flex-direction:column;min-width:0;line-height:1.3}
  .lnk .ld{font-size:11.5px;color:var(--faint);font-weight:400;margin-top:2px}
  .lnk .arw{margin-left:auto;color:#C3CBC5;font-size:20px;flex-shrink:0}
  .dgrp{font-size:11px;font-weight:700;color:var(--faint);margin:14px 2px 7px;letter-spacing:.3px}
  .cctxt{font-size:13.5px;white-space:pre-wrap;line-height:1.6;color:var(--ink)}
  .cct{font-size:11px;color:var(--faint);margin-top:8px}

  /* big chat button */
  .chatbtn{width:100%;background:var(--nut);color:#fff;border:none;border-radius:var(--radius);padding:15px;font-size:15.5px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:9px;margin-bottom:13px}
  .chatbtn .cb-badge{background:#fff;color:var(--nut);border-radius:10px;font-size:12px;padding:1px 8px}

  /* แถบนำทาง 2 ปุ่มบนหน้าแรก — แดชบอร์ด / แชททีม (11 ส.ค. · หน้าแรกเหลือแต่ลิงก์) */
  .navrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
  .navbtn{position:relative;background:var(--nut);color:#fff;border:none;border-radius:var(--radius);
    padding:13px 12px;font-size:15px;font-weight:800;cursor:pointer;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:3px;line-height:1.25;min-height:64px;font-family:inherit}
  .navbtn:active{opacity:.85}
  .navbtn .nsub{font-size:11px;font-weight:500;opacity:.85}
  .navbtn .cb-badge{position:absolute;top:7px;right:9px;background:#fff;color:var(--nut);border-radius:10px;font-size:11px;font-weight:800;padding:1px 7px}

  /* chat list */
  .room{display:flex;align-items:flex-start;gap:11px;padding:13px 15px;border-bottom:1px solid var(--line);cursor:pointer;background:var(--card)}
  .room:active{background:#F3F4F6}
  .room .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;margin-top:6px}
  .room-b{flex:1;min-width:0}
  .room-t{display:flex;align-items:center;gap:6px}
  .room-n{font-weight:700;font-size:15px}
  .badge{background:var(--nut);color:#fff;font-size:11px;font-weight:700;min-width:19px;height:19px;border-radius:10px;display:flex;align-items:center;justify-content:center;padding:0 5px;margin-left:auto}
  .room-d{font-size:12.5px;color:var(--soft)}
  .room-s{font-size:12px;color:var(--faint);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .grp{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);padding:14px 15px 6px}

  /* chat */
  #chatMsgs{padding:16px;display:flex;flex-direction:column;gap:10px;min-height:calc(100dvh - 190px)}
  .m{max-width:82%;padding:9px 13px;border-radius:15px;font-size:14.5px;word-wrap:break-word;white-space:pre-wrap}
  .m .who{font-size:11px;font-weight:700;opacity:.7;margin-bottom:2px}
  .m .t{font-size:10px;opacity:.5;margin-top:3px;text-align:right}
  .m.nut{align-self:flex-end;background:var(--nut);color:#fff;border-bottom-right-radius:5px}
  .m.claude{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:5px}
  .m.system{align-self:center;background:#FEF3C7;color:#92400E;font-size:12.5px;max-width:92%;text-align:center;border-radius:10px}
  .compose{position:sticky;bottom:0;display:flex;gap:8px;padding:12px 14px;background:var(--card);border-top:1px solid var(--line);padding-bottom:calc(12px + env(safe-area-inset-bottom))}
  .compose textarea{flex:1;resize:none;border:1.5px solid var(--line);border-radius:14px;padding:10px 14px;font-family:inherit;font-size:14.5px;max-height:120px;outline:none}
  .compose textarea:focus{border-color:var(--nut)}
  .send{background:var(--nut);color:#fff;border:none;border-radius:14px;padding:0 20px;font-weight:700;font-size:14.5px;cursor:pointer}
  .banner{background:#FEF2F2;color:#991B1B;font-size:13px;padding:10px 16px;text-align:center}
  .muted{color:var(--faint);font-size:13px}
</style>
</head>
<body>
<div id="app">

  <!-- ===== HOME (Dashboard) ===== -->
  <section class="page on" id="pgHome">
    <div class="top">
      <div class="tt"><b>Under360</b><span class="s">Command Center · หน้ารวม</span></div>
      <div class="clk" id="clk">🕐 —</div>
      <button class="rf" onclick="loadAll(true)" title="รีเฟรช">⟳</button>
    </div>
    <div class="wrap"><div class="body">
      <div id="banner"></div>
      <div class="navrow">
        <button class="navbtn" onclick="goDash()">แดชบอร์ด<span class="nsub">ส่วนตัว · ต้องใส่รหัส</span></button>
        <button class="navbtn" onclick="goChatList()">แชททีม<span class="nsub">คุยกับทุกห้อง</span><span class="cb-badge" id="cbBadge" style="display:none">0</span></button>
      </div>
      <div id="homeCards"></div>
    </div></div>
  </section>

  <!-- ===== DASHBOARD (ของเดิมที่เคยอยู่หน้าแรก — ยอดขาย/สต็อก/AI/ความคืบหน้า) ===== -->
  <section class="page" id="pgDash">
    <div class="top">
      <button class="bk" onclick="goHome()">‹</button>
      <div class="tt"><b>แดชบอร์ด</b><span class="s">ยอดขาย · สต็อก · งานวันนี้</span></div>
      <button class="rf" onclick="loadAll(true)" title="รีเฟรช">⟳</button>
    </div>
    <div class="wrap"><div class="body"><div id="dashCards"></div></div></div>
  </section>

  <!-- ===== CHAT LIST ===== -->
  <section class="page" id="pgList">
    <div class="top">
      <button class="bk" onclick="goHome()">‹</button>
      <div class="tt"><b>แชททีม</b><span class="s">12 ห้อง · แตะเพื่อคุย</span></div>
      <button class="rf" onclick="loadAll(true)">⟳</button>
    </div>
    <div class="wrap"><div id="roomList"></div></div>
  </section>

  <!-- ===== CHAT ===== -->
  <section class="page" id="pgChat">
    <div class="top">
      <button class="bk" onclick="goChatList()">‹</button>
      <span class="dot" id="cDot" style="width:10px;height:10px;border-radius:50%"></span>
      <div class="tt"><b id="cName">ห้อง</b><span class="s" id="cCur"></span></div>
    </div>
    <div class="wrap">
      <div id="chatMsgs"></div>
      <div class="compose">
        <textarea id="input" rows="1" placeholder="พิมพ์ถึงห้องนี้..." oninput="growBox(this)" onkeydown="onKey(event)"></textarea>
        <button class="send" onclick="send()">ส่ง</button>
      </div>
    </div>
  </section>

</div>

<script>
const SB_URL='https://zdartbvhbvqlwzwyyiia.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpkYXJ0YnZoYnZxbHd6d3l5aWlhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE4MTY3OTksImV4cCI6MjA5NzM5Mjc5OX0.D41YGH-CuWrVFqcAgXEuhfVTxJ7WY26Xu-PeXBF6LB8';
const sb=supabase.createClient(SB_URL,SB_KEY);
const BASE='https://under360-system.vercel.app';

const ROOMS=[
  {id:'u',      label:'U-track',   desc:'โค้ด / LIFF / DB',        color:'#2563EB', kind:'track'},
  {id:'m',      label:'M-track',   desc:'เว็บ / บล็อก / SEO',      color:'#16A34A', kind:'track'},
  {id:'a',      label:'A-track',   desc:'agents / บัญชี',         color:'#9333EA', kind:'track'},
  {id:'migrate',label:'Migrate',   desc:'Hato → DB',              color:'#EA580C', kind:'track'},
  {id:'f',      label:'F-track',   desc:'การเงิน / P&L',          color:'#0891B2', kind:'track'},
  {id:'p',      label:'P-track',   desc:'sync Hato / catalog',    color:'#7C3AED', kind:'track'},
  {id:'eath',   label:'เอิธ',      desc:'แอด / CRM / คู่แข่ง',    color:'#DB2777', kind:'agent'},
  {id:'niw',    label:'น้องนิว',   desc:'จัดเมนู Meal Plan',      color:'#65A30D', kind:'agent'},
  {id:'keng',   label:'พี่เก่ง',   desc:'จัดส่ง / Lalamove',      color:'#CA8A04', kind:'agent'},
  {id:'fah',    label:'ฟ้า',       desc:'วัตถุดิบ / ครัว',        color:'#0D9488', kind:'agent'},

// เดิมนับแต่ HT- (ผ่าน Hato) ซึ่ง ① ไม่นับยอดระบบเราเลยสักบาท
// ② ข้อมูล HT- หยุด sync ตั้งแต่ 5 ส.ค. (ห้อง P ปิด) → เลขต่ำกว่าจริงและร่วงทุกวัน
// = เปิดมาเห็นแล้วท้อ ทั้งที่ยอดจริงกำลังย้ายบ้านสำเร็จ
async function loadBiz(){
  const today=thaiDate(); const tmrw=addDays(today,1);
  const d30=addDays(today,-30), d60=addDays(today,-60);
  const OURS='order_number.like.U-%,order_number.like.MP-%';
  const isTest=n=>/test|เทส|ทดลอบ/i.test(n||'');
  try{
    /* ยอด 60 วัน กับ ออเดอร์พรุ่งนี้ ไม่เกี่ยวกัน — ยิงพร้อมกัน */
    const [q, tq] = await Promise.all([
      sb.from('orders').select('total,created_at,customer_name')
        .or(OURS).gt('total',0).neq('status','cancelled').gte('created_at',d60).limit(3000),
      sb.from('orders').select('total').eq('delivery_date',tmrw).or(OURS).neq('status','cancelled').limit(500)
    ]);
    let cur=0,prev=0,latest='';
    const daily={};
    for(const o of (q.data||[])){
      if(isTest(o.customer_name)) continue;
      const d=(o.created_at||'').slice(0,10);
      if(d>=d30){ cur+=+o.total; daily[d]=(daily[d]||0)+ +o.total; } else prev+=+o.total;
      if(o.created_at>latest)latest=o.created_at;
    }
    // แท่ง = 14 วันล่าสุด (เดิมเป็นรายเดือนยุค Hato — เปลี่ยนเป็นมองไปข้างหน้า)
    const bars=[];
    for(let i=13;i>=0;i--){ const d=addDays(today,-i);
      bars.push([d.slice(8,10)+'/'+d.slice(5,7), daily[d]||0]); }
    biz={cur,prev,latest:latest?latest.slice(0,10):'',today,bars,tmrwCount:(tq.data||[]).length,tmrwDate:tmrw};
  }catch(e){biz={err:1};}
}

function isTestOrderRow(o){
  if (String(o.source || '') === 'parallel_test') return true;
  var s = ((o.customer_name || '') + ' ' + (o.notes || '') + ' ' + (o.created_by || '')).toLowerCase();
  return /test|เทส|ทดสอบ|ทดลอบ|ทดลอง|\[parallel\]|dummy/.test(s);
}

/* ชั้น 3 — นับของที่เกิด "หลัง" สรุปล่าสุด · ยิงครั้งเดียวต่อสรุป 1 ใบ ไม่ยิงทุกครั้งที่วาดหน้า */
async function loadBriefCounts(){
  /* ล็อกอยู่ = ไม่ต้องยิงหาข้อมูลสรุปเลย — ทั้งประหยัดคำขอ และไม่มีตัวเลขค้างในหน้าให้ใครส่อง */
  if(typeof dashUnlocked==='function' && !dashUnlocked()){ briefCounts=null; briefCountsFor=null; return; }
  var b = findMarker(RE_BRIEF);
  var e = findMarker(RE_EVENING);
  var newest = (e && (!b || e.created_at > b.created_at)) ? e : b;
  if (!newest) { briefCounts = null; briefCountsFor = null; return; }
  if (briefCountsFor === newest.created_at) return;
  briefCountsFor = newest.created_at;

  var since = newest.created_at;
  /* ตัดแถวของพี่ปืนเองออก ไม่งั้นสรุปนับตัวเอง */
  var nMsgs = briefRowsAll().filter(function(m){
    return m.created_at > since && !/พี่ปืน/.test(String(m.sender || ''));
  }).length;

  var nOrders = 0, ordersOk = false;
  try{
    var r = await sb.from('orders')
      .select('order_number,customer_name,source,created_by,notes')
      .gt('created_at', since).limit(300);
    /* error ต้องโชว์ว่า "นับไม่ได้" ไม่ใช่โชว์ 0 — 0 ที่แปลว่าพัง คือของหายเงียบ */
    if (!r.error && r.data) { ordersOk = true; nOrders = r.data.filter(function(o){ return !isTestOrderRow(o); }).length; }
  }catch(err){ ordersOk = false; }

  briefCounts = { since: since, nMsgs: nMsgs, nOrders: nOrders, ordersOk: ordersOk };
  renderHome();
}

function cardBrief(){
  var b = findMarker(RE_BRIEF);
  var e = findMarker(RE_EVENING);
  /* รอบเย็นที่เก่ากว่าสรุปเช้า = ของเมื่อวาน ไม่ต้องโชว์ */
  if (e && b && e.created_at < b.created_at) e = null;

  if (!b && !e) {
    return '<div class="card"><h3>☀️ สรุปเช้า</h3>'
      + '<div class="muted">ยังไม่มีสรุปเข้ามา — พี่ปืนกวาดงานให้ตี 4 ทุกวัน<br>'
      + 'ถ้าเลยเวลานั้นมานานแล้วยังไม่มี = ตัวรันอัตโนมัติไม่ได้ทำงาน</div></div>';
  }

  var newest = (e && (!b || e.created_at > b.created_at)) ? e : b;
  var newestHrs = (Date.now() - new Date(newest.created_at).getTime()) / 3600000;
  var stale = newestHrs > BRIEF_STALE_HRS;

  var head = '', warn = '', body = '', foot = '', cnt = '';

  if (b) {
    var tb = new Date(b.created_at);
    var hb = (Date.now() - tb.getTime()) / 3600000;
    head = esc(briefWhen(tb)) + ' · ' + esc(briefAgo(hb));
    var txt = String(b.text || '').replace(/^[^\n]*DAILY BRIEF[^\n]*\n?/, '').trim();
    var lines = txt.split('\n');
    var shown = briefOpen ? txt : lines.slice(0, 14).join('\n');
    body = '<div style="white-space:pre-wrap;font-size:13px;line-height:1.65">' + esc(shown) + '</div>'
      + (lines.length > 14
          ? '<button class="lnk" style="margin-top:8px;width:100%;justify-content:center;font-weight:700" onclick="toggleBrief()">'
            + (briefOpen ? 'ย่อกลับ ▲' : 'อ่านต่อ ▼') + '</button>'
          : '');
  } else {
    head = 'ยังไม่มีรอบเช้า';
    body = '<div class="muted" style="font-size:13px">⚠️ <b>ไม่มีสรุปรอบเช้าของวันนี้</b> — มีแต่รอบเย็นด้านล่าง · ตัวรันตี 4 อาจไม่ทำงาน</div>';
  }

  if (stale) {
    warn = '<div style="background:#FEF3C7;border:1px solid #FCD34D;color:#92400E;border-radius:8px;padding:8px 10px;font-size:12px;font-weight:700;margin-bottom:8px">'
      + '⚠️ สรุปยังไม่อัปเดตวันนี้ — ใบล่าสุดเก่า ' + esc(briefAgo(newestHrs))
      + ' อย่าอ่านเป็นสถานะของวันนี้ (ตัวรันอัตโนมัติอาจไม่ทำงาน)</div>';
  }

  /* ---- ชั้น 2 · รอบเย็น (ไม่มี = ข้ามไปเลย ไม่เหลือที่ว่างค้าง) ---- */
  if (e) {
    var te = new Date(e.created_at);
    var he = (Date.now() - te.getTime()) / 3600000;
    var etxt = String(e.text || '').replace(/^[^\n]*EVENING UPDATE[^\n]*\n?/, '').trim();
    var el = etxt.split('\n');
    var eshown = briefOpen ? etxt : el.slice(0, 8).join('\n');
    foot = '<div style="border-top:1px dashed var(--line,#E5E7EB);margin-top:10px;padding-top:8px">'
      + '<div style="font-weight:700;font-size:12.5px">🌆 อัปเดตเย็น '
      + '<span style="font-weight:500;color:var(--ink-soft);font-size:11.5px">' + esc(briefWhen(te)) + ' · ' + esc(briefAgo(he)) + '</span></div>'
      + '<div style="white-space:pre-wrap;font-size:12.5px;line-height:1.6;margin-top:4px">' + esc(eshown) + '</div>'
      + (el.length > 8 && !briefOpen ? '<div class="muted" style="font-size:11.5px;margin-top:2px">… กด "อ่านต่อ" ด้านบนเพื่อดูเต็ม</div>' : '')
      + '</div>';
  }

  /* ---- ชั้น 3 · ตัวนับสด ---- */
  if (briefCounts && briefCounts.since === newest.created_at) {
    var parts = [];
    if (briefCounts.nMsgs) parts.push('ห้องพูด ' + briefCounts.nMsgs);
    if (briefCounts.ordersOk) { if (briefCounts.nOrders) parts.push('ออเดอร์ใหม่ ' + briefCounts.nOrders); }
    else parts.push('ออเดอร์ — นับไม่ได้');
    var total = briefCounts.nMsgs + (briefCounts.ordersOk ? briefCounts.nOrders : 0);
    cnt = '<div style="border-top:1px dashed var(--line,#E5E7EB);margin-top:10px;padding-top:8px;font-size:12.5px">'
      + (parts.length
          ? '🔄 <b>หลังอัปเดตล่าสุด มีความเคลื่อนไหว ' + total + ' รายการ</b>'
            + '<div class="muted" style="font-size:11.5px;margin-top:2px">' + esc(parts.join(' · ')) + '</div>'
          : '<span class="muted">🔄 หลังอัปเดตล่าสุด ยังไม่มีความเคลื่อนไหว</span>')
      + '</div>';
  }

  return '<div class="card"><h3>☀️ สรุปเช้า '
    + '<span style="font-weight:500;color:var(--ink-soft);font-size:12px">' + head + '</span></h3>'
    + warn + body + foot + cnt
    + '</div>';
}

/* ── 🔒 โซนผู้บริหาร บนหน้าแรก (นัทสั่งเอง 17 ส.ค. 2569) ──────────────────────
   "สรุปประจำวันมันเป็นเรื่องส่วนตัวที่อยู่หลังบ้านชั้นลึกสุดที่เป็นฝั่งของผู้บริหาร

      ถ้าต้องคุมจริงต้องเป็น Google login + allowlist อีเมล + RLS ฝั่ง Supabase (งานใหญ่กว่านี้)
   ➕ อยากลากหมวดอื่นเข้ามาอีก: เติมชื่อฟังก์ชันการ์ดใน BOSS_CARDS พอ ไม่ต้องแก้ที่อื่น */
var BOSS_CARDS = ['cardBrief'];      // การ์ดที่เห็นเฉพาะผู้บริหาร — เพิ่มชื่อฟังก์ชันได้เลย

function bossHtml(){

  BOSS_CARDS.forEach(function(fn){

}

    <div class="biz-top">
      <div class="biz-main">

        <div class="biz-num">${baht(biz.cur)}</div>
        <div class="biz-cmp">${cmp}</div>
      </div>
      <div class="biz-side">
        <div class="stat"><div class="v">${baht(w1)}</div><div class="k">7 วันล่าสุด</div></div>

      </div>

function thDisp(ymd){if(!ymd)return '-';const[a,b,c]=ymd.split('-');return `${+c} ${['','ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'][+b]}`;}
function barsChart(data){
  const max=Math.max(...data.map(d=>d[1]))||1;
  return '<div class="bars">'+data.map(([lab,v])=>{
    const pct=Math.max(5,Math.round(v/max*100));
    return `<div class="barcol"><div class="bwrap"><span class="btip">${baht(v)}</span><i style="height:${pct}%"></i></div><span class="blab">${lab}</span></div>`;
  }).join('')+'</div>';
}
function tickClock(){
  const el=document.getElementById('clk'); if(!el)return;
  const now=new Date();
  const t=now.toLocaleTimeString('th-TH',{timeZone:'Asia/Bangkok',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
  const d=now.toLocaleDateString('th-TH',{timeZone:'Asia/Bangkok',weekday:'short',day:'numeric',month:'short'});
  el.textContent='🕐 '+t+' · '+d+' (ไทย)';
}
setInterval(tickClock,1000); tickClock();
function sparkline(vals,labels){
  const w=612,h=64,pad=6,max=Math.max(...vals),min=Math.min(...vals);
  const rng=max-min||1;
  const pts=vals.map((v,i)=>{const x=pad+i*(w-2*pad)/(vals.length-1);const y=h-pad-(v-min)/rng*(h-2*pad);return[x,y];});
  const path=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=`M${pts[0][0].toFixed(1)} ${h-pad} `+pts.map(p=>'L'+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ')+` L${pts[pts.length-1][0].toFixed(1)} ${h-pad} Z`;
  const last=pts[pts.length-1];
  const lab=labels.map((l,i)=>`<span style="flex:1;text-align:${i===0?'left':i===labels.length-1?'right':'center'}">${l}</span>`).join('');
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:64px;display:block"><path d="${area}" fill="rgba(31,77,58,.08)"/><path d="${path}" fill="none" stroke="#1F4D3A" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="4" fill="#1F4D3A"/></svg>
  <div style="display:flex;font-size:10.5px;color:var(--faint);margin-top:3px">${lab}</div>`;
}

function cardRoutine(){
  const dow=new Date(biz.today+'T00:00:00Z').getUTCDay();
  let rows='';
  for(const j of ROUTINE){
    let done=false,status='',scls='';
    if(j.auto==='fresh'){ done = biz.latest && biz.latest>=addDays(biz.today,-1); status=done?('sync ล่าสุด '+thDisp(biz.latest)):'ข้อมูลค้าง — ยังไม่ sync'; scls=done?'okc':'due'; }
    else if(j.auto==='tmrw'){ done = rdone[j.key]===biz.today; status=`มี ${biz.tmrwCount} ออเดอร์พรุ่งนี้`+(done?' · ดูแล้ว':''); scls=done?'okc':''; }
    else { done = j.weekly? (rdone[j.key] && weekOf(rdone[j.key])===weekOf(biz.today)) : rdone[j.key]===biz.today;
      status = done?'ทำแล้ว':(j.weekly?'สัปดาห์นี้ยังไม่ได้ทำ':'ยังไม่ได้ทำวันนี้'); scls=done?'okc':(j.weekly?'':'due'); }
    const due = !done && j.auto!=='tmrw';
    rows+=`<div class="rj ${done?'done':''} ${due?'due':''}" onclick="toggleR('${j.key}',${!!j.auto})">
      <div class="ck">${done?'✓':''}</div>
      <div class="rx"><div class="rt">${j.ic} ${esc(j.t)}${j.auto?'<span class="badge-auto">auto</span>':''}${j.weekly?'<span class="badge-wk">รายสัปดาห์</span>':''}</div>
        <div class="rs ${scls}">${esc(status)}</div>
        ${j.link?`<div class="complink" onclick="event.stopPropagation()"><input id="clink" placeholder="วางลิงก์โพสต์คู่แข่ง/IG..."><button onclick="sendComp()">ส่งเอิธ</button></div>`:''}
      </div></div>`;
  }
  const doneN=ROUTINE.filter(j=>{
    if(j.auto==='fresh')return biz.latest&&biz.latest>=addDays(biz.today,-1);
    if(j.weekly)return rdone[j.key]&&weekOf(rdone[j.key])===weekOf(biz.today);
    return rdone[j.key]===biz.today;
  }).length;
  return `<div class="card"><h3>✅ วันนี้ต้องทำ <span class="r">${doneN}/${ROUTINE.length}</span></h3>${rows}</div>`;
}
function weekOf(ymd){const d=new Date(ymd+'T00:00:00Z');const on=(d.getUTCDay()+6)%7;d.setUTCDate(d.getUTCDate()-on);return d.toISOString().slice(0,10);}
function toggleR(key,isAuto){
  const j=ROUTINE.find(x=>x.key===key);
  if(j&&j.auto==='fresh'){toast('อันนี้ระบบเช็คเอง');return;}
  if(rdone[key]===biz.today||(j.weekly&&rdone[key]&&weekOf(rdone[key])===weekOf(biz.today))) delete rdone[key];
  else rdone[key]=biz.today;
  localStorage.setItem('cc_routine',JSON.stringify(rdone)); renderDash();
}
async function sendComp(){
  const el=document.getElementById('clink'); const v=(el.value||'').trim(); if(!v)return;
  el.value='';
  await sb.from('session_messages').insert({room:'eath',sender:'nut',role:'nut',text:'[คู่แข่ง/IG วันนี้] '+v});
  rdone['compet']=biz.today; localStorage.setItem('cc_routine',JSON.stringify(rdone));
  toast('ส่งให้เอิธแล้ว'); renderDash();
}

function cardAction(){
  const blocked=ROOMS.filter(r=>statusMap[r.id]&&statusMap[r.id].status==='blocked');
  if(!blocked.length) return '';
  let rows=''; let i=1;
  for(const r of blocked){ rows+=`<div class="act"><div class="n">${i++}</div><div class="x">${esc(RMAP[r.id].label)} ค้าง<div class="sub">${esc(statusMap[r.id].current||'')}</div></div></div>`; }
  return `<div class="card"><h3>🎯 ต้องปลดล็อก (${blocked.length})</h3>${rows}</div>`;
}

function cardTeam(){
  let cells='';
  for(const r of ROOMS){

/* ============================================================================
 * 🤖 น้องนิว — logic การ์ด "เมนูพิเศษอย่าให้ทำเหลือ"  (ฉบับ client-side)
 * ----------------------------------------------------------------------------
 * ส่งให้ CC แปะใน command_center.html · รับ supabase client → คืน {cards, blockers}
 *
 * ⚠️⚠️ สูตรนี้มี 2 ที่ — แก้ต้องแก้ทั้งคู่ ⚠️⚠️
 *     ตัวอ้างอิงจริง = scripts/niw/weekly_special_watch.mjs  (CLI · เจ้าของ = ห้องนิว)
 *     ตัวนี้         = สำเนาสำหรับหน้าเว็บ
 *     สเปคเต็ม       = scripts/niw/CARD_SPEC.md
 *
 * โมเดลข้อมูล (verify กับ origin/main แล้ว 5 ส.ค. 2026):
 *   menu_items.actual_stock = "ผลิตได้จริง" ครัวกรอกใน KQ  → ผลิต
 *   menu_items.stock_total  = เลขขายได้ · RPC adjust_stock ตัดตอนลูกค้าสั่ง → เหลือ
 *   ⚠️ kitchen_queue.html:582 ตั้ง stock_total ให้ "เฉพาะเมนูที่ไม่ใช่ null"
 *      → เมนูที่เป็น null ครัวกรอกไปก็ไม่มีผล ต้องตั้งเลขในแท็บ "ตั้งสต็อค" ก่อน 1 ครั้ง
 *
 * ⏰ ยึดเวลาไทยเสมอ (นัทอยู่ PST — คำนวณจากเครื่องจะเพี้ยน 1 วัน)
 * 🔒 read-only — ไม่เขียน DB
 * ==========================================================================*/

const NIW_HISTORY_WEEKS = 8;   // ย้อนหลังกี่สัปดาห์ (งาน ก)
const NIW_SAFETY = 1.10;       // เผื่อ 10% ตอนแนะจำนวนผลิต

/* ── เวลาไทย ─────────────────────────────────────────── */
function niwBkkNow() {
  return new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Bangkok' }));
}
function niwYmd(d) {
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function niwAddDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }

/** สัปดาห์ไทย จันทร์→อาทิตย์ */
function niwWeekRange(ref) {
  const dow = ref.getDay();                  // 0=อาทิตย์
  const back = dow === 0 ? 6 : dow - 1;
  const mon = niwAddDays(ref, -back);
  return { start: niwYmd(mon), end: niwYmd(niwAddDays(mon, 6)), monday: mon };
}

/** ดึงรายการขาย (paginate เสมอ — บทเรียน 1000-cap) */
async function niwSalesRows(sb, codes, startDate, endDate) {
  if (!codes.length) return [];
  const out = [];
  const PAGE = 1000;
  for (let from = 0; ; from += PAGE) {
    const { data, error } = await sb
      .from('order_items')
      .select('menu_code,quantity,orders!inner(delivery_date,status,source)')
      .in('menu_code', codes)
      .gte('orders.delivery_date', startDate)
      .lte('orders.delivery_date', endDate)
      .not('orders.status', 'in', '("cancelled","canceled")')
      .not('orders.source', 'in', '("parallel_test")')
      .range(from, from + PAGE - 1);
    if (error) throw error;
    out.push(...(data || []));
    if (!data || data.length < PAGE) break;
  }
  return out;
}

function niwTally(rows) {
  const t = {};
  for (const r of rows) t[r.menu_code] = (t[r.menu_code] || 0) + (Number(r.quantity) || 0);
  return t;
}

/** รวมยอดแยกรายสัปดาห์ — เมนูพิเศษหมุนเวียน ห้ามหารด้วยจำนวนสัปดาห์ทั้งหมด */
function niwTallyByWeek(rows) {
  const t = {};
  for (const r of rows) {
    const dd = r.orders && r.orders.delivery_date;
    if (!dd) continue;
    const p = dd.split('-').map(Number);
    const wkKey = niwWeekRange(new Date(p[0], p[1] - 1, p[2])).start;
    if (!t[r.menu_code]) t[r.menu_code] = {};
    t[r.menu_code][wkKey] = (t[r.menu_code][wkKey] || 0) + (Number(r.quantity) || 0);
  }
  return t;
}

/**
 * 🤖 หลัก — เรียกตัวนี้ตัวเดียว
 * @param {object} sb       supabase client
 * @param {object} [opt]    { mode: 'special' | 'stocked' }
 *                          special = เฉพาะ is_weekly_special (ค่าเริ่มต้น)
 *                          stocked = ทุกเมนูที่ตั้งสต็อกไว้ (ใช้ตอน flag เมนูพิเศษยังไม่มีใคร maintain)
 * @returns {Promise<{weekThai,dayOfWeek,daysLeft,watchedCount,cards,blockers}>}
 */
async function niwWeeklySpecialWatch(sb, opt) {
  const mode = (opt && opt.mode) || 'special';
  const now = niwBkkNow();
  const wk = niwWeekRange(now);
  const dayIdx = now.getDay() === 0 ? 7 : now.getDay();   // จ=1 .. อา=7
  const daysLeft = 7 - dayIdx;
  const pace = dayIdx / 7;

  let q = sb.from('menu_items')
    .select('id,code,name,price,actual_stock,stock_total,is_available,is_weekly_special')
    .order('code');
  q = mode === 'stocked'
    ? q.not('stock_total', 'is', null).eq('is_available', true)
    : q.eq('is_weekly_special', true);
  const { data: menus, error } = await q;
  if (error) throw error;

  const list = menus || [];
  const codes = list.map(m => m.code);

  /* ยอดขายสัปดาห์นี้ กับ ย้อนหลัง ไม่เกี่ยวกัน — ยิงพร้อมกัน (เดิมต่อคิว = ช้าเป็น 2 เท่า) */
  const histStart = niwYmd(niwAddDays(wk.monday, -7 * NIW_HISTORY_WEEKS));
  const histEnd = niwYmd(niwAddDays(wk.monday, -1));
  const [rowsWk, rowsHist] = await Promise.all([
    niwSalesRows(sb, codes, wk.start, wk.end),
    niwSalesRows(sb, codes, histStart, histEnd)
  ]);
  const soldThisWeek = niwTally(rowsWk);
  const histByWeek = niwTallyByWeek(rowsHist);

  const cards = [], blockers = [];

  for (const m of list) {
    const sold = soldThisWeek[m.code] || 0;
    const produced = m.actual_stock;
    const left = m.stock_total;

    /* ── งาน ก: แนะจำนวนผลิตรอบหน้า ──
       median (ไม่ใช่ mean) เฉพาะสัปดาห์ที่ขายจริง
       เหตุผล: A2 มีสัปดาห์เดียวขาย 28 (ปกติ 2-8) → mean ดันให้แนะผลิตเกิน = ผิดเป้า "อย่าให้เหลือ" */
    const wkMap = histByWeek[m.code] || {};
    const activeWeeks = Object.keys(wkMap).sort().map(k => [k, wkMap[k]]);
    const qtys = activeWeeks.map(x => x[1]);
    const sorted = qtys.slice().sort((a, b) => a - b);
    const histAvg = sorted.length
      ? (sorted.length % 2
          ? sorted[(sorted.length - 1) / 2]
          : Math.round((sorted[sorted.length / 2 - 1] + sorted[sorted.length / 2]) / 2))
      : 0;
    const lastWeekQty = qtys.length ? qtys[qtys.length - 1] : 0;
    const base = lastWeekQty > histAvg ? Math.ceil((histAvg + lastWeekQty) / 2) : histAvg;
    const suggestNextWeek = base > 0 ? Math.ceil(base * NIW_SAFETY) : null;
    const histNote = qtys.length
      ? 'ขายจริง ' + qtys.length + ' สัปดาห์ (จากย้อนหลัง ' + NIW_HISTORY_WEEKS + ') · ' +
        activeWeeks.map(x => x[0].slice(5) + '=' + x[1]).join(' · ')
      : 'ไม่เคยขายเลยใน ' + NIW_HISTORY_WEEKS + ' สัปดาห์ย้อนหลัง (เมนูใหม่?)';

    const common = {
      code: m.code, name: m.name, soldThisWeek: sold,
      histAvgPerWeek: histAvg, suggestNextWeek, histNote,
    };

    // reason แบบ 1 — ตั้ง "ไม่จำกัด" → ลูกค้าสั่งไม่ตัดสต็อก
    if (left === null || left === undefined) {
      blockers.push(Object.assign({}, common, {
        reasonType: 'no_stock_number',
        reason: 'stock_total = null (ไม่จำกัด) → ลูกค้าสั่งไม่ตัดสต็อก',
        howToFix: 'ตั้งเลขในแท็บ "ตั้งสต็อค" ของ KQ ก่อน 1 ครั้ง (ถ้าไม่ตั้ง กรอก "ผลิตได้จริง" ไปก็ไม่มีผล)',
      }));
      continue;
    }
    // reason แบบ 3 — ข้อมูลขัดกัน (เหลือ > ผลิต) เช่น A13 ผลิต 6 · stock 9
    if (produced != null && produced > 0 && left > produced) {
      blockers.push(Object.assign({}, common, {
        reasonType: 'inconsistent',
        reason: 'ข้อมูลขัดกัน — เหลือ (' + left + ') มากกว่าผลิต (' + produced + ')',
        howToFix: 'กรอก "ผลิตได้จริง" รอบใหม่ให้ตรงกับของที่ทำจริง',
      }));
      continue;
    }
    // reason แบบ 2 — ยังไม่มีใครกรอกผลิต
    if (produced == null || produced <= 0) {
      blockers.push(Object.assign({}, common, {
        reasonType: 'no_production',
        reason: 'ยังไม่มีใครกรอก "ผลิตได้จริง" ใน KQ (actual_stock = ' + produced + ')',
        howToFix: 'ครัวกรอก "ผลิตได้จริง" ใน KQ',
      }));
      continue;
    }

    /* ── งาน ข: เฝ้าระหว่างสัปดาห์ ── */
    const perDay = sold / dayIdx;
    const projectedLeft = Math.max(0, Math.round(produced - perDay * 7));
    let level = 'ok';
    if (projectedLeft >= produced * 0.30) level = 'risk';
    else if (projectedLeft >= produced * 0.15) level = 'watch';

    cards.push(Object.assign({}, common, {
      level, produced, sold, left, daysLeft,
      sellThroughPct: Math.round((sold / produced) * 100),
      targetPct: Math.round(pace * 100),
      projectedLeft,
      actions: level === 'ok' ? [] : ['ดันขึ้นหน้าแรก LIFF', 'แถมกับออเดอร์อื่น', 'ลดราคาเคลียร์'],
    }));
  }

  // เรียง: เสี่ยงสุดขึ้นก่อน
  const rank = { risk: 0, watch: 1, ok: 2 };
  cards.sort((a, b) => (rank[a.level] - rank[b.level]) || (b.projectedLeft - a.projectedLeft));

  return {
    weekThai: wk.start + ' → ' + wk.end,
    dayOfWeek: dayIdx, daysLeft,
    watchedCount: list.length,
    cards, blockers,
  };
}

    var labels={};
    var cats=(cfg.data&&cfg.data[0]&&cfg.data[0].data&&cfg.data[0].data.categories)||[];
    cats.forEach(function(c){ labels[c.key]=c.label; });
    var totBy={}; (all.data||[]).forEach(function(m){ totBy[m.category]=(totBy[m.category]||0)+1; });
    var outBy={}; (r.data||[]).forEach(function(m){ (outBy[m.category]=outBy[m.category]||[]).push(m); });
    oosData={items:r.data||[],outBy:outBy,totBy:totBy,labels:labels};
  }catch(e){ oosData=null; }
}
function cardOOS(){
  if(!oosData||!oosData.items.length) return '';
  var d=oosData;
  var whole=Object.keys(d.outBy).filter(function(k){ return d.outBy[k].length===d.totBy[k]; });
  var h='<div class="card"><h3>⛔ หมดสต็อก — ลูกค้าเห็นแต่สั่งไม่ได้ <span class="r">'+d.items.length+' เมนู</span></h3>';
  if(whole.length){
    h+='<div style="border-left:3px solid var(--r);padding-left:8px;margin-bottom:8px">'
      +'<b>🚨 หมดทั้งหมวด '+whole.length+' หมวด</b>'
      +'<div class="s">ลูกค้ากดเข้าหมวดแล้วเจอของหมดยกแผง = เสียยอดทุกวันแบบไม่มีใครรู้</div>';
    whole.forEach(function(k){
      h+='<div class="s">· <b>'+(d.labels[k]||k)+'</b> — หมด '+d.outBy[k].length+'/'+d.totBy[k]+' ('
        +d.outBy[k].map(function(m){return m.code;}).join(', ')+')</div>';
    });
    h+='</div>';
  }
  var other=Object.keys(d.outBy).filter(function(k){ return d.outBy[k].length!==d.totBy[k]; });
  other.forEach(function(k){
    h+='<div style="border-left:3px solid #e6a100;padding-left:8px;margin-bottom:6px">'
      +'<b class="s">'+(d.labels[k]||k)+'</b><div class="s">หมด '+d.outBy[k].length+'/'+d.totBy[k]+' — '
      +d.outBy[k].map(function(m){return m.code;}).join(', ')+'</div></div>';
  });
  h+='<div class="s" style="opacity:.75;margin-top:6px">แก้ที่ KQ แท็บ "ตั้งสต็อค" · ระบบตัดสต็อกอัตโนมัติตอนลูกค้าสั่ง แต่<b>ไม่มีใครเติมกลับ</b>ให้อัตโนมัติ</div>';
  return h+'</div>';
}

/* ---------- ⏰ การ์ดนับถอยหลัง cutover Hato (7 ส.ค. 2026) ---------- */
var CUTOVER_DATE='2026-08-07';
var cutHatoUrls=null;
async function loadCutover(){
  try{
    var _ab=await Promise.all([
      sb.from('home_layout').select('*').limit(200),
      sb.from('menu_items').select('code,image_urls').eq('is_available',true).limit(1000)
    ]);
    var a=_ab[0], b=_ab[1];
    var blob=JSON.stringify(a.data||[])+JSON.stringify(b.data||[]);
    var m=blob.match(/https?:\/\/[^"]*hato[^"]*/gi);
    cutHatoUrls=m?m.length:0;
  }catch(e){ cutHatoUrls=null; }
}
function cardCutover(){
  var today=thaiDate();
  var days=Math.round((new Date(CUTOVER_DATE+'T00:00:00Z')-new Date(today+'T00:00:00Z'))/86400000);
  if(days<-3) return '';
  var head=days>0?('เหลืออีก '+days+' วัน'):(days===0?'วันนี้!':'ผ่านมาแล้ว '+(-days)+' วัน');
  var h='<div class="card"><h3>⏰ ปิด Hato '+CUTOVER_DATE+' <span class="r">'+head+'</span></h3>';
  h+='<div class="s" style="margin-bottom:8px">'
    +(cutHatoUrls===0?'✅ ระบบไม่พึ่งรูป/ลิงก์จาก Hato แล้ว (สแกนสด)'
      :cutHatoUrls>0?'❌ ยังพบ '+cutHatoUrls+' URL ชี้ Hato — ต้องย้ายก่อนปิด'
      :'⏳ กำลังสแกน…')+'</div>';
  var todo=[
    ['🚨','เทสสั่งจริง 1 ใบบนมือถือ','พิสูจน์ว่า LIFF 360 รับงานได้ก่อนโยนลูกค้าทั้งหมดมา'],
    ['🚨','ย้ายริชเมนู LINE → LIFF 360','ตอนนี้ยังชี้ Hato · ถ้าไม่ย้าย = ลูกค้า ~20,000 กดสั่งไม่ได้ทั้งร้าน'],
    ['🔑','login LINE Business ID','ปลด 3 งานพร้อมกัน: feedback routine · wave 2 · verify ริชเมนู'],
    ['📸','ถ่ายรูป Meal Plan (HP+LC) + ครัว','ตอนนี้ 0 รูป → เสียโพสต์ 2 ใบ/สัปดาห์ ทุกสัปดาห์']
  ];
  todo.forEach(function(t){
    h+='<div style="border-left:3px solid var(--r);padding-left:8px;margin-bottom:6px">'
      +'<b>'+t[0]+' '+t[1]+'</b><div class="s">'+t[2]+'</div></div>';
  });
  return h+'<div class="s" style="opacity:.7">ตรวจซ้ำเองได้: bash scripts/check_hato_dependency.sh</div></div>';
}

/* ---------- 🤖 การ์ดน้องนิว: เมนูพิเศษอย่าให้ทำเหลือ (logic จากห้อง 12) ---------- */
var niwData=null, niwErr=null;
async function loadNiw(){
  try{ niwData=await niwWeeklySpecialWatch(sb,{mode:'stocked'}); niwErr=null; }
  catch(e){ niwErr=(e&&e.message)||'ดึงข้อมูลไม่ได้'; niwData=null; }
}
function cardNiw(){
  if(niwErr) return '<div class="card"><h3>🤖 เมนูอย่าให้เหลือ</h3><div class="s">โหลดไม่ได้: '+niwErr+'</div></div>';
  if(!niwData) return '';
  var d=niwData;
  var h='<div class="card"><h3>🤖 เมนูอย่าให้เหลือ <span class="r">'+d.watchedCount+' เมนู</span></h3>';
  h+='<div class="s" style="margin-bottom:8px">สัปดาห์ '+d.weekThai+' · เหลืออีก '+d.daysLeft+' วัน</div>';
  if(d.cards&&d.cards.length){
    d.cards.forEach(function(c){
      var col=c.level==='risk'?'var(--r)':(c.level==='watch'?'#e6a100':'var(--g)');
      h+='<div style="border-left:3px solid '+col+';padding-left:8px;margin-bottom:8px">'
        +'<b>'+c.code+'</b> '+(c.name||'')
        +'<div class="s">ผลิต '+c.produced+' · ขาย '+c.sold+' ('+c.sellThroughPct+'%) · คาดเหลือ <b style="color:'+col+'">'+c.projectedLeft+'</b></div>'
        +((c.actions&&c.actions.length)?'<div class="s">→ '+c.actions.join(' · ')+'</div>':'')
        +'</div>';
    });
  } else {
    h+='<div class="s" style="color:var(--g)">ไม่มีเมนูเสี่ยงเหลือในกลุ่มที่เฝ้าได้</div>';
  }
  if(d.blockers&&d.blockers.length){
    h+='<div style="margin-top:10px;padding-top:8px;border-top:1px dashed rgba(128,128,128,.4)">'
      +'<b class="s">⚠️ ยังเฝ้าไม่ได้ '+d.blockers.length+' เมนู</b>'
      +'<div class="s" style="margin:2px 0 6px">ไม่ได้แปลว่าไม่มีปัญหา — แปลว่ายังไม่มีตัวเลขให้ดู</div>';
    var by={};
    d.blockers.forEach(function(b){ var k=b.reasonType||'other'; (by[k]=by[k]||[]).push(b); });
    Object.keys(by).forEach(function(k){
      var g=by[k], f=g[0];
      var names=g.slice(0,8).map(function(x){ return x.code+(x.suggestNextWeek!=null?' (ควรผลิต ~'+x.suggestNextWeek+')':''); }).join(' · ');
      h+='<div style="border-left:3px dashed rgba(128,128,128,.5);padding-left:8px;margin-bottom:8px;opacity:.9">'
        +'<b class="s">'+g.length+' เมนู — '+(f.reason||'')+'</b>'
        +'<div class="s">→ '+(f.howToFix||'')+'</div>'
        +'<div class="s" style="opacity:.75">'+names+(g.length>8?' …':'')+'</div>'
        +'</div>';
    });
    h+='</div>';
  }
  return h+'</div>';
}
