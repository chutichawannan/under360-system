<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Under360 — ครัว</title>
<link rel="icon" href="https://under360-system.vercel.app/favicon.jpg">
<link rel="apple-touch-icon" href="https://under360-system.vercel.app/favicon.jpg">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--g:#1F4D3A;--gs:#EBF3EF;--gold:#C9973F;--golds:#FFF8EC;--r:#DC2626;--rs:#FEF2F2;--blue:#1D4ED8;--blues:#EFF6FF;--ink:#1A1A1A;--soft:#6B7280;--xsoft:#D1D5DB;--bg:#F7F8F6;--w:#fff;--mono:'IBM Plex Mono';--sans:'IBM Plex Sans Thai',sans-serif;--rad:12px;}
body{font-family:var(--sans);background:var(--bg);min-height:100vh;}

/* HEADER */
.hdr{background:var(--g);padding:10px 14px;display:flex;align-items:center;gap:8px;position:sticky;top:0;z-index:100;flex-wrap:wrap;}
.hdr-title{font-size:15px;font-weight:700;color:#fff;flex:1;}
.hdr-btn{background:rgba(255,255,255,.15);color:#fff;border:none;border-radius:8px;padding:5px 11px;font-size:12px;cursor:pointer;font-family:var(--sans);text-decoration:none;white-space:nowrap;}
.hdr-btn.active{background:rgba(255,255,255,.35);}
.live-dot{width:8px;height:8px;border-radius:50%;background:#22C55E;box-shadow:0 0 0 3px rgba(34,197,94,.2);animation:blink 2s infinite;flex-shrink:0;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

/* TABS */
.tab-bar{display:flex;background:var(--w);border-bottom:2px solid var(--xsoft);overflow-x:auto;}
.tab-btn{flex:1;padding:11px 8px;font-size:13px;font-weight:600;color:var(--soft);border:none;background:none;cursor:pointer;font-family:var(--sans);border-bottom:2px solid transparent;margin-bottom:-2px;transition:.15s;white-space:nowrap;}
.tab-btn.active{color:var(--g);border-bottom-color:var(--g);}
/* แถบหมวด + ค้นหา ในแท็บตั้งสต็อค (12 ส.ค.) — ครัวกรอกทีละหมวด ไม่ต้องเลื่อนหาในลิสต์ 115 เมนู */
.stk-cats{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
.stk-cats::-webkit-scrollbar{display:none;}
.stk-cat{flex:0 0 auto;border:1px solid var(--xsoft);background:#fff;color:var(--soft);border-radius:999px;padding:9px 14px;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap;}
.stk-cat span{opacity:.6;font-weight:600;font-size:12px;}
.stk-cat.on{background:var(--g);border-color:var(--g);color:#fff;}
.stk-cat.on span{opacity:.75;}
.stk-find{width:100%;box-sizing:border-box;border:1px solid var(--xsoft);border-radius:10px;padding:11px 12px;font-size:16px;margin-bottom:6px;font-family:inherit;}
.stk-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border-bottom:1px solid var(--xsoft);}
.stk-name{min-width:0;flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}
.stk-ctrl{display:flex;align-items:center;gap:5px;flex-shrink:0;}
.stk-btn{width:44px;height:44px;border:1.5px solid var(--xsoft);background:#fff;border-radius:10px;font-size:22px;font-weight:800;cursor:pointer;color:var(--g);line-height:1;}
.stk-btn:active{background:var(--g);color:#fff;}
.stk-btn:disabled{opacity:.3;cursor:default;}
.stk-num{width:58px;height:44px;text-align:center;border:1.5px solid var(--xsoft);border-radius:10px;font-size:18px;font-weight:800;font-family:monospace;}
.stk-inf{width:44px;height:44px;border:1.5px solid var(--xsoft);background:#fff;border-radius:10px;font-size:18px;cursor:pointer;color:var(--soft);}
.stk-inf.on{background:var(--g);color:#fff;border-color:var(--g);}
/* 📱 บนมือถือ ปุ่ม − ตัวเลข + ∞ กินไป 205px จาก 375px → เหลือให้ชื่อเมนูแค่ 118px
   ชื่อไทยยาว 174px เลยโดนตัดเป็น "..." อ่านไม่ออกว่าเมนูอะไร (นัทเจอเองบน iPhone 13 ส.ค. 2569)
   → จอแคบให้ชื่อขึ้นบรรทัดของตัวเองเต็มความกว้าง แล้วปุ่มอยู่บรรทัดล่าง
     ไม่ลดขนาดปุ่ม เพราะครัวกดด้วยนิ้วเปียก/ใส่ถุงมือ ปุ่มเล็กลง = กดพลาด */
@media (max-width:520px){
  .stk-row{flex-wrap:wrap;}
  .stk-name{flex:1 0 100%;white-space:normal;overflow:visible;text-overflow:clip;line-height:1.35;margin-bottom:6px;}
  .stk-ctrl{margin-left:auto;}
}

/* DATE + SLOT BAR */
.ctrl-bar{background:var(--w);border-bottom:1px solid var(--xsoft);padding:8px 12px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
.chip{flex-shrink:0;padding:0 14px;min-height:40px;display:inline-flex;align-items:center;border-radius:20px;border:1px solid var(--xsoft);font-size:12px;font-weight:500;cursor:pointer;background:var(--w);color:var(--soft);}
.chip.on{background:var(--g);color:#fff;border-color:var(--g);}
.sep{width:1px;height:20px;background:var(--xsoft);flex-shrink:0;}
.date-sel{padding:0 10px;min-height:40px;border-radius:20px;border:1px solid var(--xsoft);font-size:12px;cursor:pointer;background:var(--w);font-family:var(--sans);color:var(--soft);}

/* MAIN */
.main{padding:12px;max-width:940px;margin:0 auto;}

/* PROD TABLE */
.prod-wrap{background:var(--w);border-radius:var(--rad);border:1px solid var(--xsoft);overflow:hidden;margin-bottom:12px;}
.pt-head{display:grid;grid-template-columns:1fr 52px 52px 62px;gap:4px;padding:7px 12px;background:var(--gs);border-bottom:2px solid var(--xsoft);}
.pt-head span{font-size:10px;font-weight:700;color:var(--soft);text-transform:uppercase;letter-spacing:.4px;text-align:center;}
.pt-head span:first-child{text-align:left;}
.pt-row{display:grid;grid-template-columns:1fr 52px 52px 62px;gap:4px;padding:7px 12px;border-bottom:1px solid var(--xsoft);align-items:center;}
.pt-row:last-child{border-bottom:none;}
.pt-row.warn{background:#FFFBEB;}
.pt-row.danger{background:#FFF1F1;}
.code-tag{font-family:var(--mono);font-size:10px;font-weight:700;color:var(--g);background:var(--gs);padding:2px 5px;border-radius:4px;white-space:nowrap;flex-shrink:0;}
.pt-n{font-family:var(--mono);font-size:13px;font-weight:700;text-align:center;}
.mp-wrap{background:var(--w);border-radius:var(--rad);border:1px solid var(--xsoft);border-left:4px solid #7C3AED;overflow:hidden;margin-bottom:12px;}
.mp-head{padding:9px 12px;background:#F5F3FF;border-bottom:2px solid var(--xsoft);font-size:12px;font-weight:700;color:#5B21B6;}
.mp-row{padding:8px 12px;border-bottom:1px solid var(--xsoft);}
.mp-row:last-child{border-bottom:none;}
.mp-row-top{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.mp-name{font-size:13px;font-weight:700;}
.mp-tag{font-size:10px;font-weight:700;padding:2px 7px;border-radius:6px;}
.mp-tag.hp{background:#FEF3C7;color:#92400E;}
.mp-tag.lc{background:#D1FAE5;color:#065F46;}
.mp-round{font-size:11px;color:var(--soft);font-weight:600;}
.mp-meta{font-size:11px;color:var(--soft);margin-top:3px;}
.mp-chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px;}
.mp-chip{font-family:var(--mono);font-size:10px;font-weight:700;color:#5B21B6;background:#EDE9FE;padding:2px 6px;border-radius:4px;}
.mp-chip.empty{font-family:inherit;font-style:italic;font-weight:400;color:var(--xsoft);background:none;padding:0;}
.btn-mp-done{margin-top:6px;font-size:12px;font-weight:700;color:var(--g);background:var(--gs);border:1px solid var(--g);border-radius:8px;padding:0 14px;min-height:44px;cursor:pointer;}
.actual-input{width:44px;border:1.5px solid var(--g);border-radius:6px;text-align:center;font-family:var(--mono);font-size:13px;font-weight:700;color:var(--g);padding:2px 0;background:var(--gs);}

/* SLOT SECTION */
.slot-sec{margin-bottom:14px;}
.slot-hdr{display:flex;align-items:center;gap:8px;padding:9px 12px;background:var(--g);border-radius:10px 10px 0 0;color:#fff;}
.slot-hdr-label{font-size:13px;font-weight:700;flex:1;}
.slot-hdr-count{font-size:12px;background:rgba(255,255,255,.2);padding:2px 9px;border-radius:10px;}
.slot-body{background:var(--w);border:1px solid var(--xsoft);border-top:none;border-radius:0 0 10px 10px;padding:8px;}

/* ORDER CARD */
/* ป้ายกำกับวันที่กำลังดู (N-32) */
.date-banner{margin:0 14px 10px;padding:10px 14px;border-radius:10px;font-size:13px;line-height:1.5;}
.date-banner.ahead{background:#FEF3C7;color:#92400E;border:1.5px solid #F59E0B;}
.date-banner.past{background:#E5E7EB;color:#374151;border:1.5px solid #9CA3AF;}
.db-back{display:inline-block;margin-left:6px;font-weight:700;text-decoration:underline;cursor:pointer;}
body.tablet .date-banner{font-size:16px;padding:14px 18px;}
.oc{border:1px solid var(--xsoft);border-radius:10px;padding:12px 14px;margin-bottom:10px;background:var(--w);}
/* 🖥️ ดูบนเว็บ/จอกว้าง: แบ่ง 2 คอลัมน์ — ซ้ายข้อมูลลูกค้า ขวาของที่ต้องจัด+ปุ่ม (นัทสั่ง 6 ส.ค. 2569)
   จอแคบกว่า 720px ยุบเป็นคอลัมน์เดียวเหมือนเดิม มือถือแอดมินไม่กระทบ */
.oc-2col{display:block;}
.oc-left{min-width:0;}
.oc-right{min-width:0;}
@media(min-width:720px){
  .oc-2col{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:16px;align-items:start;}
  .oc-right{border-left:1px solid var(--xsoft);padding-left:16px;}
}
.oc-done{opacity:.55;}                                  /* ส่งแล้ว = จางลง แต่ยังอยู่ให้กดยกเลิกได้ */
.oc-state{font-size:11px;font-weight:700;padding:2px 8px;border-radius:7px;}
.oc-state.packed{background:var(--gs);color:var(--g);}
.oc-state.shipped{background:#DBEAFE;color:#1E40AF;}
.oc-pay{font-size:11px;font-weight:700;padding:2px 8px;border-radius:7px;}
.oc-pay.is-paid{background:#D1FAE5;color:#065F46;}
.oc-pay.is-unpaid{background:#FEF3C7;color:#92400E;}
.oc-meta-sm{font-size:11px;}
.btn-ship{background:#1E40AF;color:#fff;border:none;border-radius:8px;padding:0 16px;min-height:44px;font-size:13px;font-weight:700;cursor:pointer;font-family:var(--sans);}
.oc:last-child{margin-bottom:0;}
.oc.pkg{border-color:var(--gold);background:var(--golds);}
.oc.mealplan{border-color:var(--g);background:var(--gs);}
.oc-top{display:flex;align-items:flex-start;gap:8px;margin-bottom:6px;cursor:pointer;}
/* ── พับ/กางการ์ด (N-13) ── ค่าเริ่มต้น = กางไว้ · พับแล้วเหลือ ชื่อ+กล่อง+สถานะ ── */
.oc-caret{flex-shrink:0;font-size:14px;color:var(--soft);line-height:1.4;margin-top:1px;transition:transform .12s;}
.oc-collapsed .oc-caret{transform:rotate(-90deg);}
.oc-boxn{font-size:11px;font-weight:700;padding:2px 8px;border-radius:7px;background:var(--bg);color:var(--soft);}
.oc-collapsed .oc-right,.oc-collapsed .oc-meta,.oc-collapsed .oc-note{display:none;}
.oc-collapsed .oc-2col{display:block;}
.oc-collapsed .oc-top{margin-bottom:0;}
.oc-collapsed{padding-top:9px;padding-bottom:9px;}
.fold-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:0 2px 10px;}
.fold-btn{padding:0 14px;min-height:40px;border-radius:20px;border:1px solid var(--xsoft);background:var(--w);color:var(--soft);font-size:12px;font-weight:600;cursor:pointer;font-family:var(--sans);}
.fold-hint{font-size:11px;color:var(--xsoft);}
body.tablet .fold-btn{font-size:16px;padding:0 20px;min-height:50px;border-radius:26px;}
body.tablet .fold-hint{font-size:14px;}
body.tablet .oc-boxn{font-size:14px;}
body.tablet .oc-caret{font-size:19px;}
.oc-badge{font-size:10px;font-weight:700;padding:2px 7px;border-radius:6px;flex-shrink:0;margin-top:2px;}
.oc-badge.hp{background:#FEF3C7;color:#92400E;}
.oc-badge.lc{background:#D1FAE5;color:#065F46;}
.oc-badge.pkg{background:var(--golds);color:var(--gold);border:1px solid var(--gold);}
.oc-badge.mp{background:var(--gs);color:var(--g);}
.oc-name{font-size:16px;font-weight:800;}
.oc-meta{font-size:13px;color:var(--soft);margin-top:2px;line-height:1.45;}
.oc-order-num{font-family:var(--mono);font-size:12.5px;color:var(--soft);}
.items-grid{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;}
/* ชื่อเมนูต้องอ่านครบเสมอ — ให้ตัดบรรทัดได้ ห้ามตัดข้อความทิ้ง (ครัวใช้เช็คว่าลูกค้ารับอะไรบ้าง) */
.item-chip{font-size:13px;background:var(--bg);border:1px solid var(--xsoft);border-radius:6px;padding:2px 8px;display:flex;align-items:baseline;gap:4px;max-width:100%;}
.item-chip .ic-code{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--g);flex-shrink:0;}
.item-chip .ic-name{font-size:12.5px;color:var(--soft);white-space:normal;word-break:break-word;min-width:0;}
/* โน้ตรายกล่อง — ต้องเด่นพอให้ครัวไม่พลาด (เช่น "กล่อง 2: ข้าวไรซ์เบอร์รี่") */
.item-chip .ic-note{font-size:12px;font-weight:700;color:#92400E;background:#FEF3C7;border-radius:5px;padding:1px 6px;white-space:normal;word-break:break-word;}
body.tablet .item-chip .ic-note{font-size:15px;padding:3px 8px;}
/* เซ็ต/คอร์ส = กล่องแยก มีหัวข้อ ครัวจะได้รู้ว่าของพวกนี้อยู่ชุดเดียวกัน */
.set-box{margin-top:6px;border:1px dashed var(--xsoft);border-radius:8px;padding:5px 7px;background:rgba(0,0,0,.015);}
.set-hdr{font-size:13px;font-weight:700;color:var(--g);display:flex;align-items:center;gap:6px;margin-bottom:2px;}
.set-hdr .set-n{font-family:var(--mono);font-weight:700;color:var(--ink);}
.set-box .items-grid{margin-top:3px;}
.item-chip .ic-qty{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--ink);}
.oc-note{font-size:13px;color:var(--r);background:var(--rs);border-radius:6px;padding:4px 8px;margin-top:6px;}
/* 🩺 ข้อจำกัดอาหาร — ต้องเด่นกว่าโน้ตธรรมดา เพราะพลาดแล้วกระทบสุขภาพลูกค้า ไม่ใช่แค่ความพอใจ */
.oc-diet{border-radius:7px;padding:6px 10px;margin-top:6px;line-height:1.4;}
.oc-diet-al{background:#FEE2E2;color:#7F1D1D;border:2px solid #DC2626;font-size:14.5px;font-weight:900;}
.oc-diet-dl{background:#FFF7ED;color:#9A3412;border:1px solid #FDBA74;font-size:13px;font-weight:700;}
body.tablet .oc-diet-al{font-size:17px;padding:8px 12px;}
body.tablet .oc-diet-dl{font-size:15px;padding:7px 11px;}
@media print{.oc-diet-al{border:2px solid #000;background:#fff!important;color:#000!important;}
             .oc-diet-dl{border:1px solid #000;background:#fff!important;color:#000!important;}}
.oc-utensil{font-size:13.5px;font-weight:700;color:#065F46;background:#D1FAE5;border-radius:6px;padding:4px 8px;margin-top:6px;display:inline-block;}
.oc-utensil.oc-utensil-no{color:var(--soft);background:var(--bg);font-weight:600;}
.oc-utensil.oc-utensil-lg{font-size:18px;padding:8px 14px;border-radius:8px;border:2px solid #065F46;}
.oc-actions{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;}
.btn-pack{background:var(--g);color:#fff;border:none;border-radius:8px;padding:0 18px;min-height:46px;font-size:14px;font-weight:600;cursor:pointer;font-family:var(--sans);}
.btn-undo{background:var(--bg);color:var(--soft);border:1px solid var(--xsoft);border-radius:8px;padding:0 16px;min-height:46px;font-size:13.5px;cursor:pointer;font-family:var(--sans);}
.btn-done{background:#E5F3ED;color:var(--g);border:none;border-radius:8px;padding:0 16px;min-height:44px;font-size:12px;font-weight:600;cursor:pointer;font-family:var(--sans);}
.empty-slot{text-align:center;padding:16px;color:var(--xsoft);font-size:12px;}

/* ── 📱 โหมดแท็บเล็ต (แท็บเล็ตติดผนังครัว) ──
   ออกแบบสำหรับ: อ่านห่าง 50-80 ซม. · แตะด้วยมือเปียก/ใส่ถุงมือ · ยืนดูทั้งวัน
   หลัก: ตัวใหญ่ขึ้น ~40% · ปุ่มขั้นต่ำ 56px · คอนทราสต์สูง · หัวติดบนเสมอ · จอไม่ดับ */
body.tablet{font-size:17px;}
body.tablet .hdr{padding:14px 18px;}
body.tablet .hdr-title{font-size:22px;}
body.tablet .hdr-btn{font-size:15px;padding:11px 16px;border-radius:10px;}
body.tablet .tab-bar{position:sticky;top:0;z-index:90;box-shadow:0 2px 8px rgba(0,0,0,.06);}
body.tablet .tab-btn{font-size:19px;padding:18px 10px;}
body.tablet .ctrl-bar{padding:12px 16px;gap:9px;position:sticky;top:56px;z-index:89;}
body.tablet .chip{font-size:16px;padding:0 22px;border-radius:26px;min-height:52px;display:inline-flex;align-items:center;}
body.tablet .date-sel{font-size:16px;padding:0 14px;border-radius:26px;min-height:52px;}
body.tablet .main{max-width:100%;padding:16px 20px;}
/* ตารางรายสินค้า — เลขต้องอ่านออกจากระยะไกล */
body.tablet .pt-head{padding:11px 16px;}
body.tablet .pt-head span{font-size:13px;}
body.tablet .pt-row{padding:15px 16px;grid-template-columns:1fr 78px 78px 92px;}
body.tablet .pt-row>div:first-child{font-size:18px;}
body.tablet .pt-n{font-size:23px;}
body.tablet .code-tag{font-size:14px;padding:4px 9px;}
/* การ์ดออเดอร์ */
body.tablet .oc{padding:16px 18px;border-radius:14px;border-width:2px;margin-bottom:10px;}
body.tablet .oc-name{font-size:19px;}
body.tablet .oc-meta,body.tablet .oc-order-num{font-size:15px;}
body.tablet .oc-badge{font-size:13px;padding:4px 10px;}
body.tablet .item-chip{font-size:17px;padding:8px 13px;border-radius:9px;}
body.tablet .item-chip .ic-code{font-size:15px;}
body.tablet .item-chip .ic-name{font-size:15px;}
body.tablet .item-chip .ic-qty{font-size:19px;}
body.tablet .oc-note{font-size:16px;padding:7px 11px;}
body.tablet .oc-utensil{font-size:16px;padding:7px 12px;}
/* ปุ่มกดสถานะ — เป้าใหญ่ กันกดพลาดตอนมือเปียก */
body.tablet .btn-pack,body.tablet .btn-done,body.tablet .btn-undo,body.tablet .btn-mp-done{
  font-size:17px;padding:15px 26px;border-radius:12px;min-height:56px;}
body.tablet .oc-actions{gap:10px;margin-top:12px;}
/* แท็บตั้งสต็อค */
body.tablet .stk-row{padding:12px 14px;}
body.tablet .stk-name{font-size:18px;}
body.tablet .stk-btn{width:58px;height:58px;font-size:30px;}
body.tablet .stk-num{width:82px;height:58px;font-size:24px;}

<script>
const SB_URL="https://zdartbvhbvqlwzwyyiia.supabase.co";
const SB_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpkYXJ0YnZoYnZxbHd6d3l5aWlhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE4MTY3OTksImV4cCI6MjA5NzM5Mjc5OX0.D41YGH-CuWrVFqcAgXEuhfVTxJ7WY26Xu-PeXBF6LB8";
var sb=null;
function getSB(){try{if(!sb&&typeof supabase!=="undefined")sb=supabase.createClient(SB_URL,SB_KEY);return sb;}catch(e){return null;}}
// d.toISOString() แปลงเป็น UTC ก่อนตัด — เที่ยงคืนเวลาไทย (UTC+7) = 17:00 UTC เมื่อวาน ทำให้วันที่ผิดไป 1 วันตอนเช้ามืด
// ⏰ ยึดเวลาไทยเสมอ — ครัวอยู่ไทย · เจ้าของอาจเปิดจากต่างประเทศ (เดิมใช้เวลาเครื่อง = ได้วันของประเทศนั้น) แก้ 3 ส.ค. 2026
function toISO(d){return new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Bangkok"}).format(d||new Date());}
function today(){return toISO(new Date());}
function tomorrow(){var d=new Date();d.setDate(d.getDate()+1);return toISO(d);}
function fmtDate(iso){var d=new Date(iso+"T00:00:00");return d.toLocaleDateString("th-TH",{weekday:"short",day:"numeric",month:"short"});}
// created_at เป็น timestamp เต็ม (มี T อยู่แล้ว) ต้องแยกจาก fmtDate ที่รับแค่วันที่เปล่า
function fmtOrderPlaced(iso){
  if(!iso)return "—";
  var d=new Date(iso);
  return d.toLocaleDateString("th-TH",{day:"numeric",month:"short"})+" "+d.toLocaleTimeString("th-TH",{hour:"2-digit",minute:"2-digit"});
}

// ── ชื่อผู้ใช้ + Activity Log (ใครกดปุ่มสถานะ เมื่อไหร่ — กันมือลั่นแล้วหาไม่เจอ) ──
var kqCurrentUser=null;
function loadNickname(){
  try{ kqCurrentUser=localStorage.getItem("lastNickname")||null; }catch(e){ kqCurrentUser=null; }
  updateWhoamiBtn();
}
function updateWhoamiBtn(){
  var btn=document.getElementById("whoamiBtn");
  if(btn)btn.textContent=kqCurrentUser?("👋 "+kqCurrentUser):"👋 ตั้งชื่อ";
}
function promptNickname(){
  var name=prompt("ใส่ชื่อเล่นของคุณ (ระบบจะจำไว้ใช้ตอนกดปุ่มสถานะต่างๆ เช่น จัดกล่องเสร็จ/ส่งแล้ว)",kqCurrentUser||"");
  if(name===null)return;
  name=name.trim();
  if(!name)return;
  kqCurrentUser=name;
  try{ localStorage.setItem("lastNickname",name); }catch(e){}
  updateWhoamiBtn();
}
// ต้องมีชื่อก่อนถึงกดปุ่มสถานะได้ — ถ้ายังไม่มี เด้ง prompt ให้กรอกทันที (prompt เป็น blocking ทำให้กดปุ่มเดิมซ้ำได้เลยไม่ต้องกด 2 รอบ)
function requireKqUser(){
  if(kqCurrentUser&&kqCurrentUser.trim())return true;
  promptNickname();
  return !!(kqCurrentUser&&kqCurrentUser.trim());
}
// เขียนทุกครั้งที่กด ไม่ debounce/รวมแถว (ต่างจาก DB) เพราะเป็นการกดที่มีผลจริงต่อออเดอร์ ไม่ใช่ปรับตัวเลขรัวๆ — ต้องมี record แยกทุกครั้งเพื่อสอบย้อนหลังได้
async function logKqActivity(summary){
  var sb_=getSB(); if(!sb_)return;
  try{
    await sb_.from("activity_log").insert({
      session_id:"kq_"+Date.now()+"_"+Math.random().toString(36).slice(2,8),
      actor:kqCurrentUser||"ไม่ทราบชื่อ",
      source:"kq",
      action_type:"kq_status",
      summary:summary,
      detail:{}
    });
  }catch(e){ console.warn("logKqActivity failed:",e); }
}

// ── STATE ────────────────────────────────────────────────
var allOrders=[], allItems=[], allMenus=[], allMpDeliveries=[];
var custPrefs={};   // customer_id -> {allergies, dislikes} — ข้อจำกัดอาหารที่ต้องเด้งบนการ์ด
var dateMode="today", slotMode="all", tabMode=1;
var codeMode="code"; // code | name | subcode
var SLOT_LABELS={all_day:"🕐 รับได้ตลอดวัน", morning:"🌅 ช่วงเช้า", afternoon:"🌇 ช่วงบ่าย", express:"🚗 ด่วน"};

// ── DATE / SLOT / TAB ────────────────────────────────────
function getTargetDate(){
  if(dateMode==="today")return today();
  if(dateMode==="tomorrow")return tomorrow();
  if(dateMode==="custom"){var s=document.getElementById("calPicker");return s?s.value:null;}
  return null; // all
}
function setDate(mode,el){
  dateMode=mode;
  // กดชิป วันนี้/พรุ่งนี้/ทั้งหมด → ล้างค่าในปฏิทินด้วย ไม่งั้นจอโชว์วันหนึ่งแต่กรองอีกวัน
  if(mode!=="custom"){var _cp=document.getElementById("calPicker"); if(_cp)_cp.value="";}
  document.querySelectorAll("#ctrlBar .chip[id^='d-']").forEach(function(b){b.classList.remove("on");});
  if(el&&el.classList)el.classList.add("on");
  render();
}
function setSlot(mode,el){
  slotMode=mode;
  document.querySelectorAll("#ctrlBar .chip[id^='s-']").forEach(function(b){b.classList.remove("on");});
  if(el&&el.classList)el.classList.add("on");
  render();
}
function switchTab(n){
  tabMode=n;
  [1,2,3].forEach(function(i){
    document.getElementById("tab"+i).classList.toggle("active",i===n);
    document.getElementById("tabContent"+i).style.display=i===n?"block":"none";
  });
  render();
}

// ── CODE TOGGLE ──────────────────────────────────────────
var CODE_MODES=["code","name","subcode"];
var CODE_LABELS={"code":"🏷️ Code","name":"📝 ชื่อ","subcode":"#️⃣ Sub"};
function cycleCodeMode(){
  var idx=CODE_MODES.indexOf(codeMode);
  codeMode=CODE_MODES[(idx+1)%CODE_MODES.length];
  document.getElementById("codeToggleBtn").textContent=CODE_LABELS[codeMode];
  render();
}
function getCodeDisplay(code,name){
  if(codeMode==="name")return name;
  if(codeMode==="subcode")return (code||"").replace(/^[A-Za-z]+/,"") || code;
  return code||"—";
}

// ── 📱 โหมดแท็บเล็ต (ครัวติดผนัง) ──────────────────────────
// เปิดครั้งเดียวจำไว้ในเครื่องนั้น · เครื่องอื่น (มือถือแอดมิน) ไม่กระทบ
var _wakeLock=null;
async function kqKeepAwake(){
  try{ if("wakeLock" in navigator && !_wakeLock){ _wakeLock=await navigator.wakeLock.request("screen"); _wakeLock.addEventListener("release",function(){_wakeLock=null;}); } }catch(e){}
}
function kqReleaseAwake(){ try{ if(_wakeLock){_wakeLock.release();_wakeLock=null;} }catch(e){} }
function applyTabletMode(on,save){
  document.body.classList.toggle("tablet",!!on);
  var b=document.getElementById("tabletBtn");
  if(b){ b.textContent=on?"📱 แท็บเล็ต: เปิด":"📱 แท็บเล็ต"; b.style.background=on?"rgba(255,255,255,.38)":""; }
  if(save) localStorage.setItem("kq_tablet",on?"1":"0");
  if(on) kqKeepAwake(); else kqReleaseAwake();
}
function toggleTablet(){ applyTabletMode(!document.body.classList.contains("tablet"),true); }
// จอดับแล้วกลับมา → ขอ wake lock ใหม่ (browser ปล่อยเองตอน tab ไม่ active)
document.addEventListener("visibilitychange",function(){
  if(document.visibilityState==="visible"&&document.body.classList.contains("tablet")) kqKeepAwake();
});
(function initTablet(){
  var saved=null; try{ saved=localStorage.getItem("kq_tablet"); }catch(e){}
  // ยังไม่เคยตั้ง + เป็นจอสัมผัสขนาดแท็บเล็ตขึ้นไป → เปิดให้เลย (กดปิดได้ 1 ปุ่ม)
  var looksTablet = (typeof screen!=="undefined") && Math.min(screen.width,screen.height)>=700 && ("ontouchstart" in window);
  applyTabletMode(saved==="1"||(saved===null&&looksTablet),false);
})();

// ── LOAD ─────────────────────────────────────────────────
var kitchenUtensilSize="normal";
var catLabelMap={}; // cat_xxx → ชื่อหมวดสวย (จาก appConfig.categories)
// ดึง order_items เฉพาะออเดอร์ที่โหลดมา (chunk 80/ครั้ง กัน URL ยาว + cap 1000/ครั้ง)
async function fetchItemsFor(sb_, ids){
  var out=[];
  for(var i=0;i<ids.length;i+=80){
    var r=await sb_.from("order_items").select("*").in("order_id",ids.slice(i,i+80));
    if(r&&r.data) out=out.concat(r.data);
  }
  return out;
}
async function loadAll(){
  var sb_=getSB();
  if(!sb_){render();return;}
  try{
    // ⚠️ เดิม select("*") ไม่มี limit → Supabase cap 1000 + เรียงวันเก่าสุด = ครัวเห็นออเดอร์ 2024 ไม่เห็นวันนี้ (พังเงียบหลัง migrate 15,844 ใบ)
    // แก้: ดึงเฉพาะออเดอร์ตั้งแต่ 3 วันก่อนเป็นต้นไป (เครื่องครัว=เวลาไทย · buffer 3 วันกัน TZ เพี้ยน) → ได้วันนี้+อนาคตครบ · order_items ดึงตาม id
    // 🔴 N-32: ขยายฝั่งย้อนหลังให้ครอบตัวเลือกใน calPicker (KQ_PAST_DAYS) ไม่งั้นเลือกวันเก่าแล้วขึ้นว่าง
    //    ⚠️ ห้ามใส่ lte/upper bound เด็ดขาด — วันอนาคตต้องติดมาด้วย (คิว Meal Plan ล่วงหน้าอยู่ตรงนี้)
    //    ใช้ toISO (Asia/Bangkok) แทนวันเครื่อง — เจ้าของเปิดจากอเมริกาจะได้ไม่เพี้ยนไป 1 วัน
    var startDate=toISO(kqDayOffset(-(KQ_PAST_DAYS+2)));
    var ordRes=await sb_.from("orders").select("*").gte("delivery_date",startDate).order("delivery_date").order("time_slot").limit(3000);
    if(ordRes.error) throw ordRes.error;   // เดิมไม่เช็ค → โหลดพลาดแล้วขึ้น "ไม่มีออเดอร์" ทั้งที่ DB มีเต็ม (แก้ 3 ส.ค. 2026)
    allOrders=ordRes.data||[];
    var ids=allOrders.map(function(o){return o.id;});
    // N-13: ทิ้งสถานะ "พับ" ของออเดอร์ที่หลุดช่วงวันไปแล้ว กัน localStorage บวมสะสมไปเรื่อยๆ
    (function(){var keep={},ch=false; ids.forEach(function(i){if(kqCollapsed[i])keep[i]=1;});
      for(var k in kqCollapsed){if(!keep[k]){ch=true;break;}} if(ch){kqCollapsed=keep;saveCollapsed();}})();
    var rest=await Promise.all([
      sb_.from("menu_items").select("id,code,name,stock_total,actual_stock,is_available,no_morning,category").eq("is_available",true),
      sb_.from("mp_deliveries").select("*").gte("delivery_date",startDate).order("delivery_date").limit(2000),
      sb_.from("kitchen_data").select("key,data").in("key",["globalSettings","appConfig"])
    ]);
    allItems=await fetchItemsFor(sb_,ids);
    allMenus=rest[0].data||[]; allMpDeliveries=rest[1].data||[];
    /* 🩺 ข้อจำกัดอาหารรายลูกค้า (โรคประจำตัว/ของแพ้/ข้าวนิ่ม)
       เดิมข้อมูลนี้อยู่แต่ในแชทไลน์ ไม่เคยถึงหน้าครัว — ฟ้าเจอซ้ำ 4 วันติด (13 ส.ค. 2569)
       หนักสุดคือเคสลูกค้าโรคไต ถ้าไม่มีใครบังเอิญเห็นในแชท ครัวก็ทำข้าวปกติให้
       อ่านอย่างเดียว · พังก็ปล่อยผ่าน หน้าครัวต้องขึ้นออเดอร์ได้เสมอ */
    try{
      var _cids=[]; allOrders.forEach(function(o){ if(o.customer_id && _cids.indexOf(o.customer_id)<0) _cids.push(o.customer_id); });
      custPrefs={};
      if(_cids.length){
        var pf=await sb_.from("customer_preferences").select("customer_id,allergies,dislikes").in("customer_id",_cids).limit(500);
        (pf.data||[]).forEach(function(p){ custPrefs[p.customer_id]=p; });
      }
    }catch(e){ custPrefs={}; }
    var _kd=rest[2].data||[];
    var _gs=(_kd.find(function(x){return x.key==="globalSettings";})||{}).data||{};
    var _ac=(_kd.find(function(x){return x.key==="appConfig";})||{}).data||{};
    kitchenUtensilSize=_gs.kitchenUtensilSize||"normal";
    catLabelMap={}; (_ac.categories||[]).forEach(function(c){ if(c&&c.key) catLabelMap[c.key]=c.label||c.name||c.key; });
  }catch(e){ console.error(e); alert("⚠️ โหลดออเดอร์ไม่สำเร็จ — ที่เห็นบนจออาจไม่ครบ\n"+((e&&e.message)||"")+"\n\nกดรีเฟรชอีกครั้ง"); }
  render();
}

// เขียนไม่ติด = ต้องรู้ทันที (supabase v2 ไม่ throw → ถ้าไม่เช็ค .error จะเงียบสนิท) — เพิ่ม 3 ส.ค. 2026

// ── FILTER ───────────────────────────────────────────────
function filteredOrders(){
  var tgt=getTargetDate();
  return allOrders.filter(function(o){
    if(tgt&&o.delivery_date!==tgt)return false;
    if(slotMode!=="all"&&o.time_slot!==slotMode)return false;
    // 🔴 ใบที่ยกเลิก + ออเดอร์เทส ต้องไม่โผล่หน้าครัว — ครัวเคยเห็น 13 ใบทั้งที่งานจริง 12
    //    (นัทเปิดจอจริงเจอ 5 ส.ค. 2569 · ตัวเกินคือ U-0805-001 ที่ cancelled ไปแล้ว)
    if(o.status==="cancelled") return false;
    if(o.source==="parallel_test") return false;
    // ส่งแล้วยังโชว์อยู่ถ้าเลือกวันเจาะจง — ครัวเห็นความคืบหน้าทั้งวัน + กดยกเลิกย้อนได้
    // (ดูรวมทุกวันค่อยซ่อน ไม่งั้นรายการยาวไปด้วยของที่จบแล้ว)
    if(o.status==="delivered") return !!tgt;
    return true;
  });
}
// บรรทัดควบคุม ไม่ใช่ของที่ครัวต้องทำ (ตรงกับที่หน้าแมสใน OH กรองไว้)
var KQ_CTRL={"1":"🔁 แยกวันส่ง","0":"➕ เพิ่มเติม","000":"🍴 ช้อนส้อม"};

// จับคู่ออเดอร์ ↔ รอบส่ง Meal Plan — แยกออกมาเป็นฟังก์ชันเดียว ใช้ทั้งตอนดึงเมนูและตอนนับกล่อง
// ⚠️ ผูกด้วย order_id → line_uid → customer_id เท่านั้น · ห้ามจับคู่ด้วย "ชื่อ+วันที่" (ชื่อซ้ำกันได้)
function findMpFor(o){
  if(!o||!(allMpDeliveries||[]).length) return null;
  var m=null;
  if(o.id)              m=allMpDeliveries.find(function(x){return x.order_id&&x.order_id===o.id;});
  if(!m&&o.line_uid)    m=allMpDeliveries.find(function(x){return x.line_uid&&x.line_uid===o.line_uid&&x.delivery_date===o.delivery_date;});
  if(!m&&o.customer_id) m=allMpDeliveries.find(function(x){return x.customer_id&&x.customer_id===o.customer_id&&x.delivery_date===o.delivery_date;});
  return m;
}
function getOrderItems(orderId){
  var o=(allOrders||[]).find(function(x){return x.id===orderId;});
  var raw=allItems.filter(function(i){return i.order_id===orderId;});
  var food=raw.filter(function(i){
    if(KQ_CTRL[i.menu_code]) return false;                       // บรรทัดควบคุม
    return !!String(i.menu_name||"").trim();                     // บรรทัดไม่มีชื่อ = ครัวใช้ไม่ได้
  });
  // 🔁 ไม่มีของให้ทำเลย → ดึงเมนูจากแพลนเมนู (mp_deliveries) แบบเดียวกับหน้าแมสใน OH
  //    ที่มา: แอดมินแก้เมนูที่หน้า "แพลนเมนู" ซึ่งเขียนลง mp_deliveries — ถ้าครัวอ่านแต่ order_items จะไม่เห็นการแก้เลย
  //    ⚠️ ผูกด้วย order_id → line_uid → customer_id เท่านั้น · ห้ามจับคู่ด้วย "ชื่อ+วันที่" (ชื่อซ้ำกันได้)
  if(!food.length && o && (allMpDeliveries||[]).length){
    var m=findMpFor(o);
    if(m&&m.status!=="cancelled"&&Array.isArray(m.menu_items)&&m.menu_items.length){
      return m.menu_items.map(function(x){
        // โน้ตจากหน้าแพลนเมนู — ทั้งแบบใช้ทุกกล่อง (note) และแยกรายกล่อง (notes[])
        // ครัวต้องเห็น ไม่งั้นแอดมินกรอก "ข้าวไรซ์เบอร์รี่ กล่อง 2" ไปก็ไม่มีใครอ่าน
        var parts=[];
        if(String(x.note||"").trim()) parts.push("ทุกกล่อง: "+String(x.note).trim());
        (x.notes||[]).forEach(function(v,i){ if(String(v||"").trim()) parts.push("กล่อง "+(i+1)+": "+String(v).trim()); });
        return {code:x.code||"—", name:(x.name||"—"), qty:x.qty||1, menu_item_id:null, notes:"",
                _fromPlan:String(m.mp_type||"MP").toUpperCase(), _boxNote:parts.join(" · ")};
      });
    }
  }
  return (food.length?food:raw).map(function(i){
    var m=allMenus.find(function(x){return x.id===i.menu_item_id;});
    return {
      code: i.menu_code || (m&&m.code) || "—",
      name: i.menu_name || (m&&m.name) || "—",
      qty: i.quantity||1,
      menu_item_id: i.menu_item_id,
      notes: i.notes||""      // ใช้แยกว่าอยู่ในเซ็ต/คอร์สไหน (รูปแบบ pkg:{id}:course:r/N)
    };
  });
}

// รวมรายการซ้ำ + จัดกลุ่มเซ็ต/คอร์ส (นัทเจอบนจอครัว 5 ส.ค. 2569)
//  · เดิมเมนูเดียวกัน 6 กล่อง ขึ้น 6 บรรทัดเหมือนกันเป๊ะ → ครัวนับเอง
//  · เดิมเซ็ต/คอร์สขึ้นปนกับเมนูเดี่ยว → ครัวไม่รู้ว่าอันไหนอยู่ในเซ็ตเดียวกัน
function groupOrderItems(items){
  var groups=[], byKey={};
  items.forEach(function(i){
    var pk=(String(i.notes||"").match(/^pkg:([^:\s]+)/)||[])[1]||null;
    var gk=pk?("pkg:"+pk):"_single";
    if(!byKey[gk]){ byKey[gk]={pkg:pk,round:null,fromPlan:null,items:[],_seen:{}}; groups.push(byKey[gk]); }
    var g=byKey[gk];
    if(i._fromPlan) g.fromPlan=i._fromPlan;
    var cr=String(i.notes||"").match(/course:(\d+)\s*\/\s*(\d+)/);
    if(cr) g.round=cr[1]+"/"+cr[2];
    var ik=(i.code||"")+"|"+(i.name||"");
    if(g._seen[ik]) g._seen[ik].qty+=(i.qty||1);
    else { g._seen[ik]={code:i.code,name:i.name,qty:(i.qty||1),boxNote:i._boxNote||""}; g.items.push(g._seen[ik]); }
  });
  groups.sort(function(a,b){ return (a.pkg?1:0)-(b.pkg?1:0); });   // เมนูเดี่ยวก่อน แล้วค่อยเซ็ต
  return groups;
}
function detectBadge(items){
  if(items.some(function(i){return (i.code||"").match(/^HP/i);}))return "hp";
  if(items.some(function(i){return (i.code||"").match(/^LC/i);}))return "lc";
  return "normal";
}

function updateDateBanner(){
  var el=document.getElementById("dateBanner"); if(!el)return;
  var tgt=getTargetDate();
  if(!tgt){ el.innerHTML=""; return; }
  var t=today();
  if(tgt===t){ el.innerHTML=""; return; }   // วันนี้ = ปกติ ไม่ต้องรบกวนสายตา
  var ahead=Math.round((new Date(tgt+"T00:00:00")-new Date(t+"T00:00:00"))/86400000);
  if(ahead>0){
    el.innerHTML="<div class='date-banner ahead'>🔜 กำลังดู<b>ของล่วงหน้า</b> "+fmtDate(tgt)

// debounce save 600ms หลังพิมเสร็จ
function schedSave(inp){
  var menuId=inp.dataset.menuId;
  var val=parseInt(inp.value)||0;
  // update local ให้ rem re-calc
  var m=allMenus.find(function(x){return x.id===menuId;});
  if(m){ m.actual_stock=val; if(m.stock_total!=null) m.stock_total=val; }   // ผลิตได้จริงเท่าไหร่ = ลูกค้าซื้อได้เท่านั้น
  // update rem display ทันที
  var row=inp.closest(".pt-row");
  if(row){
    var ordered=parseInt(row.querySelectorAll(".pt-n")[0].textContent)||0;
    var rem=val-ordered;
    var remEl=row.querySelectorAll(".pt-n")[2];
    if(remEl){remEl.textContent=rem;remEl.style.color=rem<0?"var(--r)":"var(--g)";}
    row.className="pt-row"+(rem<0?" danger":rem<3?" warn":"");
  }
  clearTimeout(saveTimers[menuId]);
  saveTimers[menuId]=setTimeout(async function(){
    var sb_=getSB(); if(!sb_)return;
    // 🔗 ครัวกรอก "ผลิตได้จริง" → ตั้งเลขที่ลูกค้าซื้อได้ (stock_total) ให้ตรงกันทันที (3 ส.ค. 2026)
    //    เดิมเก็บแค่ actual_stock อย่างเดียว → ไม่มีอะไรเชื่อมกับเลขขาย → ครัวผลิตได้ 0 แต่ลูกค้ายังสั่งได้ 10
    //    เมนูที่ตั้ง "ไม่จำกัด" (stock_total = null) ไม่แตะ — ยังขายได้เรื่อยๆ ตามเดิม
    var mm=allMenus.find(function(x){return x.id===menuId;})||{};
    var patch={actual_stock:val};
    if(mm.stock_total!=null) patch.stock_total=val;
    // ⚠️ เมนูที่ตั้ง "ไม่จำกัด" (stock_total=null) → กรอกเลขนี้ไปก็ "ไม่คุมการขาย"
    //    เดิมเงียบสนิท ครัวนึกว่าจำกัดแล้วแต่ลูกค้ายังสั่งได้ไม่อั้น → ต้องบอกให้รู้ (ไม่เปลี่ยนพฤติกรรมการขายเอง)
    else kqUnlimitedHint(inp, mm);
    var _w3=await sb_.from("menu_items").update(patch).eq("id",menuId);
    if(_w3.error) kqWriteFail(_w3.error,"ผลิตได้จริง/สต็อคขาย");
    else if(patch.stock_total!=null) logKqActivity((mm.code||"")+" "+(mm.name||"")+" — ผลิตได้จริง "+val+" (ตั้งสต็อคขาย = "+val+")");
  },600);
}

// เตือนเมื่อกรอก "ผลิตได้จริง" ให้เมนูที่ตั้งไว้ว่า "ขายไม่จำกัด" — เลขนี้จะไม่คุมการขาย

    d.textContent="เมนูนี้ตั้งไว้ \u0e02\u0e32\u0e22\u0e44\u0e21\u0e48\u0e08\u0e33\u0e01\u0e31\u0e14 (\u221e) — เลขนี้บันทึกไว้ดูเฉยๆ ไม่ได้จำกัดยอดขาย ถ้าต้องการจำกัด ให้ตั้งเลขที่แท็บ \"ตั้งสต็อค\" ก่อน";

  var el=document.getElementById("stockView"); if(!el)return;
  var menus=(allMenus||[]).filter(function(m){ return m.category!=="meal_hp"&&m.category!=="meal_lc"; })
    .sort(function(a,b){ return (a.category||"").localeCompare(b.category||"")||(a.code||"").localeCompare(b.code||""); });
  if(!menus.length){ el.innerHTML="<div style='text-align:center;padding:40px;color:var(--soft)'>ไม่มีเมนู</div>"; return; }
  var om={}; filteredOrders().forEach(function(o){ getOrderItems(o.id).forEach(function(i){ om[i.menu_item_id]=(om[i.menu_item_id]||0)+i.qty; }); });
  var html="<div style='padding:10px 12px;font-size:12px;color:var(--soft);background:#EBF3EF;border-radius:10px;margin-bottom:8px'>ตั้งจำนวนที่ทำวันนี้ต่อเมนู — <b>ลูกค้าสั่งได้ไม่เกินนี้</b> (LIFF อ่านตัวนี้) · แตะ <b>∞</b> = ขายไม่จำกัด</div>";

  // แถบหมวด + ช่องค้นหา (นัทสั่ง 12 ส.ค.) — ครัวกรอกสต็อกทีละหมวด (บ๊ะจ่าง/ข้าวกล่อง/แพคกับข้าว)
  // เดิมเป็นรายการยาวรวดเดียว 115 เมนู ครัวต้องเลื่อนหาเอง = กรอกผิดแถวง่าย
  var cats=[]; menus.forEach(function(m){ var c=m.category||"other"; if(cats.indexOf(c)<0)cats.push(c); });
  var catName=function(c){ return catLabelMap[c]||CATLBL_STK[c]||c||"อื่นๆ"; };
  html+="<div class='stk-cats'><button class='stk-cat"+(stkCat==="all"?" on":"")+"' onclick=\"stkPick('all')\">ทั้งหมด <span>"+menus.length+"</span></button>";
  cats.forEach(function(c){
    var n=menus.filter(function(m){return (m.category||"other")===c;}).length;
    html+="<button class='stk-cat"+(stkCat===c?" on":"")+"' onclick=\"stkPick('"+escH(c)+"')\">"+escH(catName(c))+" <span>"+n+"</span></button>";
  });
  html+="</div><input class='stk-find' id='stkFind' placeholder='🔍 ค้นชื่อเมนูหรือโค้ด...' value='"+escH(stkQ)+"' oninput='stkSearch(this)'>";

  var shown=menus.filter(function(m){
    if(stkCat!=="all" && (m.category||"other")!==stkCat) return false;
    if(stkQ){ var q=stkQ.toLowerCase();
      return String(m.name||"").toLowerCase().indexOf(q)>=0 || String(m.code||"").toLowerCase().indexOf(q)>=0
          || String(m.subcode||"").toLowerCase().indexOf(q)>=0; }
    return true;
  });
  if(!shown.length) html+="<div style='text-align:center;padding:30px;color:var(--soft)'>ไม่เจอเมนูที่ค้น</div>";

  var lastCat=null;
  shown.forEach(function(m){
    if(m.category!==lastCat){ lastCat=m.category; html+="<div style='font-size:13px;font-weight:800;color:var(--g);margin:12px 0 2px;padding:0 4px'>"+escH(catLabelMap[m.category]||CATLBL_STK[m.category]||m.category||"อื่นๆ")+"</div>"; }
    var unlimited=(m.stock_total==null);
    var val=unlimited?0:m.stock_total;
    var ordered=om[m.id]||0;
    html+="<div class='stk-row'>"
      +"<div class='stk-name'><span class='code-tag'>"+escH(getCodeDisplay(m.code,m.name))+"</span> "+escH(m.name||"")
      +(ordered?" <span style='color:var(--gold);font-size:11px'>· สั่งแล้ว "+ordered+"</span>":"")+"</div>"
      +"<div class='stk-ctrl'>"
      +"<button class='stk-btn' onclick=\"stkAdj('"+m.id+"',-1)\" "+(unlimited?"disabled":"")+">−</button>"
      +"<input class='stk-num' type='number' min='0' value='"+val+"' data-id='"+m.id+"' oninput='stkType(this)'"+(unlimited?" disabled style='opacity:.35'":"")+">"
      +"<button class='stk-btn' onclick=\"stkAdj('"+m.id+"',1)\" "+(unlimited?"disabled":"")+">+</button>"
      +"<button class='stk-inf "+(unlimited?"on":"")+"' onclick=\"stkInf('"+m.id+"')\" title='ขายไม่จำกัด'>∞</button>"
      +"</div></div>";
  });
  el.innerHTML=html;
}
function stkWrite(menuId,val){ // val = ตัวเลข หรือ null (ไม่จำกัด)
  var m=(allMenus||[]).find(function(x){return x.id===menuId;}); if(m)m.stock_total=val;
  clearTimeout(saveTimers["stk_"+menuId]);
  saveTimers["stk_"+menuId]=setTimeout(async function(){ var sb_=getSB(); if(sb_){ var _w4=await sb_.from("menu_items").update({stock_total:val}).eq("id",menuId); if(_w4.error) kqWriteFail(_w4.error,"ตั้งสต็อค (ลูกค้าเห็นเลขนี้)"); } },500);
}
function stkAdj(menuId,d){ var m=(allMenus||[]).find(function(x){return x.id===menuId;}); if(!m)return; var cur=(m.stock_total==null)?0:m.stock_total; stkWrite(menuId,Math.max(0,cur+d)); renderStock(); }
function stkType(inp){ stkWrite(inp.dataset.id,Math.max(0,parseInt(inp.value)||0)); } // ไม่ re-render ระหว่างพิม กัน cursor เด้ง
function stkInf(menuId){ var m=(allMenus||[]).find(function(x){return x.id===menuId;}); if(!m)return; stkWrite(menuId, (m.stock_total!=null)?null:0); renderStock(); }

// ── พับ/กางการ์ด (N-13) ──────────────────────────────────
// วันที่ออเดอร์เยอะ หน้ายาวมากจนครัวเลื่อนหาของไม่เจอ → กดหัวการ์ดพับเก็บได้
// กติกา: ค่าเริ่มต้น "กางไว้" เสมอ (ครัวต้องเห็นของโดยไม่ต้องกด) · พับเองเมื่ออยากเก็บ
// เก็บสถานะไว้ใน localStorage → auto-refresh 30 วิ (loadAll→render) ไม่เด้งกางเอง
var kqCollapsed={};
try{ kqCollapsed=JSON.parse(localStorage.getItem("kqCollapsedOrders")||"{}")||{}; }catch(e){ kqCollapsed={}; }
function saveCollapsed(){ try{ localStorage.setItem("kqCollapsedOrders",JSON.stringify(kqCollapsed)); }catch(e){} }
function toggleCard(id){
  if(kqCollapsed[id]) delete kqCollapsed[id]; else kqCollapsed[id]=1;
  saveCollapsed();
  // ขยับเฉพาะการ์ดใบนั้น ไม่ re-render ทั้งหน้า = ไม่กระโดดหลุดตำแหน่งที่ครัวเลื่อนค้างไว้
  var el=document.querySelector(".oc[data-oid='"+id+"']");
  if(el) el.classList.toggle("oc-collapsed",!!kqCollapsed[id]);
  else render();
}
function foldAll(on){
  filteredOrders().forEach(function(o){ if(on)kqCollapsed[o.id]=1; else delete kqCollapsed[o.id]; });
  saveCollapsed(); render();
}
function boxCount(items){ return (items||[]).reduce(function(s,i){return s+(i.qty||1);},0); }

// TAB 2: รายออเดอร์ by slot
function renderOrders(){
  var orders=filteredOrders();
  if(!orders.length){
    document.getElementById("orderView").innerHTML="<div style='text-align:center;padding:40px;color:var(--soft)'>ไม่มีออเดอร์</div>";
    return;
  }
  // group by slot
  var slotOrder=["all_day","morning","afternoon","express",""];
  var bySlot={};
  orders.forEach(function(o){
    var s=o.time_slot||"";
    if(!bySlot[s])bySlot[s]=[];
    bySlot[s].push(o);
  });
  // 🍳 ในแต่ละช่วงเวลา: Meal Plan ขึ้นก่อน แล้วเรียงตามเวลาที่ลูกค้าสั่งเข้ามา (นัทสั่ง 6 ส.ค. 2569)
  //    เดิมไม่ได้กำหนดลำดับในกลุ่มเลย → สลับที่ทุกครั้งที่โหลด ครัวจำตำแหน่งไม่ได้
  //    ที่เอา Meal Plan ขึ้นบน เพราะเป็นของทำสดต้องลงมือก่อน · สต็อก/เซ็ตหยิบทีหลังได้
  Object.keys(bySlot).forEach(function(s){
    bySlot[s].forEach(function(o){
      var it=getOrderItems(o.id);
      o._isMp = it.some(function(i){ return /^(HP|LC|MP)/i.test(i.code||""); }) || it.some(function(i){ return i._fromPlan; });
    });
    bySlot[s].sort(function(a,b){
      if(a._isMp!==b._isMp) return a._isMp?-1:1;                                   // Meal Plan ก่อน
      return String(a.created_at||"").localeCompare(String(b.created_at||""));      // แล้วใครสั่งก่อนอยู่ก่อน
    });
  });
  // 🔴 เดิมวนแค่ slotOrder 5 ค่านี้ → ออเดอร์ที่ time_slot เป็นค่าอื่น "หายเงียบ" จากจอครัว
  //    เคสจริง: ลูกค้าเลือก "ส่งระบุเวลา" ใน LIFF → time_slot เก็บเป็นเวลาจริง เช่น "14:30"
  //    (liff_customer: `time_slot: selSlot==='express' ? expressTime : selSlot`)
  //    → ครัวไม่เห็นออเดอร์นั้นเลย ทั้งที่นับรวมอยู่ในระบบ = อาการ "สั่งจริงแล้วไม่ขึ้นหน้าครัว" (แก้ 5 ส.ค. 2569)
  //    กติกาใหม่: ช่วงเวลาที่ไม่รู้จัก ต้องโผล่ท้ายจอเสมอ ห้ามตกหล่นเด็ดขาด
  var known=slotOrder.slice();
  var extra=Object.keys(bySlot).filter(function(s){return known.indexOf(s)<0;}).sort();
  // N-13: ปุ่มพับ/กางทั้งหมด — วันออเดอร์เยอะครัวพับเก็บทีเดียวแล้วค่อยกางทีละใบที่กำลังทำ
  var html="<div class='fold-bar no-print'>"
    +"<button class='fold-btn' onclick='foldAll(true)'>⊟ พับทั้งหมด</button>"
    +"<button class='fold-btn' onclick='foldAll(false)'>⊞ กางทั้งหมด</button>"
    +"<span class='fold-hint'>แตะชื่อลูกค้าเพื่อพับ/กางทีละใบ</span></div>";
  known.concat(extra).forEach(function(s){
    if(!bySlot[s]||!bySlot[s].length)return;
    var isExtra=known.indexOf(s)<0;
    var label=SLOT_LABELS[s]||(isExtra?("🕐 นัดเวลา "+escH(s)):"⏰ ไม่ระบุช่วงเวลา");
    html+="<div class='slot-sec'>"
      +"<div class='slot-hdr'><span class='slot-hdr-label'>"+label+"</span><span class='slot-hdr-count'>"+bySlot[s].length+" ออเดอร์</span></div>"
      +"<div class='slot-body'>"+bySlot[s].map(renderCard).join("")+"</div></div>";
  });
  document.getElementById("orderView").innerHTML=html;
}

function renderCard(o){
  var items=getOrderItems(o.id);
  var badge=detectBadge(items);
  var isPkg=!!(o.package_type);
  var isMp=items.some(function(i){return (i.code||"").match(/^HP|^LC/i);});
  var cardCls=isPkg?"oc pkg":isMp?"oc mealplan":"oc";
  var badgeHtml=isPkg?"<span class='oc-badge pkg'>📦 แพ็ค</span>"
    :isMp?"<span class='oc-badge mp'>🥗 Meal</span>"
    :badge!=="normal"?"<span class='oc-badge "+badge+"'>"+badge.toUpperCase()+"</span>":"";
  // 🔴 เดิม i.name.slice(0,12) → ตัดชื่อเมนูทิ้งจริงใน JS (ไม่ใช่แค่ CSS) ครัวกดดูก็ไม่เห็น
  //    ชื่อเมนูไทยยาว 20-40 ตัว เช่น "สเต็กไก่อบน้ำผึ้งผักย่าง" เหลือ "สเต็กไก่อบน้ำ" = อ่านไม่รู้เรื่องว่ารับอะไร
  //    (นัทเห็นกับตาบนจอครัวจริง 5 ส.ค. 2569) → โชว์เต็ม แล้วให้ CSS ตัดบรรทัดเอา
  var chip=function(i){
    return "<div class='item-chip'><span class='ic-code'>"+escH(getCodeDisplay(i.code,i.name))+"</span>"
      +(codeMode!=="name"?" <span class='ic-name'>"+escH(i.name)+"</span>":"")
      +" <span class='ic-qty'>×"+i.qty+"</span>"
      // 📌 โน้ตรายกล่องจากแพลนเมนู เช่น "กล่อง 2: ข้าวไรซ์เบอร์รี่" — ครัวต้องเห็นตอนจัดกล่อง
      +(i.boxNote?"<span class='ic-note'>📌 "+escH(i.boxNote)+"</span>":"")
      +"</div>";
  };
  var itemsHtml="";
  if(items.length){
    groupOrderItems(items).forEach(function(g){
      var boxes=g.items.reduce(function(s,i){return s+(i.qty||1);},0);
      if(g.fromPlan){
        // เมนูมาจากหน้า "แพลนเมนู" ไม่ใช่จากตะกร้าลูกค้า — บอกครัวให้ชัด กันเข้าใจผิดว่าลูกค้าสั่งเอง
        itemsHtml+="<div class='set-box'><div class='set-hdr'>🥗 เมนูจากแพลน "+escH(g.fromPlan)
          +" <span class='set-n'>"+boxes+" กล่อง</span></div>"
          +"<div class='items-grid'>"+g.items.map(chip).join("")+"</div></div>";
      }else if(g.pkg){
        // เซ็ต/คอร์ส → หัวข้อ + รายการย่อยข้างใน ครัวจะได้รู้ว่าของพวกนี้อยู่ชุดเดียวกัน
        itemsHtml+="<div class='set-box'><div class='set-hdr'>📦 เซ็ต/คอร์ส"
          +(g.round?" · รอบ "+escH(g.round):"")+" <span class='set-n'>"+boxes+" กล่อง</span></div>"
          +"<div class='items-grid'>"+g.items.map(chip).join("")+"</div></div>";
      }else{
        itemsHtml+="<div class='items-grid'>"+g.items.map(chip).join("")+"</div>";
      }
    });
  }else itemsHtml="<span style='color:var(--xsoft);font-size:11px'>ไม่พบรายการ</span>";
  // Meal Plan = ซื้อทั้ง subscription ครั้งเดียว ไม่ใช่ของที่ต้องจัดกล่องในวันนี้วันเดียว
  // รอบส่งจริง + เมนูที่กำหนด อยู่ที่ mp_deliveries → ลิ้งไปดูที่แท็บ "รายสินค้า" แทนปุ่มจัดกล่อง
  // ปุ่ม 2 ขั้น: จัดกล่องเสร็จ → ส่งแมสแล้ว · ยกเลิกย้อนได้ทั้งคู่ (นัทสั่ง 6 ส.ค. 2569)
  var packed = (o.status==="ready"||o.status==="delivered");
  var shipped = (o.status==="delivered");
  var actions;
  if(isMp){
    actions="<div class='oc-actions'><span onclick='switchTab(1)' style='color:var(--g);font-weight:700;cursor:pointer;text-decoration:underline'>📋 ดูรอบส่ง & เมนูที่แท็บ \"รายสินค้า\" →</span></div>";
  }else{
    var b="";
    if(!packed) b+="<button class='btn-pack' onclick='markPacked(\""+o.id+"\")'>✅ จัดกล่องเสร็จ</button>";
    else b+="<button class='btn-undo' onclick='markUnpack(\""+o.id+"\")'>↩ ยังไม่จัด</button>";
    if(packed&&!shipped) b+="<button class='btn-ship' onclick='markShipped(\""+o.id+"\")'>🛵 ส่งแมสแล้ว</button>";
    if(shipped)          b+="<button class='btn-undo' onclick='markUnship(\""+o.id+"\")'>↩ ยังไม่ส่ง</button>";
    actions="<div class='oc-actions'>"+b+"</div>";
  }
  var wantsUtensils=o.want_utensils!==false;
  var utensilHtml="<div class='oc-utensil"+(kitchenUtensilSize==="large"?" oc-utensil-lg":"")+(wantsUtensils?"":" oc-utensil-no")+"'>"
    +(wantsUtensils?"🥄🍴 ใส่ช้อนส้อม":"❌ ไม่ต้องช้อนส้อม")+"</div>";
  var stateTag = shipped?"<span class='oc-state shipped'>🛵 ส่งแมสแล้ว</span>"
               : packed?"<span class='oc-state packed'>✅ จัดกล่องแล้ว</span>":"";
  // N-13: พับได้ — ตอนพับยังต้องเห็น ชื่อ · จำนวนกล่อง · สถานะ (ข้อมูลที่ครัวใช้ตัดสินใจ)
  var isCol=!!kqCollapsed[o.id];
  var nBox=boxCount(items);
  // Meal Plan ที่แอดมินยังไม่ assign เมนู จะไม่มี order_items เลย → นับกล่องจากรอบส่ง (mp_deliveries.box_count)
  // ไม่งั้นตอนพับจะขึ้น "0 กล่อง" ทั้งที่จริงมีของต้องทำ
  if(!nBox){ var _mp=findMpFor(o); if(_mp&&_mp.box_count) nBox=_mp.box_count; }
  var boxTag="<span class='oc-boxn'>📦 "+nBox+" กล่อง</span>";
  // 🖥️ 2 คอลัมน์: ซ้าย = ข้อมูลลูกค้า · ขวา = ของที่ต้องจัด + ปุ่ม (จอแคบยุบเป็นคอลัมน์เดียวเอง)
  return "<div class='"+cardCls+(shipped?" oc-done":"")+(isCol?" oc-collapsed":"")+"' data-oid='"+escH(o.id)+"'>"
    +"<div class='oc-2col'>"
      +"<div class='oc-left'>"
        +"<div class='oc-top' onclick='toggleCard(\""+o.id+"\")' title='แตะเพื่อพับ/กาง'>"
        +"<span class='oc-caret'>▾</span>"+badgeHtml+"<div style='flex:1;min-width:0'>"
        +"<div style='display:flex;align-items:center;gap:6px;flex-wrap:wrap'><div class='oc-name'>"+escH(o.customer_name||"ลูกค้า")+"</div>"+lineTag(o)
        +"<div class='oc-order-num'>"+escH(o.order_number||"—")+"</div>"
        +boxTag
        +"<span class='oc-pay "+(o.payment_status==="paid"?"is-paid":"is-unpaid")+"' title='สถานะการโอน (แก้ที่หน้า OH)'>"+(o.payment_status==="paid"?"💰 โอนแล้ว":"⏳ รอโอน")+"</span>"
        +stateTag+"</div>"
        +"<div class='oc-meta'>📍 "+escH(o.delivery_address_text||o.delivery_address||"—")+"</div>"
        +(o.customer_phone?"<div class='oc-meta'>📞 "+escH(o.customer_phone)+"</div>":"")
        +"<div class='oc-meta oc-meta-sm'>🗓️ สั่ง "+fmtOrderPlaced(o.created_at)+" · ส่ง "+fmtDate(o.delivery_date)+"</div></div></div>"
        +dietBox(o)
        +(o.notes?"<div class='oc-note'>📌 "+escH(o.notes)+"</div>":"")
      +"</div>"
      +"<div class='oc-right'>"+itemsHtml+utensilHtml+actions+"</div>"
    +"</div></div>";
}

// ── ACTIONS ──────────────────────────────────────────────
// ส่งแมสแล้ว = ปิดงานของครัวใบนั้น · ยังเห็นการ์ดอยู่ (จางลง) เพื่อกดยกเลิกย้อนได้
async function markShipped(id){
  if(!requireKqUser())return;
  var sb_=getSB(); if(!sb_)return;
  var w=await sb_.from("orders").update({status:"delivered",updated_at:new Date().toISOString()}).eq("id",id);
  if(w.error){kqWriteFail(w.error,"ส่งแมสแล้ว");return;}
  var o=allOrders.find(function(x){return x.id===id;}); if(o)o.status="delivered";
  logKqActivity((o?o.customer_name+" ("+(o.order_number||"—")+") — ":"")+"🛵 ส่งแมสแล้ว");
  render();
}
async function markUnship(id){
  if(!requireKqUser())return;
  var sb_=getSB(); if(!sb_)return;
  var w=await sb_.from("orders").update({status:"ready",updated_at:new Date().toISOString()}).eq("id",id);
  if(w.error){kqWriteFail(w.error,"ย้อนสถานะส่ง");return;}
  var o=allOrders.find(function(x){return x.id===id;}); if(o)o.status="ready";
  logKqActivity((o?o.customer_name+" ("+(o.order_number||"—")+") — ":"")+"↩ ยกเลิกส่งแมส");
  render();
}

async function markPacked(id){
  if(!requireKqUser())return;
  var sb_=getSB(); if(!sb_)return;
  var _w5=await sb_.from("orders").update({status:"ready",updated_at:new Date().toISOString()}).eq("id",id); if(_w5.error){kqWriteFail(_w5.error,"จัดกล่องเสร็จ");return;}
  var o=allOrders.find(function(x){return x.id===id;}); if(o)o.status="ready";
  logKqActivity((o?o.customer_name+" ("+(o.order_number||"—")+") — ":"")+"✅ จัดกล่องเสร็จ");
  render();
}
async function markUnpack(id){
  if(!requireKqUser())return;
  var sb_=getSB(); if(!sb_)return;
  var _w6=await sb_.from("orders").update({status:"confirmed",updated_at:new Date().toISOString()}).eq("id",id); if(_w6.error){kqWriteFail(_w6.error,"ย้อนสถานะ");return;}
  var o=allOrders.find(function(x){return x.id===id;}); if(o)o.status="confirmed";
  logKqActivity((o?o.customer_name+" ("+(o.order_number||"—")+") — ":"")+"↩ ยกเลิกจัดกล่อง");
  render();
}

// ── UTIL ─────────────────────────────────────────────────
function escH(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
// โชว์ชื่อ LINE ต่อท้าย เฉพาะตอนไม่ตรงกับชื่อผู้รับ — กันสั่งซ้ำ 2 รอบให้คนละคน
/* กล่องข้อจำกัดอาหารบนการ์ดออเดอร์
   แพ้ = อันตรายถึงชีวิต (แดงเข้ม กรอบหนา) · ไม่ทาน = ความชอบ (ส้มอ่อน)
   ไม่มีข้อจำกัด = ไม่ขึ้นอะไรเลย — ถ้าขึ้นทุกใบ ครัวจะชินแล้วเลิกอ่าน */
function dietBox(o){
  var p=(o&&o.customer_id)?custPrefs[o.customer_id]:null; if(!p) return "";
  var al=String(p.allergies||"").trim(), dl=String(p.dislikes||"").trim();
  if(!al&&!dl) return "";
  var h="";
  if(al) h+="<div class='oc-diet oc-diet-al'>⚠️ แพ้ "+escH(al)+"</div>";
  if(dl) h+="<div class='oc-diet oc-diet-dl'>ไม่ทาน "+escH(dl)+"</div>";
  return h;
}
function lineTag(o){
  if(!o||!o.line_display_name||o.line_display_name===o.customer_name) return "";
  return " <span style='font-size:10px;color:#9CA3AF;font-weight:400'>(LINE: "+escH(o.line_display_name)+")</span>";
}

// ── INIT ─────────────────────────────────────────────────
// 🔴 N-32 (6 ส.ค. 2569): เดิมลูป d.setDate(getDate()-i) i=0..13 = สร้างแต่ "วันย้อนหลัง" ล้วน
//    → ครัวเลือกวันข้างหน้าไม่ได้เลย = เตรียมของล่วงหน้าไม่ได้ + เช็ครอบ Meal Plan วันหน้าไม่ได้
//    (ตัวเลือกวันสร้างจาก "ช่วงวันคงที่" ไม่ได้สร้างจากออเดอร์จริง — ข้อมูลวันอนาคตมีใน DB อยู่แล้ว)
//    แก้: ล่วงหน้า 14 วัน (optgroup "ล่วงหน้า") + ย้อนหลัง 7 วัน แยกกลุ่มกันครัวกดผิด
var KQ_FUTURE_DAYS=14, KQ_PAST_DAYS=7;
var kqPickerBuiltFor=null;
function kqDayOffset(n){var d=new Date();d.setDate(d.getDate()+n);return d;}
function buildDatePicker(){
  var sel=document.getElementById("calPicker");
  if(!sel)return;
  var keep=sel.value;
  sel.innerHTML="<option value=''>📅 เลือกวัน...</option>";
  var gF=document.createElement("optgroup");gF.label="🔜 ล่วงหน้า";
  var gP=document.createElement("optgroup");gP.label="↩ ย้อนหลัง";
  function mk(n){
    var d=kqDayOffset(n);
    var lbl=d.toLocaleDateString("th-TH",{weekday:"short",day:"numeric",month:"short"});
    var pre=n===0?"วันนี้ · ":n===1?"พรุ่งนี้ · ":n>1?"🔜 ":"↩ ";
    var opt=document.createElement("option");opt.value=toISO(d);opt.textContent=pre+lbl;
    return opt;
  }
  for(var i=0;i<=KQ_FUTURE_DAYS;i++) gF.appendChild(mk(i));
  for(var j=1;j<=KQ_PAST_DAYS;j++)   gP.appendChild(mk(-j));
  sel.appendChild(gF); sel.appendChild(gP);
  if(keep) sel.value=keep;                 // auto-refresh ต้องไม่เขี่ยวันที่ครัวเลือกไว้ทิ้ง
  kqPickerBuiltFor=today();
}
buildDatePicker();
