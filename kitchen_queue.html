/* ⚠️ ใบที่อาจเป็นออเดอร์ซ้ำ — ลูกค้าคนเดียวกัน วันส่งเดียวกัน สั่งห่างกันไม่เกิน 30 นาที
   เคสจริง 23 ส.ค.: Leklucky สั่ง 2 ใบห่างกัน 4 นาที (ใบแรกไม่จ่าย) ครัวจัดไปแล้วทั้งคู่
   ครัวต้องเห็น "ก่อนจัด" ไม่ใช่รู้ตอนของหายไปแล้ว
   ⚠️ ไม่ซ่อนใบไหนทั้งนั้น — แค่ติดป้ายให้คนตัดสินใจ ระบบไม่มีทางรู้แน่ว่าใบไหนคือของจริง */
var DUP_WINDOW_MIN = 30;
function dupMate(o){
  if(!o || !o.delivery_date) return null;
  /* ⚠️ ดูเฉพาะใบที่มียอดเงินจริง
     ใบยอด ฿0 = ใบรอบย่อยของคอร์สที่ระบบเปิดให้เอง (เช่น โอ๋สั่ง LC+HP คู่กัน = ตั้งใจ ไม่ใช่ซ้ำ)
     ถ้าไม่กรอง จะติดป้ายเตือน 10 ใบทั้งที่ของจริงซ้ำแค่คู่เดียว = ครัวจะเลิกเชื่อป้ายนี้ */
  if(!(Number(o.total)>0)) return null;
  var mine = o.line_uid || o.customer_name;
  if(!mine) return null;
  var t0 = new Date(o.created_at||0).getTime();
  return (allOrders||[]).find(function(x){
    if(x.id===o.id) return false;
    if(x.status==="cancelled" || x.source==="parallel_test") return false;
    if(!(Number(x.total)>0)) return false;
    if(x.delivery_date!==o.delivery_date) return false;
    if((x.line_uid||x.customer_name)!==mine) return false;
    var dt=Math.abs(new Date(x.created_at||0).getTime()-t0)/60000;
    return dt<=DUP_WINDOW_MIN;
  })||null;
}
function dupBadge(o){
  var m=dupMate(o); if(!m) return "";
  var unpaid = (o.payment_status!=="paid");
  return "<span title='ลูกค้าคนนี้มีอีกใบวันเดียวกัน ("+escH(m.order_number||"—")+") สั่งห่างกันไม่ถึง "+DUP_WINDOW_MIN+" นาที — เช็คก่อนจัด' "
    +"style='font-size:11px;font-weight:800;border-radius:6px;padding:1px 7px;"
    +(unpaid?"color:#B91C1C;background:#FEE2E2;border:1px solid #FCA5A5":"color:#92400E;background:#FEF3C7;border:1px solid #F5E4A8")
    +"'>⚠️ อาจซ้ำกับ "+escH(m.order_number||"—")+"</span>";
}

function renderCard(o){
  var packed = (o.status==="ready"||o.status==="delivered");
  var shipped = (o.status==="delivered");
  var stale  = !!(o.delivery_date && o.delivery_date < today());
  var items=getOrderItems(o.id);
  var badge=detectBadge(items);
  var isPkg=!!(o.package_type);
  /* 🥗 ป้าย Meal Plan — เดิมเช็คแค่รหัสขึ้นต้น HP/LC
     มิ้ม (U-0814-001) รหัสเป็น "MP-LC-R3" เลยไม่ติดป้าย ครัวมองไม่ออกว่าเป็น Meal Plan (ฟ้าจับได้ 13 ส.ค. 2569)
     ⚠️ ห้ามพึ่งตาราง mp_deliveries อย่างเดียวด้วย — แถวรอบส่งหายไปได้จริง (ของมิ้มไปกองผิดวัน)
        แต่ order_items.notes มี "meal_plan:lc:..." ติดมาตั้งแต่ตอนลูกค้าสั่ง = หลักฐานที่ไม่หาย */
  var isMp=items.some(function(i){
    return /^(HP|LC|MP)/i.test(i.code||"") || /meal_plan:/i.test(String(i.notes||""));
  }) || !!o._isMp;
  var cardCls=isPkg?"oc pkg":isMp?"oc mealplan":"oc";
  var badgeHtml=isPkg?"<span class='oc-badge pkg'>📦 แพ็ค</span>"
    :isMp?"<span class='oc-badge mp'>🥗 Meal</span>"
    :badge!=="normal"?"<span class='oc-badge "+badge+"'>"+badge.toUpperCase()+"</span>":"";
  // 🔴 เดิม i.name.slice(0,12) → ตัดชื่อเมนูทิ้งจริงใน JS (ไม่ใช่แค่ CSS) ครัวกดดูก็ไม่เห็น
  //    ชื่อเมนูไทยยาว 20-40 ตัว เช่น "สเต็กไก่อบน้ำผึ้งผักย่าง" เหลือ "สเต็กไก่อบน้ำ" = อ่านไม่รู้เรื่องว่ารับอะไร
  //    (นัทเห็นกับตาบนจอครัวจริง 5 ส.ค. 2569) → โชว์เต็ม แล้วให้ CSS ตัดบรรทัดเอา
  var chip=function(i){
    return "<div class='item-chip'"+(i.gift?" style='background:#FEF3C7;border-color:#F5E4A8'":"")+">"
      +(i.gift?"<span style='font-size:11px;font-weight:800;color:#92400E'>🎁</span> ":"")
      +"<span class='ic-code'>"+escH(getCodeDisplay(i.code,i.name))+"</span>"
      +(codeMode!=="name"?" <span class='ic-name'>"+escH(i.name)+"</span>":"")
      +" <span class='ic-qty'>×"+i.qty+"</span>"
      // 📌 โน้ตรายกล่องจากแพลนเมนู เช่น "กล่อง 2: ข้าวไรซ์เบอร์รี่" — ครัวต้องเห็นตอนจัดกล่อง
      +(i.boxNote?"<span class='ic-note'>📌 "+escH(i.boxNote)+"</span>":"")
      +"</div>";
  };
  /* โหมดจัดของ: บรรทัดละรายการ + ช่องติ๊ก · โหมดปกติ: ชิปแบบเดิมทุกอย่าง */
  if(kqPackMode){
    chip=function(i){
      /* 🔴 เครื่องหมายติ๊กเปล่าๆ เก็บใน localStorage = เครื่องใครเครื่องมัน
         เคสจริง 23 ส.ค.: ครัวกดจัดครบแล้วส่งรูปมาให้นัทดู จอครัวขึ้น 12/12
         แต่จอนัทขึ้น 0/12 ทั้งที่ใบเดียวกันและปิดงานไปแล้ว → นัทนึกว่าครัวยังไม่ได้ทำ
         แก้: อะไรที่ "จริง" ต้องมาจาก DB — ใบที่ปิดแล้ว/จัดบางส่วนแล้ว ติ๊กให้เองทุกเครื่อง
              ส่วนติ๊กในเครื่องเหลือหน้าที่เดียว = กันหลงตาระหว่างไล่หยิบของที่ยังไม่ยืนยัน */
      var k=pkKeyOf(o.id,i), dn=pkDoneQty(o.id,i.code);
      var full=(dn>=(i.qty||1)) || packed;
      var on=(full||kqTicks[k])?" on":"";
      /* จัดไปแล้ว = ล็อกไว้ กดไม่ได้ ต้องกด "ยกเลิกจัดบางส่วน" ถึงจะแก้ได้
         ถ้าปล่อยให้กดสลับเล่นได้ สต็อกจะขยับตามนิ้วที่เผลอแตะ */
      return "<div class='pk-row"+on+(full?" pk-locked":"")+"' data-q='"+(i.qty||1)+"' data-oid=\""+escA(o.id)+"\" data-k=\""+escA(k)+"\""
        +(full?"":" onclick='pkTick(this,event)'")+">"
        +"<span class='pk-box'></span><span class='pk-main'>"
        +(full?"<span style='font-size:11px;font-weight:800;color:#166534;background:#DCFCE7;border-radius:5px;padding:1px 6px;margin-right:5px;'>จัดแล้ว</span>":"")
        +(dn>0&&!full?"<span style='font-size:11px;font-weight:800;color:#92400E;background:#FEF3C7;border-radius:5px;padding:1px 6px;margin-right:5px;'>จัดแล้ว "+dn+"/"+(i.qty||1)+"</span>":"")
        +(i.gift?"<span style='font-size:11px;font-weight:800;color:#92400E;background:#FEF3C7;border-radius:5px;padding:1px 6px;margin-right:5px;'>🎁 แถม</span>":"")
        +"<span class='pk-code'>"+escH(getCodeDisplay(i.code,i.name))+"</span> "
        +"<span class='pk-name'>"+escH(i.name)+"</span>"
        +(i.boxNote?"<span class='pk-note'>📌 "+escH(i.boxNote)+"</span>":"")
        +"</span><span class='pk-qty'>×"+(i.qty||1)+"</span></div>";
    };
  }
  var GRID=kqPackMode?"pk-list":"items-grid";
  var itemsHtml="";
  if(items.length){
    groupOrderItems(items).forEach(function(g){
      var boxes=g.items.reduce(function(s,i){return s+(i.qty||1);},0);
      if(g.fromPlan){
        // เมนูมาจากหน้า "แพลนเมนู" ไม่ใช่จากตะกร้าลูกค้า — บอกครัวให้ชัด กันเข้าใจผิดว่าลูกค้าสั่งเอง
        itemsHtml+="<div class='set-box'><div class='set-hdr'>🥗 เมนูจากแพลน "+escH(g.fromPlan)
          +" <span class='set-n'>"+boxes+" กล่อง</span></div>"
          +"<div class='"+GRID+"'>"+g.items.map(chip).join("")+"</div></div>";
      }else if(g.pkg){
        // เซ็ต/คอร์ส → หัวข้อ + รายการย่อยข้างใน ครัวจะได้รู้ว่าของพวกนี้อยู่ชุดเดียวกัน
        itemsHtml+="<div class='set-box'><div class='set-hdr'>📦 เซ็ต/คอร์ส"
          +(g.round?" · รอบ "+escH(g.round):"")+" <span class='set-n'>"+boxes+" กล่อง</span></div>"
          +"<div class='"+GRID+"'>"+g.items.map(chip).join("")+"</div></div>";
      }else{
        itemsHtml+="<div class='"+GRID+"'>"+g.items.map(chip).join("")+"</div>";
      }
    });
  }else itemsHtml="<span style='color:var(--xsoft);font-size:11px'>ไม่พบรายการ</span>";
  // Meal Plan = ซื้อทั้ง subscription ครั้งเดียว ไม่ใช่ของที่ต้องจัดกล่องในวันนี้วันเดียว
  // รอบส่งจริง + เมนูที่กำหนด อยู่ที่ mp_deliveries → ลิ้งไปดูที่แท็บ "รายสินค้า" แทนปุ่มจัดกล่อง
  // ปุ่ม 2 ขั้น: จัดกล่องเสร็จ → ส่งแมสแล้ว · ยกเลิกย้อนได้ทั้งคู่ (นัทสั่ง 6 ส.ค. 2569)
  var actions;
  if(isMp){
    actions="<div class='oc-actions'><span onclick='switchTab(1)' style='color:var(--g);font-weight:700;cursor:pointer;text-decoration:underline'>📋 ดูรอบส่ง & เมนูที่แท็บ \"รายสินค้า\" →</span></div>";
  }else{
    var b="";
    /* 📦 จัดเสร็จบางส่วน — โผล่เฉพาะตอนอยู่โหมดจัดของ + ติ๊กไว้บ้างแต่ยังไม่ครบ
       เหตุผลที่ต้องมี (นัท): บางเมนูต้องรอของทำวันถัดไป แต่ที่จัดได้แล้วควรตัดสต็อกไปก่อน
       ไม่งั้นของที่ออกจากตู้ไปแล้วยังนับว่าอยู่ = ครัวหยิบไปใช้กับใบอื่นซ้ำ */
    if(!packed && kqPackMode){
      var _tk=0;
      groupOrderItems(items).forEach(function(g){ g.items.forEach(function(i){
        if(pkDoneQty(o.id,i.code) >= (i.qty||1)) return;      // ยืนยันไปแล้ว ไม่ต้องนับซ้ำ
        if(kqTicks[pkKeyOf(o.id,i)]) _tk += (i.qty||1);
      }); });
      b+= _tk
        ? "<button class='btn-part hot' onclick='markPackedPartial(\""+o.id+"\")'>📦 ยืนยันจัดเสร็จ "+_tk+" กล่อง</button>"
        : "<button class='btn-part' onclick='markPackedPartial(\""+o.id+"\")'>📦 จัดเสร็จบางส่วน</button>";
    }
    if(!packed && pkDoneTotal(o.id)) b+="<button class='btn-undo' onclick='clearPartial(\""+o.id+"\")'>↩ ยกเลิกจัดบางส่วน</button>";
    if(!packed) b+="<button class='btn-pack' onclick='markPacked(\""+o.id+"\")'>✅ จัดกล่องเสร็จ</button>";
    else b+="<button class='btn-undo' onclick='markUnpack(\""+o.id+"\")'>↩ ยังไม่จัด</button>";
    if(packed&&!shipped) b+="<button class='btn-ship' onclick='markShipped(\""+o.id+"\")'>🛵 ส่งแมสแล้ว</button>";
    if(shipped)          b+="<button class='btn-undo' onclick='markUnship(\""+o.id+"\")'>↩ ยังไม่ส่ง</button>";
    actions="<div class='oc-actions'>"+b+"</div>";
  }
  var wantsUtensils=o.want_utensils!==false;
  var utensilHtml="<div class='oc-utensil"+(kitchenUtensilSize==="large"?" oc-utensil-lg":"")+(wantsUtensils?"":" oc-utensil-no")+"'>"
    +(wantsUtensils?"🥄🍴 ใส่ช้อนส้อม":"❌ ไม่ต้องช้อนส้อม")+"</div>";
  var stateTag = shipped?"<span class='oc-state shipped'>🛵 ส่งแมสแล้ว</span>"
               : packed?"<span class='oc-state packed'>✅ จัดกล่องแล้ว</span>":"";
  // N-13: พับได้ — ตอนพับยังต้องเห็น ชื่อ · จำนวนกล่อง · สถานะ (ข้อมูลที่ครัวใช้ตัดสินใจ)
  var isCol=!!kqCollapsed[o.id];
  var nBox=boxCount(items);
  // Meal Plan ที่แอดมินยังไม่ assign เมนู จะไม่มี order_items เลย → นับกล่องจากรอบส่ง (mp_deliveries.box_count)
  // ไม่งั้นตอนพับจะขึ้น "0 กล่อง" ทั้งที่จริงมีของต้องทำ
  if(!nBox){ var _mp=findMpFor(o); if(_mp&&_mp.box_count) nBox=_mp.box_count; }
  var boxTag=(stale?"<span class='stale-tag'>⏮ เลยวันส่งแล้ว ("+escH(fmtDate(o.delivery_date))+")</span> ":"")
    +"<span class='oc-boxn'>📦 "+nBox+" กล่อง</span>";
  /* ตัวนับอยู่บนหัว = ตอนพับการ์ดก็ยังเห็นว่าใบนี้จัดไปถึงไหน */
  if(kqPackMode && items.length && !isMp){
    var _tot=0,_done=0;
    groupOrderItems(items).forEach(function(g){ g.items.forEach(function(i){
      var q=i.qty||1; _tot+=q;
      var dn=pkDoneQty(o.id,i.code);
      if(packed || dn>=q) _done+=q;             // ปิดใบแล้ว/ยืนยันแล้ว = นับเสมอ ไม่ขึ้นกับเครื่อง
      else if(kqTicks[pkKeyOf(o.id,i)]) _done+=q;
    }); });
    var _dnAll=pkDoneTotal(o.id);
    if(_dnAll) boxTag+="<span style='font-size:11.5px;font-weight:800;color:#166534;background:#DCFCE7;border:1px solid #86EFAC;border-radius:6px;padding:1px 7px;'>📦 จัดแล้ว "+_dnAll+"/"+_tot+"</span>";
    boxTag+="<span class='oc-prog"+((_tot&&_done>=_tot)?" full":"")+"'>☑ "+_done+"/"+_tot+"</span>";
  }
  // 🖥️ 2 คอลัมน์: ซ้าย = ข้อมูลลูกค้า · ขวา = ของที่ต้องจัด + ปุ่ม (จอแคบยุบเป็นคอลัมน์เดียวเอง)
  return "<div class='"+cardCls+(stale?" stale":(packed?"":" todo"))+(shipped?" oc-done":"")+(isCol?" oc-collapsed":"")+(kqPackMode?" pk-lean":"")+"' data-oid='"+escH(o.id)+"'>"
    +"<div class='oc-2col'>"
      +"<div class='oc-left'>"
        +"<div class='oc-top' onclick='toggleCard(\""+o.id+"\")' title='แตะเพื่อพับ/กาง'>"
        +"<span class='oc-caret'>▾</span>"+badgeHtml+"<div style='flex:1;min-width:0'>"
        +"<div style='display:flex;align-items:center;gap:6px;flex-wrap:wrap'><div class='oc-name'>"+escH(o.customer_name||"ลูกค้า")+"</div>"+lineTag(o)
        +"<div class='oc-order-num'>"+escH(o.order_number||"—")+"</div>"
        +boxTag
        +"<span class='oc-pay "+(o.payment_status==="paid"?"is-paid":"is-unpaid")+"' title='สถานะการโอน (แก้ที่หน้า OH)'>"+(o.payment_status==="paid"?"💰 โอนแล้ว":"⏳ รอโอน")+"</span>"
        +stateTag
        +dupBadge(o)
        +(kqPackMode?"<span class='pk-info' onclick='pkInfo(this,event)'>📍 ที่อยู่/เบอร์</span>":"")
        +"</div>"
        +"<div class='oc-meta'>📍 "+escH(o.delivery_address_text||o.delivery_address||"—")+"</div>"
        +(o.customer_phone?"<div class='oc-meta'>📞 "+escH(o.customer_phone)+"</div>":"")
        +"<div class='oc-meta oc-meta-sm'>🗓️ สั่ง "+fmtOrderPlaced(o.created_at)+" · ส่ง "+fmtDate(o.delivery_date)+"</div></div></div>"
        +dietBox(o)
        +(o.notes?"<div class='oc-note'>📌 "+escH(o.notes)+"</div>":"")
      +"</div>"
      +"<div class='oc-right'>"+itemsHtml+utensilHtml+actions+"</div>"
    +"</div></div>";
}

// ── ACTIONS ──────────────────────────────────────────────
// ส่งแมสแล้ว = ปิดงานของครัวใบนั้น · ยังเห็นการ์ดอยู่ (จางลง) เพื่อกดยกเลิกย้อนได้
async function markShipped(id){
  if(!requireKqUser())return;
  var sb_=getSB(); if(!sb_)return;
  var w=await sb_.from("orders").update({status:"delivered",updated_at:new Date().toISOString()}).eq("id",id);
  if(w.error){kqWriteFail(w.error,"ส่งแมสแล้ว");return;}
  var o=allOrders.find(function(x){return x.id===id;}); if(o)o.status="delivered";
  logKqActivity((o?o.customer_name+" ("+(o.order_number||"—")+") — ":"")+"🛵 ส่งแมสแล้ว");
  render();
}
async function markUnship(id){
  if(!requireKqUser())return;
  var sb_=getSB(); if(!sb_)return;
  var w=await sb_.from("orders").update({status:"ready",updated_at:new Date().toISOString()}).eq("id",id);
  if(w.error){kqWriteFail(w.error,"ย้อนสถานะส่ง");return;}
  var o=allOrders.find(function(x){return x.id===id;}); if(o)o.status="ready";
  logKqActivity((o?o.customer_name+" ("+(o.order_number||"—")+") — ":"")+"↩ ยกเลิกส่งแมส");
  render();
}

/* 📦 จัดเสร็จบางส่วน — ยืนยันเฉพาะที่ติ๊กไว้ตอนนี้ ว่า "ของออกจากตู้แล้ว"
   ใบยังไม่ปิด (status ยังเป็น confirmed) ครัวยังเห็นการ์ดอยู่ เพราะยังมีของค้างต้องทำ */
async function markPackedPartial(id){
  if(!requireKqUser())return;
  var o=allOrders.find(function(x){return x.id===id;}); if(!o) return;
  var its=getOrderItems(id)||[];
  var add={}, n=0;
  its.forEach(function(i){
    var code=String(i.code||""); if(!code) return;
    var already=pkDoneQty(id,code);
    if(already>=(i.qty||1)) return;                 // จัดครบแล้ว ข้าม
    if(!kqTicks[pkKeyOf(id,i)]) return;             // ยังไม่ติ๊ก = ยังไม่จัด
    add[code]=(i.qty||1); n+=(i.qty||1)-already;
  });
  if(!n){ toast("ยังไม่ได้ติ๊กรายการที่จัดเสร็จ — แตะบรรทัดที่จัดลงถุงแล้วก่อน"); return; }
  var tot=its.reduce(function(a,i){return a+(i.qty||1);},0);
  var doneAfter=Object.keys(add).reduce(function(a,c){return a+add[c];},0)
    + its.filter(function(i){return !add[String(i.code||"")];}).reduce(function(a,i){return a+pkDoneQty(id,String(i.code||""));},0);
  if(!confirm("ยืนยันว่าจัดลงถุงแล้ว "+n+" กล่อง?\n\nของจะถูกตัดออกจากสต็อกทันที\nใบนี้ยังไม่ปิด — เหลืออีก "+(tot-doneAfter)+" กล่องรอทำ")) return;
  var prev=JSON.parse(JSON.stringify(pkDone[id]||{}));
  pkDone[id]=Object.assign(pkDoneOf(id),add);
  var ok=await pkSaveDone();
  if(!ok){ pkDone[id]=prev; render(); return; }     // เขียนไม่ผ่าน = ถอยคืน ห้ามให้จอกับ DB ไม่ตรงกัน
  logKqActivity((o.customer_name||"")+" ("+(o.order_number||"—")+") — 📦 จัดเสร็จบางส่วน "+n+" กล่อง (เหลือ "+(tot-doneAfter)+")");
  render();
}
/* ยกเลิกจัดบางส่วน = คืนของกลับเข้าสต็อก ทั้งใบ (ไม่ให้ยกเลิกทีละรายการ — ครัวจะงงว่าตัวไหนคืนแล้ว) */
async function clearPartial(id){
  if(!requireKqUser())return;
  var n=pkDoneTotal(id); if(!n) return;
  if(!confirm("ยกเลิก "+String.fromCharCode(34)+"จัดเสร็จบางส่วน"+String.fromCharCode(34)+" ทั้งใบ?\n\nของ "+n+" กล่องจะถูกคืนกลับเข้าสต็อก")) return;
  var prev=JSON.parse(JSON.stringify(pkDone[id]||{}));
  delete pkDone[id];
  var ok=await pkSaveDone();
  if(!ok){ pkDone[id]=prev; render(); return; }
  var o=allOrders.find(function(x){return x.id===id;});
  logKqActivity((o?o.customer_name+" ("+(o.order_number||"—")+") — ":"")+"↩ ยกเลิกจัดบางส่วน (คืน "+n+" กล่อง)");
  render();
}

async function markPacked(id){
  if(!requireKqUser())return;
  var sb_=getSB(); if(!sb_)return;
  var o0=allOrders.find(function(x){return x.id===id;});
  // กันตัดซ้ำ: ผูกกับ "การเปลี่ยนสถานะ" ไม่ใช่ "การกดปุ่ม" — กดซ้ำตอนเป็น ready อยู่แล้วต้องไม่ลดอีกรอบ
  if(o0 && (o0.status==="ready"||o0.status==="delivered")){ render(); return; }
  var _w5=await sb_.from("orders").update({status:"ready",updated_at:new Date().toISOString()}).eq("id",id); if(_w5.error){kqWriteFail(_w5.error,"จัดกล่องเสร็จ");return;}
  var o=allOrders.find(function(x){return x.id===id;}); if(o)o.status="ready";
  /* ใบที่ปิดครบแล้วหลุดจากตัวนับสต็อกทั้งใบอยู่แล้ว — ถ้าปล่อย pkDone ค้างไว้
     พอกด "ยังไม่จัด" ย้อนกลับมา ของจะถูกหักซ้ำรอบสอง */
  if(pkDone[id]){ delete pkDone[id]; pkSaveDone(); }
  pkSetAll(id,true);
  logKqActivity((o?o.customer_name+" ("+(o.order_number||"—")+") — ":"")+"✅ จัดกล่องเสร็จ");
  render();
}
async function markUnpack(id){
  if(!requireKqUser())return;
  var sb_=getSB(); if(!sb_)return;
  var o0=allOrders.find(function(x){return x.id===id;});
  if(o0 && o0.status!=="ready"){ render(); return; }   // ไม่ได้อยู่สถานะจัดแล้ว = ไม่มีอะไรให้คืน
  var _w6=await sb_.from("orders").update({status:"confirmed",updated_at:new Date().toISOString()}).eq("id",id); if(_w6.error){kqWriteFail(_w6.error,"ย้อนสถานะ");return;}
  var o=allOrders.find(function(x){return x.id===id;}); if(o)o.status="confirmed";
  pkSetAll(id,false);
  logKqActivity((o?o.customer_name+" ("+(o.order_number||"—")+") — ":"")+"↩ ยกเลิกจัดกล่อง");
  render();
}

// ── PRINT ─────────────────────────────────────────────────
function openPrint(){document.getElementById("printModal").style.display="flex";}
function closePrint(){document.getElementById("printModal").style.display="none";}
function doPrint(type){
  closePrint();
  /* ใบจัดของสลิปเทอร์มอลอยู่คนละหน้า (จัดหน้ากระดาษ 58/80mm คนละแบบกับหน้าจอ)
     → เปิดหน้านั้นพร้อมวันที่ที่ครัวเลือกอยู่ ไม่ต้องไปเลือกวันซ้ำอีกรอบ
     ไม่มีวันเจาะจง (ดู "ทั้งหมด") = ส่งวันนี้ไป กันเปิดมาเจอทุกวันปนกัน */
  if(type==="pickslip"){
    var d=getTargetDate()||today();
    window.open("print_pickslip.html?date="+encodeURIComponent(d)+"&auto=1","_blank");
    return;
  }
  if(type==="daily")switchTab(1);
  else switchTab(2);
  setTimeout(function(){window.print();},300);
}

// ── UTIL ─────────────────────────────────────────────────
function escH(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
// โชว์ชื่อ LINE ต่อท้าย เฉพาะตอนไม่ตรงกับชื่อผู้รับ — กันสั่งซ้ำ 2 รอบให้คนละคน
/* กล่องข้อจำกัดอาหารบนการ์ดออเดอร์
   แพ้ = อันตรายถึงชีวิต (แดงเข้ม กรอบหนา) · ไม่ทาน = ความชอบ (ส้มอ่อน)
   ไม่มีข้อจำกัด = ไม่ขึ้นอะไรเลย — ถ้าขึ้นทุกใบ ครัวจะชินแล้วเลิกอ่าน */
function dietBox(o){
  var p=o?(custPrefs[o.customer_id]||custPrefs[o.line_uid]):null; if(!p) return "";
  var al=String(p.allergies||"").trim(), dl=String(p.dislikes||"").trim();
  if(!al&&!dl) return "";
  var h="";
  if(al) h+="<div class='oc-diet oc-diet-al'>⚠️ แพ้ "+escH(al)+"</div>";
  if(dl) h+="<div class='oc-diet oc-diet-dl'>ไม่ทาน "+escH(dl)+"</div>";
  return h;
}
/* ชื่อที่ "ระบุตัวคนไม่ได้" = ไม่มีตัวอักษรไทย/อังกฤษให้อ่านเลย
   เคสจริง 23 ส.ค.: ลูกค้าใช้ชื่อไลน์เป็นอีโมจิตัวเดียว "🖤" และช่องชื่อผู้รับก็ได้อีโมจิตามมา
   → ครัวเห็น "🖤" · แมสถือใบไปส่งแล้วไม่รู้ว่าใคร · โทรถามก็ไม่มีชื่อจะเอ่ย
   วิธีเดิม (วงเล็บชื่อไลน์ต่อท้าย) ช่วยไม่ได้ เพราะ 2 ช่องเป็นอีโมจิเหมือนกันทั้งคู่
   → กรณีนี้ต้องเอา "เบอร์" มาแทน เพราะเป็นสิ่งเดียวที่ระบุตัวได้จริง */
function nameUnreadable(n){
  var t=String(n||"").replace(/[^฀-๿a-zA-Z0-9]/g,"");
  return t.length<=1;
}
function lineTag(o){
  if(!o) return "";
  var tag="";
  if(o.line_display_name && o.line_display_name!==o.customer_name)
    tag=" <span style='font-size:10px;color:#9CA3AF;font-weight:400'>(LINE: "+escH(o.line_display_name)+")</span>";
  // ชื่ออ่านไม่ออก → แปะเบอร์ให้เห็นตั้งแต่หัวการ์ด ไม่ต้องกดกางที่อยู่ก่อน
  if(nameUnreadable(o.customer_name) && o.customer_phone)
    tag+=" <span style='font-size:11px;color:#B91C1C;font-weight:800'>📞 "+escH(o.customer_phone)+"</span>";
  return tag;
}

// ── INIT ─────────────────────────────────────────────────
// 🔴 N-32 (6 ส.ค. 2569): เดิมลูป d.setDate(getDate()-i) i=0..13 = สร้างแต่ "วันย้อนหลัง" ล้วน
//    → ครัวเลือกวันข้างหน้าไม่ได้เลย = เตรียมของล่วงหน้าไม่ได้ + เช็ครอบ Meal Plan วันหน้าไม่ได้
//    (ตัวเลือกวันสร้างจาก "ช่วงวันคงที่" ไม่ได้สร้างจากออเดอร์จริง — ข้อมูลวันอนาคตมีใน DB อยู่แล้ว)
//    แก้: ล่วงหน้า 14 วัน (optgroup "ล่วงหน้า") + ย้อนหลัง 7 วัน แยกกลุ่มกันครัวกดผิด
var KQ_FUTURE_DAYS=14, KQ_PAST_DAYS=7;
var kqPickerBuiltFor=null;
function kqDayOffset(n){var d=new Date();d.setDate(d.getDate()+n);return d;}
function buildDatePicker(){
  var sel=document.getElementById("calPicker");
  if(!sel)return;
  var keep=sel.value;
  sel.innerHTML="<option value=''>📅 เลือกวัน...</option>";
  var gF=document.createElement("optgroup");gF.label="🔜 ล่วงหน้า";
  var gP=document.createElement("optgroup");gP.label="↩ ย้อนหลัง";
  function mk(n){
    var d=kqDayOffset(n);
    var lbl=d.toLocaleDateString("th-TH",{weekday:"short",day:"numeric",month:"short"});
    var pre=n===0?"วันนี้ · ":n===1?"พรุ่งนี้ · ":n>1?"🔜 ":"↩ ";
    var opt=document.createElement("option");opt.value=toISO(d);opt.textContent=pre+lbl;
    return opt;
  }
  for(var i=0;i<=KQ_FUTURE_DAYS;i++) gF.appendChild(mk(i));
  for(var j=1;j<=KQ_PAST_DAYS;j++)   gP.appendChild(mk(-j));
  sel.appendChild(gF); sel.appendChild(gP);
  if(keep) sel.value=keep;                 // auto-refresh ต้องไม่เขี่ยวันที่ครัวเลือกไว้ทิ้ง
  kqPickerBuiltFor=today();
}
buildDatePicker();

loadNickname();
loadAll();
setInterval(loadAll,30000);
</script>
