<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Under360 — ครัว</title>
<link rel="icon" href="https://under360-system.vercel.app/favicon.jpg">
<link rel="apple-touch-icon" href="https://under360-system.vercel.app/favicon.jpg">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--g:#1F4D3A;--gs:#EBF3EF;--gold:#C9973F;--golds:#FFF8EC;--r:#DC2626;--rs:#FEF2F2;--blue:#1D4ED8;--blues:#EFF6FF;--ink:#1A1A1A;--soft:#6B7280;--xsoft:#D1D5DB;--bg:#F7F8F6;--w:#fff;--mono:'IBM Plex Mono';--sans:'IBM Plex Sans Thai',sans-serif;--rad:12px;}
body{font-family:var(--sans);background:var(--bg);min-height:100vh;}

/* HEADER */
.hdr{background:var(--g);padding:10px 14px;display:flex;align-items:center;gap:8px;position:sticky;top:0;z-index:100;flex-wrap:wrap;}
.hdr-title{font-size:15px;font-weight:700;color:#fff;flex:1;}
.hdr-btn{background:rgba(255,255,255,.15);color:#fff;border:none;border-radius:8px;padding:5px 11px;font-size:12px;cursor:pointer;font-family:var(--sans);text-decoration:none;white-space:nowrap;}
.hdr-btn.active{background:rgba(255,255,255,.35);}
.live-dot{width:8px;height:8px;border-radius:50%;background:#22C55E;box-shadow:0 0 0 3px rgba(34,197,94,.2);animation:blink 2s infinite;flex-shrink:0;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

/* TABS */
.tab-bar{display:flex;background:var(--w);border-bottom:2px solid var(--xsoft);overflow-x:auto;}
.tab-btn{flex:1;padding:11px 8px;font-size:13px;font-weight:600;color:var(--soft);border:none;background:none;cursor:pointer;font-family:var(--sans);border-bottom:2px solid transparent;margin-bottom:-2px;transition:.15s;white-space:nowrap;}
.tab-btn.active{color:var(--g);border-bottom-color:var(--g);}
/* แถบหมวด + ค้นหา ในแท็บตั้งสต็อค (12 ส.ค.) — ครัวกรอกทีละหมวด ไม่ต้องเลื่อนหาในลิสต์ 115 เมนู */
.stk-cats{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
.stk-cats::-webkit-scrollbar{display:none;}
.stk-cat{flex:0 0 auto;border:1px solid var(--xsoft);background:#fff;color:var(--soft);border-radius:999px;padding:9px 14px;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap;}
.stk-cat span{opacity:.6;font-weight:600;font-size:12px;}
.stk-cat.on{background:var(--g);border-color:var(--g);color:#fff;}
.stk-cat.on span{opacity:.75;}
.stk-find{width:100%;box-sizing:border-box;border:1px solid var(--xsoft);border-radius:10px;padding:11px 12px;font-size:16px;margin-bottom:6px;font-family:inherit;}
/* 👥 รายชื่อคนสั่ง — เปิดจากการกดเลข "สั่งแล้ว" */
.ord-btn{color:var(--gold);border-bottom:1.5px dashed var(--gold);cursor:pointer;padding:0 2px;}
.stk-who{margin:6px 0 2px;background:#FFFBEB;border:1px solid #F5E4A8;border-radius:9px;padding:7px 9px;}
.stk-who-hd{font-size:11.5px;font-weight:800;color:#92400E;margin-bottom:4px;}
.stk-who-sub{font-size:11px;font-weight:800;color:var(--soft);margin:6px 0 1px;}
.pt-who{grid-column:1/-1;padding:0 10px 8px;}
.stk-who-row.done{opacity:.6;}
.stk-who-row.done .w-n{text-decoration:line-through;}
.stk-who-row{display:flex;align-items:baseline;gap:7px;font-size:12px;padding:3px 0;border-top:1px solid #F5E9C8;}
.stk-who-row:first-of-type{border-top:none;}
.stk-who .w-n{flex:1;min-width:0;font-weight:700;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.stk-who .w-o{font-family:var(--mono);font-size:11px;color:var(--soft);flex-shrink:0;}
.stk-who .w-d{font-size:11px;color:var(--g);font-weight:700;flex-shrink:0;}
.stk-who .w-q{font-family:var(--mono);font-weight:800;color:#92400E;flex-shrink:0;min-width:26px;text-align:right;}
body.tablet .stk-who-row{font-size:15px;}
body.tablet .stk-who .w-o,body.tablet .stk-who .w-d{font-size:14px;}
.stk-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border-bottom:1px solid var(--xsoft);}
.stk-name{min-width:0;flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}
.stk-ctrl{display:flex;align-items:center;gap:5px;flex-shrink:0;}
.stk-btn{width:44px;height:44px;border:1.5px solid var(--xsoft);background:#fff;border-radius:10px;font-size:22px;font-weight:800;cursor:pointer;color:var(--g);line-height:1;}
.stk-btn:active{background:var(--g);color:#fff;}
.stk-btn:disabled{opacity:.3;cursor:default;}
.stk-num{width:58px;height:44px;text-align:center;border:1.5px solid var(--xsoft);border-radius:10px;font-size:18px;font-weight:800;font-family:monospace;}
.stk-inf{width:44px;height:44px;border:1.5px solid var(--xsoft);background:#fff;border-radius:10px;font-size:18px;cursor:pointer;color:var(--soft);}
.stk-inf.on{background:var(--g);color:#fff;border-color:var(--g);}
/* 📱 บนมือถือ ปุ่ม − ตัวเลข + ∞ กินไป 205px จาก 375px → เหลือให้ชื่อเมนูแค่ 118px
   ชื่อไทยยาว 174px เลยโดนตัดเป็น "..." อ่านไม่ออกว่าเมนูอะไร (นัทเจอเองบน iPhone 13 ส.ค. 2569)
   → จอแคบให้ชื่อขึ้นบรรทัดของตัวเองเต็มความกว้าง แล้วปุ่มอยู่บรรทัดล่าง
     ไม่ลดขนาดปุ่ม เพราะครัวกดด้วยนิ้วเปียก/ใส่ถุงมือ ปุ่มเล็กลง = กดพลาด */
@media (max-width:520px){
  /* 👥 รายชื่อคนสั่ง — เปิดจากการกดเลข "สั่งแล้ว" */
.ord-btn{color:var(--gold);border-bottom:1.5px dashed var(--gold);cursor:pointer;padding:0 2px;}
.stk-who{margin:6px 0 2px;background:#FFFBEB;border:1px solid #F5E4A8;border-radius:9px;padding:7px 9px;}
.stk-who-hd{font-size:11.5px;font-weight:800;color:#92400E;margin-bottom:4px;}
.stk-who-sub{font-size:11px;font-weight:800;color:var(--soft);margin:6px 0 1px;}
.pt-who{grid-column:1/-1;padding:0 10px 8px;}
.stk-who-row.done{opacity:.6;}
.stk-who-row.done .w-n{text-decoration:line-through;}
.stk-who-row{display:flex;align-items:baseline;gap:7px;font-size:12px;padding:3px 0;border-top:1px solid #F5E9C8;}
.stk-who-row:first-of-type{border-top:none;}
.stk-who .w-n{flex:1;min-width:0;font-weight:700;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.stk-who .w-o{font-family:var(--mono);font-size:11px;color:var(--soft);flex-shrink:0;}
.stk-who .w-d{font-size:11px;color:var(--g);font-weight:700;flex-shrink:0;}
.stk-who .w-q{font-family:var(--mono);font-weight:800;color:#92400E;flex-shrink:0;min-width:26px;text-align:right;}
body.tablet .stk-who-row{font-size:15px;}
body.tablet .stk-who .w-o,body.tablet .stk-who .w-d{font-size:14px;}
.stk-row{flex-wrap:wrap;}
  .stk-name{flex:1 0 100%;white-space:normal;overflow:visible;text-overflow:clip;line-height:1.35;margin-bottom:6px;}
  .stk-ctrl{margin-left:auto;}

  /* 📱 คืนพื้นที่จอให้ "ออเดอร์" — วัดบนจอ 375 แล้วส่วนหัวกิน 302px จาก 812 = 37%
     ครัวต้องเลื่อนก่อนถึงจะเห็นใบแรก ทั้งที่หน้านี้มีหน้าที่เดียวคือโชว์ว่าต้องทำอะไร
     แก้แบบไม่ตัดของทิ้งสักปุ่ม: ให้เลื่อนแนวนอนแทนการตกบรรทัด
     ⚠️ กฎของแถบตัวกรองอยู่ท้ายไฟล์ ไม่ได้อยู่ตรงนี้ — เพราะ `.ctrl-bar` ตัวจริงถูกประกาศ
        **หลัง** บล็อกนี้ ถ้าเขียนตรงนี้จะโดนของเดิมทับ (specificity เท่ากัน ตัวหลังชนะ) */
  .hdr{flex-wrap:nowrap;overflow-x:auto;padding:7px 10px;gap:6px;}
  .hdr::-webkit-scrollbar{display:none;}
  .hdr-title{font-size:13px;flex:0 0 auto;white-space:nowrap;}
  .hdr-btn{padding:4px 9px;font-size:11.5px;}
}

/* DATE + SLOT BAR */
.ctrl-bar{background:var(--w);border-bottom:1px solid var(--xsoft);padding:8px 12px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
.chip{flex-shrink:0;padding:0 14px;min-height:40px;display:inline-flex;align-items:center;border-radius:20px;border:1px solid var(--xsoft);font-size:12px;font-weight:500;cursor:pointer;background:var(--w);color:var(--soft);}
.chip.on{background:var(--g);color:#fff;border-color:var(--g);}
.sep{width:1px;height:20px;background:var(--xsoft);flex-shrink:0;}
.date-sel{padding:0 10px;min-height:40px;border-radius:20px;border:1px solid var(--xsoft);font-size:12px;cursor:pointer;background:var(--w);font-family:var(--sans);color:var(--soft);}

/* 📱 แถบตัวกรองบนมือถือ: เลื่อนแนวนอนแทนตกบรรทัด (เดิมชิป 9 ตัวตกเป็น 3 แถว = 149px)
   ต้องอยู่ "หลัง" กฎ .ctrl-bar/.chip/.date-sel ข้างบน ไม่งั้นโดนทับ (specificity เท่ากัน) */
@media (max-width:520px){
  .ctrl-bar{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:6px 10px;gap:5px;}
  .ctrl-bar::-webkit-scrollbar{display:none;}
  .ctrl-bar .chip{min-height:34px;padding:0 12px;}
  .ctrl-bar .date-sel{min-height:34px;max-width:130px;}
  .ctrl-bar .sep{display:none;}
}

/* MAIN */
.main{padding:12px;max-width:940px;margin:0 auto;}

/* PROD TABLE */
.prod-wrap{background:var(--w);border-radius:var(--rad);border:1px solid var(--xsoft);overflow:hidden;margin-bottom:12px;}
.pt-head{display:grid;grid-template-columns:1fr 52px 52px 62px;gap:4px;padding:7px 12px;background:var(--gs);border-bottom:2px solid var(--xsoft);}
.pt-head span{font-size:10px;font-weight:700;color:var(--soft);text-transform:uppercase;letter-spacing:.4px;text-align:center;}
.pt-head span:first-child{text-align:left;}
.pt-row{display:grid;grid-template-columns:1fr 52px 52px 62px;gap:4px;padding:7px 12px;border-bottom:1px solid var(--xsoft);align-items:center;}
.pt-row:last-child{border-bottom:none;}
.pt-row.warn{background:#FFFBEB;}
.pt-row.danger{background:#FFF1F1;}
.code-tag{font-family:var(--mono);font-size:10px;font-weight:700;color:var(--g);background:var(--gs);padding:2px 5px;border-radius:4px;white-space:nowrap;flex-shrink:0;}
.pt-n{font-family:var(--mono);font-size:13px;font-weight:700;text-align:center;}
.mp-wrap{background:var(--w);border-radius:var(--rad);border:1px solid var(--xsoft);border-left:4px solid #7C3AED;overflow:hidden;margin-bottom:12px;}
.mp-head{padding:9px 12px;background:#F5F3FF;border-bottom:2px solid var(--xsoft);font-size:12px;font-weight:700;color:#5B21B6;}
.mp-row{padding:8px 12px;border-bottom:1px solid var(--xsoft);}
.mp-row:last-child{border-bottom:none;}
.mp-row-top{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.mp-name{font-size:13px;font-weight:700;}
.mp-tag{font-size:10px;font-weight:700;padding:2px 7px;border-radius:6px;}
.mp-tag.hp{background:#FEF3C7;color:#92400E;}
.mp-tag.lc{background:#D1FAE5;color:#065F46;}
/* HYROX = คนละสีกับ HP/LC — ตั้งแต่ 16 ส.ค. 2569 ลูกค้าสั่ง Hyrox ผ่านหน้า Meal Plan ได้แล้ว
   รอบส่งเลยมาโผล่ปนกับ HP/LC บนใบเดียวกัน · ถ้าใช้สีเดียวกับ LC ครัวจะแยกด้วยตาไม่ออก */
.mp-tag.hx{background:#EDE9FE;color:#5B21B6;}
.mp-round{font-size:11px;color:var(--soft);font-weight:600;}
.mp-meta{font-size:11px;color:var(--soft);margin-top:3px;}
/* เมนูที่ลูกค้าขอมาเอง = ของที่พลาดไม่ได้ ต้องสะดุดตากว่าบรรทัดอื่นในการ์ด */
.mp-req{margin-top:5px;background:#FFF7ED;border:1px solid #FDBA74;border-radius:8px;padding:5px 9px;font-size:12px;font-weight:800;color:#9A3412;line-height:1.45;}
body.tablet .mp-req{font-size:16px;padding:8px 12px;}
.mp-chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px;}
.mp-chip{font-family:var(--mono);font-size:10px;font-weight:700;color:#5B21B6;background:#EDE9FE;padding:2px 6px;border-radius:4px;}
.mp-chip.empty{font-family:inherit;font-style:italic;font-weight:400;color:var(--xsoft);background:none;padding:0;}
.btn-mp-done{margin-top:6px;font-size:12px;font-weight:700;color:var(--g);background:var(--gs);border:1px solid var(--g);border-radius:8px;padding:0 14px;min-height:44px;cursor:pointer;}
.actual-input{width:44px;border:1.5px solid var(--g);border-radius:6px;text-align:center;font-family:var(--mono);font-size:13px;font-weight:700;color:var(--g);padding:2px 0;background:var(--gs);}

/* SLOT SECTION */
.slot-sec{margin-bottom:14px;}
.slot-hdr{display:flex;align-items:center;gap:8px;padding:9px 12px;background:var(--g);border-radius:10px 10px 0 0;color:#fff;}
.slot-hdr-label{font-size:13px;font-weight:700;flex:1;}
.slot-hdr-count{font-size:12px;background:rgba(255,255,255,.2);padding:2px 9px;border-radius:10px;}
.slot-body{background:var(--w);border:1px solid var(--xsoft);border-top:none;border-radius:0 0 10px 10px;padding:8px;}

/* ORDER CARD */
/* ป้ายกำกับวันที่กำลังดู (N-32) */
.date-banner{margin:0 14px 10px;padding:10px 14px;border-radius:10px;font-size:13px;line-height:1.5;}
.date-banner.ahead{background:#FEF3C7;color:#92400E;border:1.5px solid #F59E0B;}
.date-banner.past{background:#E5E7EB;color:#374151;border:1.5px solid #9CA3AF;}
.db-back{display:inline-block;margin-left:6px;font-weight:700;text-decoration:underline;cursor:pointer;}
body.tablet .date-banner{font-size:16px;padding:14px 18px;}
/* ⛔ เคยใส่ content-visibility:auto ตรงนี้ (23 ส.ค. เย็น) เพื่อแก้ช่องขาวตอนเลื่อนบนมือถือ
   ถอนออกแล้ววันเดียวกัน — บน iPhone มันเดาความสูงการ์ดผิดตอนเลื่อนเข้าจอ แล้ว "หน้ากระโดด"
   ครัวกำลังไล่ติ๊กของอยู่แล้วหน้าเด้ง = แย่กว่าช่องขาวเยอะ  ❌ อย่าใส่กลับมาโดยไม่เทสบน iPhone จริง */
.oc{border:1px solid var(--xsoft);border-radius:10px;padding:12px 14px;margin-bottom:10px;background:var(--w);}
/* 🖥️ ดูบนเว็บ/จอกว้าง: แบ่ง 2 คอลัมน์ — ซ้ายข้อมูลลูกค้า ขวาของที่ต้องจัด+ปุ่ม (นัทสั่ง 6 ส.ค. 2569)
   จอแคบกว่า 720px ยุบเป็นคอลัมน์เดียวเหมือนเดิม มือถือแอดมินไม่กระทบ */
.oc-2col{display:block;}
.oc-left{min-width:0;}
.oc-right{min-width:0;}
@media(min-width:720px){
  .oc-2col{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:16px;align-items:start;}
  .oc-right{border-left:1px solid var(--xsoft);padding-left:16px;}
}
.oc-done{opacity:.55;}                                  /* ส่งแล้ว = จางลง แต่ยังอยู่ให้กดยกเลิกได้ */
.oc-state{font-size:11px;font-weight:700;padding:2px 8px;border-radius:7px;}
.oc-state.packed{background:var(--gs);color:var(--g);}
.oc-state.shipped{background:#DBEAFE;color:#1E40AF;}
.oc-pay{font-size:11px;font-weight:700;padding:2px 8px;border-radius:7px;}
.oc-pay.is-paid{background:#D1FAE5;color:#065F46;}
.oc-pay.is-unpaid{background:#FEF3C7;color:#92400E;}
.oc-meta-sm{font-size:11px;}
.btn-ship{background:#1E40AF;color:#fff;border:none;border-radius:8px;padding:0 16px;min-height:44px;font-size:13px;font-weight:700;cursor:pointer;font-family:var(--sans);}
.oc:last-child{margin-bottom:0;}
.oc.pkg{border-color:var(--gold);background:var(--golds);}
/* 🎨 สีบอกสถานะงาน (นัทสั่ง 23 ส.ค.) — ครัวกวาดตาแล้วรู้ทันทีว่าเหลืออะไร
   ยังไม่กดจัด = แดง (งานค้าง) · จัดแล้ว = ขาวปกติ (จบแล้ว ไม่ต้องดึงสายตา)
   Meal Plan = ฟ้า (คนละงาน ไม่ได้จัดจากหน้านี้) */
.oc.mealplan{border-color:#1E5F8A;background:#EEF6FC;}
.oc.todo{border-color:#DC2626;background:#FEF2F2;}
.oc.todo .oc-name{color:#B91C1C;}
/* ใบที่เลยวันส่งไปแล้ว — เทา ไม่ใช่แดง · ถ้าแดงหมายถึง 2 อย่าง มันจะไม่หมายถึงอะไรเลย */
.oc.stale{border-color:#D1D5DB;background:#F7F7F5;opacity:.8;}
.oc.stale .oc-name{color:var(--soft);}
.stale-tag{font-size:10.5px;font-weight:800;color:#6B7280;background:#E5E7EB;border-radius:6px;padding:1px 7px;}
.oc.mealplan.todo{border-color:#1E5F8A;background:#EEF6FC;}   /* MP ไม่ต้องแดง — ไม่ได้จัดจากหน้านี้ */
.oc.mealplan.todo .oc-name{color:var(--ink);}
.oc-top{display:flex;align-items:flex-start;gap:8px;margin-bottom:6px;cursor:pointer;}
/* ── พับ/กางการ์ด (N-13) ── ค่าเริ่มต้น = กางไว้ · พับแล้วเหลือ ชื่อ+กล่อง+สถานะ ── */
.oc-caret{flex-shrink:0;font-size:14px;color:var(--soft);line-height:1.4;margin-top:1px;transition:transform .12s;}
.oc-collapsed .oc-caret{transform:rotate(-90deg);}
.oc-boxn{font-size:11px;font-weight:700;padding:2px 8px;border-radius:7px;background:var(--bg);color:var(--soft);}
.oc-collapsed .oc-right,.oc-collapsed .oc-meta,.oc-collapsed .oc-note{display:none;}
.oc-collapsed .oc-2col{display:block;}
.oc-collapsed .oc-top{margin-bottom:0;}
.oc-collapsed{padding-top:9px;padding-bottom:9px;}
.fold-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:0 2px 10px;}
.fold-btn{padding:0 14px;min-height:40px;border-radius:20px;border:1px solid var(--xsoft);background:var(--w);color:var(--soft);font-size:12px;font-weight:600;cursor:pointer;font-family:var(--sans);}
.fold-hint{font-size:11px;color:var(--xsoft);}
body.tablet .fold-btn{font-size:16px;padding:0 20px;min-height:50px;border-radius:26px;}
body.tablet .fold-hint{font-size:14px;}

   ซ่อนไว้ก่อน (นัท 20 ส.ค.) แต่ยังกดดูได้ทีละใบ เพราะบางทีต้องโทรถามลูกค้าจริง */
.oc.pk-lean .oc-meta{display:none;}
.oc.pk-lean.pk-open .oc-meta{display:block;}
.pk-info{font-size:11.5px;color:var(--soft);background:var(--bg);border:1px solid var(--xsoft);
  border-radius:6px;padding:1px 7px;cursor:pointer;user-select:none;}

body.tablet .pk-info{font-size:14px;padding:2px 9px;}
.oc-order-num{font-family:var(--mono);font-size:12.5px;color:var(--soft);}
.items-grid{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;}
/* ══ โหมดจัดของ ══════════════════════════════════════════════════════════════
   ครัวบอกเองว่าชอบจัดที่หน้านี้มากกว่าใบจัดของ (นัทแจ้ง 20 ส.ค. 2569)
   แต่เดิมเมนูเรียงเป็นชิปพรืดกันไปทั้งย่อหน้า → ใบละ 15 กล่องต้องนับในหัว
   หลุดตาแล้วนับใหม่ตั้งแต่ต้น (= ต้นเหตุเดียวกับเคสส่งเกิน 2 กล่อง CASE_01)
   โหมดนี้เปลี่ยนเป็น "บรรทัดละรายการ + แตะติ๊ก" ไม่ได้ซ่อนอะไร แค่เรียงใหม่ */
.pk-list{display:flex;flex-direction:column;margin-top:4px;border-top:1px solid var(--xsoft);}
.pk-row{display:flex;align-items:center;gap:8px;padding:5px 4px;border-bottom:1px solid var(--xsoft);
  cursor:pointer;user-select:none;line-height:1.3;}
.pk-row:active{background:var(--bg);}
.pk-box{flex-shrink:0;width:19px;height:19px;border:1.5px solid var(--xsoft);border-radius:5px;background:#fff;
  display:flex;align-items:center;justify-content:center;font-size:13px;line-height:1;color:#fff;}
.pk-row.on{background:#F0FDF4;}
/* แถวที่ยืนยันว่าจัดแล้ว = แตะไม่ได้ · ต้องต่างจาก "ติ๊กเล่นไว้" ให้เห็นด้วยตา
   ไม่งั้นครัวแยกไม่ออกว่าอันไหนตัดสต็อกไปแล้วจริง */
.pk-row.pk-locked{background:#DCFCE7;cursor:default;opacity:.85;}
.pk-row.pk-locked .pk-box{background:#16A34A;border-color:#16A34A;}
.btn-part{background:#FEF3C7;color:#92400E;border:1.5px solid #F5E4A8;border-radius:9px;padding:8px 12px;font-size:13px;font-weight:800;font-family:inherit;}
/* ติ๊กไว้แล้วแต่ยังไม่กด = ต้องสะดุดตา ไม่งั้นครัวเดินจากไปโดยคิดว่าจบแล้ว */
.btn-part.hot{background:#F59E0B;color:#fff;border-color:#D97706;animation:partpulse 1.6s ease-in-out infinite;}
@keyframes partpulse{0%,100%{box-shadow:0 0 0 0 rgba(245,158,11,.55)}50%{box-shadow:0 0 0 6px rgba(245,158,11,0)}}
@media (prefers-reduced-motion:reduce){.btn-part.hot{animation:none}}
body.tablet .btn-part{font-size:16px;padding:11px 15px;}
.pk-row.on .pk-box{background:#16A34A;border-color:#16A34A;}
.pk-row.on .pk-box:after{content:"✓";}

.pk-main{flex:1;min-width:0;}

.pk-name{font-size:13.5px;color:var(--ink);word-break:break-word;}

  min-width:38px;text-align:right;font-variant-numeric:tabular-nums;}

/* ชื่อเมนูต้องอ่านครบเสมอ — ให้ตัดบรรทัดได้ ห้ามตัดข้อความทิ้ง (ครัวใช้เช็คว่าลูกค้ารับอะไรบ้าง) */

/* ── 🔢 เรียงโค้ดแบบที่คนอ่านเข้าใจ (นัทสั่ง 18 ส.ค.) ─────────────────────────
   เดิมใช้ localeCompare ตรงๆ = เรียงแบบตัวอักษร ได้ No1 · No10 · No11 … No2 · No3
   ครัวไล่หาเมนูตามเลขไม่ได้ ต้องกวาดตาทั้งหน้า
   แก้: แยก "ตัวอักษรนำหน้า" กับ "ตัวเลข" แล้วเทียบเลขเป็นเลขจริง → No1..No15 แล้วค่อย S021.. */
function cmpCode(a,b){
  a=String(a||""); b=String(b||"");
  var ma=a.match(/^([A-Za-z]*)(\d*)(.*)$/), mb=b.match(/^([A-Za-z]*)(\d*)(.*)$/);
  var pa=(ma[1]||"").toUpperCase(), pb=(mb[1]||"").toUpperCase();
  if(pa!==pb) return pa<pb?-1:1;
  var na=ma[2]===""?null:parseInt(ma[2],10), nb=mb[2]===""?null:parseInt(mb[2],10);
  if(na!==null&&nb!==null&&na!==nb) return na-nb;
  return a.localeCompare(b);
}
/* ── 🏷️ ป้ายชื่อเล่น + สัปดาห์ (นัทสั่ง 18 ส.ค.) ────────────────────────────
   ชื่อเล่น (subcode) = ชื่อที่ครัวกับลูกค้าเรียกกันจริง เช่น s3 · โค้ดจริง S032 ไม่มีใครเรียก
   เลขสัปดาห์ = เมนูพิเศษหมุนทุกสัปดาห์ ถ้าไม่บอกว่าของสัปดาห์ไหน ครัวแยกของค้างไม่ออก
   แท็กเก็บเป็นวันจันทร์ของสัปดาห์นั้น → แปลงเป็นเลขสัปดาห์ + บอกว่าค้างมากี่สัปดาห์ */
var weekTagMap={};
function weekNoOf(ymd){
  var d=new Date(ymd+"T00:00:00"); if(isNaN(d)) return null;
  var t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  var dn=(t.getUTCDay()+6)%7; t.setUTCDate(t.getUTCDate()-dn+3);
  var y0=new Date(Date.UTC(t.getUTCFullYear(),0,4));
  return 1+Math.round(((t-y0)/86400000-3+((y0.getUTCDay()+6)%7))/7);
}
function curWeekTag(){ var ds=Object.values(weekTagMap||{}).filter(Boolean).sort(); return ds.length?ds[ds.length-1]:null; }
function tagsHtml(m){
  var h="";
  var sc=String((m&&m.subcode)||"").trim();
  if(sc) h+="<span class='mtag mtag-sub' title='ชื่อเล่นที่ครัวกับลูกค้าเรียกกัน'>"+escH(sc)+"</span>";
  var wk=weekTagMap[m&&m.code];
  if(wk){
    var wn=weekNoOf(wk), cur=curWeekTag();
    var back=(cur&&wk<cur)?Math.round((new Date(cur)-new Date(wk))/604800000):0;
    h+="<span class='mtag mtag-wk"+(back?" old":"")+"' title='เมนูของสัปดาห์ที่เริ่มวันจันทร์ "+escH(wk)+"'>W"+wn
      +(back?(" ·ค้าง "+back+"สัปดาห์"):"")+"</span>";
  }
  return h;
}
/* ── หมวด "ทำสด" = ทำตามออเดอร์วันนั้น ไม่มีของสต็อคให้นับ → ไม่ควรโผล่ในแท็บตั้งสต็อค

//   เมนูที่มีชื่อเล่นประจำสัปดาห์ (S1-S8 / D1-D5) ต้องอยู่บนสุดของหมวด เรียงตามเลข

function subRankKQ(m){
  // ไม่ใช้ regex ตั้งใจ — heredoc เคยกินแบ็กสแลชจน d กลายเป็น d แล้วเรียงไม่ทำงาน (22 ส.ค.)
  var sc=String((m&&m.subcode)||"").trim().toUpperCase();
  var head=sc.charAt(0);
  if(head!=="S"&&head!=="D") return 9999;
  var rest=sc.slice(1);
  var n=parseInt(rest,10);
  if(!(n>0) || String(n)!==rest) return 9999;   // กัน xS1 / S1a / ว่าง
  return (head==="S"?0:100)+n;
}
function stkCatRank(c){ var i=STK_CAT_ORDER.indexOf(c||""); return i<0?999:i; }
function getCodeDisplay(code,name){
  if(codeMode==="name")return name;
  if(codeMode==="subcode")return (code||"").replace(/^[A-Za-z]+/,"") || code;
  return code||"—";
}

async function kqKeepAwake(){

function kqReleaseAwake(){ try{ if(_wakeLock){_wakeLock.release();_wakeLock=null;} }catch(e){} }
function applyTabletMode(on,save){
  document.body.classList.toggle("tablet",!!on);
  var b=document.getElementById("tabletBtn");
  if(b){ b.textContent=on?"📱 แท็บเล็ต: เปิด":"📱 แท็บเล็ต"; b.style.background=on?"rgba(255,255,255,.38)":""; }
  if(save) localStorage.setItem("kq_tablet",on?"1":"0");
  if(on) kqKeepAwake(); else kqReleaseAwake();
}
function toggleTablet(){ applyTabletMode(!document.body.classList.contains("tablet"),true); }

(function initTablet(){

async function fetchItemsFor(sb_, ids){
  var out=[];
  for(var i=0;i<ids.length;i+=80){
    var r=await sb_.from("order_items").select("*").in("order_id",ids.slice(i,i+80));
    if(r&&r.data) out=out.concat(r.data);

  return out;
}

// ── FILTER ───────────────────────────────────────────────
function filteredOrders(){
  var tgt=getTargetDate();
  /* 📅 "ทั้งหมด" = วันนี้เป็นต้นไป ไม่ใช่ทุกวันในประวัติศาสตร์ (นัทเคาะ 23 ส.ค.)
     นัทพูดเอง: "ของเก่าที่แก้กันไปแล้ว กดดูทั้งหมดมันจะพอกหางหมูโชว์ขึ้นไม่มีจบสิ้น"
     วัดจริง: แค่ย้อน 3 วันก็มีใบไม่เคยกดจัด 19 ใบ · ย้อนถึงต้นเดือน = 195 ใบ (+~6/วัน)
     ปล่อยไว้กองแดงจะยาวกว่างานวันนี้ → ครัวเลิกมองสีแดง = สีหมดความหมาย
     หน้านี้คือหน้าจัดของ — ของที่เลยวันส่งไปแล้วไม่ใช่งานครัวอีกต่อไป
     ใครอยากตามงานค้างเก่า ใช้ปุ่ม "⏮ ย้อนหลัง" แยกต่างหาก ไม่ปนกับงานวันนี้ */
  var tday=today();
  return allOrders.filter(function(o){
    if(dateMode==="all"  && o.delivery_date && o.delivery_date <  tday) return false;
    if(dateMode==="past" && (!o.delivery_date || o.delivery_date >= tday)) return false;
    if(tgt&&o.delivery_date!==tgt)return false;
    if(slotMode!=="all"&&o.time_slot!==slotMode)return false;
    // 🔴 ใบที่ยกเลิก + ออเดอร์เทส ต้องไม่โผล่หน้าครัว — ครัวเคยเห็น 13 ใบทั้งที่งานจริง 12
    //    (นัทเปิดจอจริงเจอ 5 ส.ค. 2569 · ตัวเกินคือ U-0805-001 ที่ cancelled ไปแล้ว)
    if(o.status==="cancelled") return false;
    if(o.source==="parallel_test") return false;
    // ส่งแล้วยังโชว์อยู่ถ้าเลือกวันเจาะจง — ครัวเห็นความคืบหน้าทั้งวัน + กดยกเลิกย้อนได้
    // (ดูรวมทุกวันค่อยซ่อน ไม่งั้นรายการยาวไปด้วยของที่จบแล้ว)
    if(o.status==="delivered") return !!tgt;
    return true;
  });
}
// บรรทัดควบคุม ไม่ใช่ของที่ครัวต้องทำ (ตรงกับที่หน้าแมสใน OH กรองไว้)
var KQ_CTRL={"1":"🔁 แยกวันส่ง","0":"➕ เพิ่มเติม","000":"🍴 ช้อนส้อม"};
/* 🔴 บรรทัดหัวข้อของ Meal Plan (เช่น MP-LC "LC · ทดลอง") ไม่ใช่กล่องอาหาร
   เป็นบรรทัดบอกว่าใบนี้คือแพลนอะไร กล่องจริงคือบรรทัด meal_plan:box:... ที่ตามมา
   ถ้านับด้วยจะได้ 8 กล่องทั้งที่จริง 7 (นัทจับได้เองจากหน้าแมส 14 ส.ค. 2569)
   → ตัดออกจากการนับกล่องทุกที่ แต่ยังใช้ดูได้ว่าเป็น Meal Plan */
function isMpHeaderLine(i){
  var n=String((i&&(i.notes!=null?i.notes:i.note))||"");
  if(/^set:/i.test(n)) return true;   /* เซ็ต/คอร์สก็มีบรรทัดขายแบบเดียวกัน — เดิมตกตะแกรง (U 18 ส.ค.) */
  return /^meal_plan:/i.test(n) && !/^meal_plan:box/i.test(n);
}

// จับคู่ออเดอร์ ↔ รอบส่ง Meal Plan — แยกออกมาเป็นฟังก์ชันเดียว ใช้ทั้งตอนดึงเมนูและตอนนับกล่อง
// ⚠️ ผูกด้วย order_id → line_uid → customer_id เท่านั้น · ห้ามจับคู่ด้วย "ชื่อ+วันที่" (ชื่อซ้ำกันได้)
function findMpFor(o){
  if(!o||!(allMpDeliveries||[]).length) return null;
  var m=null;
  if(o.id)              m=allMpDeliveries.find(function(x){return x.order_id&&x.order_id===o.id;});
  if(!m&&o.line_uid)    m=allMpDeliveries.find(function(x){return x.line_uid&&x.line_uid===o.line_uid&&x.delivery_date===o.delivery_date;});
  if(!m&&o.customer_id) m=allMpDeliveries.find(function(x){return x.customer_id&&x.customer_id===o.customer_id&&x.delivery_date===o.delivery_date;});
  return m;
}
function getOrderItems(orderId){
  var o=(allOrders||[]).find(function(x){return x.id===orderId;});
  var raw=allItems.filter(function(i){return i.order_id===orderId;});
  var food=raw.filter(function(i){
    if(KQ_CTRL[i.menu_code]) return false;                       // บรรทัดควบคุม
    if(isMpHeaderLine(i)) return false;                          // หัวข้อแพลน ไม่ใช่กล่องอาหาร
    return !!String(i.menu_name||"").trim();                     // บรรทัดไม่มีชื่อ = ครัวใช้ไม่ได้
  });
  // 🔁 ไม่มีของให้ทำเลย → ดึงเมนูจากแพลนเมนู (mp_deliveries) แบบเดียวกับหน้าแมสใน OH
  //    ที่มา: แอดมินแก้เมนูที่หน้า "แพลนเมนู" ซึ่งเขียนลง mp_deliveries — ถ้าครัวอ่านแต่ order_items จะไม่เห็นการแก้เลย
  //    ⚠️ ผูกด้วย order_id → line_uid → customer_id เท่านั้น · ห้ามจับคู่ด้วย "ชื่อ+วันที่" (ชื่อซ้ำกันได้)
  if(!food.length && o && (allMpDeliveries||[]).length){
    var m=findMpFor(o);
    if(m&&m.status!=="cancelled"&&Array.isArray(m.menu_items)&&m.menu_items.length){
      return m.menu_items.map(function(x){
        // โน้ตจากหน้าแพลนเมนู — ทั้งแบบใช้ทุกกล่อง (note) และแยกรายกล่อง (notes[])
        // ครัวต้องเห็น ไม่งั้นแอดมินกรอก "ข้าวไรซ์เบอร์รี่ กล่อง 2" ไปก็ไม่มีใครอ่าน
        var parts=[];
        if(String(x.note||"").trim()) parts.push("ทุกกล่อง: "+String(x.note).trim());
        (x.notes||[]).forEach(function(v,i){ if(String(v||"").trim()) parts.push("กล่อง "+(i+1)+": "+String(v).trim()); });
        return {code:x.code||"—", name:(x.name||"—"), qty:x.qty||1, menu_item_id:null, notes:"",
                _fromPlan:String(m.mp_type||"MP").toUpperCase(), _boxNote:parts.join(" · ")};
      });
    }
  }
  return (food.length?food:raw).map(function(i){
    var m=allMenus.find(function(x){return x.id===i.menu_item_id;});
    return {
      code: i.menu_code || (m&&m.code) || "—",
      name: i.menu_name || (m&&m.name) || "—",
      qty: i.quantity||1,
      menu_item_id: i.menu_item_id,
      notes: i.notes||""      // ใช้แยกว่าอยู่ในเซ็ต/คอร์สไหน (รูปแบบ pkg:{id}:course:r/N)
    };
  });
}

// รวมรายการซ้ำ + จัดกลุ่มเซ็ต/คอร์ส (นัทเจอบนจอครัว 5 ส.ค. 2569)
//  · เดิมเมนูเดียวกัน 6 กล่อง ขึ้น 6 บรรทัดเหมือนกันเป๊ะ → ครัวนับเอง
//  · เดิมเซ็ต/คอร์สขึ้นปนกับเมนูเดี่ยว → ครัวไม่รู้ว่าอันไหนอยู่ในเซ็ตเดียวกัน
function groupOrderItems(items){
  var groups=[], byKey={};
  items.forEach(function(i){
    var pk=(String(i.notes||"").match(/^pkg:([^:\s]+)/)||[])[1]||null;
    var gk=pk?("pkg:"+pk):"_single";
    if(!byKey[gk]){ byKey[gk]={pkg:pk,round:null,fromPlan:null,items:[],_seen:{}}; groups.push(byKey[gk]); }
    var g=byKey[gk];
    if(i._fromPlan) g.fromPlan=i._fromPlan;
    var cr=String(i.notes||"").match(/course:(\d+)\s*\/\s*(\d+)/);
    if(cr) g.round=cr[1]+"/"+cr[2];
    var isGift=/:gift(|$)/.test(String(i.notes||""));
    var ik=(i.code||"")+"|"+(i.name||"")+(isGift?"|gift":"");
    if(g._seen[ik]) g._seen[ik].qty+=(i.qty||1);
    else { g._seen[ik]={code:i.code,name:i.name,qty:(i.qty||1),boxNote:i._boxNote||"",gift:isGift}; g.items.push(g._seen[ik]); }
  });
  groups.sort(function(a,b){ return (a.pkg?1:0)-(b.pkg?1:0); });   // เมนูเดี่ยวก่อน แล้วค่อยเซ็ต
  return groups;
}
function detectBadge(items){
  if(items.some(function(i){return (i.code||"").match(/^HP/i);}))return "hp";
  if(items.some(function(i){return (i.code||"").match(/^LC/i);}))return "lc";
  return "normal";
}

function ensureProdFind(){

function prodHit(q,code,name,sub){
  q=String(q||"").toLowerCase().trim(); if(!q) return true;
  return String(code||"").toLowerCase().indexOf(q)>=0
      || String(name||"").toLowerCase().indexOf(q)>=0
      || String(sub ||"").toLowerCase().indexOf(q)>=0;

function renderProd(){
  var orders=filteredOrders();

     เดิมใช้ค่านี้เป็นคีย์รวมยอดตรงๆ → ทุกเมนูของทุกคนถูกยุบเป็นแถวเดียวชื่อ "null"
     = ครัวเห็นรายการเดียวยอดมหาศาล แทนที่จะเห็นว่าต้องทำจานไหนบ้าง
     → ไม่มี id ก็ใช้รหัสเมนูเป็นคีย์แทน */
  var agg={};
  orders.forEach(function(o){
    getOrderItems(o.id).forEach(function(i){
      var key = i.menu_item_id || ("code:"+String(i.code||i.name||"?").toUpperCase());

      agg[key].qty+=i.qty;

  var rows=Object.values(agg).sort(function(a,b){

    var mb=(allMenus||[]).find(function(x){return x.code===b.code;});
    return (subRankKQ(ma)-subRankKQ(mb)) || cmpCode(a.code,b.code);
  });
  var rowsAll=rows;
  if(prodQ) rows=rows.filter(function(r){
    var m=(allMenus||[]).find(function(x){return (r.id&&x.id===r.id)||(r.code&&x.code===r.code);})||{};
    return prodHit(prodQ,r.code,r.name,m.subcode);

  var unplanned=prodUnplanned(tgt);

       ทำเติมจริงก็จะได้ยอดจริง ฝั่งของครัวคือฝั่งที่มีแต่ความจริงเพราะอยู่กับของ")
       · สั่ง   = ของ "วันที่เลือกดู"        → เป็นแพลน ขึ้นกับวัน
       · ทำไว้/เหลือ = ของจริงในตู้ตอนนี้     → เป็นความจริง ไม่ขึ้นกับวัน
     🐞 ของเดิม: ทำไว้ = stock_total + r.qty  โดย r.qty กรองตามวันที่ดู
        = เอาเลขที่ไม่ผูกวัน มาบวกกับเลขที่ผูกวัน (พลาดแบบเดียวกับช่องซ้ายในแท็บตั้งสต็อค)
        ผลจริงที่วัดได้: S149 เลือก "ทั้งหมด" ทำไว้ 5 · เลือก "พรุ่งนี้" ทำไว้ 3
        → ของในตู้ไม่ได้เปลี่ยน แต่ตัวเลขเปลี่ยนเพราะกดดูคนละวัน = ครัวเชื่อไม่ได้ */

    +"<b style='color:var(--g)'>ทำไว้</b> / <b>เหลือ</b> = ของจริงในตู้ตอนนี้ (ไม่เปลี่ยนตามวันที่เลือก)</div>"
    +"<div class='pt-head'><span>สินค้า</span><span>สั่ง</span><span style='color:var(--g)'>ทำไว้</span><span>เหลือ</span></div>";
  rows.forEach(function(r){
    var m=allMenus.find(function(x){return x.id===r.id;})||{};
    var unlimited=(m.stock_total==null);
    /* ⚠️ ตั้งแต่ 16 ส.ค. `stock_total` = "ขายได้อีก" (หักของที่สั่งไปแล้วเรียบร้อย)

       แต่ต้องบวก "ทุกวัน" (omAll) ไม่ใช่เฉพาะวันที่ดู ไม่งั้นตัวเลขแกว่งตามปุ่มที่กด */

      +"<div class='pt-n'>"+(unlimited?"∞":stk)+"</div>"

      +"</div>";
    /* ปุ่ม "⏮ ย้อนหลัง" ไม่ได้เจาะจงวัน (tgt เป็น null) → ส่งเส้นตายที่ไม่ตัดอะไรเลย
       ไม่งั้นครัวกดดูงานค้างเก่า แล้วปุ่ม 👥 จะบอกว่าไม่มีใครสั่งทุกแถว */
    if(r.id && stkWhoId===r.id) html+="<div class='pt-who'>"+stkWhoHtml({id:r.id},(dateMode==="past"?"0000-00-00":tgt))+"</div>";

// MEAL PLAN QUEUE (คิวส่งระยะยาว)
/* ── ⚠️ รอบที่ยังไม่ได้จ่ายเมนู = กล่องที่หายไปจากใบสั่งผลิต (นัทสั่ง 8 ส.ค.) ────────
   แอดมินยังไม่แพลน → ไม่มีเมนูให้ครัวเลยทั้ง order_items และ mp_deliveries
   → ใบสั่งผลิตนับไม่เจอ ครัวทำของ **ขาด** ทั้งที่หน้าจอดูปกติทุกอย่าง = อันตรายแบบเงียบ
   ของจริงตอนเขียน (21 ส.ค.): 5 รอบ 35 กล่อง ยังไม่ได้จ่ายเมนูเลยสักจาน */
function prodUnplanned(tgt){
  var out={rounds:[], boxes:0};
  if(!tgt) return out;
  (allMpDeliveries||[]).forEach(function(r){
    if(r.status==="skipped"||r.status==="cancelled") return;
    if(r.delivery_date!==tgt) return;
    if(Array.isArray(r.menu_items) && r.menu_items.length) return;
    out.rounds.push(r); out.boxes += (r.box_count||7);
  });
  return out;
}
function unplannedHtml(u){
  if(!u.rounds.length) return "";
  return "<div class='prod-warn'>"
    +"<div class='pw-t'>⚠️ ยังไม่ได้จ่ายเมนู "+u.rounds.length+" รอบ = <b>"+u.boxes+" กล่อง</b> ที่ยังไม่อยู่ในยอดข้างล่าง</div>"
    +"<div class='pw-b'>"+u.rounds.map(function(r){
        return "<span>"+escH(r.customer_name||"ลูกค้า")+" รอบ "+(r.round_no||"?")+" · "+(r.box_count||7)+" กล่อง</span>";
      }).join("")+"</div>"
    +"<div class='pw-f'>ทำตามยอดข้างล่างอย่างเดียว = ของขาด "+u.boxes+" กล่อง — บอกแอดมินให้จ่ายเมนูรอบพวกนี้ก่อน</div>"
    +"</div>";
}

function renderMpQueue(){
  var tgt=getTargetDate();
  var rows=allMpDeliveries.filter(function(x){
    if(x.status==="skipped"||x.status==="cancelled")return false;
    if(!tgt)return false; // ไม่แสดงถ้าเลือก "ทั้งหมด" — คิวนี้ผูกกับวันเดียว
    if(x.delivery_date!==tgt)return false;
    return true;
  }).sort(function(a,b){return (a.round_no||0)-(b.round_no||0);});
  var el=document.getElementById("mpQueueView");
  if(!el)return;
  if(!rows.length){el.innerHTML="";return;}
  var html="<div class='mp-wrap'>"
    +"<div class='mp-head'>📦 Meal Plan ระยะยาว — คิวส่ง"+(tgt?"วันที่ "+fmtDate(tgt):"วันนี้")+"</div>";
  rows.forEach(function(r){
    var _mt=(r.mp_type||"").toLowerCase();
    var tagCls=_mt==="hp"?"hp":(/^hyrox|^hx/.test(_mt)?"hx":"lc");
    var tagLabel=(r.mp_type||"").toUpperCase();
    var menuItems=r.menu_items||[];
    var chipsHtml=menuItems.length
      ?menuItems.map(function(m){return "<span class='mp-chip'>"+escH(m.code||m.name||"—")+"</span>";}).join("")
      :"<span class='mp-chip empty'>ยังไม่กำหนดเมนู</span>";
    html+="<div class='mp-row'>"
      +"<div class='mp-row-top'>"
      +"<span class='mp-name'>"+escH(r.customer_name||"ลูกค้า")+"</span>"+lineTag(r)
      +"<span class='mp-tag "+tagCls+"'>"+escH(tagLabel)+"</span>"
      +"<span class='mp-round'>รอบ "+(r.round_no||"—")+"/"+(r.total_rounds||"—")+"</span>"
      +"<span class='mp-round'>📦 "+(r.box_count||7)+" กล่อง</span>"
      +"</div>"
      +"<div class='mp-chips'>"+chipsHtml+"</div>"
      /* 🙋 เมนูที่ลูกค้าขอมาเอง — ต้องเด่นกว่าเมนูที่แอดมินจัด เพราะเป็นของที่ "พลาดไม่ได้"
         เดิมหน้าครัวไม่เคยอ่าน `customer_request` เลยสักบรรทัด (grep = 0)
         → ลูกค้าขอ LC76/LC84 ผ่านไลน์ ค้าง 2 วัน ครัวไม่ได้ทำ เพราะไม่มีใครเห็น */
      +(((r.customer_request||[]).length)
        ?"<div class='mp-req'>🙋 ลูกค้าขอเอง: "
          +(r.customer_request||[]).map(function(m){return escH(m.code||m.name||"");}).filter(Boolean).join(" · ")
          +"</div>"
        :"")
      +"<div class='mp-meta'>📍 "+escH(r.delivery_address||"—")+"</div>"
      +"<div class='mp-meta'>⏰ "+escH(r.time_slot_label||r.time_slot||"—")+"</div>"
      +(r.status==="delivered"

        :"<button class='btn-mp-done' onclick='markMpDelivered(\""+r.id+"\")'>✅ ส่งแล้ว</button>")
      +"</div>";

  html+="</div>";

}

/* ⚰️ โค้ดตายแล้ว — ไม่มีใครเรียก `schedSave` อีกแล้ว (grep ทั้งไฟล์เจอแค่บรรทัดนี้)
   ช่อง "ผลิตได้จริง" ที่เคยใช้ตัวนี้ถูกถอดออกไปแล้ว ครัวกรอกที่แท็บ "ตั้งสต็อค" แทน
   ⚠️ เอกสารเก่าหลายฉบับยังอ้างพฤติกรรมของฟังก์ชันนี้อยู่ — อย่าเชื่อ ให้ดู `stkWrite`
   ยังไม่ลบทิ้ง เพราะกันไว้เผื่อมีหน้าอื่นเรียกข้ามไฟล์ที่ grep ไม่เห็น */
// debounce save 600ms หลังพิมเสร็จ
function schedSave(inp){
  var menuId=inp.dataset.menuId;
  var val=parseInt(inp.value)||0;
  // update local ให้ rem re-calc
  var m=allMenus.find(function(x){return x.id===menuId;});
  if(m){ m.actual_stock=val; if(m.stock_total!=null) m.stock_total=val; }   // ผลิตได้จริงเท่าไหร่ = ลูกค้าซื้อได้เท่านั้น
  // update rem display ทันที
  var row=inp.closest(".pt-row");
  if(row){
    var ordered=parseInt(row.querySelectorAll(".pt-n")[0].textContent)||0;
    var rem=val-ordered;
    var remEl=row.querySelectorAll(".pt-n")[2];
    if(remEl){remEl.textContent=rem;remEl.style.color=rem<0?"var(--r)":"var(--g)";}
    row.className="pt-row"+(rem<0?" danger":rem<3?" warn":"");
  }
  clearTimeout(saveTimers[menuId]);
  saveTimers[menuId]=setTimeout(async function(){
    var sb_=getSB(); if(!sb_)return;
    // 🔗 ครัวกรอก "ผลิตได้จริง" → ตั้งเลขที่ลูกค้าซื้อได้ (stock_total) ให้ตรงกันทันที (3 ส.ค. 2026)
    //    เดิมเก็บแค่ actual_stock อย่างเดียว → ไม่มีอะไรเชื่อมกับเลขขาย → ครัวผลิตได้ 0 แต่ลูกค้ายังสั่งได้ 10
    //    เมนูที่ตั้ง "ไม่จำกัด" (stock_total = null) ไม่แตะ — ยังขายได้เรื่อยๆ ตามเดิม
    var mm=allMenus.find(function(x){return x.id===menuId;})||{};
    var patch={actual_stock:val};
    if(mm.stock_total!=null) patch.stock_total=val;
    // ⚠️ เมนูที่ตั้ง "ไม่จำกัด" (stock_total=null) → กรอกเลขนี้ไปก็ "ไม่คุมการขาย"
    //    เดิมเงียบสนิท ครัวนึกว่าจำกัดแล้วแต่ลูกค้ายังสั่งได้ไม่อั้น → ต้องบอกให้รู้ (ไม่เปลี่ยนพฤติกรรมการขายเอง)
    else kqUnlimitedHint(inp, mm);
    var _w3=await sb_.from("menu_items").update(patch).eq("id",menuId);
    if(_w3.error) kqWriteFail(_w3.error,"ผลิตได้จริง/สต็อคขาย");
    else if(patch.stock_total!=null) logKqActivity((mm.code||"")+" "+(mm.name||"")+" — ผลิตได้จริง "+val+" (ตั้งสต็อคขาย = "+val+")");
  },600);
}

// เตือนเมื่อกรอก "ผลิตได้จริง" ให้เมนูที่ตั้งไว้ว่า "ขายไม่จำกัด" — เลขนี้จะไม่คุมการขาย
function kqUnlimitedHint(inp, mm){

    d.textContent="เมนูนี้ตั้งไว้ \u0e02\u0e32\u0e22\u0e44\u0e21\u0e48\u0e08\u0e33\u0e01\u0e31\u0e14 (\u221e) — เลขนี้บันทึกไว้ดูเฉยๆ ไม่ได้จำกัดยอดขาย ถ้าต้องการจำกัด ให้ตั้งเลขที่แท็บ \"ตั้งสต็อค\" ก่อน";

// ── TAB 3: ตั้งสต็อค (canonical = stock_total · ทุกหน้ารวม LIFF อ่านตัวนี้) ──
var stkCat="all", stkQ="";
function stkPick(c){ stkCat=c; renderStock(); }
function stkSearch(inp){ stkQ=inp.value||""; renderStock();
  var f=document.getElementById("stkFind"); if(f){ f.focus(); try{f.setSelectionRange(f.value.length,f.value.length);}catch(e){} } }
var CATLBL_STK={no_regular:"🍚 ข้าวกล่อง",no_special:"⭐ เมนูพิเศษ",pack_regular:"📦 แพคกับข้าว",pack_special:"📦 แพคพิเศษ",trend:"🔥 เมนูกระแส"};

  var om=stkOrderedMap(), omToday=stkOrderedTodayMap();
  var html="<div style='padding:10px 12px;font-size:12px;color:var(--soft);background:#EBF3EF;border-radius:10px;margin-bottom:8px'>"
    +"เลขใหญ่ = <b>ลูกค้ายังสั่งได้อีกกี่กล่อง</b> · แตะ <b>✏️</b> เพื่อแก้<br>"
    +"<span style='color:var(--g);font-weight:700'>มีของจริง + กำลังเติม − สั่งแล้ว = ลูกค้าสั่งได้อีก</span><br>"
    +"<span style='font-size:11px'>ของหมดสต็อคแต่จะทำเพิ่ม → ใส่ <b>กำลังเติม</b> ไว้ หน้าร้านจะยังเปิดขายให้</span></div>";

  // แถบหมวด + ช่องค้นหา (นัทสั่ง 12 ส.ค.) — ครัวกรอกสต็อกทีละหมวด (บ๊ะจ่าง/ข้าวกล่อง/แพคกับข้าว)
  // เดิมเป็นรายการยาวรวดเดียว 115 เมนู ครัวต้องเลื่อนหาเอง = กรอกผิดแถวง่าย
  var cats=[]; menus.forEach(function(m){ var c=m.category||"other"; if(cats.indexOf(c)<0)cats.push(c); });
  cats.sort(function(a,b){ return (stkCatRank(a)-stkCatRank(b))||a.localeCompare(b); });

  html+="<div class='stk-cats'><button class='stk-cat"+(stkCat==="all"?" on":"")+"' onclick=\"stkPick('all')\">ทั้งหมด <span>"+menus.length+"</span></button>";
  cats.forEach(function(c){

    html+="<button class='stk-cat"+(stkCat===c?" on":"")+"' onclick=\"stkPick('"+escH(c)+"')\">"+escH(catName(c))+" <span>"+n+"</span></button>";
  });
  /* ชิปพิเศษ — เมนูที่ครัวซ่อนไว้ ต้องมีที่ไล่ดูและเปิดคืน ไม่งั้นค้างซ่อนยาวโดยไม่มีใครรู้ */
  var hidN=menus.filter(function(m){return m.is_available===false;}).length;
  if(hidN) html+="<button class='stk-cat hid"+(stkCat==="__hidden__"?" on":"")+"' onclick=\"stkPick('__hidden__')\" title='เมนูที่ครัวซ่อนจากหน้าร้านอยู่'>🙈 ซ่อนอยู่ <span>"+hidN+"</span></button>";
  html+="</div><input class='stk-find' id='stkFind' placeholder='🔍 ค้นชื่อเมนูหรือโค้ด...' value='"+escH(stkQ)+"' oninput='stkSearch(this)'>";

  var shown=menus.filter(function(m){
    if(stkCat==="__hidden__"){ if(m.is_available!==false) return false; }
    else if(stkCat!=="all" && (m.category||"other")!==stkCat) return false;
    if(stkQ){ var q=stkQ.toLowerCase();
      return String(m.name||"").toLowerCase().indexOf(q)>=0 || String(m.code||"").toLowerCase().indexOf(q)>=0
          || String(m.subcode||"").toLowerCase().indexOf(q)>=0; }
    return true;
  });
  if(!shown.length) html+="<div style='text-align:center;padding:30px;color:var(--soft)'>ไม่เจอเมนูที่ค้น</div>";

    html+=stkRowHtml(m,om[m.id]||0,omToday[m.id]||0);

  html+="<div id='stkHist' class='stk-hist'></div>";

  if(!stockHist.length) loadStockHistory();

/* ── 🍳 ครัวกรอก "ทำไว้กี่กล่อง" ไม่ใช่ "ขายได้อีกกี่กล่อง" (นัทสั่งแก้ที่ต้นเหตุ) ─────
   ปัญหาเดิม: ช่องนี้เขียนลง `stock_total` ตรงๆ ซึ่งแปลว่า "ลูกค้าซื้อได้อีกเท่านี้"
     แต่ครัวคิดว่ากรอก "วันนี้ทำไปกี่กล่อง" → ของที่ขายไปแล้วถูกเปิดขายซ้ำ
     ของจริง 16 ส.ค.: No12 ทำ 7 · ขายไป 2 · แต่ยังเปิดให้ซื้อได้อีก 13 = ขายได้รวม 15 จากของ 7 กล่อง
   แก้: ช่องกรอก = **ของที่ทำไว้ทั้งหมด** · ระบบหักที่สั่งไปแล้วเอง แล้วเก็บส่วนที่เหลือลง stock_total
   ✅ คุณสมบัติที่ทำให้ตัวเลขนิ่ง: ลูกค้าสั่งเพิ่ม 1 → stock_total ลด 1 · สั่งแล้ว +1
      → "ทำไว้" ที่ครัวเห็น = เท่าเดิมเสมอ ไม่ขยับเองระหว่างวัน */
/* ══ นัทอธิบายเอง 23 ส.ค. 2569 ══════════════════════════════════════════════
   "ของมี 5 ลูกค้าสั่งไป 5 → ช่องซ้ายต้องมี 5 เหลืออยู่ แต่มีตัวเล็กบอกว่าสั่งไปแล้ว 5"
   "ช่องซ้าย = ของในตู้เย็น จะลดก็ต่อเมื่อครัวกดว่าจัดของแล้วเท่านั้น"

   🐞 ของเดิม: ตัวนับนี้ใช้ filteredOrders() = **นับเฉพาะวันที่ครัวเปิดดูอยู่**
      แต่ stock_total ถูกหักจากออเดอร์ **ทุกวันรวมกัน** (RPC adjust_stock ตอนลูกค้าสั่ง)
      → 2 ค่าคนละขอบเขต แล้วเอามาเข้าสูตรเดียวกัน
      → ช่องซ้ายลดลงทั้งที่ครัวยังไม่ได้จัดของ และหน้าจอขึ้น "สั่งแล้ว 0"
      (นัทเจอเอง: ตั้ง s1-s8 อย่างละ 5 เปิดมาเห็น 4·3·3·1·5·2·2·1 แต่สั่งแล้ว 0 ทุกตัว)

   ✅ กฎใหม่: นับ "ออเดอร์ที่ครัวยังไม่ได้กดจัดของ · ทุกวัน"
      · ลูกค้าสั่ง  → stock_total ลด แต่ตัวนี้บวกกลับ → ช่องซ้ายไม่ขยับ
      · ครัวกดจัดของ → ใบหลุดจากตัวนับ           → ช่องซ้ายลด  ← ตรงกับที่นัทสั่งเป๊ะ
   ⚠️ ต้องตัดใบที่จัดแล้ว/ส่งแล้วออก ไม่งั้นบวกกลับของที่ออกจากตู้ไปแล้ว = ช่องซ้ายค้างสูงเกินจริง
   ⚠️ ตัดวันที่ผ่านมาแล้วออกด้วย — ใบเก่าที่ไม่มีใครกดปิด จะบวกกลับค้างตลอดกาล */
function stkOrderedMap(){
  var om={}, tday=today();
  (allOrders||[]).forEach(function(o){
    if(o.status==="cancelled"||o.status==="ready"||o.status==="delivered") return;
    if(o.source==="parallel_test") return;
    if(o.delivery_date && o.delivery_date < tday) return;
    /* หักของที่ครัวกด "จัดเสร็จบางส่วน" ไปแล้วออก — ของออกจากตู้ไปแล้วเหมือนกัน
       ต่างจากใบที่จัดครบ (ทั้งใบหลุดไปตั้งแต่ status=ready) ตรงที่ใบนี้ยังค้างอยู่บางส่วน */
    var _dn=pkDoneOf(o.id);
    getOrderItems(o.id).forEach(function(i){
      var left=(i.qty||1)-(Number(_dn[String(i.code||"")])||0);
      if(left>0) om[i.menu_item_id]=(om[i.menu_item_id]||0)+left;
    });
  });
  return om;
}
/* ตัวนับ "เฉพาะวันที่ครัวเปิดดู" — ใช้แค่โชว์ให้ครัวรู้ว่าวันนี้ต้องจัดกี่กล่อง
   ห้ามเอาไปเข้าสูตรช่องซ้ายเด็ดขาด (นั่นคือบั๊กเดิม) */
function stkOrderedTodayMap(){
  var om={};
  filteredOrders().forEach(function(o){ getOrderItems(o.id).forEach(function(i){ om[i.menu_item_id]=(om[i.menu_item_id]||0)+i.qty; }); });
  return om;
}
function stkOrderedOf(menuId){ return stkOrderedMap()[menuId]||0; }

/* 👥 กดเลข "สั่งแล้ว" แล้วดูว่าใครสั่งบ้าง (นัทสั่ง 23 ส.ค.)
   เดิมเห็นแต่ตัวเลขรวม — พอของไม่พอ ครัวไม่รู้ว่าต้องไปคุยกับใบไหน
   เอาเฉพาะที่จำเป็น: ชื่อ · รหัสออเดอร์ · วันส่ง (นัทย้ำว่า "แค่นั้นเอง เอาตัวเล็กๆ") */
var stkWhoId=null;
/* คืนทุกใบที่มีเมนูนี้ แยกว่า "จัดแล้ว" หรือ "ยังไม่จัด"
   🔴 เดิมคืนเฉพาะที่ยังไม่จัด → พอครัวจัดครบ รายชื่อว่างเปล่า
      เคสจริง 23 ส.ค.: S104 เกี๊ยวกุ้ง มีคนสั่ง 10 กล่อง 6 ใบ แต่จัดครบหมดแล้ว
      → หน้าจอขึ้น "สั่งแล้ว 0" และกดดูไม่ได้ → นัทหาไม่เจอว่าใครรับไป
      "ไม่เหลือค้าง" กับ "ไม่มีใครสั่ง" เป็นคนละเรื่อง ต้องแยกให้เห็น */
/* 🐞 25 ส.ค. — แถวบอก "สั่ง 1" แต่กด 👥 แล้วขึ้น "ยังไม่มีใครสั่งเมนูนี้" (นัทเจอเองกับ BJ1)
   ต้นเหตุ: ตัวนี้ตัดใบที่เลยวันส่งไปแล้วทิ้ง "เสมอ" โดยยึดวันนี้เป็นเส้นตาย
   ถูกสำหรับแท็บตั้งสต็อค (ถามว่าของในตู้จะถูกใครเอาไป) แต่ผิดทันทีที่ครัวย้อนดูวันเก่า
   → ให้ผู้เรียกส่ง "วันที่กำลังดูอยู่" เข้ามาได้ · ไม่ส่ง = ยึดวันนี้เหมือนเดิม */
function stkWhoList(menuId, viewDate){
  var out=[], tday=today();
  var floor=(viewDate && viewDate<tday) ? viewDate : tday;
  (allOrders||[]).forEach(function(o){
    if(o.status==="cancelled") return;
    if(o.source==="parallel_test") return;
    if(o.delivery_date && o.delivery_date < floor) return;
    var packed=(o.status==="ready"||o.status==="delivered");
    var dn=pkDoneOf(o.id), tot=0, left=0;
    getOrderItems(o.id).forEach(function(i){
      if(i.menu_item_id!==menuId) return;
      var q=i.qty||1; tot+=q;
      left += packed ? 0 : (q - (Number(dn[String(i.code||"")])||0));
    });
    if(tot>0) out.push({ name:o.customer_name||"ลูกค้า", num:o.order_number||"—",
      date:o.delivery_date||"", qty:tot, left:left, done:(left<=0) });
  });
  out.sort(function(a,b){ return (a.done?1:0)-(b.done?1:0)
    || String(a.date).localeCompare(String(b.date)) || String(a.num).localeCompare(String(b.num)); });
  return out;
}
function stkWho(menuId,ev){
  if(ev){ ev.stopPropagation(); ev.preventDefault(); }
  stkWhoId = (stkWhoId===menuId) ? null : menuId;   // กดซ้ำ = ปิด
  render();                                         // ต้องวาดแท็บที่เปิดอยู่ ไม่ใช่แท็บสต็อคเสมอ
}
function stkWhoHtml(m, viewDate){
  if(stkWhoId!==m.id) return "";
  var list=stkWhoList(m.id, viewDate);
  if(!list.length) return "<div class='stk-who'>ยังไม่มีใครสั่งเมนูนี้</div>";
  var row=function(r){
    var d=r.date?fmtDate(r.date):"—";
    return "<div class='stk-who-row"+(r.done?" done":"")+"'>"
      +"<span class='w-n'>"+escH(r.name)+"</span>"
      +"<span class='w-o'>"+escH(r.num)+"</span>"
      +"<span class='w-d'>"+escH(d)+"</span>"
      +"<span class='w-q'>×"+r.qty+"</span></div>";
  };
  var wait=list.filter(function(r){return !r.done;}), done=list.filter(function(r){return r.done;});
  var nWait=wait.reduce(function(a,r){return a+r.qty;},0), nDone=done.reduce(function(a,r){return a+r.qty;},0);
  var h="<div class='stk-who'><div class='stk-who-hd'>👥 ใครสั่งบ้าง — "+list.length+" ใบ รวม "+(nWait+nDone)+" กล่อง</div>";
  if(wait.length) h+="<div class='stk-who-sub'>⏳ ยังไม่ได้จัด "+nWait+" กล่อง</div>"+wait.map(row).join("");
  if(done.length) h+="<div class='stk-who-sub'>✅ จัดไปแล้ว "+nDone+" กล่อง</div>"+done.map(row).join("");
  return h+"</div>";
}

/* ══════════════════════════════════════════════════════════════════════════
   📦 แผงเติมสต็อค — ออกแบบตามที่นัทอธิบายเอง 18 ส.ค. 2569

   ปัญหาที่แก้: ช่องเดียว +/- แก้สดๆ ได้ทันที
     · ครัวกดทับเลขที่ลูกค้าสั่งไปแล้ว → in/out ของออเดอร์เพี้ยน ตามย้อนไม่ได้ว่าใครแก้
     · ของขายหมดจริง (เหลือ 0) หน้าร้านขึ้น "หมด" ทั้งที่ครัวกำลังจะทำเพิ่ม = เสียยอดฟรี

   นัทอธิบายเอง: "ครัวกดกรอกอีกช่อง ก็จะขึ้น เช่น 0 กับอีกช่อง 10
                  ลูกค้าก็จะเห็นว่ายังสั่งได้อยู่ แม้ว่าครัวจะยังไม่เริ่มทำ"

   เลย 2 ช่องแยกกัน:
     · มีของจริง (actual_stock)  = นับด้วยตาแล้วกรอก · ไม่ขยับเอง
     · กำลังเติม (stockIncoming) = ที่จะทำเพิ่ม · ยังไม่มีของ แต่ขายล่วงหน้าได้
   ลูกค้าเห็น (stock_total) = มีจริง + กำลังเติม − สั่งแล้ว   ← สูตรเดียว ที่อื่นไม่ต้องรู้

   ⚠️ ทำไมไม่ยุบเป็นช่องเดียว: วันที่ของทำไม่ทัน จะแยกไม่ออกว่าที่หายไปคือ "ขายไป"
      หรือ "ทำไม่ครบ" — แยก 2 ช่องแล้วมองออกทันทีว่าค้างที่ไหน
   ⚠️ ไม่มีการยุบ "กำลังเติม" เข้า "มีของจริง" อัตโนมัติ — ระบบไม่รู้ว่าครัวทำเสร็จจริงไหม
      เดาแล้วผิด = ตัวเลขโกหกแบบเงียบ · ให้ครัวกดปุ่ม "ทำเสร็จแล้ว" เองเมื่อของอยู่ในมือ
   ═══════════════════════════════════════════════════════════════════════════ */
var stockIncoming={};        // { menuId: {n:จำนวน, by:ใครกรอก, at:ISO} } เก็บใน kitchen_data.stock_incoming
var stkEditId=null;          // แถวที่กางแผงแก้อยู่

function stkIncOf(menuId){ var r=stockIncoming[menuId]; return (r&&r.n)?Number(r.n)||0:0; }
/* ⚠️ "มีของจริง" คำนวณย้อนจาก stock_total ไม่ใช่อ่าน actual_stock ตรงๆ
   เพราะ stock_total คือเลขที่ LIFF ใช้จริง (RPC adjust_stock ลดทุกครั้งที่ลูกค้าสั่ง)
   ส่วน actual_stock เป็นเลขที่ครัวเคยนับไว้ ไม่ขยับตามการขาย → 2 เลขนี้หลุดกันได้
   ถ้าโชว์ actual_stock ตรงๆ หน้าครัวจะบอกเลขนึง แต่หน้าร้านขายอีกเลขนึง = โกหกเงียบๆ
   ยึด stock_total เป็นความจริงเสมอ: มีจริง = ลูกค้าสั่งได้อีก + สั่งไปแล้ว − กำลังเติม */
function stkRealOf(m,ordered){
  if(m.stock_total==null) return 0;
  return Math.max(0, Number(m.stock_total||0) + (ordered||0) - stkIncOf(m.id));
}

// แถวเมนู 1 แถว — เลขใหญ่ = ลูกค้าสั่งได้อีก · ปุ่มดินสอเปิดแผงแก้
function stkRowHtml(m,ordered,orderedToday){
  var unlimited=(m.stock_total==null);
  var inc=stkIncOf(m.id), real=stkRealOf(m,ordered);
  var left=unlimited?null:Number(m.stock_total||0);   // เลขที่ LIFF ใช้จริง ไม่คำนวณใหม่ให้เพี้ยน
  var open=(stkEditId===m.id), quick=(stkQuickId===m.id);
  var incAge="";
  if(inc){
    var at=stockIncoming[m.id]&&stockIncoming[m.id].at;
    // ค้างข้ามวัน = ของที่บอกว่าจะทำแต่ยังไม่ทำ ต้องสะดุดตา ไม่งั้นขายล่วงหน้าไปเรื่อยๆ โดยไม่มีของ
    if(at && String(at).slice(0,10) < thaiToday2()) incAge=" ⚠️ ค้างจากวันก่อน";
  }
  var hidden=(m.is_available===false);
  var h="<div class='stk-row"+((open||quick)?" open":"")+(hidden?" hidden-sale":"")+"'>"
    +"<div class='stk-name'><span class='code-tag'>"+escH(getCodeDisplay(m.code,m.name))+"</span> "+tagsHtml(m)+escH(m.name||"")
    +"<div class='stk-sub'>"
      +(hidden?"<b class='hid-tag'>🙈 ซ่อนจากหน้าร้านอยู่ — ลูกค้าสั่งไม่ได้</b> "+escH(stkHidBy(m.id))+"<br>":"")
      +(unlimited
        ? "ขายไม่จำกัด"+(ordered?(" · <b style='color:var(--gold)'>สั่งแล้ว "+ordered+"</b>"):"")
        : "มีจริง <b>"+real+"</b> + กำลังเติม <b class='"+(inc?"inc":"")+"'>"+inc+"</b>"
          +" − สั่งแล้ว <b class='ord-btn' onclick='stkWho(\""+m.id+"\",event)' title='กดดูว่าใครสั่งบ้าง (รวมใบที่จัดไปแล้ว)'>"+ordered+" 👥</b>"
          +(ordered? ("<span style='font-size:11px;color:var(--soft)'> (วันที่ดูอยู่ "+(orderedToday||0)
              +(ordered>(orderedToday||0)?" · วันอื่น "+(ordered-(orderedToday||0)):"")+")</span>") : "")
          +(incAge?("<span class='inc-old'>"+incAge+"</span>"):""))
    +"</div></div>"
    +"<div class='stk-ctrl'>"
      +"<div class='stk-left "+(unlimited?"inf":(left>0?"ok":"zero"))+"'>"+(unlimited?"∞":left)+"</div>"
      +((unlimited||hidden)?"":"<button class='stk-add' onclick=\"stkQuick('"+m.id+"')\" title='เติมสต็อค — เพิ่มของที่กำลังทำ'>➕</button>")
      +"<button class='stk-hide"+(hidden?" on":"")+"' onclick=\"stkToggleSale('"+m.id+"')\" title='"
      +(hidden?"เปิดขายคืน — ลูกค้าจะเห็นเมนูนี้อีกครั้ง":"ซ่อนการขาย — ลูกค้าจะไม่เห็นเมนูนี้ทันที ใช้ตอนของหมดแต่ยังบอกแอดมินไม่ทัน")
      +"'>"+(hidden?"👁":"🙈")+"</button>"
      +"<button class='stk-pen' onclick=\"stkEdit('"+m.id+"')\" title='แก้จำนวนแบบละเอียด'>✏️</button>"
    +"</div></div>";
  h+=stkWhoHtml(m);
  if(quick) h+=stkQuickBar(m,inc);
  if(open)  h+=stkEditPanel(m,ordered);
  return h;
}

// แผงแก้ — 2 ช่องตามที่นัทออกแบบ + ปุ่มลัดที่ครัวใช้จริง
function stkEditPanel(m,ordered){
  var unlimited=(m.stock_total==null);
  var inc=stkIncOf(m.id), real=stkRealOf(m,ordered);
  return "<div class='stk-edit'>"
    +"<div class='stk-edit-who'>👤 คนแก้: <b>"+escH(kqCurrentUser||"—")+"</b></div>"
    +"<div class='stk-edit-grid'>"
      +"<label>มีของจริงตอนนี้<input type='number' min='0' id='se_real' value='"+real+"'"+(unlimited?" disabled":"")+"></label>"
      +"<label>กำลังเติมอีก<input type='number' min='0' id='se_inc' value='"+inc+"'"+(unlimited?" disabled":"")+"></label>"
    +"</div>"
    +"<div class='stk-edit-note'>ลูกค้าจะสั่งได้อีก = "
      +(unlimited?"ไม่จำกัด":"<b id='se_prev'>"+Math.max(0,real+inc-ordered)+"</b> กล่อง (หักที่สั่งไปแล้ว "+ordered+")")+"</div>"
    +"<div class='stk-edit-btns'>"
      +(inc&&!unlimited?"<button class='se-b se-done' onclick=\"stkDone('"+m.id+"')\">✅ ทำเสร็จแล้ว ("+inc+") → ย้ายเข้าของจริง</button>":"")
      +"<button class='se-b se-inf"+(unlimited?" on":"")+"' onclick=\"stkToggleInf('"+m.id+"')\">"+(unlimited?"↩ กลับมานับจำนวน":"∞ ขายไม่จำกัด")+"</button>"
      +"<button class='se-b se-cancel' onclick='stkEdit(null)'>ยกเลิก</button>"
      +(unlimited?"":"<button class='se-b se-save' onclick=\"stkSave('"+m.id+"')\">บันทึก</button>")
    +"</div></div>";
}

/* ── 🙈 ซ่อนการขาย (นัทสั่ง 19 ส.ค.) ───────────────────────────────────────
   นัทอธิบายเอง: "สำหรับพนักงานครัวที่รู้ว่าสินค้านั้นไม่มี แต่บอกแอดมินไม่ทัน รีบซ่อนให้ก่อน"

   ทำไมต้องมี ทั้งที่มีช่อง "มีของจริง" อยู่แล้ว:
     · ตั้งของจริง = 0 ยัง**ไม่**ปิดการขาย ถ้ามี "กำลังเติม" ค้าง หรือเมนูตั้งเป็น ไม่จำกัด ไว้
     · ครัวที่รู้ว่าของเสีย/วัตถุดิบไม่มา ต้องปิดทันที ไม่ใช่มานั่งคิดเลข
   ปุ่มนี้แตะคอลัมน์ is_available = ตัวเดียวกับที่หน้าลูกค้าใช้ตัดสินว่าจะโชว์เมนูไหม -> มีผลทันที

   ⚠️ ของแบบนี้อันตรายถ้าเงียบ — เมนูหายจากหน้าร้านโดยไม่มีใครรู้ว่าใครทำ = ตามหาสาเหตุไม่เจอ
      บังคับ 3 อย่าง: ต้องมีชื่อคนกด · ถามยืนยันก่อน · ลง activity_log ทุกครั้ง
      + จำไว้ว่าใครซ่อนเมื่อไหร่ แล้วโชว์ในแถว (แอดมินเปิดมาเห็นทันทีว่าใครสั่งซ่อน) */
var stockHidden={};   // { menuId: {by:'ชื่อ', at:ISO, code:'S032'} }
function stkHidBy(id){
  var r=stockHidden[id]; if(!r||!r.by) return "";
  var t=String(r.at||"").slice(5,10).split("-").reverse().join("/");
  return "(โดย "+r.by+(t?" "+t:"")+")";
}
async function saveHidden(){
  var sb_=getSB(); if(!sb_) return;
  try{ await sb_.from("kitchen_data").upsert({key:"stock_hidden", data:stockHidden},{onConflict:"key"}); }
  catch(e){ console.warn("saveHidden:",e); }
}
async function stkToggleSale(menuId){
  if(!requireKqUser()) return;
  var m=(allMenus||[]).find(function(x){return x.id===menuId;}); if(!m) return;
  var sb_=getSB(); if(!sb_) return;
  var hidden=(m.is_available===false);
  var name=(m.code||"")+" "+(m.name||"");
  if(hidden){
    if(!confirm("เปิดขายคืน?\n\n"+name+"\n\nลูกค้าจะเห็นเมนูนี้อีกครั้งทันที")) return;
  }else{
    if(!confirm("ซ่อนเมนูนี้จากหน้าร้าน?\n\n"+name
      +"\n\nลูกค้าจะสั่งไม่ได้ทันที (ใบที่สั่งไปแล้วไม่กระทบ)\nกดปุ่มเดิมอีกครั้งเพื่อเปิดคืน\n\nคนกด: "+kqCurrentUser)) return;
  }
  var next=hidden;                      // ซ่อนอยู่ -> เปิดคืน(true) · ยังขายอยู่ -> ซ่อน(false)
  var r=await sb_.from("menu_items").update({is_available:next}).eq("id",menuId);
  if(r.error) return kqWriteFail(r.error, next?"เปิดขายคืน":"ซ่อนการขาย");
  m.is_available=next;
  if(next) delete stockHidden[menuId];
  else stockHidden[menuId]={by:kqCurrentUser||"", at:new Date().toISOString(), code:m.code||""};
  await saveHidden();
  var ordered=stkOrderedMap()[m.id]||0;
  var snap={real:stkRealOf(m,ordered), inc:stkIncOf(m.id)};
  try{ await logStock(m, next?"เปิดขายคืน":"ซ่อนการขาย", snap, snap, {hidden_from_shop:!next}); }catch(e){}
  renderStock(); loadStockHistory();
}

/* ── ➕ เติมสต็อคเร็ว (นัทขอ 18 ส.ค.: "ย้ายเติมสต็อคมาข้างๆ ดินสอ ให้สะดวกขึ้น") ──
   งานที่ครัวทำบ่อยสุดคือ "ทำเพิ่มอีก N กล่อง" ไม่ใช่ "นับใหม่ทั้งแถว"
   เลยแยกเป็นปุ่มเดียวจบ: กด ➕ → เคาะจำนวน → เข้า "กำลังเติม" ทันที
   ปุ่มดินสอเก็บไว้สำหรับตอนต้องนับใหม่/แก้ของจริง (งานที่ทำน้อยกว่า) */
var stkQuickId=null;
function stkQuickBar(m,inc){
  return "<div class='stk-quick'>"
    +"<span class='sq-lb'>➕ ทำเพิ่มอีก</span>"
    +"<div class='sq-chips'>"
      +[5,10,20,30].map(function(n){ return "<button class='sq-c' onclick=\"stkQuickAdd('"+m.id+"',"+n+")\">+"+n+"</button>"; }).join("")
    +"</div>"
    +"<input class='sq-n' id='sq_n' type='number' min='1' placeholder='อื่นๆ' onkeydown=\"if(event.key==='Enter')stkQuickAdd('"+m.id+"',null)\">"
    +"<button class='sq-ok' onclick=\"stkQuickAdd('"+m.id+"',null)\">เพิ่ม</button>"
    +"<button class='sq-x' onclick='stkQuick(null)'>ปิด</button>"
    +(inc?"<div class='sq-now'>ตอนนี้กำลังเติมอยู่ <b>"+inc+"</b> กล่อง</div>":"")
    +"</div>";
}
function stkQuick(menuId){
  if(menuId && !requireKqUser()) return;
  stkQuickId=(stkQuickId===menuId)?null:menuId;
  if(stkQuickId) stkEditId=null;
  renderStock();
  var n=document.getElementById("sq_n"); if(n) n.focus();
}
async function stkQuickAdd(menuId,n){
  if(!requireKqUser()) return;
  var m=(allMenus||[]).find(function(x){return x.id===menuId;}); if(!m) return;
  if(n==null){ n=parseInt((document.getElementById("sq_n")||{}).value)||0; }
  n=Math.max(0,n); if(!n) return;
  var ordered=stkOrderedMap()[m.id]||0;
  await stkCommit(m, stkRealOf(m,ordered), stkIncOf(m.id)+n, "เติมสต็อค");
  stkQuickId=null; renderStock(); loadStockHistory();
}

// เปิด/ปิดแผง — ต้องมีชื่อก่อน (นัทสั่ง: ใครจะมาแก้ต้องกรอกชื่อ)
function stkEdit(menuId){
  if(menuId && !requireKqUser()) return;
  stkEditId=(stkEditId===menuId)?null:menuId;
  if(stkEditId) stkQuickId=null;
  renderStock();
  if(stkEditId){
    var a=document.getElementById("se_real"), b=document.getElementById("se_inc"), p=document.getElementById("se_prev");
    var m=(allMenus||[]).find(function(x){return x.id===stkEditId;});
    var ord=stkOrderedMap()[stkEditId]||0;
    var upd=function(){ if(p) p.textContent=Math.max(0,(parseInt(a.value)||0)+(parseInt(b.value)||0)-ord); };
    if(a){ a.addEventListener("input",upd); a.focus(); a.select(); }
    if(b) b.addEventListener("input",upd);
  }
}

async function stkSave(menuId){
  if(!requireKqUser()) return;
  var m=(allMenus||[]).find(function(x){return x.id===menuId;}); if(!m) return;
  var real=Math.max(0,parseInt((document.getElementById("se_real")||{}).value)||0);
  var inc =Math.max(0,parseInt((document.getElementById("se_inc") ||{}).value)||0);
  var before={real:stkRealOf(m,stkOrderedMap()[menuId]||0), inc:stkIncOf(m.id)};
  await stkCommit(m, real, inc, "แก้จำนวน");
  stkEditId=null; renderStock(); loadStockHistory();
}

// ✅ ครัวกดเองเมื่อของอยู่ในมือแล้ว — ย้าย "กำลังเติม" เข้า "มีของจริง" (ยอดที่ลูกค้าเห็นไม่ขยับ)
async function stkDone(menuId){
  if(!requireKqUser()) return;
  var m=(allMenus||[]).find(function(x){return x.id===menuId;}); if(!m) return;
  var inc=stkIncOf(m.id); if(!inc) return;
  if(!confirm("ยืนยันว่าทำเสร็จแล้ว "+inc+" กล่อง?\n\nจะย้ายจาก \"กำลังเติม\" ไปเป็น \"มีของจริง\"\nยอดที่ลูกค้าสั่งได้ไม่เปลี่ยน")) return;
  await stkCommit(m, stkRealOf(m,stkOrderedMap()[menuId]||0)+inc, 0, "เติมเสร็จ");
  stkEditId=null; renderStock(); loadStockHistory();
}

async function stkToggleInf(menuId){
  if(!requireKqUser()) return;
  var m=(allMenus||[]).find(function(x){return x.id===menuId;}); if(!m) return;
  if(m.stock_total==null){ await stkCommit(m,0,0,"เลิกไม่จำกัด"); }
  else { await stkSetUnlimited(m); }
  stkEditId=null; renderStock(); loadStockHistory();
}

/* เขียนจริง — สูตรเดียวที่ทุกหน้าอ่านต่อได้: stock_total = มีจริง + กำลังเติม − สั่งแล้ว
   เขียน stock_total ทุกครั้งที่ครัวแก้ · เวลาลูกค้าสั่งเพิ่ม RPC adjust_stock ลด stock_total ให้เอง
   → ตัวเลขสองทางนี้ไม่ตีกัน เพราะฝั่งลูกค้าลดทีละ 1 พร้อมกับ ordered เพิ่มทีละ 1 */
async function stkCommit(m, real, inc, why){
  var sb_=getSB(); if(!sb_) return;
  var ordered=stkOrderedMap()[m.id]||0;
  var before={real:stkRealOf(m,ordered), inc:stkIncOf(m.id)};
  var total=Math.max(0, real+inc-ordered);
  m.actual_stock=real; m.stock_total=total;
  stockIncoming[m.id]= inc ? {n:inc, by:kqCurrentUser||"", at:new Date().toISOString()} : null;
  if(!inc) delete stockIncoming[m.id];
  var r=await sb_.from("menu_items").update({actual_stock:real, stock_total:total}).eq("id",m.id);
  if(r.error) return kqWriteFail(r.error,"ตั้งสต็อค ("+why+")");
  await saveIncoming();
  await logStock(m, why, before, {real:real, inc:inc});
}
async function stkSetUnlimited(m){
  var sb_=getSB(); if(!sb_) return;
  m.stock_total=null; m.actual_stock=null;
  delete stockIncoming[m.id];
  var r=await sb_.from("menu_items").update({actual_stock:null, stock_total:null}).eq("id",m.id);
  if(r.error) return kqWriteFail(r.error,"ตั้งสต็อค (ไม่จำกัด)");
  await saveIncoming();
}
/* เก็บ "กำลังเติม" ใน kitchen_data — ไม่ต้องรอใครรัน SQL เพิ่มคอลัมน์
   (คีย์เดียวทั้งร้าน เหมือน menu_special_weeks ที่ใช้อยู่แล้ว) */
async function saveIncoming(){
  var sb_=getSB(); if(!sb_) return;
  try{ await sb_.from("kitchen_data").upsert({key:"stock_incoming", data:stockIncoming},{onConflict:"key"}); }
  catch(e){ console.warn("saveIncoming:",e); }
}
function thaiToday2(){ return new Date(Date.now()+7*3600e3).toISOString().slice(0,10); }

/* ── 🌙 ปิดวันอัตโนมัติ (นัทเคาะ 18 ส.ค.: "เอาทั้ง 2 แบบเลย") ───────────────
   ครัวกดปุ่ม "เติมเสร็จ" เองได้ · แต่ถ้าลืมกด พอข้ามวันระบบย้ายให้เอง
   เหตุผล: ของที่บอกว่า "กำลังเติม" เมื่อวาน วันนี้มันอยู่ในมือแล้ว (หรือไม่ก็ไม่ได้ทำ)
   ปล่อยค้างไว้ = ขายล่วงหน้าซ้ำทุกวันโดยไม่มีของ
   ⚠️ ยอดที่ลูกค้าเห็น (stock_total) ไม่ขยับจากการย้ายนี้ — แค่ย้ายกระเป๋า
      ถ้าครัวไม่ได้ทำจริง ต้องมาแก้ "มีของจริง" ลงเอง ระบบเดาแทนไม่ได้ */
var _needRollover=false;
async function stkRolloverDay(){
  _needRollover=false;
  var today=thaiToday2(), ids=[];
  for(var k in stockIncoming){
    var r=stockIncoming[k];
    if(r && r.n && String(r.at||"").slice(0,10) < today) ids.push(k);
  }
  if(!ids.length) return;
  for(var i=0;i<ids.length;i++){
    var m=(allMenus||[]).find(function(x){return x.id===ids[i];});
    if(!m){ delete stockIncoming[ids[i]]; continue; }
    var ordered=stkOrderedMap()[m.id]||0;
    var inc=stkIncOf(m.id), real=stkRealOf(m,ordered);
    var keeper=kqCurrentUser; kqCurrentUser=kqCurrentUser||"ระบบ (ปิดวัน)";
    await stkCommit(m, real+inc, 0, "ปิดวันอัตโนมัติ");
    kqCurrentUser=keeper;
  }
  console.log("ปิดวัน: ย้ายกำลังเติมเข้าของจริง "+ids.length+" เมนู");
}

/* ── 📜 แผงประวัติการเติมสต็อค — 7 วันล่าสุด + ยอดรวมสัปดาห์ ── */
var stockHist=[], stockHistOpen=false;
async function loadStockHistory(){
  var sb_=getSB(); if(!sb_) return;
  try{
    var since=new Date(Date.now()+7*3600e3 - 7*86400e3).toISOString().slice(0,10);
    var r=await sb_.from("activity_log").select("actor,summary,detail,created_at")
      .eq("action_type","stock").gte("created_at",since).order("created_at",{ascending:false}).limit(300);
    stockHist=r.data||[];
  }catch(e){ stockHist=[]; }
  renderStockHistory();
}
function toggleStockHist(){ stockHistOpen=!stockHistOpen; renderStockHistory(); }
function renderStockHistory(){
  var el=document.getElementById("stkHist"); if(!el) return;
  var added=0, byCode={};
  stockHist.forEach(function(x){
    var d=x.detail||{}, n=Number(d.added||0);
    if(n>0){ added+=n; byCode[d.code||"?"]=(byCode[d.code||"?"]||0)+n; }
  });
  var top=Object.keys(byCode).sort(function(a,b){return byCode[b]-byCode[a];}).slice(0,5);
  var h="<div class='hist-head' onclick='toggleStockHist()'>"
    +"<b>📜 ประวัติการเติมสต็อค 7 วัน</b>"
    +"<span class='hist-sum'>เติมรวม <b>"+added+"</b> กล่อง · "+stockHist.length+" ครั้ง</span>"
    +"<span class='hist-arrow'>"+(stockHistOpen?"▲":"▼")+"</span></div>";
  if(stockHistOpen){
    if(top.length) h+="<div class='hist-top'>เติมเยอะสุด: "
      +top.map(function(c){return "<span>"+escH(c)+" <b>"+byCode[c]+"</b></span>";}).join("")+"</div>";
    if(!stockHist.length) h+="<div class='hist-empty'>ยังไม่มีการแก้สต็อคใน 7 วันนี้</div>";
    stockHist.slice(0,80).forEach(function(x){
      var d=x.detail||{}, t=new Date(x.created_at);
      var when=String(t.getDate()).padStart(2,"0")+"/"+String(t.getMonth()+1).padStart(2,"0")
        +" "+String(t.getHours()).padStart(2,"0")+":"+String(t.getMinutes()).padStart(2,"0");
      h+="<div class='hist-row'><span class='hist-t'>"+when+"</span>"
        +"<span class='hist-who'>"+escH(x.actor||"—")+"</span>"
        +"<span class='hist-x'>"+escH(x.summary||"")+"</span>"
        +(Number(d.added||0)>0?"<span class='hist-add'>+"+d.added+"</span>":"")+"</div>";
    });
  }
  el.innerHTML=h;
}

// val = "ทำไว้ทั้งหมด" (ตัวเลข) หรือ null (ไม่จำกัด)  ── ของเดิม เก็บไว้ให้ที่อื่นเรียกได้
function stkWrite(menuId,val){
  var left = (val==null) ? null : Math.max(0, val - stkOrderedOf(menuId));
  var m=(allMenus||[]).find(function(x){return x.id===menuId;}); if(m)m.stock_total=left;
  clearTimeout(saveTimers["stk_"+menuId]);
  saveTimers["stk_"+menuId]=setTimeout(async function(){ var sb_=getSB(); if(sb_){ var _w4=await sb_.from("menu_items").update({stock_total:left}).eq("id",menuId); if(_w4.error) kqWriteFail(_w4.error,"ตั้งสต็อค (ลูกค้าเห็นเลขนี้)"); } },500);
}
// +/- ขยับที่ "ของที่ทำไว้" (ไม่ใช่ที่เลขเหลือขาย) — ครัวกดเพิ่ม 1 = ทำเพิ่มอีก 1 กล่อง
function stkAdj(menuId,d){
  var m=(allMenus||[]).find(function(x){return x.id===menuId;}); if(!m)return;
  var made=(m.stock_total==null)?0:(m.stock_total + stkOrderedOf(menuId));
  stkWrite(menuId,Math.max(0,made+d)); renderStock();
}
function stkType(inp){ stkWrite(inp.dataset.id,Math.max(0,parseInt(inp.value)||0)); } // ไม่ re-render ระหว่างพิม กัน cursor เด้ง
function stkInf(menuId){ var m=(allMenus||[]).find(function(x){return x.id===menuId;}); if(!m)return; stkWrite(menuId, (m.stock_total!=null)?null:0); renderStock(); }

// ── พับ/กางการ์ด (N-13) ──────────────────────────────────
// วันที่ออเดอร์เยอะ หน้ายาวมากจนครัวเลื่อนหาของไม่เจอ → กดหัวการ์ดพับเก็บได้

// TAB 2: รายออเดอร์ by slot
function renderOrders(){
  var orders=filteredOrders();
  if(!orders.length){
    document.getElementById("orderView").innerHTML="<div style='text-align:center;padding:40px;color:var(--soft)'>ไม่มีออเดอร์</div>";
    return;
  }
  // group by slot
  var slotOrder=["all_day","morning","afternoon","express",""];
  var bySlot={};
  orders.forEach(function(o){
    var s=o.time_slot||"";
    if(!bySlot[s])bySlot[s]=[];
    bySlot[s].push(o);
  });
  /* 🍳 ลำดับในแต่ละช่วงเวลา (นัทสั่งใหม่ 23 ส.ค. 2569 — สลับจากของเดิม)
     ① ออเดอร์ที่ยังไม่ได้จัด  ② ออเดอร์ที่จัดแล้ว  ③ Meal Plan (ล่างสุด)
     เหตุผล: หน้านี้ครัวใช้ "ไล่จัดของ" → งานที่ยังไม่ทำต้องอยู่บนสุดเสมอ
     Meal Plan ไม่ได้จัดจากหน้านี้ (ไปดูรอบส่งที่แท็บรายสินค้า) จึงลงไปอยู่ล่าง
     ⚠️ เดิมเอา Meal Plan ขึ้นบนเพราะเป็นของทำสดต้องลงมือก่อน — เหตุผลนั้นยังจริง
        แต่เป็นเรื่อง "ผลิต" ไม่ใช่ "จัดของ" คนละงานกับที่หน้านี้ทำ */
  Object.keys(bySlot).forEach(function(s){
    bySlot[s].forEach(function(o){
      var it=getOrderItems(o.id);
      o._isMp = it.some(function(i){ return /^(HP|LC|MP)/i.test(i.code||""); }) || it.some(function(i){ return i._fromPlan; });
    });
    bySlot[s].sort(function(a,b){
      if(a._isMp!==b._isMp) return a._isMp?1:-1;                                   // Meal Plan ไปล่างสุด
      var ap=(a.status==="ready"||a.status==="delivered")?1:0;
      var bp=(b.status==="ready"||b.status==="delivered")?1:0;
      if(ap!==bp) return ap-bp;                                                    // ยังไม่จัด ขึ้นก่อน
      return String(a.created_at||"").localeCompare(String(b.created_at||""));      // แล้วใครสั่งก่อนอยู่ก่อน
    });
  });
  // 🔴 เดิมวนแค่ slotOrder 5 ค่านี้ → ออเดอร์ที่ time_slot เป็นค่าอื่น "หายเงียบ" จากจอครัว
  //    เคสจริง: ลูกค้าเลือก "ส่งระบุเวลา" ใน LIFF → time_slot เก็บเป็นเวลาจริง เช่น "14:30"
  //    (liff_customer: `time_slot: selSlot==='express' ? expressTime : selSlot`)
  //    → ครัวไม่เห็นออเดอร์นั้นเลย ทั้งที่นับรวมอยู่ในระบบ = อาการ "สั่งจริงแล้วไม่ขึ้นหน้าครัว" (แก้ 5 ส.ค. 2569)
  //    กติกาใหม่: ช่วงเวลาที่ไม่รู้จัก ต้องโผล่ท้ายจอเสมอ ห้ามตกหล่นเด็ดขาด
  var known=slotOrder.slice();
  var extra=Object.keys(bySlot).filter(function(s){return known.indexOf(s)<0;}).sort();
  // N-13: ปุ่มพับ/กางทั้งหมด — วันออเดอร์เยอะครัวพับเก็บทีเดียวแล้วค่อยกางทีละใบที่กำลังทำ
  pkLoadTicks();
  var html="<div class='fold-bar no-print'>"
    +"<button class='fold-btn' onclick='togglePackMode()' style='"+(kqPackMode?"background:#DCFCE7;border-color:#86EFAC;color:#166534;font-weight:800":"")+"'>"
      +(kqPackMode?"☑️ โหมดจัดของ (เปิด)":"☑️ โหมดจัดของ (ปิด)")+"</button>"
    +"<button class='fold-btn' onclick='foldAll(true)'>⊟ พับทั้งหมด</button>"
    +"<button class='fold-btn' onclick='foldAll(false)'>⊞ กางทั้งหมด</button>"
    +"<span class='fold-hint'>แตะชื่อลูกค้าเพื่อพับ/กางทีละใบ</span></div>";
  known.concat(extra).forEach(function(s){
    if(!bySlot[s]||!bySlot[s].length)return;
    var isExtra=known.indexOf(s)<0;
    var label=SLOT_LABELS[s]||(isExtra?("🕐 นัดเวลา "+escH(s)):"⏰ ไม่ระบุช่วงเวลา");
    html+="<div class='slot-sec'>"
      +"<div class='slot-hdr'><span class='slot-hdr-label'>"+label+"</span><span class='slot-hdr-count'>"+bySlot[s].length+" ออเดอร์</span></div>"
      +"<div class='slot-body'>"+bySlot[s].map(renderCard).join("")+"</div></div>";
  });
  document.getElementById("orderView").innerHTML=html;
}

   นัทสั่ง 23 ส.ค.: "อยากได้ปุ่มจัดกล่องเสร็จบางส่วน เพื่อให้มันตัดสต็อกก่อน
